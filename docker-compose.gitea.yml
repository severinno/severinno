# =============================================================================
# docker-compose.gitea.yml — SHIM para o canônico da forja
# =============================================================================
# O canônico deste stack é deploy/docker-compose.gitea.yml (é o que o
# deploy/setup-gitea.sh copia para a VPS, o que o deploy/gitea-up.sh sobe e o
# que os guards/provas da forja usam). Esta cópia na raiz já tinha derivado
# (nomes lógicos de volume e healthcheck do Caddy divergiram do canônico) —
# agora ela só REDIRECIONA: o modelo final é o mesmo arquivo, sem segunda
# cópia para derivar.
#
# Uso (igual ao de antes — ambas as invocações renderizam o MESMO modelo):
#   docker compose -f docker-compose.gitea.yml --env-file deploy/.env.gitea up -d
#
# Acesso:
#   Web UI: https://git.severinno.com
#   SSH:    ssh -p 2222 git@git.severinno.com
# =============================================================================

include:
  - deploy/docker-compose.gitea.yml
