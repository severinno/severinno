# =============================================================================
# docker-compose.hostinger.yml — Deploy via Hostinger GitHub Action
# =============================================================================
# Este arquivo é usado pela hostinger/deploy-on-vps action.
# Mantém todos os serviços de produção, com a origem das imagens vinda de
# IMAGE_REGISTRY/IMAGE_NAMESPACE (default: ghcr.io/severinno) — a MESMA fonte
# única do docker-compose.prod.yml. Trocar registry = mudar a variável.
#
# Uso:
#   docker compose -f docker-compose.hostinger.yml --env-file .env.production up -d
#   docker compose -f docker-compose.hostinger.yml --env-file .env.production logs -f
# =============================================================================

# ── Redes compartilhadas ──────────────────────────────────────────────────
networks:
  frontend:
    name: severinno_frontend
    driver: bridge
  backend:
    name: severinno_backend
    driver: bridge

# ── Volumes persistentes ─────────────────────────────────────────────────
volumes:
  postgres_data:
    name: severinno_postgres_data
  redis_data:
    name: severinno_redis_data
  minio_data:
    name: severinno_minio_data
  rabbitmq_data:
    name: severinno_rabbitmq_data
  caddy_data:
    name: severinno_caddy_data
  caddy_config:
    name: severinno_caddy_config
  caddy_logs:
    name: severinno_caddy_logs

# ── Docker Secrets ──────────────────────────────────────────────────────
secrets:
  postgres_password:
    file: ./secrets/postgres_password.secret
  glitchtip_db_password:
    file: ./secrets/glitchtip_db_password.secret
  s3_secret_key:
    file: ./secrets/s3_secret_key.secret
  rabbitmq_pass:
    file: ./secrets/rabbitmq_pass.secret
  session_secret:
    file: ./secrets/session_secret.secret
  vapid_private_key:
    file: ./secrets/vapid_private_key.secret
  smtp_pass:
    file: ./secrets/smtp_pass.secret
  cron_secret:
    file: ./secrets/cron_secret.secret
  lytex_client_secret:
    file: ./secrets/lytex_client_secret.secret

# ============================================================================
# SERVICOS
# ============================================================================

services:
  # ── Caddy (Reverse Proxy + SSL Automatico) ────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-s", "-q", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PostgreSQL + PostGIS ───────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=256M
    expose:
      - "5432"
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-severinno}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-severinno}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-severinno} -d ${POSTGRES_DB:-severinno}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis (Cache + Rate Limiting) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=64M
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ (Message Broker) ─────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_NICE
    read_only: true
    tmpfs:
      - /tmp:size=64M
      - /var/log/rabbitmq:size=32M
    expose:
      - "5672"
      - "15672"
    secrets:
      - rabbitmq_pass
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-severinno}
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_pass
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+P 1048576"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── MinIO (S3-compatible Object Storage) ──────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_CHROOT
    tmpfs:
      - /tmp:size=128M
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    secrets:
      - s3_secret_key
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── MinIO Bucket Init (one-shot) ──────────────────────────────────────
  minio-init:
    image: minio/mc:RELEASE.2024-12-18T13-15-44Z
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for MinIO..."
        S3_SECRET_VAL="$(cat /run/secrets/s3_secret_key 2>/dev/null || echo \"${S3_SECRET_KEY}\")"
        until /usr/bin/mc alias set minio http://minio:9000 \
          "${S3_ACCESS_KEY}" "${S3_SECRET_VAL}"; do sleep 2; done
        echo "Creating bucket '${S3_BUCKET}'..."
        /usr/bin/mc mb "minio/${S3_BUCKET}" --ignore-existing
        /usr/bin/mc anonymous set download "minio/${S3_BUCKET}"
        echo "Bucket '${S3_BUCKET}' ready."
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-severinno-uploads}
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - s3_secret_key

  # ── PgBouncer (Connection Pooler para PostgreSQL) ────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=16M
    expose:
      - "6432"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Realtime WebSocket (Socket.io) ─────────────────────────────────────
  realtime:
    build:
      context: ./mini-services/realtime
      dockerfile: Dockerfile
      args:
        BUN_VERSION: ${BUN_VERSION:-1.4.0}
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-severinno}/realtime:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=64M
    expose:
      - "3003"
    environment:
      PORT: 3003
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${NEXT_PUBLIC_APP_URL}
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Next.js (App Principal) ───────────────────────────────────────────
  app:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-severinno}/severinno:latest
    entrypoint: ["./scripts/docker-entrypoint.sh"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=256M
    expose:
      - "3000"
    networks:
      - backend
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    secrets:
      - postgres_password
      - rabbitmq_pass
      - s3_secret_key
      - session_secret
      - vapid_private_key
      - smtp_pass
      - cron_secret
      - lytex_client_secret
    volumes:
      - ./scripts/docker-entrypoint.sh:/app/scripts/docker-entrypoint.sh:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: "0.0.0.0"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-severinno}
      DIRECT_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-severinno}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-severinno}:${RABBITMQ_PASS}@rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-severinno-uploads}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      NEXT_PUBLIC_UPLOADS_BASE_URL: ${NEXT_PUBLIC_UPLOADS_BASE_URL:-/api/uploads}
      REALTIME_URL: http://realtime:3003
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://severinno.com}
      LYTEX_CLIENT_ID: ${LYTEX_CLIENT_ID}
      LYTEX_ENV: ${LYTEX_ENV:-production}
      LYTEX_API_URL: ${LYTEX_API_URL:-https://api.lytex.com.br/v1}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@severinno.com}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_FROM: ${SMTP_FROM:-noreply@severinno.com}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-severinno}
      SENTRY_DSN: ${SENTRY_DSN}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://osrm:5000}
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Email Worker ──────────────────────────────────────────────────────
  email-worker:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-severinno}/severinno:worker-latest
    entrypoint: ["./scripts/docker-entrypoint.sh"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    tmpfs:
      - /tmp:size=64M
    networks:
      - backend
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    secrets:
      - postgres_password
      - rabbitmq_pass
      - smtp_pass
    volumes:
      - ./scripts/docker-entrypoint.sh:/app/scripts/docker-entrypoint.sh:ro
    environment:
      NODE_ENV: production
      WORKER_TYPE: email
      DATABASE_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-severinno}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-severinno}:${RABBITMQ_PASS}@rabbitmq:5672
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_FROM: ${SMTP_FROM:-noreply@severinno.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "require('net').connect(5672,'rabbitmq').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1)).setTimeout(5000,()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Notification Worker ───────────────────────────────────────────────
  notification-worker:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-severinno}/severinno:worker-latest
    entrypoint: ["./scripts/docker-entrypoint.sh"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    tmpfs:
      - /tmp:size=64M
    networks:
      - backend
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    secrets:
      - postgres_password
      - rabbitmq_pass
      - vapid_private_key
    volumes:
      - ./scripts/docker-entrypoint.sh:/app/scripts/docker-entrypoint.sh:ro
    environment:
      NODE_ENV: production
      WORKER_TYPE: notification
      DATABASE_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-severinno}
      DIRECT_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-severinno}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-severinno}:${RABBITMQ_PASS}@rabbitmq:5672
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@severinno.com}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-severinno}
      REALTIME_URL: http://realtime:3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "require('net').connect(5672,'rabbitmq').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1)).setTimeout(5000,()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
