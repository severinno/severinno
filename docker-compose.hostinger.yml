# =============================================================================
# docker-compose.hostinger.yml — Deploy via Hostinger GitHub Action
# =============================================================================
# Este arquivo é usado pela hostinger/deploy-on-vps action.
#
# ── Modelo base + override ────────────────────────────────────────────────
# Os 10 serviços comuns à produção (postgres, redis, rabbitmq, minio,
# minio-init, pgbouncer, realtime, app, email-worker, notification-worker)
# vivem em deploy/docker-compose.base.yml — a MESMA fonte única de imagens
# (${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}, default git.severinno.com/severinno).
# Trocar registry = mudar a variável. Este arquivo declara só o que lhe é
# PRÓPRIO: o Caddy do deploy via action (sem admin API/2019, sem bind de log
# para fail2ban) e os defaults de domínio `.com` históricos deste canal —
# LEGÍTIMOS até decisão em contrário (a produção usa `.com.br`).
#
# Diferenças em relação ao prod (intencionais, medidas no merge):
#   - SEM deploy.resources (limites de CPU/RAM) e SEM rotação de logs;
#   - Caddy sem porta 2019 (admin API) e sem bind mount /var/log/caddy;
#   - Sem o stack GlitchTip, search-index-worker e geo-cache-warm.
#
# Uso:
#   docker compose -f docker-compose.hostinger.yml --env-file .env.production up -d
#   docker compose -f docker-compose.hostinger.yml --env-file .env.production logs -f
# =============================================================================

include:
  # env_file aponta para um arquivo VAZIO de propósito: sem ele, o include
  # carregaria o .env do diretório da base por conta própria (var de dev
  # vazaria para o render de produção quando o --env-file não a define).
  # Com ele, a interpolação da base usa as MESMAS fontes do comando
  # (--env-file .env.production), preservando o contrato do monolítico.
  - path: docker-compose.base.yml
    env_file: [compose-include.env]

# ── Rede exposta (Caddy → mundo) — backend herda da base ─────────────────
networks:
  frontend:
    name: severinno_frontend
    driver: bridge

# ── Volumes persistentes do Caddy (os de infra vêm da base) ──────────────
volumes:
  caddy_data:
    name: severinno_caddy_data
  caddy_config:
    name: severinno_caddy_config
  caddy_logs:
    name: severinno_caddy_logs

# ============================================================================
# SERVIÇOS EXCLUSIVOS DO DEPLOY VIA ACTION
# ============================================================================

services:
  # ── Caddy (Reverse Proxy + SSL Automático) ────────────────────────────
  # Versão do canal action: sem admin API (2019) e sem bind mount de log
  # para fail2ban — o hardening (no-new-privileges, cap_drop ALL, read_only,
  # tmpfs) é o mesmo do Caddy da produção.
  caddy:
    # MESMA imagem custom da produção (caddy-2.11.4-plugins, publicada pelo
    # job build do deploy.yml): o Caddyfile.prod usa rate_limit e format
    # transform — com a stock o parse crasha no boot e o edge entra em
    # ciclo de restart. O pull do deploy puxa ESTA tag do registry.
    image: ${IMAGE_REGISTRY:-git.severinno.com}/${IMAGE_NAMESPACE:-severinno}/severinno:caddy-2.11.4-plugins
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-s", "-q", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Divergências legítimas de default de domínio (`.com`) ─────────────
  # Este canal historicamente usa `.com` nos defaults (a env real do
  # .env.production prevalece quando definida). O prod usa `.com.br`.
  app:
    environment:
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://severinno.com}
      SMTP_FROM: ${SMTP_FROM:-noreply@severinno.com}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@severinno.com}

  email-worker:
    environment:
      SMTP_FROM: ${SMTP_FROM:-noreply@severinno.com}

  notification-worker:
    environment:
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@severinno.com}
