# =============================================================================
# Severinno — E2E Playwright Accessibility Test Environment
# =============================================================================
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down -v
# =============================================================================

services:

  # ── PostgreSQL + PostGIS ────────────────────────────────────────────────
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: severinno_test
      POSTGRES_USER: severinno
      POSTGRES_PASSWORD: severinno_test
    ports:
      - "127.0.0.1:5433:5432"   # 5433 host → 5432 container (avoid conflict with dev DB)
    tmpfs: /var/lib/postgresql/data   # throw-away data; fresh each run
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U severinno -d severinno_test"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── Valkey (Redis-compatible cache — 100 % FOSS) ────────────────────────
  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "127.0.0.1:6381:6379"   # 6381 host → 6379 container
    tmpfs: /data
    command: valkey-server --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  # ── Realtime WebSocket (Socket.io) ──────────────────────────────────────
  realtime:
    build:
      context: ./mini-services/realtime
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e",
        "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
