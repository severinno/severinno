# =============================================================================
# .gitea/workflows/forge-doctor.yml
#
# Equivalente ao `bun run doctor` rodando como CRON: publica o VEREDITO de
# prontidão da forja como ISSUE ACIONÁVEL quando ele não é PRONTA.
#
# POR QUE UM CRON (e por que a subida já não basta): o `deploy/gitea-up.sh` usa o
# doctor como pré-requisito e recusa subir com veredito BLOQUEADA. Mas a forja é
# um sistema VIVO: a branch protection registrada pode ser editada no painel, o
# registro do runner (o `/data/.runner` do volume) pode ficar velho, a tag que o
# registry serve hoje pode não ser a que o repositório declara, um espelho do
# BUN_VERSION pode divergir da variable. Nada disso aparece num PR, nada disso
# deixa um gate vermelho, e o doctor só é lido por quem lembrou de rodá-lo.
#
# POR QUE ISSUE (e não só o job vermelho): mesmo precedente dos outros alertas
# deste repositório (`required-checks-drift-issue.mjs`, `actrc-sync.yml`) — um
# cron que fica vermelho é alerta MUDO: ninguém abre o log de algo que rodou
# sozinho às 5h. A issue carrega o veredito, cada bloqueador com o seu remédio e
# a lista do que ficou SEM PROVA, e o dedup por assinatura evita repetir o mesmo
# veredito toda semana.
#
# INDETERMINADA TAMBÉM ABRE ISSUE, de propósito: ela não é violação, mas é dívida
# de PROVA — e é onde o drift se esconde (um fato que ninguém mediu não pode
# estar certo nem errado). Deixá-la fora do alerta faria o cron ficar verde
# justamente quando a medição está faltando. O corpo da issue distingue os dois
# casos, para o leitor não consertar uma peça que não está quebrada.
#
# A ORDEM DOS PASSOS É CONTRATO: o step que falha é o ÚLTIMO. Se ele viesse
# antes, o step da issue nunca rodaria e o alerta voltaria a ser cron vermelho
# sem ticket — exatamente o defeito que este workflow existe para eliminar.
# (Ordem travada por teste em src/lib/__tests__/forge-doctor-issue.test.ts.)
#
# O OUTRO LADO DA DÍVIDA: com o veredito de volta em PRONTA o MESMO step FECHA
# as issues que ele abriu (com a prova no comentário), em vez de deixá-las
# abertas mentindo no board. Por isso ele roda em `always()` e não só quando o
# veredito é ruim: era o único run capaz de fechar, e era o único em que ele não
# rodava. O que modula o step é o RELATÓRIO existir (exit 3 não produz um).
#
# POR QUE SÓ NA FORJA (e não um par no .github/): o veredito é sobre ESTA forja —
# ela é dona do merge, é onde a stack roda (docker, o volume do registro, o env
# do host) e é onde a branch protection que bloqueia vive. O runner do GitHub é
# outro ambiente: rodar o mesmo doctor lá responderia sobre o espelho, não sobre
# quem segura o merge. A assimetria é intencional — não "complete" o par.
#
# MAS O BOARD DO GITHUB ENTRA NA LEITURA (seção 6/7), e é a única coisa do
# veredito que NÃO é sobre esta forja — de propósito: nem toda dívida nasce aqui.
# A auditoria reversa do README e a tendência de mutação são crons do `.github/`,
# e as issues delas existem SÓ no board de lá. Sem `GH_TOKEN` + `GH_REPOSITORY` a
# leitura dessa parte sai como NÃO lida (INDETERMINADA, com o motivo) — nunca
# como "sem dívida", que é o falso verde que a seção existe para não produzir.
# Os nomes são `GH_*` e não `GITHUB_*` pelo mesmo motivo escrito no
# `githubReadConfig`: este runner EMULA o contexto do GitHub, e ali
# `GITHUB_REPOSITORY`/`GITHUB_TOKEN` são o repositório e o token do GITEA.
#
# Secrets: `GITEA_TOKEN` (leitura do branch protection, do registry, DO BOARD —
#                       as issues de drift abertas, que o doctor lê pela mesma
#                       consulta dos publicadores — e escrita em issues: sem a
#                       escrita, o veredito não é publicado)
#          `GITEA_URL`   (ex.: https://gitea.exemplo.com)
#          `GITEA_REPOSITORY` (owner/repo — necessário para abrir a issue)
#          `GH_TOKEN`   (LEITURA do board do GITHUB: as issues de 'readme-drift' e
#                        'mutation-trend-drift' vivem só lá. Token com
#                        `issues:read` — é o único canal possível aqui, porque o
#                        runner da forja não tem a CLI `gh`)
#          `GH_REPOSITORY` (owner/repo NO GITHUB — não confundir com o do Gitea;
#                        sem ele a API não tem alvo e a leitura sai como NÃO lida)
# Ausentes, o doctor roda assim mesmo: ele reporta o que NÃO conseguiu medir
# (`INDETERMINADA`) e a issue é publicada com essa lista — o mesmo fail-closed
# do resto do repositório: um alerta que não pode ser publicado é o silêncio de
# antes, só que parecendo verde.
#
# Este workflow NÃO pode estar em `ci/required-checks.json`: roda por cron, não
# em PR — exigi-lo travaria todo PR para sempre. (Mesma invariante do
# required-checks-drift.yml, travada em teste.)
#
# Usage:
#   cron semanal (segunda 07:07 UTC) ou dispatch manual.
#
# Exit codes (dos steps):
#   0 — veredito PRONTA (nada a reportar)
#   1 — veredito BLOQUEADA / INDETERMINADA (a issue é publicada ANTES de falhar)
# =============================================================================

name: Forge Doctor

on:
  schedule:
    # Segunda 07:07 UTC — depois dos crons de drift/espelhos (06:23-06:41) para
    # não competir por runner; o resultado não depende deles, só o horário é
    # quieto. Minuto que não coincide com os outros de propósito: um horário
    # idêntico faria duas filas disputarem o mesmo runner no mesmo instante.
    - cron: "7 7 * * 1"
  workflow_dispatch:

env:
  # FONTE ÚNICA (variables do repositório) — não cravar valor nenhum aqui. O
  # `--expected` compara o VALOR da versão e o `--expected-var` o das outras
  # variáveis que o compose da forja consome, não só a existência delas.
  BUN_VERSION: ${{ vars.BUN_VERSION }}
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}

jobs:
  doctor:
    name: Forge doctor (prontidão da forja → issue)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # fetch-depth: 0 é REQUISITO (de um fato do veredito, não preferência): a
      # seção 9/9 conta a IDADE do commit de origem de cada família medida do bench
      # em COMMITS até HEAD, e um clone raso responderia "o commit não está aqui" —
      # que a régua lê como "sem idade", nunca como "fresca". O padrão do
      # actions/checkout é depth 1; sem a história, o cron declara INDETERMINADA
      # para sempre sobre a régua que o modelo de latência consome.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mesmo contrato da ci.yml: script por `run:` (sem composite local).
      # Sem `actions/cache` nesta forja — ver ci.yml.
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"

      # ── O pré-requisito que o job `guards` também tem ────────────────────
      # O doctor EXECUTA a fatia de gates do job `guards` da ci.yml, e alguns
      # deles (a auditoria de dependências, por exemplo) precisam de
      # node_modules. Sem este passo, cada um deles viraria um BLOQUEADOR falso
      # na issue toda semana — e um alerta que sempre acende é um alerta que
      # ninguém lê. É o MESMO comando da ci.yml: o doctor mede o que o job mede.
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      # ── O veredito (relatório JSON gravado, exit code guardado) ───────────
      # `bun <script>` direto (não `bun run doctor`): a entry do package.json
      # invoca `node scripts/...`, e a imagem do runner Gitea não garante `node`
      # no PATH — bun executa o .mjs nativamente (o doctor usa `process.execPath`
      # nos subprocessos, então rodar por bun propaga a escolha).
      #
      # O step NÃO falha aqui: quem falha é o último. Um step que saísse 1 aqui
      # mataria o step da issue, e o drift voltaria a ser cron vermelho sem
      # ticket.
      #
      # O exit code do doctor É o veredito (0 pronta · 1 bloqueada · 2
      # indeterminada) — e 3 é RECUSA, com dois significados (recursão, que traz
      # relatório, e uso inválido, que não traz). Sem `--no-*`: o cron semanal é
      # justamente onde vale pagar o doctor inteiro — inclusive a prova do
      # bloqueio e o contrato da imagem publicada.
      #
      # `--expected` compara o VALOR dos espelhos com a repository variable, não
      # só a existência deles. Só é passado com a variable resolvida: uma flag
      # com valor vazio faria o espelho "divergir de ''", que é um diagnóstico
      # falso em cima de uma falha real (o contexto `vars` não hidratou).
      - name: Run doctor (report only)
        id: doctor
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ github.server_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          # O board do GitHub (a seção 6/7 lê as duas forjas). Ausentes, o doctor
          # DIZ que não conseguiu ler (e o veredito vira INDETERMINADA) — o que
          # ele nunca faz é tratar o board não lido como board vazio.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPOSITORY: ${{ vars.GH_REPOSITORY }}
        run: |
          set +e
          ARGS=(--json)
          if [ -n "${BUN_VERSION:-}" ]; then
            ARGS+=(--expected "$BUN_VERSION")
          else
            echo "::notice::vars.BUN_VERSION vazio — o veredito não cobrirá o VALOR dos espelhos."
          fi
          # Cada variável da imagem entra SÓ com o valor resolvido: uma flag com
          # valor vazio faria o espelho "divergir de ''", um diagnóstico falso
          # em cima de uma falha real (o contexto `vars` não hidratou). O doctor
          # DIZ qual variável ficou sem valor, então nenhuma some em silêncio.
          if [ -n "${IMAGE_REGISTRY:-}" ]; then
            ARGS+=(--expected-var "IMAGE_REGISTRY=$IMAGE_REGISTRY")
          fi
          if [ -n "${IMAGE_NAMESPACE:-}" ]; then
            ARGS+=(--expected-var "IMAGE_NAMESPACE=$IMAGE_NAMESPACE")
          fi
          bun scripts/forge-doctor.mjs "${ARGS[@]}" > /tmp/forge-doctor.json 2>/tmp/forge-doctor.log
          CODE=$?
          set -e
          cat /tmp/forge-doctor.log
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          # O RELATÓRIO existe? É o que MODULA o step da issue — e não o exit
          # code: com veredito 0/1/2 o JSON existe (o veredito É o exit code) e o
          # publicador roda nos DOIS sentidos (publicar dívida, fechar dívida).
          #
          # E o exit 3 NÃO é "sem medição": ele tem DOIS significados, e quem os
          # separa é o relatório. A RECURSÃO (o doctor rodando dentro da própria
          # prova) sai com 3 e EMITE o fato `nestedGuard` com `state: fired` —
          # publicado como issue PRÓPRIA, com o canal que marcou a invocação. O
          # uso inválido sai com 3 e não emite nada: aí sim não há medição, e o
          # publicador não roda.
          if [ -s /tmp/forge-doctor.json ]; then
            echo "report=1" >> "$GITHUB_OUTPUT"
          else
            echo "report=0" >> "$GITHUB_OUTPUT"
          fi
          # Qual dos dois exit 3 foi este. A regra sai do CONTRATO e não de
          # parsear o JSON no YAML: o ÚNICO caminho que sai 3 COM relatório é a
          # recursão — o uso inválido sai 3 sem escrever nada (é o `-s` acima) —,
          # e o relatório da recursão é justamente o que o publicador lê.
          #
          # O fato `nestedGuard` NÃO serve mais de sentinela aqui: ele passou a
          # existir em TODO relatório (dizendo `armed`, `disarmed` ou `fired`, o
          # guard declarado como fato próprio) — quem lembrava de um sinal de
          # disparo "grepando" o nome acabaria marcando `nested=1` num veredito
          # normal.
          if [ "$CODE" = "3" ] && [ -s /tmp/forge-doctor.json ]; then
            echo "nested=1" >> "$GITHUB_OUTPUT"
          else
            echo "nested=0" >> "$GITHUB_OUTPUT"
          fi
          echo "  relatório: /tmp/forge-doctor.json ($(wc -c < /tmp/forge-doctor.json) bytes)"

      # ── A ISSUE é o alerta; o vermelho abaixo é a lembrança ──────────────
      # Roda ANTES de falhar, de propósito. O relatório já está pronto, então
      # não há novo acesso à forja além da escrita da issue.
      #
      # `always()` — E NÃO `exit_code != '0'`: com veredito não-PRONTA este step
      # PUBLICA; com PRONTA ele RECONCILIA — comenta a prova e FECHA as issues
      # que ELE abriu, para a dívida não ficar ABERTA depois de resolvida. É o
      # MESMO ciclo de reconciliação dos alertas de drift (a mecânica é uma só,
      # em `issue-publish.mjs`), e condicionar este step ao veredito ruim faria o
      # fechamento sumir em SILÊNCIO no único run que pode fechá-lo — que era
      # exatamente o que acontecia aqui: o fechamento estava PROVADO no
      # publicador e nunca chegava a rodar no cron.
      #
      # Quem modula é o RELATÓRIO existir. Com exit 3 SEM relatório (uso/erro
      # interno) não há medição — e sem medição não há o que publicar nem o que
      # fechar. O job segue vermelho pelo step final, então pular aqui não afrouxa
      # nada ("não consegui medir" nunca vira verde).
      #
      # Com exit 3 COM relatório (RECURSÃO) há o que publicar: o relatório da
      # recursão é um veredito acionável próprio — o publicador o abre numa issue
      # separada, nomeando o canal que marcou a invocação aninhada.
      - name: Publish doctor verdict issue (Gitea)
        if: always() && steps.doctor.outputs.report == '1'
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ github.server_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
        run: |
          bun scripts/forge-doctor-issue.mjs \
            --report /tmp/forge-doctor.json \
            --backend gitea

      # ── Falha o cron também: a issue é o alerta, o vermelho é a lembrança ──
      - name: Fail on non-ready verdict
        if: steps.doctor.outputs.exit_code != '0'
        run: |
          # A issue é o alerta; este vermelho é a lembrança. Os dois casos de
          # exit 3 são ditos pelo NOME, porque "o veredito não é PRONTA" seria
          # falso na recursão: ali não houve veredito nenhum (o doctor recusou
          # antes de medir), e um log que afirmasse o contrário mandaria procurar
          # o problema no lugar errado.
          if [ "${{ steps.doctor.outputs.nested }}" = "1" ]; then
            echo "::error::O forge doctor RECUSOU por RECURSÃO (rodou dentro da própria prova): a prontidão NÃO foi medida. Veja a issue 'forge-doctor-verdict' — o corpo dela nomeia o canal que marcou a invocação (reprodução: bun run doctor)."
          else
            echo "::error::O veredito do forge doctor não é PRONTA. Veja a issue 'forge-doctor-verdict' (reprodução: bun run doctor)."
          fi
          exit 1
