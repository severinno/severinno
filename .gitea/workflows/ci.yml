# =============================================================================
# .gitea/workflows/ci.yml — CI/CD Pipeline para Severinno Marketplace
# =============================================================================
# Gitea Actions - compatível com GitHub Actions
#
# Pipeline:
#   lint       → ESLint
#   typecheck  → tsc --noEmit
#   test       → vitest run
#   build      → next build
#   deploy     → SSH deploy no VPS
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  # FONTE ÚNICA da versão do Bun: a variable do repositório. Era o literal
  # "1.4.0" — um SEGUNDO ponto de verdade que permitia esta pipeline construir
  # com um runtime diferente do que o espelho do GitHub constrói para o mesmo
  # commit. O guard `check:bun-mirror` só varria `.github/workflows` e por isso
  # não acusava; hoje ele varre todas as forjas (scripts/forge-workflows.mjs).
  BUN_VERSION: ${{ vars.BUN_VERSION }}
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/severinno_test
  REDIS_URL: redis://localhost:6379
  SESSION_SECRET: ci-session-secret-at-least-32-characters-long

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Script (não composite action): `run:` não passa pelo resolvedor de
      # actions locais do runner — ver scripts/setup-bun-ci.sh.
      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  # ── Repo Guards (invariantes do repositório, node-puro) ───────────────────
  # NÃO dependem do app rodar: são consistência de manifesto, de referências e
  # de fonte única. Job próprio para que a falha aponte o INVARIANTE violado em
  # vez de se diluir no `test` — e para que cada um possa ser exigido
  # individualmente no branch protection desta forja.
  guards:
    name: Repo Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Script (não composite action): `run:` não passa pelo resolvedor de
      # actions locais do runner — ver scripts/setup-bun-ci.sh.
      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile

      # O manifesto dos required checks precisa apontar para jobs REAIS e
      # incondicionais — um required check inexistente não falha, ele faz o PR
      # ESPERAR para sempre (diagnóstico opaco, PR travado sem causa visível).
      - name: Required checks manifest
        run: bun run check:required-checks

      # Cabeçalho de script: `Usage:` + `Exit code` no BLOCO DE DOCUMENTAÇÃO
      # LÍDER do arquivo (as linhas de comentário do topo, até a primeira linha
      # de código — a posição dentro do bloco não importa).
      #
      # Por que é BLOQUEANTE aqui: o contrato existia só dentro do `barrel-lint`,
      # cujo exit 3 o CI tratava como aviso e o pre-commit diluía (o `wait` de
      # vários PIDs devolve o status do ÚLTIMO). Resultado: sete scripts sem
      # cabeçalho válido passando por verde em toda parte. Um gate que decide o
      # merge precisa FALHAR, não aconselhar.
      #
      # node direto: guard node-puro, sem node_modules e sem bun no PATH.
      - name: Script header docs
        run: node scripts/check-script-headers.mjs

      # Fonte única do registry OCI (imagens da app + mirrors de toolchain).
      # Impede o reacoplamento ao GHCR: um `ghcr.io/...` solto volta a exigir
      # cota de storage/egress do registry proprietário e quebra o flip de uma
      # única variável (IMAGE_REGISTRY).
      #
      # As `vars` entram no AMBIENTE do passo de propósito: as referências da
      # imagem moram em configuração não versionada, e é do ambiente que o guard
      # lê o valor. Sem elas o passo só pode dizer INDETERMINADO ("não consegui
      # provar") — e um gate verde sobre o que não foi provado é pior que um
      # vermelho. Com elas, a repository variable é COMPARADA com o que o
      # repositório declara (`.actrc`, `deploy/env.gitea.example`).
      - name: OCI registry single source
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
          BUN_VERSION: ${{ vars.BUN_VERSION }}
        run: bun run check:registry-source

      # A BASE da imagem que roda ESTES jobs: pinada por digest e com o contrato
      # da imagem provado por EXECUÇÃO (o bloco `RUN` real do Dockerfile, contra
      # bases dubladas: com o plugin `compose` passa, sem ele FALHA — é a prova
      # de que trocar o digest quebra o contrato, como o mutation prova).
      #
      # `catthehacker/ubuntu:act-latest` é uma tag FLUTUANTE: um rebuild troca a
      # imagem inteira — inclusive o plugin `compose` que a invariante 7 usa para
      # renderizar o compose da forja — sem nenhuma linha do repositório mudar.
      #
      # O probe da tag é o único passo que depende de rede: sem ele o passo
      # continua verde DECLARANDO que não conferiu o pin contra a tag.
      - name: Runner base pin (digest + contrato)
        run: bun run check:runner-base

      # Nenhuma referência pendurada entre workflow → script/package.json.
      - name: Workflow references
        run: bun run check:workflow-refs:internal

      # @ts-nocheck desliga a verificação de tipos do arquivo — é a porta dos
      # fundos do typecheck. Sem este gate na forja, um arquivo poderia entrar
      # aqui com os tipos desligados e a pipeline passaria verde.
      - name: No @ts-nocheck
        run: bun run check:ts-nocheck

      # Escopo dos guards: nenhum script pode cravar um diretório de forja —
      # é o que garante que ESTA pipeline não volte a ficar fora da cobertura.
      - name: Forge workflow scope
        run: bun run check:forge-workflow-scope

      # Paridade de gates entre esta pipeline (dona do merge) e o espelho do
      # GitHub: um gate do CORE que roda em só uma delas é buraco silencioso.
      - name: Forge gate parity
        run: bun run check:forge-parity

      # ── Segurança: gates que existiam APENAS no espelho do GitHub ────────
      # Descobertos pela classificação obrigatória do check:forge-parity. Estar
      # "no arquivo do GitHub" foi confundido com "ser específico do GitHub":
      # a auditoria de dependências, a baseline de segredos e o guard de hooks
      # de seed não têm nada de GitHub — só moravam lá. A forja é dona do merge,
      # então ela é quem precisa bloquear neles.
      - name: Dependency audit baseline (vulnerabilidades novas)
        run: bun run check:bun-audit-baseline

      - name: Secrets baseline (nenhum segredo versionado)
        run: bun scripts/rotate-secrets.mjs --check

      # SEED_SPEC_PATCH/PROD_SEED_ALLOW_DEV são TEST-ONLY: vazando para um
      # caminho de deploy, o seed de produção roda com spec patchado. A forja
      # TEM um deploy — este é o gate que mais faz sentido estar aqui.
      - name: Seed test hooks (fora do caminho de deploy)
        run: bun run check:seed-hooks

      # Sentinel órfão = guarda CEGA (o grep nunca acende e 'não achou' vira
      # falso positivo de 'limpo').
      - name: Sentinel producer
        run: bun run check:sentinel-producer

      # ── Fonte única / consistência do repositório ─────────────────────────
      - name: Bun single source (mirror + call sites)
        run: bun run check:bun-mirror

      - name: No oven-sh/setup-bun
        run: bun run check:no-setup-bun

      # README prometendo um hook que não existe = proteção fantasma.
      - name: Hook symmetry (README ↔ hooks reais)
        run: bun scripts/check-hooks-symmetry.mjs

  # ── TypeScript check ─────────────────────────────────────────────────────
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Script (não composite action): `run:` não passa pelo resolvedor de
      # actions locais do runner — ver scripts/setup-bun-ci.sh.
      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun run db:generate

      - name: Type check
        run: bunx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: severinno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Script (não composite action): `run:` não passa pelo resolvedor de
      # actions locais do runner — ver scripts/setup-bun-ci.sh.
      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun run db:generate

      # Barreira explícita de payload de usuário (allowlist de PII) + fonte
      # única do client Prisma. Roda como step próprio para que a falha aponte
      # direto para vazamento de campo, em vez de se perder no `test:run`.
      - name: PII allowlist guard
        run: bun run check:pii-allowlist

      # Prova que o guard acima detecta a regressão que ele existe para impedir
      # (sandbox isolado em `.tmp/`; o checkout não é tocado).
      - name: PII gate self-test
        run: bun run check:pii-gate

      - run: bun run test:run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/severinno_test

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]

    steps:
      - uses: actions/checkout@v4

      # Script (não composite action): `run:` não passa pelo resolvedor de
      # actions locais do runner — ver scripts/setup-bun-ci.sh.
      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run build
        env:
          SKIP_TYPESCRIPT_CHECK: "true"
          BUILD_STANDALONE: "true"

  # ── Deploy (apenas main) ─────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Pulling new images..."
            docker compose pull app realtime email-worker notification-worker
            echo "Restarting services..."
            docker compose up -d --no-deps --remove-orphans app realtime
            docker compose --profile workers up -d --no-deps email-worker notification-worker
            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              sleep 5
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Health check passed (HTTP $HTTP_CODE)"
                docker image prune -f
                exit 0
              fi
              echo "Attempt $i/12 — HTTP $HTTP_CODE, retrying..."
            done
            echo "Health check failed after 12 attempts" && exit 1
