# =============================================================================
# .gitea/workflows/ci.yml — CI/CD Pipeline para Severinno Marketplace
# =============================================================================
# Gitea Actions - compatível com GitHub Actions
#
# Pipeline:
#   lint       → bun run lint (prettier --check + eslint --max-warnings 0)
#                — o MESMO comando do job `lint-guard` do GitHub: a régua vive no
#                script `lint` do package.json, não em cada pipeline. Antes daqui
#                saía só `eslint .` (sem o teto de warnings, sem prettier) e o
#                mesmo commit passava neste merge e era rejeitado no GitHub.
#   typecheck  → tsc --noEmit
#   test       → vitest run
#   build      → next build
#   deploy     → SSH deploy no VPS
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  # FONTE ÚNICA da versão do Bun: a variable do repositório. Era o literal
  # "1.4.0" — um SEGUNDO ponto de verdade que permitia esta pipeline construir
  # com um runtime diferente do que o espelho do GitHub constrói para o mesmo
  # commit. O guard `check:bun-mirror` só varria `.github/workflows` e por isso
  # não acusava; hoje ele varre todas as forjas (scripts/forge-workflows.mjs).
  BUN_VERSION: ${{ vars.BUN_VERSION }}
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/severinno_test
  REDIS_URL: redis://localhost:6379
  SESSION_SECRET: ci-session-secret-at-least-32-characters-long

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Script (não composite action): `run:` não passa pelo resolvedor de
      # actions locais do runner — ver scripts/setup-bun-ci.sh.
      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  # ── Repo Guards (invariantes do repositório, node-puro) ───────────────────
  # NÃO dependem do app rodar: são consistência de manifesto, de referências e
  # de fonte única. Job próprio para que a falha aponte o INVARIANTE violado em
  # vez de se diluir no `test` — e para que cada um possa ser exigido
  # individualmente no branch protection desta forja.
  guards:
    name: Repo Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Script (não composite action): `run:` não passa pelo resolvedor de
      # actions locais do runner — ver scripts/setup-bun-ci.sh.
      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile

      # ── OS GATES DESTE JOB E A FORJA ESPELHO ─────────────────────────────
      # Cada gate abaixo é invocado pela MESMA linha que o espelho do GitHub
      # (`.github/workflows/pr-check.yml`): `node scripts/<arquivo>.mjs` com os
      # MESMOS argumentos. A forma indireta (`bun run check:<entry>`) passava
      # pelo `matches` frouxo de cada invariante e escondia uma SEGUNDA RÉGUA:
      # o `--pkg-internal` de um lado e a ausência dele do outro davam o mesmo
      # "presente". Hoje o invariante do CORE é o LITERAL do comando, e o
      # `check-forge-parity` mede presença pelas linhas de `run:` (é o mesmo
      # dado que o doctor usa) — a régua é uma só por construção.
      #
      # Três invariantes seguem pela entry do package.json, e não pelo caminho
      # do script: `lint`, `typecheck` e `test:run` (o comando é composto ou
      # carrega opções de runtime que NÃO existem na linha — o heap do tsc), e
      # `check:pii-allowlist`/`check:pii-gate` (o comando é um `vitest` com a
      # lista de arquivos). Ali a entry É a fonte única: o comando não existe
      # fora dela.

      # O manifesto dos required checks precisa apontar para jobs REAIS e
      # incondicionais — um required check inexistente não falha, ele faz o PR
      # ESPERAR para sempre (diagnóstico opaco, PR travado sem causa visível).
      - name: Required checks manifest
        run: node scripts/check-required-checks.mjs

      # Cabeçalho de script: `Usage:` + `Exit code` no BLOCO DE DOCUMENTAÇÃO
      # LÍDER do arquivo (as linhas de comentário do topo, até a primeira linha
      # de código — a posição dentro do bloco não importa).
      #
      # Por que é BLOQUEANTE aqui: o contrato existia só dentro do `barrel-lint`,
      # cujo exit 3 o CI tratava como aviso e o pre-commit diluía (o `wait` de
      # vários PIDs devolve o status do ÚLTIMO). Resultado: sete scripts sem
      # cabeçalho válido passando por verde em toda parte. Um gate que decide o
      # merge precisa FALHAR, não aconselhar.
      #
      # node direto: guard node-puro, sem node_modules — e é a forma canônica
      # de todo gate de um script só (o espelho do GitHub invoca o mesmo
      # literal, sem depender de `bun` no PATH).
      - name: Script header docs
        run: node scripts/check-script-headers.mjs

      # A classe SIGPIPE: sob `set -o pipefail`, `algo | grep -q PADRAO` pode
      # passar a 141 MESMO com o padrão encontrado — `grep -q` fecha o stdin no
      # primeiro casamento e o produtor leva SIGPIPE se ainda tiver o que
      # escrever. É INTERMITENTE (depende do tamanho da saída), então o sintoma
      # aparece na asserção que ACHOU o texto, não na causa. O remédio é
      # herestring (`grep -q X <<< "$OUT"`): nenhum pipe, nenhum produtor para
      # levar o sinal.
      #
      # Sem cota, sem allowlist: a dívida foi APOSENTADA (o `--fix` do guard
      # reescreveu as 216 ocorrências mecânicas) e o baseline foi removido —
      # QUALQUER ocorrência reprova o PR, em qualquer arquivo.
      - name: Pipefail x grep quieto (SIGPIPE)
        run: node scripts/check-pipefail-sigpipe.mjs

      # Contrato de documentação das PROVAS (família `prove-*`/`doctor`): exige,
      # para CADA comando, um bloco com o resultado esperado — e CONFRONTA esse
      # bloco com a saída real (exit declarado + linhas exigidas). Uma doc que
      # descreve a saída de ANTES mente com aparência de rigor, o que é pior que
      # a ausência dela: quem confia no bloco documentado confia em nada.
      #
      # As provas que exigem docker/imagem (runtime, smoke-render, merge-gate) o
      # guard executa com o `docker` AUSENTE de propósito e cobra o desfecho
      # INDETERMINADO que elas DOCUMENTAM ter aí — a invariante verificada é
      # "ausência de prova nunca vira sucesso", e ela roda hermeticamente (~1s).
      - name: Probe docs contract
        run: node scripts/check-prove-docs.mjs

      # Fonte única do registry OCI (imagens da app + mirrors de toolchain).
      # Impede o reacoplamento ao GHCR: um `ghcr.io/...` solto volta a exigir
      # cota de storage/egress do registry proprietário e quebra o flip de uma
      # única variável (IMAGE_REGISTRY).
      #
      # As `vars` entram no AMBIENTE do passo de propósito: as referências da
      # imagem moram em configuração não versionada, e é do ambiente que o guard
      # lê o valor. Sem elas o passo só pode dizer INDETERMINADO ("não consegui
      # provar") — e um gate verde sobre o que não foi provado é pior que um
      # vermelho. Com elas, a repository variable é COMPARADA com o que o
      # repositório declara (`.actrc`, `deploy/env.gitea.example`).
      - name: OCI registry single source
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
          BUN_VERSION: ${{ vars.BUN_VERSION }}
        run: node scripts/check-registry-source.mjs

      # ── O VALOR das variables, conferido a CADA PR (o doctor, perfil --ci) ──
      # O job semanal `actrc-sync` faz esta pergunta, mas ele é SEMANAL: um PR que
      # mexe no template (ou uma variable trocada na forja) espera dias pelo
      # veredito — e o defeito é silencioso (o espelho velho não quebra nada
      # visível). Aqui a MESMA pergunta roda no merge, pelo doctor, que chama a
      # MESMA função do guard periódico (`mirrorDriftReport`) e por isso não pode
      # discordar do log dele.
      #
      # POR QUE O PERFIL `--ci`, e não o doctor inteiro:
      #   - a bateria de guards É este job (rodá-la aqui seria recursão);
      #   - a prova do bloqueio executa o `deploy/gitea-up.sh`, que executa ESTE
      #     doctor (recursão de novo);
      #   - a branch protection registrada, o registro do runner, o contrato da
      #     imagem publicada, o probe do registry e o board exigem credencial de
      #     administração, rede ou o estado do HOST — quem os cobre é o cron
      #     (`.gitea/workflows/forge-doctor.yml`).
      # O recorte é DELIBERADO e o relatório NOMEIA cada seção que ficou fora
      # (lista de "não provado"): nenhuma some por omissão.
      #
      # AS `vars` ENTRAM PELO AMBIENTE **E** PELAS FLAGS, e são duas perguntas
      # diferentes: no AMBIENTE, a invariante 7c do check-registry-source compara
      # o valor com o que o repositório declara; nas FLAGS
      # (`--expected`/`--expected-var`), o doctor compara os ESPELHOS (`.actrc`, o
      # template e o `deploy/.env.gitea` do host quando ele existe) com o MESMO
      # código do job semanal.
      #
      # A LÓGICA (montar as flags, recusar régua vazia, traduzir o veredito em
      # exit code) mora em `scripts/check-doctor-ci.mjs`, e a linha aqui é uma só
      # de propósito: o próprio doctor executa esta bateria a partir do job — e
      # ele exige que todo gate da pipeline dona do merge seja uma linha
      # `run: <cmd>` que ele consiga rodar por LISTA DE ARGUMENTOS (um `run: |`
      # com o comando lá dentro é invisível para ele e falharia o teste que prova
      # isso). O script nomeia a variável não criada (`::warning::`), roda o doctor
      # e faz 1 (BLOQUEADA) valer 1 e o INDETERMINADA do perfil valer 0 — um PR
      # vermelho por seção que o cron cobre seria o "gate que sempre acende".
      - name: Doctor Ci (o VALOR das repository variables nos espelhos)
        # BUN_VERSION já vem do env do workflow (a MESMA variável que o
        # setup-bun usou); as outras duas são declaradas aqui, sem fallback: um
        # `|| 'ghcr.io'` no YAML é intenção declarada, nunca o valor.
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
        run: node scripts/check-doctor-ci.mjs

      # A BASE da imagem que roda ESTES jobs: pinada por digest e com o contrato
      # da imagem provado por EXECUÇÃO (o bloco `RUN` real do Dockerfile, contra
      # bases dubladas: com o plugin `compose` passa, sem ele FALHA — é a prova
      # de que trocar o digest quebra o contrato, como o mutation prova).
      #
      # `catthehacker/ubuntu:act-latest` é uma tag FLUTUANTE: um rebuild troca a
      # imagem inteira — inclusive o plugin `compose` que a invariante 7 usa para
      # renderizar o compose da forja — sem nenhuma linha do repositório mudar.
      #
      # O probe da tag é o único passo que depende de rede: sem ele o passo
      # continua verde DECLARANDO que não conferiu o pin contra a tag.
      - name: Runner base pin (digest + contrato)
        run: node scripts/check-runner-base.mjs

      # Nenhuma referência pendurada entre workflow → script/package.json.
      - name: Workflow references
        run: node scripts/check-workflow-refs.mjs --pkg-internal

      # PARIDADE hook ↔ CI: o veredito LOCAL e o do MERGE são dois conjuntos de
      # comandos escritos em dois lugares — e enquanto a duplicação for
      # invisível, ela diverge em silêncio ("passou aqui e quebrou lá"). O caso
      # REAL: `.husky/pre-push` rodava `bunx tsc --noEmit` SEM o heap de 4GB que
      # o script `typecheck` carrega — o mesmo commit estourava a memória no
      # push (SIGABRT, 134) e passava no merge, por uma régua que só o hook
      # tinha. Aqui cada comando dos hooks é resolvido (a entrada do
      # package.json) e comparado com o comando CANÔNICO do CORE; o que não é o
      # mesmo comando exige DECISÃO ESCRITA, e o que o hook não roda exige
      # entrada em HOOK_NOT_RUN — um gate do contrato de merge não entra em
      # silêncio em nenhum dos dois lados.
      - name: Hook x CI parity
        run: node scripts/check-hook-ci-parity.mjs

      # @ts-nocheck desliga a verificação de tipos do arquivo — é a porta dos
      # fundos do typecheck. Sem este gate na forja, um arquivo poderia entrar
      # aqui com os tipos desligados e a pipeline passaria verde.
      - name: No @ts-nocheck
        run: bun run check:ts-nocheck

      # Escopo dos guards: nenhum script pode cravar um diretório de forja —
      # é o que garante que ESTA pipeline não volte a ficar fora da cobertura.
      - name: Forge workflow scope
        run: node scripts/check-forge-workflow-scope.mjs

      # Paridade de gates entre esta pipeline (dona do merge) e o espelho do
      # GitHub: um gate do CORE que roda em só uma delas é buraco silencioso.
      - name: Forge gate parity
        run: node scripts/check-forge-parity.mjs

      # ── Segurança: gates que existiam APENAS no espelho do GitHub ────────
      # Descobertos pela classificação obrigatória do check:forge-parity. Estar
      # "no arquivo do GitHub" foi confundido com "ser específico do GitHub":
      # a auditoria de dependências, a baseline de segredos e o guard de hooks
      # de seed não têm nada de GitHub — só moravam lá. A forja é dona do merge,
      # então ela é quem precisa bloquear neles.
      - name: Dependency audit baseline (vulnerabilidades novas)
        run: node scripts/check-bun-audit-baseline.mjs

      - name: Secrets baseline (nenhum segredo versionado)
        run: node scripts/rotate-secrets.mjs --check

      # SEED_SPEC_PATCH/PROD_SEED_ALLOW_DEV são TEST-ONLY: vazando para um
      # caminho de deploy, o seed de produção roda com spec patchado. A forja
      # TEM um deploy — este é o gate que mais faz sentido estar aqui.
      - name: Seed test hooks (fora do caminho de deploy)
        run: node scripts/check-seed-hooks.mjs

      # Sentinel órfão = guarda CEGA (o grep nunca acende e 'não achou' vira
      # falso positivo de 'limpo').
      - name: Sentinel producer
        run: node scripts/check-sentinel-producer.mjs

      # ── Fonte única / consistência do repositório ─────────────────────────
      - name: Bun single source (mirror + call sites)
        run: node scripts/check-bun-mirror.mjs

      - name: No oven-sh/setup-bun
        run: node scripts/check-no-setup-bun.mjs

      # README prometendo um hook que não existe = proteção fantasma.
      - name: Hook symmetry (README ↔ hooks reais)
        run: node scripts/check-hooks-symmetry.mjs

  # ── Prova do PRÉ-REQUISITO 0 do bring-up (por EXECUÇÃO, não por texto) ─────
  # O `guards` prova a ORDEM no TEXTO do `deploy/gitea-up.sh` (`checkGiteaBringUp`)
  # e o ensure tem testes unitários dos seus estados. Nada disso distingue "o
  # passo 0 RECUSA" de "o passo 0 está QUEBRADO": um bring-up que aborta por
  # qualquer outro motivo também não sobe o runner — e passaria. Aqui o bring-up
  # REAL roda contra um env DIVERGENTE (a imagem existe e a stack MESMO ASSIM não
  # sobe), com um registry de teste em 127.0.0.1 e um `docker` dublê: sem rede
  # externa, sem docker real, ~10s. Quem mexer no `gitea-up.sh` e quebrar o passo
  # 0 derruba ESTE job — o bloqueio deixa de depender de alguém lembrar de rodar
  # a prova.
  #
  # POR QUE UM JOB PRÓPRIO (e não um passo do `guards`): o doctor EXECUTA a
  # bateria do job `guards` como fato, e o `gitea-up.sh` chama o doctor com
  # `--no-proof` justamente para não chamar de volta a prova que executa ELE. Se
  # a prova entrasse na bateria do `guards`, o `--no-proof` perderia o efeito e
  # cada subida rodaria a prova de si mesma, dez vezes. Como job próprio ela é o
  # gate de merge, e o doctor continua medindo o fato pela seção `proof` — sem
  # circularidade. (A paridade nas duas forjas é cobrada pelo `check:forge-parity`,
  # cuja invariante `bring-up-env-gate-proof` casa esta linha.)
  bring-up-proof:
    name: Bring-up Gate Proof (pré-requisito 0, por execução)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `node` direto: o guard é node-puro (sem node_modules) e já EXIGE node — o
      # próprio `deploy/gitea-up.sh` aborta sem ele (`command -v node`), e é ele
      # quem executa o caminho real aqui dentro.
      - name: Bring-up contra env divergente (a stack não sobe)
        run: node scripts/prove-runner-image-gate.mjs

  # ── TypeScript check ─────────────────────────────────────────────────────
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Script (não composite action): `run:` não passa pelo resolvedor de
      # actions locais do runner — ver scripts/setup-bun-ci.sh.
      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun run db:generate

      # O comando INTEIRO vive no script `typecheck` do package.json — inclusive
      # o heap de 4GB. Passá-lo TAMBÉM como `env:` aqui criaria uma segunda
      # régua: dois lugares para o mesmo valor, e o commit podia divergir entre
      # as forjas sem nenhuma linha de workflow mudar. O job `typecheck` do
      # espelho do GitHub executa este MESMO `bun run typecheck`.
      - name: Type check
        run: bun run typecheck

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: severinno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Script (não composite action): `run:` não passa pelo resolvedor de
      # actions locais do runner — ver scripts/setup-bun-ci.sh.
      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun run db:generate

      # Barreira explícita de payload de usuário (allowlist de PII) + fonte
      # única do client Prisma. Roda como step próprio para que a falha aponte
      # direto para vazamento de campo, em vez de se perder no `test:run`.
      - name: PII allowlist guard
        run: bun run check:pii-allowlist

      # Prova que o guard acima detecta a regressão que ele existe para impedir
      # (sandbox isolado em `.tmp/`; o checkout não é tocado).
      - name: PII gate self-test
        run: bun run check:pii-gate

      - run: bun run test:run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/severinno_test

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]

    steps:
      - uses: actions/checkout@v4

      # Script (não composite action): `run:` não passa pelo resolvedor de
      # actions locais do runner — ver scripts/setup-bun-ci.sh.
      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run build
        env:
          SKIP_TYPESCRIPT_CHECK: "true"
          BUILD_STANDALONE: "true"

  # ── Deploy (apenas main) ─────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Pulling new images..."
            docker compose pull app realtime email-worker notification-worker
            echo "Restarting services..."
            docker compose up -d --no-deps --remove-orphans app realtime
            docker compose --profile workers up -d --no-deps email-worker notification-worker
            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              sleep 5
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Health check passed (HTTP $HTTP_CODE)"
                docker image prune -f
                exit 0
              fi
              echo "Attempt $i/12 — HTTP $HTTP_CODE, retrying..."
            done
            echo "Health check failed after 12 attempts" && exit 1
