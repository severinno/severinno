# =============================================================================
# .gitea/workflows/deploy.yml — Deploy Pipeline para Severinno Marketplace
# =============================================================================
# Gitea Actions - build da imagem no host e deploy via SSH
#
# UM caminho de build só: host-artifacts. O `next build` roda NO HOST do
# runner, FORA do buildkit, e a imagem é montada COPY-only a partir de
# .next/standalone. O build dentro do buildkit foi REMOVIDO em 23/10/2026:
# ele não completava nesta stack (Turbopack/postcss) e, com o teto de memória,
# morria no cgroup em vez de entregar imagem — medido na VPS da forja: 8 GB de
# cgroup (morto aos 161 s do `next build`) e 11 GB (pico colado no teto,
# morto). O job `docker-test` saiu junto: a prova de boot que ele fazia (subir
# o container e responder 200/503 no /api/health) vive agora DENTRO do job
# `build`, sobre a MESMA imagem que o deploy entrega — antes ele provava uma
# imagem que nunca chegava à VPS.
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Origem das imagens — FONTE ÚNICA (variable IMAGE_REGISTRY da forja).
  # Aqui é onde o registry open source (git.severinno.com) entra: defina a
  # variable IMAGE_REGISTRY no repositório do Gitea/Forgejo e as imagens
  # param de sair do GHCR sem tocar em nenhum outro arquivo.
  # O contexto `vars` exige Gitea >= 1.22 (o compose fixa 1.22).
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'git.severinno.com' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}
  # FONTE ÚNICA da versão do Bun (era o literal 1.4.0 nos build-args).
  BUN_VERSION: ${{ vars.BUN_VERSION }}

jobs:
  # ── UTF-8 Check ──────────────────────────────────────────────────────────
  utf8-check:
    name: UTF-8 Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check UTF-8 encoding
        run: |
          find . -name "*.ts" -o -name "*.tsx" | xargs file --mime-encoding | grep -v utf-8 || true

  # ── Build & Test (host-artifacts) ────────────────────────────────────────
  # O tarpit do buildkit (`next build` dentro do buildkit: worker postcss do
  # Turbopack, 6+ GB RSS, CPU 100% sem término — reproduzido 3× local, 2× VPS,
  # documentado no Dockerfile) deixava o deploy completo dependente de MAO
  # HUMANA. Este é o caminho MEDIDO no deploy de 07/10/2026 e o ÚNICO desde
  # 23/10/2026: build fora do buildkit, no próprio job (imagem ubuntu-bun:
  # bun + node + openssl) — RC=0, `next build` em ~70s — e montagem COPY-only
  # das camadas de runtime com as MESMAS 3 tags que o compose.hostinger
  # consome (:latest, :sha-<sha>, :worker-latest).
  #
  # O `timeout` continua: uma pendura aqui é do runner, não do docker, e o
  # job precisa falhar ALTO em vez de ficar até o timeout global da forja.
  build:
    name: Build & Test (host-artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Artefatos no host (bun install → generate → build)
        run: |-
          set -e
          # O job roda DENTRO da imagem ubuntu-bun (label ubuntu-latest da
          # forja): bun, node, npm e openssl estão no PATH — o build acontece
          # aqui, FORA do buildkit, que é onde o postcss do Turbopack tarpita.
          # Nenhum `docker run -v $PWD` aqui: o -v do `-v` resolve o caminho no
          # HOST daemon, e o workspace do runner é um volume — o 1º run deste
          # caminho falhou com "Bun could not find a package.json" por isso
          # (medido no task 312). OpenSSL 3.x daqui gera a mesma engine
          # (debian-openssl-3.0.x) que o runtime node:22-bookworm-slim consome.
          openssl version || { apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl; }
          openssl version
          export DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder"
          bun install --frozen-lockfile
          npx prisma generate
          BUILD_STANDALONE=true SKIP_TYPESCRIPT_CHECK=true DOCKER_BUILD=true npm run build
          test -f .next/standalone/server.js

      - name: Imagem do app (COPY-only; contexto sem .dockerignore)
        run: |-
          set -e
          # O .dockerignore exclui .next/ e node_modules/ (insumos da montagem)
          # e *.png/*.svg (ícones do public/) — a montagem COPY-only exige o
          # contexto SEM ele, restaurado ao fim para o build do worker.
          mv .dockerignore /tmp/.dockerignore.bak
          # ── A FECHAMENTO do migrate, não o node_modules inteiro ─────────────
          # O COPY de node_modules COMPLETO por cima do standalone SOBRESCREVE
          # o node_modules traçado (~141M, 45 pacotes) que já veio nele — a
          # imagem pagava ~1,3GB de devDependencies (typescript, prettier,
          # playwright-core, vite, webpack…). O que o `prisma migrate deploy`
          # resolve em runtime ALEM do standalone é pequeno: dotenv +
          # @prisma/config + transitivas (39 pacotes, ~48M) — a closure é
          # calculada pelo script (caminhada sobre os dependencies declarados,
          # resolução pela regra do node) e o COPY dela sobre o node_modules do
          # standalone é MERGE (COPY sobrescreve só os paths que entrega).
          # PROVADO em 08/10/2026: migrate deploy carrega prisma.config.ts,
          # lê schema+migrations e CHEGA AO BANCO (P1000 auth com credencial
          # placeholder = última etapa); boot responde 200/503 como antes.
          node scripts/stage-migrate-closure.mjs node_modules migrate-closure
          cat > /tmp/host-artifacts-app.Dockerfile <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          ENV NODE_ENV=production
          RUN addgroup --system --gid 1001 nodejs && adduser --system --uid 1001 --gid 1001 nextjs
          RUN apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl && rm -rf /var/lib/apt/lists/*
          RUN mkdir -p /data && chown nextjs:nodejs /data
          WORKDIR /app
          COPY --chown=nextjs:nodejs public ./public
          COPY --chown=nextjs:nodejs .next/standalone ./
          COPY --chown=nextjs:nodejs .next/static ./.next/static
          COPY --chown=nextjs:nodejs migrate-closure ./node_modules
          COPY --chown=nextjs:nodejs prisma ./prisma
          COPY --chown=nextjs:nodejs prisma.config.ts ./prisma.config.ts
          RUN npm install -g prisma@6.19.3
          USER nextjs
          EXPOSE 3000
          ENV PORT=3000
          CMD ["node", "server.js"]
          DOCKERFILE
          docker build -f /tmp/host-artifacts-app.Dockerfile -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" .
          mv /tmp/.dockerignore.bak .dockerignore
          rm -rf migrate-closure
          docker tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"

      - name: Imagem do worker (Dockerfile.worker, base pinada por digest)
        run: |-
          set -e
          docker build -f Dockerfile.worker --build-arg BUN_VERSION=${{ env.BUN_VERSION }} -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:worker-latest" .

      - name: Prova de boot (servidor sobe e responde 200/503)
        run: |-
          set -e
          # HOSTNAME=0.0.0.0 OBRIGATÓRIO com --network host: o container herda o
          # hostname da MÁQUINA (ex. "severinno") e o standalone do Next lê
          # process.env.HOSTNAME para escolher a interface — sem esta linha o
          # servidor binda no IP do host (inalcançável por localhost) e a prova
          # de boot falha em HTTP 000 nas 20 tentativas (medido no task 322).
          docker run -d --name severinno-build-test --network host \
            -e DATABASE_URL="postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder" \
            -e REDIS_URL="redis://127.0.0.1:6379" \
            -e SESSION_SECRET="build-secret-at-least-32-characters" \
            -e NODE_ENV=production \
            -e HOSTNAME=0.0.0.0 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          # A SONDA VAI DENTRO DO CONTAINER (`docker exec` + fetch do node): o
          # job roda na rede bridge da gitea e o app em --network host — o
          # `localhost` do job é OUTRO netns e nunca alcança o host (medido:
          # HTTP 000 nas 40 tentativas dos tasks 322 e 327). Mesmo padrão já
          # provado pelo job deploy abaixo.
          HTTP_LAST="000"
          for i in $(seq 1 20); do
            sleep 3
            HTTP_LAST=$(docker exec severinno-build-test node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{console.log(r.status)}).catch(()=>{console.log(0)})" 2>/dev/null || echo "000")
            case "$HTTP_LAST" in
              200|503) echo "Boot OK (HTTP $HTTP_LAST em $i tentativas)"; break;;
            esac
            echo "attempt $i/20 - HTTP $HTTP_LAST"
          done
          docker logs severinno-build-test 2>&1 | tail -20 || true
          docker rm -f severinno-build-test >/dev/null 2>&1 || true
          case "$HTTP_LAST" in
            200|503) exit 0;;
            *) echo "Boot falhou após 20 tentativas (último HTTP $HTTP_LAST)"; exit 1;;
          esac

  # ── Migrate Database ─────────────────────────────────────────────────────
  migrate:
    name: Migrate Database
    needs: [build]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.build.result == 'success'

    steps:
      - name: Run database migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Subindo a camada de dados (postgres/redis/rabbitmq/minio/pgbouncer)..."
            docker compose -f docker-compose.hostinger.yml --env-file .env.production.local \
              up -d --wait postgres redis rabbitmq minio pgbouncer
            echo "Running database migrations..."
            docker compose -f docker-compose.hostinger.yml --env-file .env.production.local \
              run --rm --no-deps app prisma migrate deploy
            # (a imagem roda node:22 sem bun/bunx; o CLI do prisma vem assado
            # global na imagem, pino igual ao do package.json)

      - name: Bootstrap do admin real (após o migrate)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            # O PRIMEIRO administrador REAL nasce no deploy, dos Docker secrets
            # admin_email/admin_password (idempotente: admin existente não é
            # tocado — rotação é operação manual). Sem os secrets, avisa e
            # segue (mesma postura do deploy.sh: o deploy não falha por isso).
            if [ ! -s secrets/admin_email.secret ] || [ ! -s secrets/admin_password.secret ]; then
              echo "AVISO: secrets/admin_{email,password}.secret vazios/ausentes — bootstrap do admin pulado"
              exit 0
            fi
            # --user root: o secret do host é 600 e a imagem roda como nextjs
            # (o run é um container efêmero — as permissões do host não mudam).
            docker compose -f docker-compose.hostinger.yml --env-file .env.production.local \
              run --rm --no-deps --user root \
              -v "$PWD/scripts/bootstrap-admin.mjs:/app/scripts/bootstrap-admin.mjs:ro" \
              -v "$PWD/secrets/admin_email.secret:/run/secrets/admin_email:ro" \
              -v "$PWD/secrets/admin_password.secret:/run/secrets/admin_password:ro" \
              -e ADMIN_EMAIL_FILE=/run/secrets/admin_email \
              -e ADMIN_PASSWORD_FILE=/run/secrets/admin_password \
              app node /app/scripts/bootstrap-admin.mjs \
              || echo "AVISO: bootstrap do admin falhou — deploy continua; corrija os secrets e rode o deploy novamente"

  # ── Deploy to VPS ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: migrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            COMPOSE="docker compose -f docker-compose.hostinger.yml --env-file .env.production.local"
            echo "Aplicando app/realtime/workers (imagens já no daemon da VPS via job build)..."
            $COMPOSE up -d --no-deps --remove-orphans app realtime
            $COMPOSE up -d --no-deps email-worker notification-worker
            echo "Waiting for health check (dentro do container app)..."
            for i in $(seq 1 12); do
              sleep 5
              HTTP_CODE=$($COMPOSE exec -T app node -e "fetch('http://localhost:3000/api/health').then(r=>{console.log(r.status);process.exit(r.ok?0:1)}).catch(()=>{console.log(0);process.exit(1)})" || echo 000)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Health check passed (HTTP $HTTP_CODE)"
                echo "Executando Auto-Purge pós-deploy..."
                docker builder prune -a -f --filter "until=24h" >/dev/null 2>&1 || true
                docker image prune -a -f --filter "until=24h" >/dev/null 2>&1 || true
                docker volume ls -q -f dangling=true | grep -E '^[a-f0-9]{64}$' | xargs -r docker volume rm >/dev/null 2>&1 || true
                fstrim -v / >/dev/null 2>&1 || true
                exit 0
              fi
              echo "Attempt $i/12 — HTTP $HTTP_CODE, retrying..."
            done
            echo "Health check failed after 12 attempts" && exit 1
