# =============================================================================
# Alertmanager Configuration — Severinno Marketplace
# =============================================================================
# Sends alerts to Telegram when Prometheus fires critical alerts.
#
# Setup:
#   1. Create Telegram bot via @BotFather → get BOT_TOKEN
#   2. Add bot to a channel/group → get CHAT_ID
#   3. Set ALERTMANAGER_TELEGRAM_BOT_TOKEN and ALERTMANAGER_TELEGRAM_CHAT_ID in env
# =============================================================================

global:
  resolve_timeout: 5m

route:
  receiver: "null"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: "critical"
      receiver: "telegram"
      continue: false

receivers:
  - name: "null"

  - name: "telegram"
    telegram_configs:
      # Valores injetados via env (docker-compose.monitoring.yml), preenchidos
      # por scripts/setup-telegram-alerts.sh. Alertmanager expande ${VAR} no
      # arquivo de config a partir da v0.24.
      - bot_token: "${ALERTMANAGER_TELEGRAM_BOT_TOKEN}"
        chat_id: ${ALERTMANAGER_TELEGRAM_CHAT_ID}
        parse_mode: "HTML"
        message: |
          🔔 <b>{{ .GroupLabels.alertname }}</b>

          Severity: {{ .CommonLabels.severity }}
          Status: {{ .Status }}

          {{ range .Alerts }}
          <b>{{ .Annotations.summary }}</b>
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
