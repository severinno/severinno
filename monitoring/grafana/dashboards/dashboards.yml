# =============================================================================
# Grafana Dashboards Provisioning — Severinno Marketplace
# =============================================================================

apiVersion: 1

providers:
  - name: "Severinno Marketplace"
    orgId: 1
    folder: "Severinno"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
