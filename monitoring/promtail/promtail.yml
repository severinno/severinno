# =============================================================================
# Promtail Configuration — Severinno Marketplace
# =============================================================================
# Collects:
#   1. PM2 application logs (severinno-out.log, severinno-error.log)
#   2. Docker container logs (all running containers)
#   3. Caddy access logs
# =============================================================================

server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://severinno-loki-1:3100/loki/api/v1/push

scrape_configs:
  # ── PM2 Application Logs ───────────────────────────────────────────────
  - job_name: pm2-severinno
    static_configs:
      - targets:
          - localhost
        labels:
          job: severinno-app
          source: pm2
          __path__: /home/severinno/.pm2/logs/severinno-out.log

  - job_name: pm2-severinno-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: severinno-app
          source: pm2-error
          __path__: /home/severinno/.pm2/logs/severinno-error.log

  # ── Docker Container Logs ──────────────────────────────────────────────
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          source: docker
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      # Docker JSON log format
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      - labels:
          stream:
      - timestamp:
          source: time
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.999999999Z07:00"
      - output:
          source: log

  # ── Caddy Access Logs ─────────────────────────────────────────────────
  - job_name: caddy
    static_configs:
      - targets:
          - localhost
        labels:
          job: caddy
          source: caddy
          __path__: /var/log/caddy/severinno.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            request: request
            status: status
      - labels:
          status:
      - output:
          source: msg
