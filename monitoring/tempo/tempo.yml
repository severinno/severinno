# =============================================================================
# Tempo Configuration — Severinno Marketplace
# =============================================================================

server:
  http_listen_port: 3200

# ── Distributor — OTLP receivers ──────────────────────────────────────────
# Enables the OTLP HTTP (4318) and gRPC (4317) endpoints that the app
# sends traces to via @opentelemetry/exporter-trace-otlp-http.
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: severinno
  storage:
    path: /var/tempo/generator/wal
    remote_write: []
  traces_storage:
    path: /var/tempo/generator/traces
  ring:
    kvstore:
      store: inmemory

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics]
