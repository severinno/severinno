# =============================================================================
# Tempo Configuration — Severinno Marketplace
# =============================================================================

server:
  http_listen_port: 3200

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: severinno
  storage:
    path: /var/tempo/generator/wal
    remote_write: []
  traces_storage:
    path: /var/tempo/generator/traces
  ring:
    kvstore:
      store: inmemory

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graph, span-metrics]
