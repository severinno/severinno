# =============================================================================
# Prometheus Configuration — Severinno Marketplace
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ── Scrape Targets ────────────────────────────────────────────────────────
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Severinno App (Next.js)
  - job_name: "severinno-app"
    metrics_path: "/api/health/detailed"
    params:
      format: ["prometheus"]
    follow_redirects: true
    static_configs:
      - targets: ["app:3000"]
    scrape_interval: 10s
    scrape_timeout: 5s

  # Tempo (tracing backend)
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]

# ── Alert Rules ──────────────────────────────────────────────────────────
rule_files:
  - "alerts/*.yml"

# ── Alertmanager ──────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
