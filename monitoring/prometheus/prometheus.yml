# =============================================================================
# Prometheus Configuration — Severinno Marketplace
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ── Scrape Targets ────────────────────────────────────────────────────────
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Severinno App (Next.js)
  - job_name: "severinno-app"
    metrics_path: "/api/metrics/prometheus"
    static_configs:
      - targets: ["host.docker.internal:3000"]
    scrape_interval: 10s
    scrape_timeout: 5s

  # Tempo (tracing backend)
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]

# ── Alert Rules (optional) ────────────────────────────────────────────────
rule_files:
  - "alerts/*.yml"
