# =============================================================================
# Prometheus Alert Rules — Severinno Marketplace
# =============================================================================

groups:
  - name: severinno_app
    rules:
      # ── App Down ──────────────────────────────────────────────────────
      - alert: AppDown
        expr: up{job="severinno-health"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Severinno app is DOWN"
          description: "The health endpoint has been unreachable for 2+ minutes."

      # ── High Error Rate ───────────────────────────────────────────────
      - alert: HighErrorRate
        expr: rate(http_request_duration_ms_count{status=~"5.."}[5m]) / rate(http_request_duration_ms_count[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate (>5%)"
          description: "More than 5% of requests are returning 5xx errors."

      # ── Slow Responses ────────────────────────────────────────────────
      - alert: SlowResponses
        expr: histogram_quantile(0.95, rate(http_request_duration_ms_bucket[5m])) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 response time > 2s"
          description: "The 95th percentile response time exceeds 2 seconds."

  - name: severinno_infra
    rules:
      # ── Container Down ────────────────────────────────────────────────
      - alert: ContainerDown
        expr: absent(container_last_seen{name=~"severinno-.*"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is DOWN"
          description: "A Severinno container has been missing for 1+ minutes."

      # ── High Memory Usage ─────────────────────────────────────────────
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes{name=~"severinno-.*"} / container_spec_memory_limit_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} memory > 85%"
          description: "Memory usage is approaching the limit."

      # ── Redis Down ────────────────────────────────────────────────────
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN"
          description: "Redis has been unreachable for 1+ minutes."

      # ── PostgreSQL Down ───────────────────────────────────────────────
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN"
          description: "PostgreSQL has been unreachable for 1+ minutes."

  - name: severinno_geo
    rules:
      # ── Geocoding Errors Spiking ──────────────────────────────────────
      - alert: GeocodingErrorsSpiking
        expr: rate(geo_geocode_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Geocoding error rate spiking"
          description: "More than 0.1 errors/s in geocoding requests."

      # ── Nominatim Circuit Open ────────────────────────────────────────
      - alert: NominatimCircuitOpen
        expr: geo_circuit_nominatim_state == 2
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Nominatim circuit breaker is OPEN"
          description: "Nominatim geocoding is failing — circuit breaker tripped."
