# =============================================================================
# docker-compose.yml — Severinno Marketplace (Desenvolvimento + Produção)
#
# Serviços essenciais: PostgreSQL 16 + Valkey 7 (Redis-compatível, BSD-3) + MinIO + RabbitMQ + Realtime.
# Workers são iniciados com --profile workers:
#   docker compose --profile workers up -d
#
# Para erro monitoring (GlitchTip), use:
#   docker compose -f docker-compose.glitchtip.yml --env-file .env.glitchtip up -d
#
# Para desenvolvimento completo (com OpenSearch, OSRM, etc.), use:
#   docker compose -f docker-compose.dev.yml up -d
# =============================================================================

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-severinno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-severinno_dev}
      POSTGRES_DB: ${POSTGRES_DB:-severinno}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-severinno} -d ${POSTGRES_DB:-severinno}"]
      interval: 10s
      timeout: 5s
      retries: 5
  # ── Valkey (Redis-compatível — BSD-3, o fork 100% open source) ──────────
  # O serviço mantém o nome "redis" e o env REDIS_URL (protocolo RESP
  # compatível — drop-in, sem mudança de código).
  redis:
    image: valkey/valkey:7.2-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible storage) ───────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── RabbitMQ (message broker para workers assíncronos) ──────────────────
  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-severinno}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-severinno_dev}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ── Realtime WebSocket (Socket.io) ──────────────────────────────────────
  realtime:
    build:
      context: ./mini-services/realtime
      dockerfile: Dockerfile
    image: severinno-realtime:latest
    restart: unless-stopped
    ports:
      - "${REALTIME_PORT:-3003}:3003"
    environment:
      PORT: ${REALTIME_PORT:-3003}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e",
        "fetch('http://localhost:${REALTIME_PORT:-3003}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Next.js (produção / desenvolvimento) ────────────────────────────────
  app:
    build:
      context: .
      target: runner
    image: severinno:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD:-severinno_dev}@postgres:5432/${POSTGRES_DB:-severinno}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-severinno}:${RABBITMQ_PASS:-severinno_dev}@rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-severinno-uploads}
      SESSION_SECRET: ${SESSION_SECRET}
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret}
      REALTIME_URL: http://realtime:${REALTIME_PORT:-3003}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3003}
    # Health check defined in Dockerfile

  # ═══════════════════════════════════════════════════════════════════════
  # WORKERS — perfil isolado para deploy seletivo
  # ═══════════════════════════════════════════════════════════════════════
  # Iniciar com:
  #   docker compose --profile workers up -d
  #
  # Atualizar workers individuais:
  #   docker compose --profile workers up -d --no-deps email-worker
  #
  # Parar workers (sem afetar core):
  #   docker compose --profile workers down
  #
  # Ver logs:
  #   docker compose --profile workers logs -f
  # ═══════════════════════════════════════════════════════════════════════

  # ── Email Worker ─────────────────────────────────────────────────────────
  # Envia e-mails transacionais via fila RabbitMQ (queue: "emails").
  # Requer SMTP configurado (SMTP_HOST, SMTP_USER, SMTP_PASS).
  email-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: severinno-worker:latest
    restart: unless-stopped
    profiles:
      - workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WORKER_TYPE: email
      DATABASE_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD:-severinno_dev}@postgres:5432/${POSTGRES_DB:-severinno}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-severinno}:${RABBITMQ_PASS:-severinno_dev}@rabbitmq:5672
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@severinno.com}
    healthcheck:
      test: ["CMD-SHELL", "bun --eval 'process.exit(0)' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Notification Worker ──────────────────────────────────────────────────
  # Dispara notificações push, WhatsApp e realtime via fila (queue: "notifications").
  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: severinno-worker:latest
    restart: unless-stopped
    profiles:
      - workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WORKER_TYPE: notification
      DATABASE_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD:-severinno_dev}@postgres:5432/${POSTGRES_DB:-severinno}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-severinno}:${RABBITMQ_PASS:-severinno_dev}@rabbitmq:5672
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@severinno.com.br}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-severinno}
      REALTIME_URL: http://realtime:${REALTIME_PORT:-3003}
    healthcheck:
      test: ["CMD-SHELL", "bun --eval 'process.exit(0)' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Search Index Worker ──────────────────────────────────────────────────
  # Reindexa documentos no OpenSearch via polling da tabela search_reindex_queue.
  # Requer OPENSEARCH_URL configurado.
  search-index-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: severinno-worker:latest
    restart: unless-stopped
    profiles:
      - workers
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WORKER_TYPE: search-index
      DATABASE_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD:-severinno_dev}@postgres:5432/${POSTGRES_DB:-severinno}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      BATCH_SIZE: ${BATCH_SIZE:-50}
    healthcheck:
      test: ["CMD-SHELL", "bun --eval 'process.exit(0)' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

# ═══════════════════════════════════════════════════════════════════════════
# Referência rápida:
# ───────────────────────────────────────────────────────────────────────────
# Iniciar tudo (core + workers):
#   docker compose --profile "*" up -d
#
# Apenas core (sem workers):
#   docker compose up -d
#
# Deploy em produção (sem rebuild):
#   docker compose pull app realtime
#   docker compose up -d --no-deps --remove-orphans app realtime
#   docker compose --profile workers up -d --no-deps email-worker notification-worker
#
# GlitchTip (error monitoring):
#   docker compose -f docker-compose.glitchtip.yml --env-file .env.glitchtip up -d
# ═══════════════════════════════════════════════════════════════════════════

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
