services:
  app:
    # O Dockerfile não tem default para a versão do Bun (invariante 18 do
    # check-bun-mirror): o valor entra por AQUI, derivado da variável. Um
    # literal puro seria um SEGUNDO ponto de verdade e o build sem o arg
    # herdaria o default do Dockerfile em silêncio.
    build:
      context: .
      args:
        BUN_VERSION: ${BUN_VERSION:-1.3.14}
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
volumes:
  redisdata:
