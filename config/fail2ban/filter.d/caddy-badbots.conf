# ═══════════════════════════════════════════════════════════════════════════
# Filter: caddy-badbots
# ───────────────────────────────────────────────────────────────────────────
# Detecta bots/scanners maliciosos que tentam explorar vulnerabilidades
# conhecidas ou acessar paths sensíveis.
#
# Match:
#   - Paths sensível: /.env, /wp-admin, /admin, /api/admin, /dashboard
#   - SQL Injection patterns: UNION SELECT, OR 1=1, etc.
#   - Bots maliciosos no User-Agent: curl, masscan, zgrab, etc.
#   - Path traversal: ../../../etc/passwd
#   - Config files: /web.config, /config.json, /.git/config
#
# Uso no jail.local:
#   [caddy-badbots]
#   enabled  = true
#   port     = http,https
#   filter   = caddy-badbots
#   logpath  = /var/log/caddy/severinno-access.log
#   maxretry = 2
#   findtime = 300
#   bantime  = 604800
# ═══════════════════════════════════════════════════════════════════════════

[Definition]

# ── Date pattern para Caddy {ts} (Unix epoch: 1705334400.123) ──────────
datepattern = {^[0-9]{10}(?:\.[0-9]+)?}

# ── Paths sensíveis (mais comuns em scanners automáticos) ───────────────
__sensitive_paths = (\.env|\.git/config|/wp-admin|/wp-login|/admin/|/dashboard|/api/admin|/\.\..*passwd|/web\.config|/config\.json|/phpmyadmin|/xmlrpc\.php|/debug|/aws/credentials|/backup|/\.svn|/crossdomain\.xml|/server-status)

# ── Padrões de SQL Injection ────────────────────────────────────────────
__sqli_pattern = (union.*select|select.*from|1=1|' or 1|admin'|waitfor|delay|pg_sleep)

# ── Bots/scanners maliciosos conhecidos ─────────────────────────────────
__bad_agents = (masscan|zgrab|nikto|nmap|^curl(?! /health)|wget|python-requests|Go-http-client|ruby|scanner|acunetix|nessus|openvas|burpcollaborator|sqlmap|havij|netsparker)

# ── Regex principal — combina todos os padrões acima ────────────────────
failregex = ^<HOST> - - \[.*\] "\S+ /?(?:%(__sensitive_paths)s)\s
            ^<HOST> - - \[.*\] "\S+ \S+.*%(__sqli_pattern)s.*\sHTTP
            ^<HOST> - - \[.*\] "\S+ /.*\.(php|asp|aspx|jsp|cgi)(\?.*)?\sHTTP.* (404|403|500)

# ── User-Agent malicioso (Combinado com o log format que inclui user-agent)
# O Caddyfile.prod agora usa Combined Log Format que inclui o user-agent.
# Format: <host> - - [date] "method uri proto" status size "referrer" "user-agent"
failregex = ^<HOST> - - \[.*\] "\S+ \S+ \S+" \d+ \d+ ".*" "(?:%(__bad_agents)s)

# ═══════════════════════════════════════════════════════════════════════════
# 📌 TESTAR O FILTER:
#   sudo fail2ban-regex /var/log/caddy/severinno-access.log \
#     /etc/fail2ban/filter.d/caddy-badbots.conf
# ═══════════════════════════════════════════════════════════════════════════
