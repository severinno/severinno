# ═══════════════════════════════════════════════════════════════════════════
# Filter: caddy-404-scan
# ───────────────────────────────────────────────────────────────────────────
# Detecta varredura de diretórios (directory brute-force / 404 scan).
# Atacantes comuns usam wordlists para descobrir endpoints escondidos.
#
# Match:
#   - Qualquer requisição que retorne 404 (página não encontrada)
#   - Exclui assets estáticos (imagens, CSS, JS, favicon) para evitar
#     falsos positivos quando assets são removidos/renomeados
#
# Uso no jail.local:
#   [caddy-404-scan]
#   enabled  = true
#   port     = http,https
#   filter   = caddy-404-scan
#   logpath  = /var/log/caddy/severinno-access.log
#   maxretry = 15
#   findtime = 300
#   bantime  = 43200
# ═══════════════════════════════════════════════════════════════════════════

[Definition]

# ── Date pattern para Caddy {ts} (Unix epoch: 1705334400.123) ──────────
datepattern = {^[0-9]{10}(?:\.[0-9]+)?}

# ── Regex principal ─────────────────────────────────────────────────────
# Match: qualquer request que retorne HTTP 404
failregex = ^<HOST> - - \[.*\] "\S+ \S+ \S+" 404 \d+

# ── Ignorar assets estáticos (evita falsos positivos) ───────────────────
ignoreregex = ^<HOST> - - \[.*\] "GET .*\.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|eot|ttf|otf|map) HTTP

# ── Ignorar OPTIONS (CORS preflight) ────────────────────────────────────
ignoreregex = ^<HOST> - - \[.*\] "OPTIONS

# ═══════════════════════════════════════════════════════════════════════════
# 📌 TESTAR O FILTER:
#   sudo fail2ban-regex /var/log/caddy/severinno-access.log \
#     /etc/fail2ban/filter.d/caddy-404-scan.conf
# ═══════════════════════════════════════════════════════════════════════════
