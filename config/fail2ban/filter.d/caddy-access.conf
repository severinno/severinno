# ═══════════════════════════════════════════════════════════════════════════
# Filter: caddy-access
# ───────────────────────────────────────────────────────────────────────────
# Detecta tentativas de força bruta em endpoints autenticados.
#
# Match:
#   - 401 Unauthorized — credenciais inválidas (login, API keys)
#   - 403 Forbidden    — acesso negado pelo middleware (admin, dashboard)
#
# Formato esperado do log: common log (transform "{common_log}")
#   Ex: 192.168.1.1 - - [27/Jul/2026:12:00:00 +0000] "POST /api/auth/login HTTP/1.1" 401 1234
#
# Uso no jail.local:
#   [caddy-access]
#   enabled  = true
#   port     = http,https
#   filter   = caddy-access
#   logpath  = /var/log/caddy/severinno-access.log
#   maxretry = 8
#   findtime = 600
#   bantime  = 3600
# ═══════════════════════════════════════════════════════════════════════════

[Definition]

# ── Date pattern para Caddy {ts} (Unix epoch: 1705334400.123) ──────────
datepattern = {^[0-9]{10}(?:\.[0-9]+)?}

# ── Regex principal ─────────────────────────────────────────────────────
# Match: IP + request (opcional) + status 401 ou 403
failregex = ^<HOST> - - \[.*\] "\S+ \S+ \S+" (401|403) \d+

# ── Regex de ignorados ──────────────────────────────────────────────────
# Não banir OPTIONS (CORS preflight) nem HEAD
ignoreregex = ^<HOST> - - \[.*\] "OPTIONS
ignoreregex = ^<HOST> - - \[.*\] "HEAD

# ═══════════════════════════════════════════════════════════════════════════
# 📌 TESTAR O FILTER:
#   sudo fail2ban-regex /var/log/caddy/severinno-access.log \
#     /etc/fail2ban/filter.d/caddy-access.conf
# ═══════════════════════════════════════════════════════════════════════════
