# ═══════════════════════════════════════════════════════════════════════════
# pgbouncer.ini — PgBouncer para Severinno Marketplace (Produção)
# ═══════════════════════════════════════════════════════════════════════════
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d pgbouncer
#
# Conexão:
#   App → DATABASE_URL=postgresql://severinno:senha@pgbouncer:6432/severinno
#   Prisma Migrate → DIRECT_URL=postgresql://severinno:senha@postgres:5432/severinno
#
# Monitoramento:
#   psql -h pgbouncer -p 6432 -U severinno -d pgbouncer
#   → SHOW POOLS; SHOW STATS; SHOW CLIENTS; SHOW SERVERS;
#
# ═══════════════════════════════════════════════════════════════════════════

[databases]
# ── Mapeia o database que o app solicita para o PostgreSQL real ───────────
# Formato: <nome_db> = host=<pg_host> port=<pg_port> dbname=<nome_db_real>
# O app conecta em "severinno", PgBouncer redireciona para postgres:5432/severinno
* = host=postgres port=5432

[pgbouncer]

# ── Conexão ──────────────────────────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 6432
# trust → PgBouncer aceita qualquer usuário e DELEGA a autenticação ao PostgreSQL
# Isto é SEGURO porque PgBouncer e PostgreSQL estão na mesma rede Docker interna.
# O PostgreSQL já faz autenticação SCRAM-SHA-256 com as credenciais reais.
# Vantagem: não precisa manter userlist.txt sincronizado com o banco.
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

# ── Pool Mode ────────────────────────────────────────────────────────────
# transaction → Libera a conexão após CADA transação (não após cada query).
# ESSENCIAL para Prisma (que faz diversas transações curtas por requisição).
# Com isso, 20 conexões de banco servem centenas de requisições simultâneas.
pool_mode = transaction

# ── Pool Sizing ──────────────────────────────────────────────────────────
# Número máximo de clientes conectados ao PgBouncer simultaneamente.
# Ajuste conforme pico de tráfego. 1000 é seguro para a maioria dos cenários.
max_client_conn = 1000

# Número máximo de conexões para CADA database pool (severinno).
# 20 é um bom valor inicial — cada conexão PostgreSQL tem custo de ~10MB RAM.
# Monitore com SHOW POOLS e ajuste conforme necessário.
default_pool_size = 25

# Número máximo de conexões extras que podem ser criadas além do pool
# se todos os slots estiverem ocupados e houver requisições em fila.
# Útil para picos repentinos.
reserve_pool_size = 5

# Tempo (segundos) antes de criar uma conexão reserva
# Se uma requisição esperar mais que 3s, uma conexão reserva é aberta.
reserve_pool_timeout = 3

# ── Prepared Statements (CRÍTICO para Prisma!) ───────────────────────────
# PgBouncer 1.21+ suporta prepared statements em transaction mode.
# Define quantas prepared statements diferentes podem ser cacheadas por conexão.
# Prisma gera dezenas de prepared statements diferentes. 200 é um número seguro.
max_prepared_statements = 200

# ── Timeouts ─────────────────────────────────────────────────────────────
# Tempo máximo que uma conexão pode ficar ociosa no pool (segundos)
server_idle_timeout = 600

# Tempo máximo que uma conexão pode ficar viva (segundos)
# Força reciclagem periódica para evitar conexões "esticadas"
server_lifetime = 3600

# Tempo máximo que uma query pode levar (segundos)
# 0 = sem limite. Ajuste se houver queries lentas (ex: relatórios pesados)
query_timeout = 30

# Tempo máximo de idle do cliente (segundos)
client_idle_timeout = 600

# ── Tuning de Conexão ────────────────────────────────────────────────────
# Tamanho do buffer de rede para enviar dados ao cliente (bytes)
# Aumentar para 16KB melhora performance em payloads médios
pkt_buf = 4096

# Número máximo de pacotes por conexão (10MB — seguro para uploads de imagens)
max_packet_size = 10485760

# ── DNS ──────────────────────────────────────────────────────────────────
# Resolver nomes DNS apenas uma vez na inicialização (evita lookup em cada conexão)
dns_max_ttl = 300
dns_nxdomain_ttl = 60

# ── Stats & Monitoring ──────────────────────────────────────────────────
# Período de coleta de estatísticas (segundos)
# 60 = granularidade de 1 minuto para SHOW STATS e SHOW POOLS
stats_period = 60

# ── Logging ──────────────────────────────────────────────────────────────
# syslog = 0 → logs para stderr (Docker captura)
# log_connections = 1 → loga cada nova conexão (útil para debug)
# log_disconnections = 1 → loga cada desconexão
syslog = 0
# Desligado em produção para evitar spam
log_connections = 0
log_disconnections = 0
verbose = 0

# ═══════════════════════════════════════════════════════════════════════════
# 📊 MONITORAMENTO
# ═══════════════════════════════════════════════════════════════════════════
# Conectar no banco virtual "pgbouncer" para administração:
#   psql -h localhost -p 6432 -U severinno -d pgbouncer
#
# Comandos úteis:
#   SHOW POOLS;       → Ver estado de cada pool
#   SHOW STATS;       → Estatísticas de queries
#   SHOW CLIENTS;     → Clientes conectados
#   SHOW SERVERS;     → Conexões com PostgreSQL
#   SHOW CONFIG;      → Config atual
#   SHOW FDS;         → File descriptors
#   PAUSE;            → Drena pool (útil para manutenção)
#   RESUME;           → Retoma pool
#   RELOAD;           → Recarrega config sem restart
#   SHUTDOWN;         → Desliga

# ═══════════════════════════════════════════════════════════════════════════
# 📈 AJUSTE DE PERFORMANCE
# ═══════════════════════════════════════════════════════════════════════════
# Sintoma: SHOW POOLS mostra "cl Active" sempre perto de default_pool_size
#   → Aumente default_pool_size gradualmente (30, 40, 50)
#
# Sintoma: "cl Waiting" > 0 frequente (clientes esperando)
#   → Aumente default_pool_size ou reserve_pool_size
#
# Sintoma: "sv Active" = "cl Active" (todas conexões ocupadas)
#   → Pode indicar queries lentas. Verifique query_timeout
#
# Sintoma: Erro "max_client_conn reached"
#   → Aumente max_client_conn e ulimit -n no host
# ═══════════════════════════════════════════════════════════════════════════
