[databases]
severinno = host=postgis port=5432 dbname=severinno

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# Pool sizing — 25 connections per pool is sufficient for most workloads
pool_mode = transaction
default_pool_size = 25
max_client_conn = 200
max_db_connections = 50

# Timeouts
server_idle_timeout = 300
client_idle_timeout = 600
query_timeout = 30

# Connection lifetime — recycle connections to avoid long-lived issues
server_lifetime = 3600
server_connect_timeout = 10

# Logging
log_connections = 0
log_disconnections = 0
verbose = 0
stats_period = 60
