# ═══════════════════════════════════════════════════════════════════════════
# pgbouncer-glitchtip.ini — PgBouncer para GlitchTip
# ═══════════════════════════════════════════════════════════════════════════
#
# Pooler de conexões para o PostgreSQL do GlitchTip (Sentry self-hosted).
# GlitchTip usa Django + Celery, que juntos abrem até ~20 conexões simultâneas.
# O PgBouncer reduz isso para um pool fixo de 15, evitando:
#   - "too many connections" no PostgreSQL
#   - OOM em servidores com pouca RAM
#   - Handshake overhead a cada nova conexão
#
# DIFERENÇA do pgbouncer principal:
#   pool_mode = session  → Django espera que a conexão seja persistente
#                          (mantém o state da sessão entre queries).
#                          Diferente do Prisma/Next.js que faz transações curtas.
#   default_pool_size = 15 → GlitchTip tem no máximo web + worker (10 + 10=20).
#                             15 já cobre com folga + reserva.
#
# Uso:
#   docker compose -f docker-compose.prod.yml --profile glitchtip up -d \
#     pgbouncer-glitchtip
#
# Conexão:
#   GlitchTip → DATABASE_URL=postgres://glitchtip:senha@pgbouncer-glitchtip:6432/glitchtip
#
# Monitoramento:
#   psql -h pgbouncer-glitchtip -p 6432 -U glitchtip -d pgbouncer
#   → SHOW POOLS; SHOW STATS; SHOW CLIENTS;
#
# ═══════════════════════════════════════════════════════════════════════════

[databases]
# Mapeia o database que o GlitchTip solicita para o PostgreSQL real
# * = curinga → qualquer dbname vai para glitchtip-db:5432
* = host=glitchtip-db port=5432

[pgbouncer]

# ── Conexão ──────────────────────────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 6432

# trust → delega autenticação ao PostgreSQL (ambos na rede Docker interna)
auth_type = trust
auth_file = /dev/null

# ── Pool Mode ────────────────────────────────────────────────────────────
# SESSION mode: mantém a conexão do cliente ligada à conexão do servidor
# DURANTE TODA A SESSÃO (não apenas durante a transação).
# ESSENCIAL para Django, que espera que o state da sessão (session state,
# SET statements, temporary tables) persista entre queries.
# DESVANTAGEM: cada cliente ocupa um slot do pool até desconectar.
# VANTAGEM: compatível com qualquer ORM/framework.
pool_mode = session

# ── Pool Sizing ──────────────────────────────────────────────────────────
# Máximo de clientes simultâneos conectados ao PgBouncer
max_client_conn = 100

# Tamanho do pool para o database glitchtip.
# GlitchTip tem 2 serviços concorrentes:
#   glitchtip-web:  Django Gunicorn (4 workers x ~2 conns = 8)
#   glitchtip-worker: Celery (4 workers x ~2 conns = 8)
# Pico estimado: 16 conexões. Pool de 15 + reserva de 5 = folga segura.
default_pool_size = 15

# Conexões extras de reserva para picos
reserve_pool_size = 5

# Tempo (segundos) antes de ativar uma conexão reserva
reserve_pool_timeout = 3

# ── Timeouts ─────────────────────────────────────────────────────────────
# Conexão ociosa no pool (segundos) — maior porque Django mantém sessões (30 min)
server_idle_timeout = 1800

# Vida máxima de uma conexão (segundos) — força reciclagem periódica (2 horas)
server_lifetime = 7200

# Tempo máximo que uma query pode levar (segundos)
# GlitchTip pode ter queries analíticas mais longas
query_timeout = 60

# Tempo máximo de idle do cliente (segundos)
# Clientes Django podem ficar idle entre requisições
client_idle_timeout = 600

# ── Tuning de Conexão ────────────────────────────────────────────────────
# 4MB — suficiente para payloads de source maps
pkt_buf = 4096
max_packet_size = 4194304

# ── DNS ──────────────────────────────────────────────────────────────────
dns_max_ttl = 300
dns_nxdomain_ttl = 60

# ── Stats & Monitoring ──────────────────────────────────────────────────
stats_period = 60

# ── Logging ──────────────────────────────────────────────────────────────
syslog = 0
log_connections = 0
log_disconnections = 0
verbose = 0
