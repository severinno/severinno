version: "3.8"

services:
  localai:
    image: localai/localai:latest-aio-cpu
    container_name: severinno-localai
    ports:
      - "8081:8080"
    environment:
      - THREADS=4
      - CONTEXT_SIZE=4096
      - MODELS_PATH=/build/models
      - DEBUG=true
    volumes:
      - ./models:/build/models:cached
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
