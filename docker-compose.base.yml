# =============================================================================
# docker-compose.base.yml — BASE COMPARTILHADA prod ∩ hostinger
# =============================================================================
# O que este arquivo é: a INTERSEÇÃO EXATA dos stacks docker-compose.prod.yml e
# docker-compose.hostinger.yml — serviços idênticos nos dois ambientes
# (postgres, redis, rabbitmq, minio, minio-init, pgbouncer, realtime, app,
# email-worker, notification-worker) com hardening, healthchecks, secrets e
# environment em comum. Cada ambiente só declara o que lhe é PRÓPRIO:
#
#   docker-compose.prod.yml      → include desta base + caddy completo +
#                                  geo-cache-warm + search-index-worker +
#                                  stack GlitchTip (profile) + ipam +
#                                  deploy.resources + rotation de logs
#   docker-compose.hostinger.yml → include desta base + caddy do deploy via
#                                  GitHub Action + divergências de domínio
#
# Regras do modelo:
#   - Path relativo resolve a partir da RAIZ do repo (a base vive na raiz
#     para valer a régua de guard dos composes da raiz — em deploy/ a
#     invariante 6 do check-registry-source proibiria as tags literais que
#     prod/hostinger legítimamente usam);
#   - environment é MESCLADO POR CHAVE: uma chave declarada num override
#     substitui apenas ela própria (o resto herda da base);
#   - ARRAYS (ports, volumes, secrets por serviço) são SUBSTITUÍDOS no
#     override: se um override precisa adicionar um item, re-declara todos;
#   - A origem das imagens é a FONTE ÚNICA ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}
#     (guard: bun run check:registry-source) e o build do realtime deriva
#     BUN_VERSION da variável (invariante 18 do check-bun-mirror);
#   - Os guards de governança varrem `docker-compose*.yml` da raiz e de
#     deploy/ — este arquivo está dentro dessa régua de propósito.
#
# CORREÇÕES DE DRIFT feitas nesta consolidação (marcadas com ⛳):
#   - REALTIME_EMIT_API_KEY passou a existir em app, realtime E
#     notification-worker nos DOIS ambientes. Antes: prod não injetava no
#     notification-worker e o hostinger não injetava no app — metade do
#     contrato em cada arquivo. A chave é obrigatória no realtime
#     (fail-closed) e precisa ser idêntica em todo emissor do bridge /emit.
#   - Hoje a chave entra como DOCKER SECRET (realtime_emit_api_key →
#     /run/secrets/realtime_emit_api_key) + env REALTIME_EMIT_API_KEY_FILE;
#     o valor NUNCA transita por environment/docker inspect. Em dev/staging
#     (composes monolíticos) segue por env direta do .env.
#
# Divergências LEGÍTIMAS (defaults de domínio .com.br vs .com) continuam
# explícitas nos overrides — ver docker-compose.prod.yml e
# docker-compose.hostinger.yml.
# =============================================================================

# ── Rede interna compartilhada ────────────────────────────────────────────
# Serviços internos, SEM exposição externa (só `expose:`). A rede `frontend`
# (Caddy → mundo) é declarada nos overrides. O prod acrescenta ipam/subnet
# mesclando por chave — o merge por chave de redes preserva name/driver.
networks:
  backend:
    name: severinno_backend
    driver: bridge
    # NOTA: internal: true foi removido intencionalmente porque os serviços
    # no backend precisam de conectividade de saída (SMTP, Lytex, Evolution
    # API, Sentry/GlitchTip). A segurança é mantida via expose: (sem ports:).

# ── Volumes persistentes de infra ─────────────────────────────────────────
volumes:
  postgres_data:
    name: severinno_postgres_data
  redis_data:
    name: severinno_redis_data
  minio_data:
    name: severinno_minio_data
  rabbitmq_data:
    name: severinno_rabbitmq_data

# ── Docker Secrets ───────────────────────────────────────────────────────
# Secrets são montados em /run/secrets/<nome> dentro do container.
# Serviços que suportam _FILE (PostgreSQL, RabbitMQ, MinIO) leem diretamente
# do arquivo. Serviços customizados usam o entrypoint
# scripts/docker-entrypoint.sh para exportar como env vars.
#
# USO EM PRODUÇÃO (Docker Swarm):  ./scripts/setup-secrets.sh
# USO EM DESENVOLVIMENTO (file:):  cp secrets/*.secret.example secrets/*.secret
# Paths resolvem relativos a deploy/ → ./secrets/.
secrets:
  postgres_password:
    file: ./secrets/postgres_password.secret
  glitchtip_db_password:
    file: ./secrets/glitchtip_db_password.secret
  s3_secret_key:
    file: ./secrets/s3_secret_key.secret
  rabbitmq_pass:
    file: ./secrets/rabbitmq_pass.secret
  session_secret:
    file: ./secrets/session_secret.secret
  vapid_private_key:
    file: ./secrets/vapid_private_key.secret
  smtp_pass:
    file: ./secrets/smtp_pass.secret
  cron_secret:
    file: ./secrets/cron_secret.secret
  lytex_client_secret:
    file: ./secrets/lytex_client_secret.secret
  # Chave do bridge /emit do realtime (fail-closed) — mesma chave nos três
  # consumidores (realtime valida; app e notification-worker emitem). Lida
  # via REALTIME_EMIT_API_KEY_FILE, não por environment.
  realtime_emit_api_key:
    file: ./secrets/realtime_emit_api_key.secret

# ============================================================================
# SERVIÇOS (interseção prod ∩ hostinger — o que os DOIS declaram idêntico)
# ============================================================================

services:
  # ── PostgreSQL + PostGIS ───────────────────────────────────────────────
  # Banco de dados principal com suporte geoespacial.
  # Tag fixada: postgis/postgis:16-3.4-alpine (71MB vs 280MB da versão full).
  # Hardening: tmpfs para /tmp (PG usa /tmp para tabelas temporárias/sort),
  # capacidades mínimas. read_only=false — PG precisa de escrita para WAL,
  # background writer e checkpoints.
  # ATENÇÃO: em produção, prefira um banco gerenciado (RDS, Cloud SQL) e
  # remova este serviço, configurando DATABASE_URL diretamente.
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=256M
    expose:
      - "5432"
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-severinno}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-severinno}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-severinno} -d ${POSTGRES_DB:-severinno}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis (Cache + Rate Limiting) ─────────────────────────────────────
  # Hardening: read-only filesystem + tmpfs para /tmp, capacidades mínimas.
  # Redis só escreve em /data (volume persistente) e /tmp (temporário).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=64M
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ (Message Broker) ─────────────────────────────────────────
  # Hardening: read-only filesystem com tmpfs para /tmp e /var/log/rabbitmq.
  # Dados persistentes em volume rabbitmq_data (/var/lib/rabbitmq).
  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - SYS_NICE # Necessário para RabbitMQ definir prioridade de E/S
    read_only: true
    tmpfs:
      - /tmp:size=64M
      - /var/log/rabbitmq:size=32M # Logs internos em RAM (RabbitMQ 4-alpine)
    expose:
      - "5672"
      - "15672"
    secrets:
      - rabbitmq_pass
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-severinno}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-severinno}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+P 1048576"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── MinIO (S3-compatible Object Storage) ──────────────────────────────
  # Tag fixada: minio/minio:RELEASE.2024-12-18T13-15-44Z. Não usar :latest —
  # versões do MinIO quebram compatibilidade com frequência.
  # read_only=false porque MinIO escreve ativamente em /data.
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_CHROOT # MinIO usa chroot para isolamento de disco
    tmpfs:
      - /tmp:size=128M
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    secrets:
      - s3_secret_key
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── MinIO Bucket Init (one-shot) ──────────────────────────────────────
  # Tag fixada: minio/mc:RELEASE.2024-12-18T13-15-44Z (mesma versão do server).
  minio-init:
    image: minio/mc:RELEASE.2024-12-18T13-15-44Z
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for MinIO..."
        S3_SECRET_VAL="$(cat /run/secrets/s3_secret_key 2>/dev/null || echo \"${S3_SECRET_KEY}\")"
        until /usr/bin/mc alias set minio http://minio:9000 \
          "${S3_ACCESS_KEY}" "${S3_SECRET_VAL}"; do sleep 2; done
        echo "Creating bucket '${S3_BUCKET}'..."
        /usr/bin/mc mb "minio/${S3_BUCKET}" --ignore-existing
        /usr/bin/mc anonymous set download "minio/${S3_BUCKET}"
        echo "Bucket '${S3_BUCKET}' ready."
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-severinno-uploads}
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - s3_secret_key

  # ── PgBouncer (Connection Pooler para PostgreSQL) ─────────────────────
  # Pooling de conexões em transaction mode para Prisma/Next.js.
  # Reduz conexões ativas no PostgreSQL de ~centenas para ~25.
  # Essencial em produção para evitar "too many connections" e OOM.
  #
  # ── IMAGEM CORRIGIDA ──────────────────────────────────────────────────
  # bitnami/pgbouncer:latest NÃO EXISTE (404). Substituído por
  # edoburu/pgbouncer:v1.25.2-p0 (pinned) que:
  #   ✅ Suporta max_prepared_statements (necessário para Prisma)
  #   ✅ Suporta auth_type = trust (configurado no pgbouncer.ini)
  #   ✅ Lê config de /etc/pgbouncer/pgbouncer.ini (path corrigido)
  #
  # read_only propositalmente REMOVIDO — o entrypoint do edoburu/pgbouncer
  # precisa escrever userlist.txt em /etc/pgbouncer. O hardening é mantido
  # via cap_drop: ALL + no-new-privileges:true + rede backend sem exposição.
  # As env vars PGBOUNCER_* (Bitnami) foram removidas: montamos nosso próprio
  # pgbouncer.ini (pool_mode=transaction, default_pool_size=25,
  # reserve_pool_size=5, max_prepared_statements=200, auth_type=trust).
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=16M
    expose:
      - "6432"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-d", "severinno"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Realtime WebSocket (Socket.io) ────────────────────────────────────
  # Hardening: read-only + tmpfs. Serviço stateless — estado via Redis.
  # Build site da base: BUN_VERSION derivado da variável (invariante 18 do
  # check-bun-mirror — um literal puro aqui é um SEGUNDO ponto de verdade).
  realtime:
    build:
      context: ./mini-services/realtime
      dockerfile: Dockerfile
      args:
        BUN_VERSION: ${BUN_VERSION:-1.3.14}
    image: ${IMAGE_REGISTRY:-git.severinno.com}/${IMAGE_NAMESPACE:-severinno}/realtime:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=64M
    expose:
      - "3003"
    environment:
      PORT: 3003
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${NEXT_PUBLIC_APP_URL}
      # OBRIGATÓRIA em produção: o serviço falha o boot sem ela (fail-closed).
      # A chave entra como DOCKER SECRET (realtime_emit_api_key →
      # /run/secrets/realtime_emit_api_key) e o serviço lê via _FILE —
      # o valor nunca transitaria por `environment`/`docker inspect`. Deve
      # ser A MESMA chave nos emissores do bridge /emit (app e
      # notification-worker). ⛳ Consolidação: antes faltava no `app` do
      # docker-compose.hostinger.yml — metade do contrato em cada arquivo.
      REALTIME_EMIT_API_KEY_FILE: /run/secrets/realtime_emit_api_key
    secrets:
      - realtime_emit_api_key
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Next.js (App Principal) ───────────────────────────────────────────
  # Hardening: tmpfs + capacidades mínimas. read_only=false porque Next.js
  # gera cache em .next em runtime e pode precisar de /tmp para uploads.
  #
  # As senhas sensíveis são lidas de /run/secrets/ pelo entrypoint
  # scripts/docker-entrypoint.sh (montado como bind). Env públicas via
  # environment:/env file. As 3 chaves com DEFAULT divergente entre os
  # ambientes (NEXT_PUBLIC_WS_URL, SMTP_FROM, VAPID_SUBJECT) ficam nos
  # overrides — ver header da base.
  app:
    image: ${IMAGE_REGISTRY:-git.severinno.com}/${IMAGE_NAMESPACE:-severinno}/severinno:latest
    entrypoint: ["./scripts/docker-entrypoint.sh"]
    command: ["node", "server.js"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=256M
    expose:
      - "3000"
    networks:
      - backend
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    secrets:
      - postgres_password
      - rabbitmq_pass
      - s3_secret_key
      - session_secret
      - vapid_private_key
      - smtp_pass
      - cron_secret
      - lytex_client_secret
      - realtime_emit_api_key
    volumes:
      - ./scripts/docker-entrypoint.sh:/app/scripts/docker-entrypoint.sh:ro
    environment:
      # ── App ──────────────────────────────────────────────────────────
      NODE_ENV: production
      PORT: 3000
      HOST: "0.0.0.0"
      # HOSTNAME: o standalone do Next binda pelo HOSTNAME — sem ele o server
      # sobe em localhost e o healthcheck do compose (e o Caddy) levam 503
      # (incidente medido em produção 06-07/10/2026, corrigido à mão no compose
      # do host; declarado aqui para o próximo deploy não herdar o 503).
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # ── Database (via PgBouncer pool) — password via secret ─────────
      DATABASE_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-severinno}
      DIRECT_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-severinno}
      # ── Cache ────────────────────────────────────────────────────────
      REDIS_URL: redis://redis:6379
      # ── Queue — password via secret ──────────────────────────────────
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-severinno}:${RABBITMQ_PASS}@rabbitmq:5672
      # ── Storage — secret key via secret ──────────────────────────────
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-severinno-uploads}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      NEXT_PUBLIC_UPLOADS_BASE_URL: ${NEXT_PUBLIC_UPLOADS_BASE_URL:-/api/uploads}
      # ── Realtime ─────────────────────────────────────────────────────
      REALTIME_URL: http://realtime:3003
      # ⛳ Consolidação: antes faltava no docker-compose.hostinger.yml — o
      # app não autenticava o bridge /emit contra o realtime fail-closed.
      # Docker secret realtime_emit_api_key, lido via _FILE (mesma chave do
      # serviço realtime; o docker-entrypoint.sh exporta como env).
      REALTIME_EMIT_API_KEY_FILE: /run/secrets/realtime_emit_api_key
      # ── Payments (Lytex) ─────────────────────────────────────────────
      LYTEX_CLIENT_ID: ${LYTEX_CLIENT_ID}
      LYTEX_ENV: ${LYTEX_ENV:-production}
      LYTEX_API_URL: ${LYTEX_API_URL:-https://api.lytex.com.br/v1}
      # ── Web Push (VAPID) ─────────────────────────────────────────────
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      # ── SMTP ─────────────────────────────────────────────────────────
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      # ── WhatsApp ─────────────────────────────────────────────────────
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-severinno}
      # ── Error Monitoring ─────────────────────────────────────────────
      SENTRY_DSN: ${SENTRY_DSN}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN}
      # ── Routing (OSRM) ───────────────────────────────────────────────
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://osrm:5000}
      # ── Search (OpenSearch) ──────────────────────────────────────────
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Email Worker ──────────────────────────────────────────────────────
  # Hardening: tmpfs + capacidades mínimas (cap_add vazio).
  # Healthcheck: conectividade TCP com RabbitMQ na porta AMQP real (5672)
  # via node:net — NÃO usa HTTP management (15672) porque a imagem
  # rabbitmq:4-alpine não inclui o plugin de management por padrão.
  email-worker:
    image: ${IMAGE_REGISTRY:-git.severinno.com}/${IMAGE_NAMESPACE:-severinno}/severinno:worker-latest
    entrypoint: ["./scripts/docker-entrypoint.sh"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    tmpfs:
      - /tmp:size=64M
    networks:
      - backend
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    secrets:
      - postgres_password
      - rabbitmq_pass
      - smtp_pass
    volumes:
      - ./scripts/docker-entrypoint.sh:/app/scripts/docker-entrypoint.sh:ro
    environment:
      NODE_ENV: production
      WORKER_TYPE: email
      DATABASE_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-severinno}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-severinno}:${RABBITMQ_PASS}@rabbitmq:5672
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "require('net').connect(5672,'rabbitmq').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1)).setTimeout(5000,()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Notification Worker ───────────────────────────────────────────────
  # Mesma forma do email-worker; consome a fila de push (RabbitMQ) e emite
  # realtime/push. Healthcheck de TCP com RabbitMQ (5672), igual ao de cima.
  notification-worker:
    image: ${IMAGE_REGISTRY:-git.severinno.com}/${IMAGE_NAMESPACE:-severinno}/severinno:worker-latest
    entrypoint: ["./scripts/docker-entrypoint.sh"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    tmpfs:
      - /tmp:size=64M
    networks:
      - backend
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    secrets:
      - postgres_password
      - rabbitmq_pass
      - vapid_private_key
      - realtime_emit_api_key
    volumes:
      - ./scripts/docker-entrypoint.sh:/app/scripts/docker-entrypoint.sh:ro
    environment:
      NODE_ENV: production
      WORKER_TYPE: notification
      DATABASE_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-severinno}
      DIRECT_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-severinno}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-severinno}:${RABBITMQ_PASS}@rabbitmq:5672
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-severinno}
      REALTIME_URL: http://realtime:3003
      # ⛳ Consolidação: antes faltava no docker-compose.prod.yml — o
      # notification-worker da produção não autenticava o bridge /emit.
      # Docker secret realtime_emit_api_key, lido via _FILE (mesma chave do
      # serviço realtime; o docker-entrypoint.sh exporta como env).
      REALTIME_EMIT_API_KEY_FILE: /run/secrets/realtime_emit_api_key
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "require('net').connect(5672,'rabbitmq').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1)).setTimeout(5000,()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
