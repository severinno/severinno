# =============================================================================
# Setup Bun (fast-path + cached release)
#
# Substitui oven-sh/setup-bun@v2, que re-downloada o release LATEST em TODOS
# os jobs (~25-35s/job), mesmo quando o Bun já está instalado na imagem.
#
# FONTE ÚNICA DA VERSÃO: repository variable BUN_VERSION (vars.BUN_VERSION).
# Todos os workflows passam `bun-version: vars.BUN_VERSION` no input e o
# sync-bun-mirror.yml usa a mesma variável no env — trocar o Bun = alterar
# a variável em UM lugar (Settings → Secrets and variables → Actions).
#
# Por que NÃO há `default:` no input:
#   - Metadata de action (action.yml) é ESTÁTICA — `default: <expressão>` NÃO
#     é avaliado pelo GitHub (seria o literal "vars.BUN_VERSION"). Um default
#     literal (ex.: "1.3.14") criaria um SEGUNDO ponto de verdade, com risco
#     de drift vs. a variável.
#   - A resolução acontece em RUNTIME no step 'Resolve Bun version': o
#     caller SEMPRE passa `bun-version: vars.BUN_VERSION` (resolvido no
#     WORKFLOW, onde vars funciona no GitHub E no act) e o composite lê o
#     input. O guard scripts/check-bun-mirror.mjs falha o PR se algum call
#     site omitir o input ou usar literal.
#
# ATENÇÃO (act 0.2.89): este arquivo NUNCA contém o token vars.BUN_VERSION
# com chaves de expressão — o act 0.2.89 varre TODOS os tokens de expressão
# (sintaxe de chaves duplas) do composite action, incluindo comentários,
# descrições e prosa, e tenta avaliá-los — falha com 'Unknown Variable Access
# vars' quando o contexto é vars (e o token vazio também quebra o parse).
# Por isso, em prosa/comentário usamos o texto puro `vars.BUN_VERSION` (sem
# chaves). Expressões só aparecem em contextos seguros: inputs, steps, runner
# e github.
#
# Estratégia em 3 camadas (da mais rápida para a mais lenta):
#
#   1. PRE-INSTALLED fast path — se `bun` já estiver no PATH com a versão
#      pedida (imagem que embarca Bun — ex.: runner auto-hospedado ou a
#      imagem custom ghcr.io/<owner>/ubuntu-bun:<versão>), usa como está:
#      ZERO download, ZERO cache I/O (~0-2s).
#      ATENÇÃO (verificado em 08/2026): NEM os runners GitHub-hosted
#      ubuntu-24.04 (manifest oficial sem Bun) NEM a imagem catthehacker/act
#      embarcam Bun — o fast path só dispara em imagens que realmente o
#      incluem. Nos runners padrão o fluxo real é tier 2 (cache ~1-2s no
#      cache real do GitHub) ou tier 3 (download ~5-10s em cache frio).
#   2. actions/cache restore — caso contrário, restaura o binário do release
#      EXATO de actions/cache (key = bun-<versão>-<os>-<arch>) (~1-2s).
#   3. COLD-CACHE download — só em cache miss, puxa do mirror GHCR
#      (ghcr.io/<owner>/bun:<versão>, sincronizado por sync-bun-mirror.yml)
#      via docker pull + docker create/cp (~1-3s, sem rate limit do GitHub
#      Releases) e o salva no cache para os próximos jobs. Se o mirror ainda
#      não existir ou o docker não estiver disponível, faz fallback para o
#      download direto do release do GitHub (~5-10s).
#
# Usage:
#   - uses: ./.github/actions/setup-bun
#     with:
#       bun-version: vars.BUN_VERSION   # OBRIGATÓRIO — no workflow, escreva o valor com chaves de expressão (guard check-bun-mirror falha o PR se omitido)
# =============================================================================

name: Setup Bun (fast-path + cached)
description: >-
  Sets up Bun with three tiers — pre-installed fast path, actions/cache
  restore keyed on the exact version, and a direct GitHub release download
  only on cold cache miss. Replaces oven-sh/setup-bun@v2 (~25-35s re-download
  per job). Version source: repository variable BUN_VERSION (vars.BUN_VERSION).

inputs:
  bun-version:
    description: >-
      Exact Bun version to use (e.g. 1.3.14). FONTE ÚNICA: repository
      variable BUN_VERSION (vars.BUN_VERSION) — workflows pass
      `bun-version: vars.BUN_VERSION` (resolvido no WORKFLOW, onde vars
      funciona no GitHub e no act). OBRIGATÓRIO: o guard
      scripts/check-bun-mirror.mjs falha o PR se um call site omitir o input
      ou usar literal — o composite action não resolve vars internamente
      (act 0.2.89 não suporta vars em composite actions). Sem default no
      metadata (metadata não avalia expressões); input vazio falha.
    required: false

runs:
  using: composite
  steps:
    # ── Resolve a versão (input do caller → erro claro) ──────────────────
    # Metadata de action é estática — a resolução do "default" acontece
    # aqui, em runtime, lendo o INPUT bun-version (que os callers resolvem
    # de vars.BUN_VERSION no workflow). O guard scripts/check-bun-mirror.mjs
    # falha se um default literal voltar ou se um call site omitir o input.
    - name: Resolve Bun version
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        # ATENÇÃO (act 0.2.89): nunca escrever o token vars.BUN_VERSION com
        # chaves de expressão aqui — o act não resolve o contexto vars em
        # composite actions (erro 'Unknown Variable Access vars'). A versão
        # é resolvida no WORKFLOW (onde vars funciona) e passada via input
        # bun-version: todos os call sites passam o valor de vars.BUN_VERSION
        # (guard scripts/check-bun-mirror.mjs falha o PR se algum omitir).
        VERSION="${{ inputs.bun-version }}"
        if [ -z "$VERSION" ]; then
          echo "::error::Bun version não resolvida — passe bun-version no with: (ex.: bun-version: vars.BUN_VERSION, FONTE ÚNICA: repository variable em Settings → Secrets and variables → Actions)."
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "✅ Bun ${VERSION} (input do caller → vars.BUN_VERSION no workflow)"

    # ── Tier 1: pre-installed fast path ─────────────────────────────────
    - name: Detect pre-installed Bun
      id: detect
      shell: bash
      run: |
        set -euo pipefail
        if command -v bun >/dev/null 2>&1; then
          FOUND_VERSION="$(bun --version 2>/dev/null || true)"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "version=${FOUND_VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Bun já instalado no runner (${FOUND_VERSION}) — fast path"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "version=" >> "$GITHUB_OUTPUT"
        fi

    - name: Use pre-installed Bun (fast path)
      if: steps.detect.outputs.found == 'true' && steps.detect.outputs.version == steps.resolve.outputs.version
      shell: bash
      run: |
        echo "✅ Usando Bun pré-instalado: $(bun --version) (0s, sem download)"

    # ── Tier 2: restore from cache ──────────────────────────────────────
    - name: Restore Bun release from cache
      id: cache
      if: steps.detect.outputs.found == 'false' || steps.detect.outputs.version != steps.resolve.outputs.version
      uses: actions/cache@v4
      with:
        path: ~/.bun
        key: bun-${{ steps.resolve.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    # ── Tier 3: cold-cache download (GHCR mirror → GitHub release fallback) ─
    # Prioridade: mirror GHCR ghcr.io/<owner>/bun:<versão> (imagem scratch com
    # o binário em /bun, sincronizada por sync-bun-mirror.yml). O mirror só
    # serve linux/x64; demais plataformas e fallbacks vão direto ao release.
    - name: Download Bun release (cold cache)
      if: (steps.detect.outputs.found == 'false' || steps.detect.outputs.version != steps.resolve.outputs.version) && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BUN_VERSION: ${{ steps.resolve.outputs.version }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        GHCR_OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail

        # Mapeia runner.os/arch → nome do asset do release bun-<os>-<arch>.zip
        case "$RUNNER_OS" in
          Linux)   OS=linux ;;
          macOS)   OS=darwin ;;
          Windows) OS=windows ;;
          *) echo "::error::OS não suportado: $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   ARCH=x64 ;;
          ARM64) ARCH=aarch64 ;;
          *) echo "::error::arch não suportado: $RUNNER_ARCH" >&2; exit 1 ;;
        esac

        mkdir -p "$HOME/.bun/bin"
        BUN_BIN="$HOME/.bun/bin/bun"

        # ── 3a. Mirror GHCR (linux/x64 apenas) ───────────────────────────
        # Pull da imagem scratch (docker create + docker cp extrai /bun).
        # Se o mirror ainda não rodou ou o docker está indisponível, cai no
        # fallback 3b (release direto) — o mirror é otimização, não requisito.
        if [ "$OS" = "linux" ] && [ "$ARCH" = "x64" ] && command -v docker >/dev/null 2>&1; then
          MIRROR="ghcr.io/${GHCR_OWNER}/bun:${BUN_VERSION}"
          echo "::group::Puxando Bun ${BUN_VERSION} do mirror GHCR (${MIRROR})"
          if docker pull "$MIRROR" >/dev/null 2>&1; then
            CID="$(docker create "$MIRROR" 2>/dev/null || true)"
            if [ -n "$CID" ] && docker cp "$CID:/bun" "$BUN_BIN" >/dev/null 2>&1; then
              chmod +x "$BUN_BIN" 2>/dev/null || true
              echo "  ✅ Mirror GHCR ok — bun $( "$BUN_BIN" --version 2>/dev/null || echo '?' )"
              docker rm -f "$CID" >/dev/null 2>&1 || true
              ln -sf "$BUN_BIN" "$HOME/.bun/bin/bunx"
              echo "bunx -> $(readlink -f "$HOME/.bun/bin/bunx" 2>/dev/null || echo "$HOME/.bun/bin/bunx")"
              echo "::endgroup::"
              echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            [ -n "$CID" ] && docker rm -f "$CID" >/dev/null 2>&1 || true
          fi
          echo "  ⚠️ Mirror GHCR indisponível (${MIRROR}) — fallback p/ GitHub Releases"
          echo "::endgroup::"
        fi

        # ── 3b. Fallback: download direto do GitHub Releases ─────────────
        URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${OS}-${ARCH}.zip"
        echo "::group::Baixando Bun ${BUN_VERSION} (${OS}-${ARCH}) do GitHub Releases"
        echo "URL: ${URL}"
        curl -fsSL "$URL" -o "$RUNNER_TEMP/bun.zip"
        unzip -qo "$RUNNER_TEMP/bun.zip" -d "$HOME/.bun"

        # O zip extrai para uma pasta (ex.: bun-linux-x64/bun) — normaliza
        # para o layout do instalador oficial: ~/.bun/bin/bun (mesmo caminho
        # usado pelo actions/cache acima, mantendo a key compatível).
        find "$HOME/.bun" -type f -name bun -exec mv -f {} "$BUN_BIN" \; 2>/dev/null || true
        chmod +x "$BUN_BIN" 2>/dev/null || true

        # CRÍTICO: o zip do release contém APENAS o binário `bun` — o `bunx`
        # é um symlink criado pelo instalador oficial. Sem ele, steps que
        # usam `bunx` (ex.: bunx prisma generate, bunx tsc) falham com
        # exit 127 (command not found). Verificado em at: check job real
        # morreu em 'Generate Prisma client' exatamente por isso.
        ln -sf "$BUN_BIN" "$HOME/.bun/bin/bunx"

        "$BUN_BIN" --version
        echo "bunx -> $(readlink -f "$HOME/.bun/bin/bunx" 2>/dev/null || echo "$HOME/.bun/bin/bunx")"
        echo "::endgroup::"

        # Adiciona ao PATH do job (e das próximas ações)
        echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

    # ── Garante bunx em restores de cache ANTIGOS (pré-fix) ─────────────
    # Caches salvos antes do symlink bunx existir restaurariam ~/.bun sem o
    # bunx, quebrando `bunx ...` mesmo com o tier 3 corrigido. Este passo é
    # idempotente e barato (~ms) — só cria o symlink se estiver faltando.
    - name: Ensure bunx symlink (cached installs)
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ -x "$HOME/.bun/bin/bun" ] && [ ! -e "$HOME/.bun/bin/bunx" ]; then
          ln -sf "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"
          echo "::notice::bunx symlink criado (cache antigo sem bunx)"
        fi

    # ── PATH para o binário restaurado do cache ─────────────────────────
    - name: Add cached Bun to PATH
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
