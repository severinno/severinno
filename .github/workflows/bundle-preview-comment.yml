# =============================================================================
# Bundle Preview PR Comment
#
# Consumes the bundle-preview artifact generated by ci.yml (job `budget` —
# step "Generate bundle preview (PR only)") and posts the JS bundle delta
# table as a PR comment. This workflow does NOT run the ANALYZE build itself
# — that happens in ci.yml.
#
# Why a separate workflow_run? The ci.yml budget job runs the ANALYZE build
# with the PR's code; posting comments from within that same workflow would
# need a write token that also runs on fork PRs. workflow_run is the standard
# safe pattern (same as benchmark-pr-comment.yml).
#
# The comment is posted/updated on EVERY completion (green or red): the delta
# is most informative when the budget gate fails, showing which chunk/library
# blew the budget before merge.
# =============================================================================

name: Bundle Preview Comment

on:
  workflow_run:
    workflows: ["CI/CD"]
    types:
      - completed

concurrency:
  group: bundle-preview-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post Bundle Preview Comment
    runs-on: ubuntu-latest
    # Post even on failure — the delta table matters most when the gate is red.
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}

    steps:
      - name: Checkout default branch (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Download artifact from the triggering CI run ─────────────────
      - name: Download bundle preview artifact from CI run
        uses: actions/download-artifact@v4
        with:
          name: bundle-preview
          path: .bundle-preview/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ── Extract PR number from the triggering workflow run ────────────
      - name: Extract PR number
        id: pr-info
        run: |
          PR_NUMBER='${{ github.event.workflow_run.pull_requests[0].number }}'
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "number=0" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      # ── Post / update PR comment ─────────────────────────────────────
      # Replaces any previous bundle-preview comment (identified by the
      # stable "## Bundle preview" marker - the ASCII rename of the
      # pre-2026-08 "## 📦 Bundle preview" marker, matching the generator's
      # output in bundle-report.mjs) so history stays clean.
      - name: Post/update PR comment
        if: steps.pr-info.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt('${{ steps.pr-info.outputs.number }}', 10);

            let body;
            try {
              body = fs.readFileSync('.bundle-preview/bundle-preview.md', 'utf-8');
            } catch (e) {
              body = '## Bundle preview\n\n_Relatorio nao gerado nesta execucao - o job `budget` do CI/CD nao alcancou o passo "Generate bundle preview" (build ANALYZE provavelmente falhou antes)._';
            }

            // Fetch existing comments to find and remove previous bundle-preview comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComments = comments.filter(c =>
              c.user.type === 'Bot' && c.body?.startsWith('## Bundle preview')
            );

            for (const c of botComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: c.id,
              });
            }

            // Post fresh comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body,
            });
