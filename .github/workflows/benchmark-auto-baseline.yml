# =============================================================================
# Benchmark Auto-Baseline — Severinno Marketplace
#
# On merge to main, re-runs the geo and cache benchmarks and updates the
# baseline JSON files (docs/benchmarks/geo-baseline.json and
# cache-baseline.json) so that PR comparisons always have a fresh reference.
#
# This prevents baseline drift: after performance-affecting changes land on
# main, the next PR compares against the new normal rather than a stale
# baseline from weeks ago.
#
# Safety:
#   - Only commits if baseline files actually changed (±1% threshold)
#   - Commits via github-actions[bot] — no human identity used
#   - Only runs on push to main (merge events)
# =============================================================================

name: Benchmark Auto-Baseline

on:
  push:
    branches: [main]
    paths:
      - "src/lib/geo-shared.ts"
      - "src/lib/distance-fallback.ts"
      - "src/lib/radius-expansion.ts"
      - "src/lib/fetch-providers-data.ts"
      - "src/lib/fetch-unrestricted-results.ts"
      - "src/lib/sql-builder.ts"
      - "src/lib/benchmark-utils.ts"
      - "src/lib/cpu-calibrate.ts"
      - "scripts/geo-benchmark.mjs"
      - "scripts/cache-benchmark.mjs"
      - "scripts/compare-benchmarks.mjs"
      - "scripts/run-benchmark.mjs"

concurrency:
  group: benchmark-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Smoke test ────────────────────────────────────────────────────────
  # Fast pre-flight: verifies that benchmark dependencies are in place
  # before the auto-baseline job spends time installing deps and running
  # benchmarks.  Fails fast (<30s) on missing scripts, wrong Node version,
  # or missing output directory.
  smoke:
    name: Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Check Node.js version
        run: |
          REQUIRED_MAJOR=22
          ACTUAL_MAJOR=$(node -e "console.log(process.versions.node.split('.')[0])")
          if [ "$ACTUAL_MAJOR" -lt "$REQUIRED_MAJOR" ]; then
            echo "❌ Node.js v$REQUIRED_MAJOR+ required, found v$(node --version)"
            exit 1
          fi
          echo "  ✅ Node.js $(node --version) meets minimum v$REQUIRED_MAJOR"

      - name: Check benchmark scripts exist
        run: |
          MISSING=false
          for script in scripts/geo-benchmark.mjs scripts/cache-benchmark.mjs scripts/search-benchmark.mjs scripts/compare-benchmarks.mjs scripts/run-benchmark.mjs; do
            if [ ! -f "$script" ]; then
              echo "  ❌ Missing: $script"
              MISSING=true
            else
              echo "  ✅ Found:   $script"
            fi
          done
          if [ "$MISSING" = true ]; then
            exit 1
          fi

      - name: Check docs/benchmarks/ directory
        run: |
          if [ ! -d "docs/benchmarks" ]; then
            echo "❌ Missing output directory: docs/benchmarks/"
            echo "   Create it: mkdir -p docs/benchmarks"
            exit 1
          fi
          echo "  ✅ Output directory: docs/benchmarks/"

  # ── Auto-Baseline ───────────────────────────────────────────────────
  auto-baseline:
    name: Auto-Baseline
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Geo baseline ──────────────────────────────────────────────────
      - name: Run geo benchmark
        run: |
          node scripts/run-benchmark.mjs --type geo --baseline

      # ── Cache baseline ────────────────────────────────────────────────
      - name: Run cache benchmark
        run: |
          node scripts/run-benchmark.mjs --type cache --baseline

      # ── Search baseline ───────────────────────────────────────────────
      - name: Run search benchmark
        run: |
          node scripts/run-benchmark.mjs --type search --baseline

      # ── Validate baseline JSONs ───────────────────────────────────────
      # Prevent committing garbage if a benchmark crashed mid-write.
      - name: Validate baseline JSON files
        run: |
          node -e "
            const fs = require('fs');
            const g = JSON.parse(fs.readFileSync('docs/benchmarks/geo-baseline.json','utf-8'));
            const c = JSON.parse(fs.readFileSync('docs/benchmarks/cache-baseline.json','utf-8'));
            const s = JSON.parse(fs.readFileSync('docs/benchmarks/search-baseline.json','utf-8'));
            if (!g.meta || !Array.isArray(g.benchmarks) || g.benchmarks.length === 0) {
              throw Error('geo-baseline.json: invalid or empty');
            }
            if (!c.meta || !Array.isArray(c.benchmarks) || c.benchmarks.length === 0) {
              throw Error('cache-baseline.json: invalid or empty');
            }
            if (!s.meta || !Array.isArray(s.benchmarks) || s.benchmarks.length === 0) {
              throw Error('search-baseline.json: invalid or empty');
            }
            console.log('  ✅ Baseline validation passed');
            console.log('  · geo-baseline.json:    ' + g.benchmarks.length + ' benchmarks, ' + g.meta.platform + ' ' + g.meta.arch);
            console.log('  · cache-baseline.json:  ' + c.benchmarks.length + ' benchmarks, ' + c.meta.platform + ' ' + c.meta.arch);
            console.log('  · search-baseline.json: ' + s.benchmarks.length + ' benchmarks, ' + s.meta.platform + ' ' + s.meta.arch);
          "

      # ── Check for actual changes ───────────────────────────────────────
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/benchmarks/geo-baseline.json docs/benchmarks/cache-baseline.json docs/benchmarks/search-baseline.json; then
            echo "No baseline files changed."
            echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Commit and push ───────────────────────────────────────────────
      - name: Commit updated baseline
        if: steps.changes.outputs.HAS_CHANGES == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/geo-baseline.json docs/benchmarks/cache-baseline.json docs/benchmarks/search-baseline.json
          git commit -m "chore: auto-atualizar baselines de benchmark (merge em main)

          Re-executa geo-benchmark, cache-benchmark e search-benchmark
          apos merge em main e atualiza os arquivos de baseline para
          manter referencias frescas para comparacao em PRs.

          🤖 Generated with Codebuff"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
