# =============================================================================
# Health Check (reusable workflow)
#
# Encapsulates the checkout + scp + ssh sequence that the deploy jobs of
# deploy.yml and release-deploy.yml used to duplicate inline: copy
# scripts/health-check.sh to the VPS and run it over SSH after restarting the
# services, with the retry/URL params driven by `with:` inputs.
#
# VPS access is 100% centralized in the local composite actions: the scp
# step uses ./.github/actions/severinno-scp and every ssh step uses
# ./.github/actions/severinno-ssh — the appleboy pins (scp-action@v1,
# ssh-action@v1) live ONLY there, never inline in a workflow. The credential
# trio (host/username/key) is passed through by each caller via `with:`
# (composite actions cannot read the secrets context directly).
#
# Callers (job-level `uses:` — runs as its OWN job on its OWN runner):
#   deploy-job-name:
#     needs: <deploy step that restarts services>
#     uses: ./.github/workflows/health-check.yml
#     with:
#       url: http://localhost:3000/api/health   # optional
#       attempts: 12                             # optional
#       sleep: 5                                 # optional
#       expect-code: 200                         # optional
#       docker-prune: true                       # optional
#     secrets:
#       DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
#       DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
#       DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
#       DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
#
# Why docker-test (deploy.yml) does NOT call this workflow: its container runs
# on the docker-test job's OWN runner, and a reusable workflow runs on a
# FRESH runner — it could not reach that container. The local smoke test keeps
# its inline `bash scripts/health-check.sh` (env 20/3), which is already DRY
# via the same shared script.
# =============================================================================
name: Health Check (deploy)

on:
  workflow_call:
    inputs:
      url:
        description: "URL to probe"
        required: false
        type: string
        default: http://localhost:3000/api/health
      attempts:
        description: "Max attempts before failing"
        required: false
        type: number
        default: 12
      sleep:
        description: "Seconds between attempts"
        required: false
        type: number
        default: 5
      expect-code:
        description: "HTTP code that means 'healthy'"
        required: false
        type: number
        default: 200
      docker-prune:
        description: "Run `docker image prune -f` as a post-deploy housekeeping step (only after a successful health check)"
        required: false
        type: boolean
        default: true
    secrets:
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_KEY:
        required: true
      DEPLOY_PATH:
        required: true

jobs:
  check:
    name: Wait for health check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # scp preserves the source path: scripts/health-check.sh lands at
      # ${{ secrets.DEPLOY_PATH }}/scripts/health-check.sh. The appleboy
      # scp pin lives in ./.github/actions/severinno-scp — never inline.
      - name: Copy health check script
        uses: ./.github/actions/severinno-scp
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: scripts/health-check.sh
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: ./.github/actions/severinno-ssh
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "Pulling new images..."
            docker compose pull app realtime email-worker notification-worker

            echo "Restarting services..."
            docker compose up -d --no-deps --remove-orphans app realtime
            docker compose --profile workers up -d --no-deps email-worker notification-worker

            echo "Waiting for health check..."
            HEALTH_URL="${{ inputs.url }}" \
              HEALTH_ATTEMPTS=${{ inputs.attempts }} \
              HEALTH_SLEEP=${{ inputs.sleep }} \
              HEALTH_EXPECT_CODE=${{ inputs.expect-code }} \
              bash scripts/health-check.sh

      # Housekeeping is SEPARATE from the health check on purpose: the deploy
      # verdict is the app being up (the step above), not disk cleanup. This
      # runs only when the health check SUCCEEDED (`success()`) AND the caller
      # opted in (`inputs.docker-prune`); its failure is non-fatal (|| echo),
      # ASCII-only for VPS locale robustness.
      - name: Housekeeping (docker image prune)
        if: ${{ success() && inputs.docker-prune }}
        uses: ./.github/actions/severinno-ssh
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker image prune -f || echo "WARNING: docker image prune -f failed (non-fatal - deploy stays green)"
