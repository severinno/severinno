# =============================================================================
# Seed Guards E2E — reusable workflow (MATRIX 2×2 seed×imagem + dev-env
# em container próprio)
#
# MATRIX 2×2: consolida os DOIS E2Es de seed (prod + dev) em uma matrix que
# também varia a imagem do PostGIS — cada célula roda UM E2E contra UMA imagem
# (4 combinações independentes):
#   prod×alpine, prod×full, dev×alpine, dev×full
# Objetivo: validar a compatibilidade de AMBAS as variantes da imagem em PRs,
# não só em cron/deploy — o full é a MESMA imagem que o deploy.yml usa.
#   1. prod E2E (test-seed-prod-e2e.ts — 128 checks): guard recusa fora de
#      produção, dry-run nada escrito, bootstrap categorias+settings, ZERO
#      usuários, idempotência, cenários SEED_SPEC_PATCH (update + rename)
#   2. dev E2E (test-seed-dev-e2e.ts — 162 checks): guard recusa em produção,
#      9 usuários demo, árvore completa, wipe+recreate idempotente, guard
#      ENTRE re-execuções, cenários SEED_SPEC_PATCH
#   3. prod E2E dev-env (job seed-prod-e2e-dev-env — container PRÓPRIO): roda
#      o prod E2E COMPLETO com PROD_SEED_ALLOW_DEV=1 presente no AMBIENTE do
#      job (NODE_ENV=development) — o fluxo de override de banco efêmero em
#      dev que o CI de produção nunca exercita (ver detalhes no job)
#   4. MUTATION TEST (job mutation-seed-dev-e2e — container PRÓPRIO): prova
#      que o guard do seed dev pega regressões — introduz um bug CONHECIDO
#      no prisma/seed.ts, roda o dev E2E e exige que ele FALHE pela asserção
#      certa (guarda cego → job falha)
#   5. MIGRATE RENAME E2E (job migrate-category-rename-e2e — container
#      PRÓPRIO): prova que a migração segura de renomeação de categoria
#      (scripts/migrate-category-rename.mjs) continua funcionando contra o
#      PostGIS real — guards de recusa, dry-run, renomeação de pai com
#      filhos + subcategoria com services, re-run recusado, colisão de slug
#      e consistência da árvore com o seed-data
#
# Cada célula tem SEU próprio container (banco limpo — o prod asserta ZERO
# usuários; o dev faz wipe+recreate). Sem acoplamento nem ordem entre células:
# o `if: always()` e o SKIP_DB_PUSH condicional do desenho antigo (prod→dev no
# mesmo container) foram eliminados — cada célula é independente.
#
# Independência PRESERVADA: o step do dev roda com `if: always()` — um PR
# que quebre o seed de dev é detectado MESMO se o prod E2E falhar antes
# (mesmo comportamento do antigo job seed-dev-e2e dedicado, sem o custo de
# um container + imagem + bun install extras). SKIP_DB_PUSH no dev é
# condicional ao sucesso do prod: se o prod fez o push, o dev pula (~9s);
# se o prod falhou antes do push, o dev faz o próprio push (robustez).
#
# Otimizações de CI aplicadas:
#   - vars.POSTGIS_IMAGE (default alpine; mire no GHCR com
#     sync-postgis-mirror.yml para pull mais rápido + sem rate limit Docker Hub)
#   - Cache do Prisma client keyed no schema.prisma + bun.lock →
#     SKIP_PRISMA_GENERATE=1 em cache hit (pula o generate, ~6s)
#   - A matrix compartilha o cache do Prisma client entre as 4 combinações
#     (mesma key em todas — em runs subsequentes, todas pulam o generate)
#
# Centralizado aqui (em vez de duplicado) para que PR check e cron semanal
# validem SEMPRE a mesma definição — sem drift entre os dois contextos.
#
# Chamado por:
#   - pr-check.yml          (a cada pull request)
#   - benchmark-weekly.yml  (cron semanal — revalida contra banco efêmero)
# =============================================================================

name: Seed Guards E2E (reusable)

on:
  workflow_call:

jobs:
  seed-guards:
    name: Seed E2E ${{ matrix.seed }} · ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ── MATRIX 2×2: seed (prod/dev) × imagem (alpine/full) ──────────
    # Consolida os DOIS E2Es de seed (prod + dev) em uma matrix que também
    # varia a imagem do PostGIS — cada célula roda UM E2E contra UMA imagem,
    # com SEU próprio service container (4 combinações independentes):
    #   prod×alpine, prod×full, dev×alpine, dev×full
    # Objetivo: validar a compatibilidade de AMBAS as variantes da imagem em
    # PRs (não só em cron/deploy). O full é a MESMA imagem que o deploy.yml
    # usa; o alpine é o default mais leve (~154 MiB).
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: prod
            variant: alpine
          - seed: prod
            variant: full
          - seed: dev
            variant: alpine
          - seed: dev
            variant: full

    # ── Ephemeral PostGIS service container (UM por combinação) ─────
    # Imagem resolvida por matrix.variant: alpine usa vars.POSTGIS_IMAGE
    # (fallback Docker Hub; aponte para o mirror GHCR com
    # sync-postgis-mirror.yml), full usa a imagem oficial postgis/postgis:16-3.4
    # (a MESMA que o deploy.yml usa — compatibilidade garantida com prod).
    services:
      postgres:
        image: ${{ matrix.variant == 'full' && 'postgis/postgis:16-3.4' || (vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine') }}
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      # ── Cache do Prisma client (keyed no schema + versão do client) ──
      # Em cache hit, os E2Es rodam com SKIP_PRISMA_GENERATE=1 (o .sh pula
      # o generate, que é determinístico dado o schema) — economia ~6s.
      # restore-keys nunca dispara o skip: o cache-hit só é 'true' com key
      # exata, então um restore parcial roda o generate.
      - name: Cache Prisma client
        id: prisma-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: prisma-${{ vars.BUN_VERSION }}-${{ hashFiles('prisma/schema.prisma') }}-${{ hashFiles('bun.lock') }}
          restore-keys: prisma-${{ vars.BUN_VERSION }}-

      # ── PostGIS extension no service container ──────────────────────
      # A imagem postgis só habilita a extensão em postgres/template_postgis,
      # NÃO no POSTGRES_DB (criado de template1) — sem ela o prisma db push
      # falha nas colunas Unsupported("geography(Point, 4326)"). Não dá para
      # usar init-script montado aqui: o service container inicia ANTES do
      # checkout (workspace vazio) — por isso o docker exec explícito.
      - name: Enable PostGIS extension
        run: |
          # O docker-postgis (alpine E full) carrega a extensão no POSTGRES_DB
          # DEPOIS do servidor aceitar conexões ('Loading PostGIS extensions
          # into severinno') — o healthcheck passa antes. Um CREATE EXTENSION
          # IF NOT EXISTS nesse momento RACEIA com o load da imagem e falha
          # esporadicamente com duplicate key pg_extension_name_index.
          # Solução: poll até a extensão aparecer (a imagem SEMPRE carrega),
          # com fallback de criação (IF NOT EXISTS + re-verificação).
          POSTGIS_READY=0
          for _ in $(seq 1 30); do
            if docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null | grep -qx 1; then
              POSTGIS_READY=1
              break
            fi
            sleep 1
          done
          if [ "$POSTGIS_READY" != "1" ]; then
            docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -c "CREATE EXTENSION IF NOT EXISTS postgis" >/dev/null 2>&1 || true
            if ! docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null | grep -qx 1; then
              echo "❌ postgis não disponível após espera/fallback"
              exit 1
            fi
          fi
          echo "✅ postgis disponível"

      # ── E2E da célula (prod ou dev) ─────────────────────────────────
      # Cada célula roda UM E2E em um container EXCLUSIVO da combinação
      # (banco limpo próprio — o prod asserta ZERO usuários; o dev faz
      # wipe+recreate). Sem acoplamento nem ordem entre células.
      # O .sh com --skip-docker faz: prisma generate (se cache miss) +
      # db push (schema) + validator (prod: 128 checks; dev: 162 checks).
      - name: Run seed-${{ matrix.seed }} E2E
        id: e2e
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
          SKIP_PRISMA_GENERATE: ${{ steps.prisma-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          if [ "${{ matrix.seed }}" = "prod" ]; then
            bun run test:seed-prod-e2e --skip-docker
            echo "  ✅ Seed prod E2E passou (128 checks)"
          else
            bun run test:seed-dev-e2e --skip-docker
            echo "  ✅ Seed dev E2E passou (162 checks)"
          fi

      # ── Publish summary ─────────────────────────────────────────────
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🛡️ Seed Guards E2E'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Seed | ${{ matrix.seed }} |"
            echo "| Variante imagem | ${{ matrix.variant }} |"
            echo "| E2E (${{ matrix.seed == 'prod' && '128' || '162' }} checks) | ${{ steps.e2e.conclusion == 'success' && '✅' || '❌' }} |"
            echo "| Imagem PostGIS | ${{ matrix.variant == 'full' && 'postgis/postgis:16-3.4' || (vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine') }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── MUTATION TEST — o guard do seed dev pega regressões? ─────────────
  # Introduz um bug CONHECIDO no prisma/seed.ts (muta o email do admin),
  # roda o seed-dev E2E e exige que ele FALHE pela asserção certa:
  #   ❌ 'admin@severinno.com' existe com role ADMIN
  # Se o E2E PASSAR com o seed mutado (exit 0), o guard está CEGO — uma
  # asserção foi removida/enfraquecida em scripts/test-seed-dev-e2e.ts — e
  # o job falha. Script: scripts/test-mutation-seed-dev-e2e.sh (restaura o
  # seed via backup em trap, nunca git checkout).
  mutation-seed-dev-e2e:
    name: Mutation Test (seed dev E2E pega regressões?)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine' }}
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Cache Prisma client
        id: prisma-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: prisma-${{ vars.BUN_VERSION }}-${{ hashFiles('prisma/schema.prisma') }}-${{ hashFiles('bun.lock') }}
          restore-keys: prisma-${{ vars.BUN_VERSION }}-

      - name: Enable PostGIS extension
        run: |
          # O docker-postgis (alpine E full) carrega a extensão no POSTGRES_DB
          # DEPOIS do servidor aceitar conexões ('Loading PostGIS extensions
          # into severinno') — o healthcheck passa antes. Um CREATE EXTENSION
          # IF NOT EXISTS nesse momento RACEIA com o load da imagem e falha
          # esporadicamente com duplicate key pg_extension_name_index.
          # Solução: poll até a extensão aparecer (a imagem SEMPRE carrega),
          # com fallback de criação (IF NOT EXISTS + re-verificação).
          POSTGIS_READY=0
          for _ in $(seq 1 30); do
            if docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null | grep -qx 1; then
              POSTGIS_READY=1
              break
            fi
            sleep 1
          done
          if [ "$POSTGIS_READY" != "1" ]; then
            docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -c "CREATE EXTENSION IF NOT EXISTS postgis" >/dev/null 2>&1 || true
            if ! docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null | grep -qx 1; then
              echo "❌ postgis não disponível após espera/fallback"
              exit 1
            fi
          fi
          echo "✅ postgis disponível"

      # ── Mutation test ──────────────────────────────────────────────
      # O script muta prisma/seed.ts (sed), roda o E2E contra o seed
      # mutado e valida que ele FALHA pela asserção esperada. O seed é
      # restaurado do backup em trap (o working tree do runner volta limpo).
      - name: Run mutation test (seed dev E2E deve FALHAR)
        id: mutation
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
          SKIP_PRISMA_GENERATE: ${{ steps.prisma-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          bun run test:mutation-seed-dev-e2e --skip-docker
          echo "  ✅ Mutation test passou — o guard detectou a mutação"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🧬 Mutation Test — seed dev E2E'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Mutação detectada | ${{ steps.mutation.conclusion == 'success' && '✅ guard saudável' || '❌ guard CEGO' }} |"
            echo "| Imagem PostGIS | ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine (default)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── MUTATION TEST — contrato de atualização COORDENADA dos counts ──
  # Prova que o seed-e2e-count.test.ts pega o cenário exato do bug
  # histórico: atualizar SÓ os comentários dos workflows (128→N) sem tocar
  # a âncora do teste. O script muta os SCAN_FILES (pr-check.yml,
  # seed-guards.yml, validate-seed-guards-matrix-local.sh) IN-PLACE no
  # working tree (é assim que o teste de integração lê os arquivos via
  # process.cwd() — uma cópia em temp quebraria a premissa) com backup +
  # trap EXIT de restauração, e exige que o teste FALHE pelo piso de sites
  # (prod ≥ 8). Roda vitest REAL (precisa de node_modules) — por isso NÃO
  # vai na matriz node-pura do master mutation-guards; este job com bun
  # install é o home do contrato. Sem postgis: o teste é unitário (só
  # derivação + leitura dos SCAN_FILES), não toca banco.
  mutation-coord-update:
    name: Mutation Test (workflows 128→N deve FALHAR o teste)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      # ── Mutation test ──────────────────────────────────────────────
      # O script muta a doc dos workflows (128→N) em in-place com backup
      # + trap, roda o vitest real no seed-e2e-count.test.ts e exige que
      # ele FALHE pelo piso — se o teste passar com a doc generalizada, o
      # contrato não está enforced e o job falha.
      - name: Run mutation test (contrato coordenado)
        id: mutation
        run: |
          bun run test:mutation-coord-update
          echo "  ✅ Mutation test passou — o contrato de atualização coordenada está enforced"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🧬 Mutation Test — contrato de atualização coordenada (counts)'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Doc 128→N detectada pelo teste | ${{ steps.mutation.conclusion == 'success' && '✅ contrato enforced' || '❌ guard CEGO' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── PROD E2E — variante dev-env (override PROD_SEED_ALLOW_DEV=1) ────
  # Cobre o cenário que o CI de PRODUÇÃO NÃO exercita: o seed-prod rodando
  # FORA de produção com o override explícito (PROD_SEED_ALLOW_DEV=1) — o
  # fluxo documentado no header do prisma/seed-prod.ts para validar contra
  # um banco efêmero em dev/CI.
  #
  # Diferença vs. o job seed-guards acima: lá o override é SIMULADO
  # internamente pelo runSeed() do E2E (que remove a env herdada por chamada
  # para manter o guard honesto). Aqui o override está presente no AMBIENTE
  # do job, validando que:
  #   1. isProdSeedAllowed(development, "1") permite (o override funciona);
  #   2. O E2E permanece honesto MESMO com a env presente (runSeed a remove
  #      no teste de recusa — o guard não é mascarado pela env do job);
  #   3. O comando documentado de dev funciona end-to-end:
  #      PROD_SEED_ALLOW_DEV=1 NODE_ENV=development bun run db:seed:prod
  #
  # Container PRÓPRIO (não reusa o do job seed-guards): o prod E2E exige
  # banco LIMPO (asserta ZERO usuários + counts canônicos) e o dev E2E faz
  # wipe+recreate com usuários demo — compartilhar o container quebraria as
  # asserções do prod E2E.
  seed-prod-e2e-dev-env:
    name: Seed Prod E2E (dev-env override)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine' }}
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Cache Prisma client
        id: prisma-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: prisma-${{ vars.BUN_VERSION }}-${{ hashFiles('prisma/schema.prisma') }}-${{ hashFiles('bun.lock') }}
          restore-keys: prisma-${{ vars.BUN_VERSION }}-

      - name: Enable PostGIS extension
        run: |
          # O docker-postgis (alpine E full) carrega a extensão no POSTGRES_DB
          # DEPOIS do servidor aceitar conexões ('Loading PostGIS extensions
          # into severinno') — o healthcheck passa antes. Um CREATE EXTENSION
          # IF NOT EXISTS nesse momento RACEIA com o load da imagem e falha
          # esporadicamente com duplicate key pg_extension_name_index.
          # Solução: poll até a extensão aparecer (a imagem SEMPRE carrega),
          # com fallback de criação (IF NOT EXISTS + re-verificação).
          POSTGIS_READY=0
          for _ in $(seq 1 30); do
            if docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null | grep -qx 1; then
              POSTGIS_READY=1
              break
            fi
            sleep 1
          done
          if [ "$POSTGIS_READY" != "1" ]; then
            docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -c "CREATE EXTENSION IF NOT EXISTS postgis" >/dev/null 2>&1 || true
            if ! docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null | grep -qx 1; then
              echo "❌ postgis não disponível após espera/fallback"
              exit 1
            fi
          fi
          echo "✅ postgis disponível"

      # ── Prod E2E com override no AMBIENTE (não só simulado) ──────────
      # PROD_SEED_ALLOW_DEV=1 presente no env do step → o E2E roda no fluxo
      # de dev/CI. O guard de recusa continua honesto: runSeed() remove a env
      # herdada antes de cada chamada (higiene de env do E2E).
      - name: Run seed-prod E2E (override no env do job)
        id: e2e
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
          NODE_ENV: development
          PROD_SEED_ALLOW_DEV: "1"
          SKIP_PRISMA_GENERATE: ${{ steps.prisma-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          bun run test:seed-prod-e2e --skip-docker
          echo "  ✅ Seed prod E2E (dev-env) passou — 128 checks"

      # ── Smoke do fluxo documentado de override ────────────────────────
      # O comando EXATO que um dev roda contra banco efêmero em dev
      # (documentado no header do prisma/seed-prod.ts):
      #   PROD_SEED_ALLOW_DEV=1 NODE_ENV=development bun run db:seed:prod
      # Valida que o script do package.json + a env var do job fluem até o
      # guard isProdSeedAllowed() e o seed conclui (exit 0 + confirmação).
      - name: Smoke — db:seed:prod com override (dev)
        id: smoke
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
          NODE_ENV: development
          PROD_SEED_ALLOW_DEV: "1"
        run: |
          OUT=$(bun run db:seed:prod 2>&1)
          echo "$OUT"
          if ! echo "$OUT" | grep -q "Seed de produção concluído"; then
            echo "❌ db:seed:prod não concluiu com override — veja output acima"
            exit 1
          fi
          echo "  ✅ Override flow validado (exit 0 + confirmação final)"

      # ── Publish summary ─────────────────────────────────────────────
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🛡️ Seed Prod E2E — dev-env (override PROD_SEED_ALLOW_DEV=1)'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Prod E2E (128 checks, override no env) | ${{ steps.e2e.conclusion == 'success' && '✅' || '❌' }} |"
            echo "| Smoke db:seed:prod com override | ${{ steps.smoke.conclusion == 'success' && '✅' || '❌' }} |"
            echo "| Imagem PostGIS | ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine (default)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── CATEGORY RENAME MIGRATION E2E ───────────────────────────────────────
  # Prova que a migração SEGURA de renomeação de categoria
  # (scripts/migrate-category-rename.mjs) continua funcionando contra o
  # PostGIS real: guards de recusa (fora de prod + --from inexistente),
  # dry-run sem escrita, renomeação de pai com filhos, subcategoria com
  # services, re-run recusado, colisão de slug e consistência da árvore
  # com o seed-data. Container PRÓPRIO (o .sh faz generate + push + seed
  # dev + validator; --skip-docker usa o service container do job).
  migrate-category-rename-e2e:
    name: Migrate Category Rename E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine' }}
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Cache Prisma client
        id: prisma-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: prisma-${{ vars.BUN_VERSION }}-${{ hashFiles('prisma/schema.prisma') }}-${{ hashFiles('bun.lock') }}
          restore-keys: prisma-${{ vars.BUN_VERSION }}-

      - name: Enable PostGIS extension
        run: |
          # O docker-postgis (alpine E full) carrega a extensão no POSTGRES_DB
          # DEPOIS do servidor aceitar conexões ('Loading PostGIS extensions
          # into severinno') — o healthcheck passa antes. Um CREATE EXTENSION
          # IF NOT EXISTS nesse momento RACEIA com o load da imagem e falha
          # esporadicamente com duplicate key pg_extension_name_index.
          # Solução: poll até a extensão aparecer (a imagem SEMPRE carrega),
          # com fallback de criação (IF NOT EXISTS + re-verificação).
          POSTGIS_READY=0
          for _ in $(seq 1 30); do
            if docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null | grep -qx 1; then
              POSTGIS_READY=1
              break
            fi
            sleep 1
          done
          if [ "$POSTGIS_READY" != "1" ]; then
            docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -c "CREATE EXTENSION IF NOT EXISTS postgis" >/dev/null 2>&1 || true
            if ! docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null | grep -qx 1; then
              echo "❌ postgis não disponível após espera/fallback"
              exit 1
            fi
          fi
          echo "✅ postgis disponível"

      # ── Run migrate rename E2E ──────────────────────────────────────
      # O .sh com --skip-docker faz: prisma generate (se cache miss) +
      # db push + seed dev + validator (8 cenários de renomeação).
      - name: Run migrate category rename E2E
        id: e2e
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
          SKIP_PRISMA_GENERATE: ${{ steps.prisma-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          bun run test:migrate-category-rename-e2e --skip-docker
          echo "  ✅ Migrate category rename E2E passou"

      # ── Publish summary ─────────────────────────────────────────────
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🔄 Migrate Category Rename E2E'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Migrate rename E2E | ${{ steps.e2e.conclusion == 'success' && '✅' || '❌' }} |"
            echo "| Imagem PostGIS | ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine (default)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
