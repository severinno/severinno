# =============================================================================
# Seed Guards E2E — reusable workflow (MATRIX 2×2 seed×imagem + dev-env
# em container próprio)
#
# MATRIX 2×2: consolida os DOIS E2Es de seed (prod + dev) em uma matrix que
# também varia a imagem do PostGIS — cada célula roda UM E2E contra UMA imagem
# (4 combinações independentes):
#   prod×alpine, prod×full, dev×alpine, dev×full
# Objetivo: validar a compatibilidade de AMBAS as variantes da imagem em PRs,
# não só em cron/deploy — o full é a MESMA imagem que o deploy.yml usa.
#   1. prod E2E (test-seed-prod-e2e.ts — 127 checks): guard recusa fora de
#      produção, dry-run nada escrito, bootstrap categorias+settings, ZERO
#      usuários, idempotência, cenários SEED_SPEC_PATCH (update + rename)
#   2. dev E2E (test-seed-dev-e2e.ts — 161 checks): guard recusa em produção,
#      9 usuários demo, árvore completa, wipe+recreate idempotente, guard
#      ENTRE re-execuções, cenários SEED_SPEC_PATCH
#   3. prod E2E dev-env (job seed-prod-e2e-dev-env — container PRÓPRIO): roda
#      o prod E2E COMPLETO com PROD_SEED_ALLOW_DEV=1 presente no AMBIENTE do
#      job (NODE_ENV=development) — o fluxo de override de banco efêmero em
#      dev que o CI de produção nunca exercita (ver detalhes no job)
#   4. MUTATION TEST (job mutation-seed-dev-e2e — container PRÓPRIO): prova
#      que o guard do seed dev pega regressões — introduz um bug CONHECIDO
#      no prisma/seed.ts, roda o dev E2E e exige que ele FALHE pela asserção
#      certa (guarda cego → job falha)
#   5. MIGRATE RENAME E2E (job migrate-category-rename-e2e — container
#      PRÓPRIO): prova que a migração segura de renomeação de categoria
#      (scripts/migrate-category-rename.mjs) continua funcionando contra o
#      PostGIS real — guards de recusa, dry-run, renomeação de pai com
#      filhos + subcategoria com services, re-run recusado, colisão de slug
#      e consistência da árvore com o seed-data
#
# Cada célula tem SEU próprio container (banco limpo — o prod asserta ZERO
# usuários; o dev faz wipe+recreate). Sem acoplamento nem ordem entre células:
# o `if: always()` e o SKIP_DB_PUSH condicional do desenho antigo (prod→dev no
# mesmo container) foram eliminados — cada célula é independente.
#
# Independência PRESERVADA: o step do dev roda com `if: always()` — um PR
# que quebre o seed de dev é detectado MESMO se o prod E2E falhar antes
# (mesmo comportamento do antigo job seed-dev-e2e dedicado, sem o custo de
# um container + imagem + bun install extras). SKIP_DB_PUSH no dev é
# condicional ao sucesso do prod: se o prod fez o push, o dev pula (~9s);
# se o prod falhou antes do push, o dev faz o próprio push (robustez).
#
# Otimizações de CI aplicadas:
#   - vars.POSTGIS_IMAGE (default alpine; mire no GHCR com
#     sync-postgis-mirror.yml para pull mais rápido + sem rate limit Docker Hub)
#   - Cache do Prisma client keyed no schema.prisma + bun.lock →
#     SKIP_PRISMA_GENERATE=1 em cache hit (pula o generate, ~6s)
#   - A matrix compartilha o cache do Prisma client entre as 4 combinações
#     (mesma key em todas — em runs subsequentes, todas pulam o generate)
#
# Centralizado aqui (em vez de duplicado) para que PR check e cron semanal
# validem SEMPRE a mesma definição — sem drift entre os dois contextos.
#
# Chamado por:
#   - pr-check.yml          (a cada pull request)
#   - benchmark-weekly.yml  (cron semanal — revalida contra banco efêmero)
# =============================================================================

name: Seed Guards E2E (reusable)

on:
  workflow_call:

jobs:
  seed-guards:
    name: Seed E2E ${{ matrix.seed }} · ${{ matrix.variant }}
    runs-on: self-hosted
    timeout-minutes: 30

    # ── MATRIX 2×2: seed (prod/dev) × imagem (alpine/full) ──────────
    # Consolida os DOIS E2Es de seed (prod + dev) em uma matrix que também
    # varia a imagem do PostGIS — cada célula roda UM E2E contra UMA imagem,
    # com SEU próprio service container (4 combinações independentes):
    #   prod×alpine, prod×full, dev×alpine, dev×full
    # Objetivo: validar a compatibilidade de AMBAS as variantes da imagem em
    # PRs (não só em cron/deploy). O full é a MESMA imagem que o deploy.yml
    # usa; o alpine é o default mais leve (~154 MiB).
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: prod
            variant: alpine
          - seed: prod
            variant: full
          - seed: dev
            variant: alpine
          - seed: dev
            variant: full

    # ── Ephemeral PostGIS service container (UM por combinação) ─────
    # Imagem resolvida por matrix.variant: alpine usa vars.POSTGIS_IMAGE
    # (fallback Docker Hub; aponte para o mirror GHCR com
    # sync-postgis-mirror.yml), full usa a imagem oficial postgis/postgis:16-3.4
    # (a MESMA que o deploy.yml usa — compatibilidade garantida com prod).
    services:
      postgres:
        image: ${{ matrix.variant == 'full' && 'postgis/postgis:16-3.4' || (vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine') }}
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v7

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      # ── Cache do Prisma client (keyed no schema + versão do client) ──
      # Em cache hit, os E2Es rodam com SKIP_PRISMA_GENERATE=1 (o .sh pula
      # o generate, que é determinístico dado o schema) — economia ~6s.
      # restore-keys nunca dispara o skip: o cache-hit só é 'true' com key
      # exata, então um restore parcial roda o generate.
      - name: Cache Prisma client
        id: prisma-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: prisma-${{ vars.BUN_VERSION }}-${{ hashFiles('prisma/schema.prisma') }}-${{ hashFiles('bun.lock') }}
          restore-keys: prisma-${{ vars.BUN_VERSION }}-

      # ── PostGIS extension no service container ──────────────────────
      # A imagem postgis só habilita a extensão em postgres/template_postgis,
      # NÃO no POSTGRES_DB (criado de template1) — sem ela o prisma db push
      # falha nas colunas Unsupported("geography(Point, 4326)"). Não dá para
      # usar init-script montado aqui: o service container inicia ANTES do
      # checkout (workspace vazio) — por isso o docker exec explícito.
      - name: Enable PostGIS extension
        run: |
          # O docker-postgis (alpine E full) carrega a extensão no POSTGRES_DB
          # DEPOIS do servidor aceitar conexões ('Loading PostGIS extensions
          # into severinno') — o healthcheck passa antes. Um CREATE EXTENSION
          # IF NOT EXISTS nesse momento RACEIA com o load da imagem e falha
          # esporadicamente com duplicate key pg_extension_name_index.
          # Solução: poll até a extensão aparecer (a imagem SEMPRE carrega),
          # com fallback de criação (IF NOT EXISTS + re-verificação).
          POSTGIS_READY=0
          for _ in $(seq 1 30); do
            if grep -qx 1 <<< "$(docker exec ${{ job.services.postgres.id }} psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null)"; then
              POSTGIS_READY=1
              break
            fi
            sleep 1
          done
          if [ "$POSTGIS_READY" != "1" ]; then
            docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -c "CREATE EXTENSION IF NOT EXISTS postgis" >/dev/null 2>&1 || true
            if ! grep -qx 1 <<< "$(docker exec ${{ job.services.postgres.id }} psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null)"; then
              echo "❌ postgis não disponível após espera/fallback"
              exit 1
            fi
          fi
          echo "✅ postgis disponível"

      # ── E2E da célula (prod ou dev) ─────────────────────────────────
      # Cada célula roda UM E2E em um container EXCLUSIVO da combinação
      # (banco limpo próprio — o prod asserta ZERO usuários; o dev faz
      # wipe+recreate). Sem acoplamento nem ordem entre células.
      # O .sh com --skip-docker faz: prisma generate (se cache miss) +
      # db push (schema) + validator (prod: 127 checks; dev: 161 checks).
      - name: Run seed-${{ matrix.seed }} E2E
        id: e2e
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
          SKIP_PRISMA_GENERATE: ${{ steps.prisma-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          if [ "${{ matrix.seed }}" = "prod" ]; then
            bun run test:seed-prod-e2e --skip-docker
            echo "  ✅ Seed prod E2E passou (127 checks)"
          else
            bun run test:seed-dev-e2e --skip-docker
            echo "  ✅ Seed dev E2E passou (161 checks)"
          fi

      # ── Publish summary ─────────────────────────────────────────────
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🛡️ Seed Guards E2E'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Seed | ${{ matrix.seed }} |"
            echo "| Variante imagem | ${{ matrix.variant }} |"
            echo "| E2E (${{ matrix.seed == 'prod' && '127' || '161' }} checks) | ${{ steps.e2e.conclusion == 'success' && '✅' || '❌' }} |"
            echo "| Imagem PostGIS | ${{ matrix.variant == 'full' && 'postgis/postgis:16-3.4' || (vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine') }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── MUTATION TEST — o guard do seed dev pega regressões? ─────────────
  # Introduz um bug CONHECIDO no prisma/seed.ts (muta o email do admin),
  # roda o seed-dev E2E e exige que ele FALHE pela asserção certa:
  #   ❌ 'admin@severinno.com' existe com role ADMIN
  # Se o E2E PASSAR com o seed mutado (exit 0), o guard está CEGO — uma
  # asserção foi removida/enfraquecida em scripts/test-seed-dev-e2e.ts — e
  # o job falha. Script: scripts/test-mutation-seed-dev-e2e.sh (restaura o
  # seed via backup em trap, nunca git checkout).
  mutation-seed-dev-e2e:
    name: Mutation Test (seed dev E2E pega regressões?)
    runs-on: self-hosted
    timeout-minutes: 30

    services:
      postgres:
        image: ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine' }}
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v7

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Cache Prisma client
        id: prisma-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: prisma-${{ vars.BUN_VERSION }}-${{ hashFiles('prisma/schema.prisma') }}-${{ hashFiles('bun.lock') }}
          restore-keys: prisma-${{ vars.BUN_VERSION }}-

      - name: Enable PostGIS extension
        run: |
          # O docker-postgis (alpine E full) carrega a extensão no POSTGRES_DB
          # DEPOIS do servidor aceitar conexões ('Loading PostGIS extensions
          # into severinno') — o healthcheck passa antes. Um CREATE EXTENSION
          # IF NOT EXISTS nesse momento RACEIA com o load da imagem e falha
          # esporadicamente com duplicate key pg_extension_name_index.
          # Solução: poll até a extensão aparecer (a imagem SEMPRE carrega),
          # com fallback de criação (IF NOT EXISTS + re-verificação).
          POSTGIS_READY=0
          for _ in $(seq 1 30); do
            if grep -qx 1 <<< "$(docker exec ${{ job.services.postgres.id }} psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null)"; then
              POSTGIS_READY=1
              break
            fi
            sleep 1
          done
          if [ "$POSTGIS_READY" != "1" ]; then
            docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -c "CREATE EXTENSION IF NOT EXISTS postgis" >/dev/null 2>&1 || true
            if ! grep -qx 1 <<< "$(docker exec ${{ job.services.postgres.id }} psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null)"; then
              echo "❌ postgis não disponível após espera/fallback"
              exit 1
            fi
          fi
          echo "✅ postgis disponível"

      # ── Mutation test ──────────────────────────────────────────────
      # O script muta prisma/seed.ts (sed), roda o E2E contra o seed
      # mutado e valida que ele FALHA pela asserção esperada. O seed é
      # restaurado do backup em trap (o working tree do runner volta limpo).
      - name: Run mutation test (seed dev E2E deve FALHAR)
        id: mutation
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
          SKIP_PRISMA_GENERATE: ${{ steps.prisma-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          bun run test:mutation-seed-dev-e2e --skip-docker
          echo "  ✅ Mutation test passou — o guard detectou a mutação"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🧬 Mutation Test — seed dev E2E'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Mutação detectada | ${{ steps.mutation.conclusion == 'success' && '✅ guard saudável' || '❌ guard CEGO' }} |"
            echo "| Imagem PostGIS | ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine (default)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── MUTATION TEST — contrato de atualização COORDENADA dos counts ──
  # Prova que o seed-e2e-count.test.ts E o guard estático (check-e2e-counts)
  # pegam o cenário exato do bug histórico no TRIÂNGULO doc↔anchor↔código:
  #   (A) atualizar SÓ os comentários dos workflows (128→N) sem tocar a
  #       âncora do teste → teste E guard falham pelo piso de sites;
  #   (B) mutar SÓ a âncora do teste (.toBe(128)→.toBe(129)) sem tocar a
  #       doc dos workflows → teste falha pela sanidade, guard PASSA (doc
  #       íntegra — causa isolada);
  #   (C) mutar a DERIVAÇÃO de verdade (comenta a 1ª asserção real do
  #       scripts/test-seed-prod-e2e.ts → prod cai 128→127) com doc E âncora
  #       INTACTAS → teste falha com 'cada count documentado bate' E guard
  #       falha por DIVERGÊNCIA de count;
  #   (D) PROVA DE INDEPENDÊNCIA: doc 128→N + piso do guard NEUTRALIZADO
  #       (MIN_DOCUMENTED_SITES prod:8→0 via sed no check-e2e-counts.mjs) →
  #       o guard fica CEGO (exit 0 — sem piso e sem sites de prod para
  #       divergir) mas o vitest CONTINUA falhando ('piso prod violado' — o
  #       piso do TESTE é próprio, não herdado do guard): o teste de
  #       integração não depende do guard para pegar a regressão da doc;
  #   (E) ESPELHO DEV: mutar SÓ a doc de dev (162→N: "161 checks" → "N
  #       checks" + ternary '162' → 'N') com a doc de prod ("127 checks")
  #       E a âncora dev (.toBe(162)) INTACTAS → teste falha com 'piso dev
  #       violado' (hardcoded ≥ 6 no seed-e2e-count.test.ts) E guard falha
  #       pelo piso de sites (dev 0 < 6) — o contrato vale para AMBOS os
  #       counts, não só prod.
  # O script muta os SCAN_FILES (pr-check.yml, seed-guards.yml,
  # validate-seed-guards-matrix-local.sh), o TEST_FILE e o DERIVATION_FILE
  # IN-PLACE no working tree (é assim que o teste de integração lê os
  # arquivos via process.cwd() — uma cópia em temp quebraria a premissa) com
  # backup + trap EXIT de restauração. OS 2 ELOS da cadeia rodam no mesmo
  # script em cada cenário: o guard estático FALHA em A (piso por alvo
  # violado, prod) e em E (piso por alvo violado, dev), FALHA em C (count
  # divergente), PASSA em B (doc íntegra) e fica CEGO em D (piso
  # neutralizado — a prova de independência do teste). Roda
  # vitest REAL (precisa de node_modules) — por isso NÃO vai na matriz
  # node-pura do master mutation-guards; este job com bun install é o home
  # do contrato. Sem postgis: o teste é unitário (só derivação + leitura dos
  # SCAN_FILES), não toca banco.
  # ⚠️ O `name:` ABAIXO NÃO CARREGA O COUNT — DE PROPÓSITO.
  # O nome de um job é o CONTEXTO do status check, e este é required check em
  # `ci/required-checks.json`. O nome dizia "..., 5 cenários" e o contrato
  # coordenado GANHA UM CENÁRIO POR RELEASE: cada cenário novo reescrevia o
  # contexto protegido, a proteção da forja passava a exigir um check que não
  # existe e o PR travava — sem nenhuma linha de gate parecer errada. A
  # contagem continua no NOME DO STEP ("— 5 cenários, 2 elos"), onde é
  # diagnóstico, e o `check-required-checks` recusa um número que volte para cá.
  mutation-coord-update:
    name: Mutation Test (contrato coordenado — doc↔anchor↔código)
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      # ── Mutation test ──────────────────────────────────────────────
      # O script muta a doc dos workflows (A: 128→N), a âncora do teste
      # (B: .toBe(128)→.toBe(129)), a derivação do código (C: comenta a 1ª  #      asserção real do test-seed-prod-e2e.ts → 128→127), ainda neutraliza
      #      o piso do guard (D: MIN_DOCUMENTED_SITES prod:8→0) e espelha a
      #      mutação da doc para o DEV (E: 162→N) em in-place com backup + trap,
      #      roda o vitest real no seed-e2e-count.test.ts E o guard estático
      #      (check-e2e-counts) e exige que eles FALHEM pelo piso (A, 2 elos),
      #      pela sanidade (B, guard passa — doc íntegra), pela divergência
      #      (C, 2 elos), pela independência (D: guard cego, teste segue
      #      falhando) e pelo piso de DEV (E, 2 elos) — se qualquer um passar
      #      com a mutação, o contrato não está enforced e o job falha.
      - name: Run mutation test (contrato coordenado — 5 cenários, 2 elos)
        id: mutation
        run: |
          bun run test:mutation-coord-update
          echo "  ✅ Mutation test passou — o contrato de atualização coordenada está enforced (doc↔anchor↔código + independência + dev)"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🧬 Mutation Test — contrato de atualização coordenada (counts)'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Doc 128→N (A) detectada pelo teste | ${{ steps.mutation.conclusion == 'success' && '✅ contrato enforced' || '❌ guard CEGO' }} |"
            echo "| Anchor 128→129 (B) detectada pelo teste | ${{ steps.mutation.conclusion == 'success' && '✅ contrato enforced' || '❌ guard CEGO' }} |"
            echo "| Derivação 128→127 (C) detectada pelo teste | ${{ steps.mutation.conclusion == 'success' && '✅ contrato enforced' || '❌ guard CEGO' }} |"
            echo "| Independência (D): piso do guard neutralizado, teste segue pegando a doc | ${{ steps.mutation.conclusion == 'success' && '✅ teste independente do guard' || '❌ guard CEGO' }} |"
            echo "| Doc dev 162→N (E) detectada pelo teste | ${{ steps.mutation.conclusion == 'success' && '✅ contrato enforced p/ prod E dev' || '❌ guard CEGO' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── MUTATION TEST — espelhos do doctor (comparação de VALOR) ────────
  # Prova que o forge-doctor.test.ts PEGA a regressão exata de remover a
  # comparação de VALOR dos espelhos (.actrc, deploy/env.gitea.example e o
  # .env.gitea do host) contra as repository variables: sem ela, dois
  # espelhos que concordam ENTRE SI mas estão os DOIS velhos passam por
  # "em sincronia" e o fast path de 0s do tier-1 desliga em silêncio.
  #
  # O script muta scripts/forge-doctor.mjs IN-PLACE (backup + trap de
  # restauração), roda o vitest REAL do forge-doctor.test.ts e lê o JSON do
  # reporter (--reporter=json) para decidir com FATO: o controle fica verde;
  # a mutação exige o teste do valor DECLARADO FAILING e o de EXISTÊNCIA
  # PASSING (mutação cirúrgica: só a comparação morreu). Roda vitest REAL
  # (precisa de node_modules) — por isso NÃO vai na matriz node-pura do
  # master mutation-guards; este job com bun install é o home. Sem postgis:
  # o teste é unitário (lê arquivos, não toca banco).
  mutation-doctor-mirrors:
    name: Mutation Test (espelhos do doctor — comparação de valor)
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      # ── Mutation test ──────────────────────────────────────────────
      # O script muta a linha da régua da comparação em scripts/forge-doctor.mjs
      # (IN-PLACE, backup + trap), roda o vitest real no forge-doctor.test.ts e
      # exige a suíte VERMELHA com a asserção do valor FAILING e a de existência
      # PASSING — se a suíte passar com a mutação, o job falha (regressão
      # silenciosa).
      - name: Run mutation test (espelhos do doctor — comparação de valor)
        id: mutation
        run: |
          bun run test:mutation-doctor-mirrors
          echo "  ✅ Mutation test passou — a suíte pega a remoção da comparação de valor dos espelhos"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🧬 Mutation Test — espelhos do doctor (comparação de valor)'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Controle: doctor íntegro → suíte verde | ${{ steps.mutation.conclusion == 'success' && '✅ teste-âncora existe e passa' || '❌ controle falhou' }} |"
            echo "| Mutação: comparação removida → suíte vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| Cirúrgica: caminho de existência segue verde | ${{ steps.mutation.conclusion == 'success' && '✅ só a comparação morreu' || '❌ falha não isolada' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── OS CINCO FIOS do veredito do doctor ───────────────────────────
  # O doctor não mede os fatos da forja: ele os TRANSPORTA para o veredito —
  # cada seção termina no mesmo `blockers.push(...)` (o que faz o veredito ser
  # BLOQUEADA), um fato não provado empurra para `unknowns` (o que impede o
  # veredito de ser PRONTA), `unproven` declara o que o doctor NÃO cobre e
  # `channelEnv` decide de ONDE cada consulta tira o repositório.
  # Cortar qualquer um dos cinco é silencioso: o doctor continua rodando,
  # continua imprimindo todas as seções — e passa a dizer PRONTA com a forja
  # quebrada (A), PRONTA sobre o que não conseguiu medir (B), deixa de dizer
  # onde a pergunta ficou aberta (C), consulta o repositório do CONTEXTO
  # COMPARTILHADO da forja emulada (D — no runner da Gitea, o repositório da
  # Gitea: o veredito sai completo, e assinado pelo repositório errado) ou
  # confunde a fila VAZIA com a forja PARADA (E — a ORDEM da derivação, na folha
  # da fila: sem ela, o item mais comum de todos, a fila vazia de todo dia, passa
  # a abrir BLOQUEIO).
  #
  # O script muta cada fio (IN-PLACE, backup + trap de restauração, TAMBÉM em
  # TERM/INT) e exige, para CADA um, a suíte VERMELHA pela âncora de CADA FATO
  # (16 violações, 15 não-provados, 10 limites, 6 consultas e 3 âncoras da folha
  # da fila, respectivamente) e as âncoras CIRÚRGICAS seguindo PASSING (o caminho
  # SAUDÁVEL segue PRONTA; o da violação segue bloqueando) — se a suíte passar, o
  # job falha (o veredito teria perdido a autoridade).
  #
  # A CONTAGEM VIVA de cada fio (e o total de âncoras) é a do CONTROLE do
  # script — a fonte é `scripts/test-mutation-doctor-facts.sh`, e o job imprime
  # o resumo dele no log. Os números desta prosa são cópia dela.
  mutation-doctor-facts:
    # ⚠️ O `name:` é um CONTEXTO DE REQUIRED CHECK (registrado em
    # ci/required-checks-applied.json): ele NÃO carrega os fios, de propósito —
    # renomeá-lo exige declarar e REAPLICAR a branch protection na forja (é a
    # mesma classe do count no nome que este repositório já pagou uma vez). Os
    # fios são CINCO desde a ORDEM da derivação da fila (E); o nome fica, e a
    # contagem viva está no controle do script.
    name: Mutation Test (os três fios do veredito do doctor)
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run mutation test (os cinco fios do veredito do doctor)
        id: mutation
        run: |
          bun run test:mutation-doctor-facts
          echo "  ✅ Mutation test passou — a suíte pega o corte dos cinco fios do veredito"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🧬 Mutation Test — os cinco fios do veredito do doctor'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Controle: doctor íntegro → suíte verde (59 âncoras: fatos, não-provados, limites, consultas e a folha da fila) | ${{ steps.mutation.conclusion == 'success' && '✅ cada fato tem a sua testemunha' || '❌ controle falhou' }} |"
            echo "| A. violação→bloqueio cortado (16 fatos) → suíte vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| B. o veredito deixa de declarar o não-provado (15 fatos) → vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| C. o relatório deixa de declarar o que NÃO cobre (10 limites) → vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| D. o contexto compartilhado volta a resolver o repo (6 consultas) → vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| E. a fila vazia deixa de ser medida antes do puxador (3 âncoras da folha) → vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| Cirúrgica: caminho saudável segue PRONTA e a violação segue bloqueando | ${{ steps.mutation.conclusion == 'success' && '✅ só o fio nomeado morreu' || '❌ falha não isolada' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── MUTATION TEST — as TRÊS REGRAS do contrato de gates CORE ──────────
  # O doctor responde "o que o manifesto EXIGE é CORE e roda o comando
  # certo?", e essa pergunta tem três regras — cada uma com a sua regressão
  # silenciosa: (A) a FORJA DECLARANTE (um contrato só é conferido contra as
  # forjas que DECLARAM aquele job; sem o recorte, um job que só o GitHub exige
  # vira violação da Gitea — falso positivo, que ensina o operador a ignorar o
  # veredito); (B) a RÉGUA da invariante (`expectedCommand: inv.matches`, o
  # MESMO comando nas duas forjas; enfraquecida, o merge volta a ser liberado
  # pelo lado laxo — a assimetria que este repositório já pagou uma vez);
  # (C) o CONTRATO por invariante×job (a chave `${inv.id}|${jid}`; por job,
  # as SEIS invariantes que compartilham o `guards` da Gitea saem da lista e
  # passam a "cobertas" sem terem sido medidas).
  #
  # O script muta UMA regra por vez IN-PLACE (backup + trap de restauração) e
  # exige, para cada uma, a suíte VERMELHA pela âncora da PRÓPRIA REGRA e as
  # âncoras INTACTAS PASSING (a outra regra do mesmo fato e o veredito seguem
  # medindo), com o total de testes do controle conferido — um arquivo que não
  # roda inteiro é infra, não detecção. Roda vitest REAL (precisa de
  # node_modules) — por isso NÃO vai na matriz node-pura do master.
  mutation-gate-contracts:
    name: Mutation Test (as três regras do contrato de gates CORE)
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run mutation test (as três regras do contrato de gates CORE)
        id: mutation
        run: |
          bun run test:mutation-gate-contracts
          echo "  ✅ Mutation test passou — cada regra do contrato de gates CORE tem testemunha na suíte"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🧬 Mutation Test — as três regras do contrato de gates CORE'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Controle: doctor íntegro → suíte verde (20 âncoras: 1 teste cada) | ${{ steps.mutation.conclusion == 'success' && '✅ cada regra tem a sua testemunha' || '❌ controle falhou' }} |"
            echo "| A. a FORJA DECLARANTE (recorte do job exigido por uma forja só) → vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| B. a RÉGUA da invariante (qualquer comando satisfaz) → vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| C. o CONTRATO por invariante×job (a chave volta a ser o job) → vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| Cirúrgica: a outra regra e o veredito seguem medindo | ${{ steps.mutation.conclusion == 'success' && '✅ só a regra nomeada morreu' || '❌ falha não isolada' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── MUTATION TEST — as TRÊS metades da comparação do perfil `--ci` ────
  # O job de PR das DUAS forjas roda o `check-doctor-ci.mjs`, e a pergunta
  # dele é UMA: o VALOR das repository variables continua o que o repositório
  # declara? Essa comparação tem três metades, e cada uma degrada em SILÊNCIO:
  # (1) a régua que o gate entrega (as flags `--expected`/`--expected-var`) —
  # sem ela o doctor cai no ramo "não comparado" e segue verde; (2) o critério
  # do "não comparado" (`unproven`, no `mirrorDriftReport` — a função
  # COMPARTILHADA com o guard semanal e o publicador de issue) — sem ele o
  # relatório para de dizer o que não foi comparado e "não medi" parece "está
  # certo"; (3) a própria função compartilhada, trocada por uma versão local que
  # devolve "sem drift" — o doctor diz que comparou e não compara.
  #
  # O script muta cada metade IN-PLACE (backup + trap de restauração nos TRÊS
  # arquivos: gate, check-actrc-sync.mjs e forge-doctor.mjs) e exige, para cada
  # uma, DUAS testemunhas: a SUÍTE (do gate para a metade 1, do doctor para as
  # metades 2 e 3) VERMELHA com as âncoras da metade FAILING e as cirúrgicas
  # PASSING — cada âncora casando exatamente um teste e o total de testes do
  # controle conferido; e o JOB, pela linha `run:` que cada forja de fato roda
  # (job `guards` da forja e job `doctor-mirrors-guard` do GitHub) executada nos
  # três modos (declarado, ERRADO e PARCIAL). Com a metade 1 removida o job de
  # cada forja CONTINUA VERMELHO (a segunda régua bloqueia e a remoção fica
  # visível no relatório); com a metade 2 o veredito fica intacto e o naming do
  # "não comparado" SOME (silêncio MEDIDO); com a metade 3 a régua CHEGA
  # (`▸ comparados com vars.…`) e o bloqueio NÃO sai. Nenhuma metade passa em
  # silêncio; nenhuma abre buraco no merge. Roda vitest REAL (precisa de
  # node_modules) — por isso NÃO vai na matriz node-pura do master
  # mutation-guards.
  mutation-doctor-ci:
    name: Mutation Test (perfil --ci do doctor — as 3 metades da comparação)
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run mutation test (perfil --ci do doctor — a régua do gate)
        id: mutation
        run: |
          bun run test:mutation-doctor-ci
          echo "  ✅ Mutation test passou — as 3 metades da comparação têm testemunha na suíte, e o job de PR de cada forja continua vermelho"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🧬 Mutation Test — perfil --ci do doctor (as 3 metades da comparação)'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Controle: suítes íntegras → verdes | ${{ steps.mutation.conclusion == 'success' && '✅ âncoras vivos (1 teste cada)' || '❌ controle falhou' }} |"
            echo "| Controle: valor certo → 0 · ERRADO → ≠ 0 · PARCIAL → 0 + naming | ${{ steps.mutation.conclusion == 'success' && '✅ cada forja bloqueia o valor' || '❌ não bloqueia o valor' }} |"
            echo "| Mutação 1: a régua do gate removida → suíte vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| Mutação 2: o critério do 'não comparado' removido → suíte vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ silêncio medido + testemunha' || '❌ passou em silêncio' }} |"
            echo "| Mutação 3: a função compartilhada trocada → suíte vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ a régua chega e não compara' || '❌ passou em silêncio' }} |"
            echo "| Mutação: job de PR de cada forja AINDA vermelho | ${{ steps.mutation.conclusion == 'success' && '✅ sem buraco no merge' || '❌ buraco aberto' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── AS QUATRO DEFESAS do reconciliador de env (check-env-mirror) ──────
  # O `check-env-mirror.mjs` reconcilia o env do host com o template comitado,
  # e as quatro defesas que ele tem contra fazer isso ERRADO não são o mesmo
  # fio: (A) o PORTÃO DA CONTA — reaplica o plano em memória e recusa escrever
  # quando sobra violação que ele não explicou (escrever seria APAGAR a dúvida);
  # (B) a DEFESA DO SEGREDO — recusa qualquer plano que inclua um nome de
  # `SECRET_ENV_VARIABLES` (o único valor que o host receberia é o PLACEHOLDER
  # comitado); (C) `maskSecrets` — o valor REAL de um segredo que caia no
  # CONTEXTO do diff sai mascarado, para o patch não o levar ao terminal/PR;
  # (D) o SEGREDO AUSENTE vira decisão HUMANA, nunca `add` com o valor do
  # template (que, num segredo, é o placeholder).
  #
  # Nenhuma delas muda o exit code do caso comum — quem as mede são a suíte e o
  # `--fix`. Por isso o script muta UMA defesa por vez (IN-PLACE, backup + trap
  # de restauração) e exige, para CADA uma, a suíte VERMELHA pela âncora da SUA
  # prova e as âncoras INTACTAS PASSING (as outras três defesas e o caminho
  # saudável seguem de pé) — sem isso, o que caiu poderia ser o comando inteiro
  # em vez da defesa nomeada. Exige também o total de testes do controle: um
  # arquivo que não roda inteiro é infra, não detecção.
  mutation-env-mirror:
    name: Mutation Test (defesas do check-env-mirror)
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run mutation test (defesas do check-env-mirror)
        id: mutation
        run: |
          bun run test:mutation-env-mirror
          echo "  ✅ Mutation test passou — as quatro defesas do check-env-mirror têm testemunha na suíte"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🧬 Mutation Test — as quatro defesas do check-env-mirror'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Controle: guard íntegro → suíte verde (13 âncoras vivas) | ${{ steps.mutation.conclusion == 'success' && '✅ cada defesa tem a sua testemunha' || '❌ controle falhou' }} |"
            echo "| A. portão da conta no-op → suíte vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| B. defesa do segredo no-op → suíte vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| C. maskSecrets no-op → suíte vermelha (unidade + ponta) | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| D. segredo ausente vira add → suíte vermelha | ${{ steps.mutation.conclusion == 'success' && '✅ regressão detectada' || '❌ suíte CEGA' }} |"
            echo "| Cirúrgicas: as OUTRAS defesas e o caminho saudável seguem de pé | ${{ steps.mutation.conclusion == 'success' && '✅ só a defesa nomeada morreu' || '❌ falha não isolada' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── PROD E2E — variante dev-env (override PROD_SEED_ALLOW_DEV=1) ────
  # Cobre o cenário que o CI de PRODUÇÃO NÃO exercita: o seed-prod rodando
  # FORA de produção com o override explícito (PROD_SEED_ALLOW_DEV=1) — o
  # fluxo documentado no header do prisma/seed-prod.ts para validar contra
  # um banco efêmero em dev/CI.
  #
  # Diferença vs. o job seed-guards acima: lá o override é SIMULADO
  # internamente pelo runSeed() do E2E (que remove a env herdada por chamada
  # para manter o guard honesto). Aqui o override está presente no AMBIENTE
  # do job, validando que:
  #   1. isProdSeedAllowed(development, "1") permite (o override funciona);
  #   2. O E2E permanece honesto MESMO com a env presente (runSeed a remove
  #      no teste de recusa — o guard não é mascarado pela env do job);
  #   3. O comando documentado de dev funciona end-to-end:
  #      PROD_SEED_ALLOW_DEV=1 NODE_ENV=development bun run db:seed:prod
  #
  # Container PRÓPRIO (não reusa o do job seed-guards): o prod E2E exige
  # banco LIMPO (asserta ZERO usuários + counts canônicos) e o dev E2E faz
  # wipe+recreate com usuários demo — compartilhar o container quebraria as
  # asserções do prod E2E.
  seed-prod-e2e-dev-env:
    name: Seed Prod E2E (dev-env override)
    runs-on: self-hosted
    timeout-minutes: 30

    services:
      postgres:
        image: ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine' }}
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v7

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Cache Prisma client
        id: prisma-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: prisma-${{ vars.BUN_VERSION }}-${{ hashFiles('prisma/schema.prisma') }}-${{ hashFiles('bun.lock') }}
          restore-keys: prisma-${{ vars.BUN_VERSION }}-

      - name: Enable PostGIS extension
        run: |
          # O docker-postgis (alpine E full) carrega a extensão no POSTGRES_DB
          # DEPOIS do servidor aceitar conexões ('Loading PostGIS extensions
          # into severinno') — o healthcheck passa antes. Um CREATE EXTENSION
          # IF NOT EXISTS nesse momento RACEIA com o load da imagem e falha
          # esporadicamente com duplicate key pg_extension_name_index.
          # Solução: poll até a extensão aparecer (a imagem SEMPRE carrega),
          # com fallback de criação (IF NOT EXISTS + re-verificação).
          POSTGIS_READY=0
          for _ in $(seq 1 30); do
            if grep -qx 1 <<< "$(docker exec ${{ job.services.postgres.id }} psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null)"; then
              POSTGIS_READY=1
              break
            fi
            sleep 1
          done
          if [ "$POSTGIS_READY" != "1" ]; then
            docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -c "CREATE EXTENSION IF NOT EXISTS postgis" >/dev/null 2>&1 || true
            if ! grep -qx 1 <<< "$(docker exec ${{ job.services.postgres.id }} psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null)"; then
              echo "❌ postgis não disponível após espera/fallback"
              exit 1
            fi
          fi
          echo "✅ postgis disponível"

      # ── Prod E2E com override no AMBIENTE (não só simulado) ──────────
      # PROD_SEED_ALLOW_DEV=1 presente no env do step → o E2E roda no fluxo
      # de dev/CI. O guard de recusa continua honesto: runSeed() remove a env
      # herdada antes de cada chamada (higiene de env do E2E).
      - name: Run seed-prod E2E (override no env do job)
        id: e2e
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
          NODE_ENV: development
          PROD_SEED_ALLOW_DEV: "1"
          SKIP_PRISMA_GENERATE: ${{ steps.prisma-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          bun run test:seed-prod-e2e --skip-docker
          echo "  ✅ Seed prod E2E (dev-env) passou — 127 checks"

      # ── Smoke do fluxo documentado de override ────────────────────────
      # O comando EXATO que um dev roda contra banco efêmero em dev
      # (documentado no header do prisma/seed-prod.ts):
      #   PROD_SEED_ALLOW_DEV=1 NODE_ENV=development bun run db:seed:prod
      # Valida que o script do package.json + a env var do job fluem até o
      # guard isProdSeedAllowed() e o seed conclui (exit 0 + confirmação).
      - name: Smoke — db:seed:prod com override (dev)
        id: smoke
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
          NODE_ENV: development
          PROD_SEED_ALLOW_DEV: "1"
        run: |
          OUT=$(bun run db:seed:prod 2>&1)
          echo "$OUT"
          if ! grep -q "Seed de produção concluído" <<< "$OUT"; then
            echo "❌ db:seed:prod não concluiu com override — veja output acima"
            exit 1
          fi
          echo "  ✅ Override flow validado (exit 0 + confirmação final)"

      # ── Publish summary ─────────────────────────────────────────────
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🛡️ Seed Prod E2E — dev-env (override PROD_SEED_ALLOW_DEV=1)'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Prod E2E (127 checks, override no env) | ${{ steps.e2e.conclusion == 'success' && '✅' || '❌' }} |"
            echo "| Smoke db:seed:prod com override | ${{ steps.smoke.conclusion == 'success' && '✅' || '❌' }} |"
            echo "| Imagem PostGIS | ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine (default)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── CATEGORY RENAME MIGRATION E2E ───────────────────────────────────────
  # Prova que a migração SEGURA de renomeação de categoria
  # (scripts/migrate-category-rename.mjs) continua funcionando contra o
  # PostGIS real: guards de recusa (fora de prod + --from inexistente),
  # dry-run sem escrita, renomeação de pai com filhos, subcategoria com
  # services, re-run recusado, colisão de slug e consistência da árvore
  # com o seed-data. Container PRÓPRIO (o .sh faz generate + push + seed
  # dev + validator; --skip-docker usa o service container do job).
  migrate-category-rename-e2e:
    name: Migrate Category Rename E2E
    runs-on: self-hosted
    timeout-minutes: 30

    services:
      postgres:
        image: ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine' }}
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v7

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Cache Prisma client
        id: prisma-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: prisma-${{ vars.BUN_VERSION }}-${{ hashFiles('prisma/schema.prisma') }}-${{ hashFiles('bun.lock') }}
          restore-keys: prisma-${{ vars.BUN_VERSION }}-

      - name: Enable PostGIS extension
        run: |
          # O docker-postgis (alpine E full) carrega a extensão no POSTGRES_DB
          # DEPOIS do servidor aceitar conexões ('Loading PostGIS extensions
          # into severinno') — o healthcheck passa antes. Um CREATE EXTENSION
          # IF NOT EXISTS nesse momento RACEIA com o load da imagem e falha
          # esporadicamente com duplicate key pg_extension_name_index.
          # Solução: poll até a extensão aparecer (a imagem SEMPRE carrega),
          # com fallback de criação (IF NOT EXISTS + re-verificação).
          POSTGIS_READY=0
          for _ in $(seq 1 30); do
            if grep -qx 1 <<< "$(docker exec ${{ job.services.postgres.id }} psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null)"; then
              POSTGIS_READY=1
              break
            fi
            sleep 1
          done
          if [ "$POSTGIS_READY" != "1" ]; then
            docker exec ${{ job.services.postgres.id }} \
              psql -U severinno -d severinno -c "CREATE EXTENSION IF NOT EXISTS postgis" >/dev/null 2>&1 || true
            if ! grep -qx 1 <<< "$(docker exec ${{ job.services.postgres.id }} psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null)"; then
              echo "❌ postgis não disponível após espera/fallback"
              exit 1
            fi
          fi
          echo "✅ postgis disponível"

      # ── Run migrate rename E2E ──────────────────────────────────────
      # O .sh com --skip-docker faz: prisma generate (se cache miss) +
      # db push + seed dev + validator (8 cenários de renomeação).
      - name: Run migrate category rename E2E
        id: e2e
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
          SKIP_PRISMA_GENERATE: ${{ steps.prisma-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          bun run test:migrate-category-rename-e2e --skip-docker
          echo "  ✅ Migrate category rename E2E passou"

      # ── Publish summary ─────────────────────────────────────────────
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🔄 Migrate Category Rename E2E'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Migrate rename E2E | ${{ steps.e2e.conclusion == 'success' && '✅' || '❌' }} |"
            echo "| Imagem PostGIS | ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine (default)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
