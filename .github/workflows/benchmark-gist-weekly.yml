# =============================================================================
# Benchmark GiST Weekly — Severinno Marketplace
#
# Runs the GiST Index vs Full-Scan benchmark (scripts/geo-benchmark-gist.mjs)
# weekly against the staging database, records results, and validates that
# the GiST crossover radius has not shifted significantly.
#
# The crossover radius is the smallest search radius at which a GiST DWithin
# query becomes faster than a full table scan.  A significant drift in this
# value indicates a change in index performance, PostGIS configuration, or
# hardware — all of which should be investigated.
#
# Security:
#   - Never exposes staging credentials in logs
#   - Temp tables are dropped after each benchmark tier
#   - Only commits benchmark JSON files
# =============================================================================

name: Benchmark GiST Weekly

on:
  schedule:
    # Every Monday at 04:00 UTC (offset from the real benchmark on Sunday)
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      threshold-steps:
        description: "Max crossover radius step drift (default: 2)"
        required: false
        default: 2
        type: number
      ratio-drift:
        description: "Max best-ratio drift in pp (default: 25)"
        required: false
        default: 25
        type: number
      providers:
        description: "Custom provider count (optional, default: 1000,5000,10000)"
        required: false
        default: ""
        type: string
      radii:
        description: "Custom radius list in km (optional, default: 1,3,5,10,15,25,50,100)"
        required: false
        default: ""
        type: string

concurrency:
  group: benchmark-gist-weekly-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_ENV: development
  # Staging database — must be configured in GitHub Secrets
  PGUSER: ${{ secrets.STAGING_PGUSER || 'severinno' }}
  PGPASSWORD: ${{ secrets.STAGING_PGPASSWORD || '' }}
  PGHOST: ${{ secrets.STAGING_PGHOST || 'localhost' }}
  PGPORT: ${{ secrets.STAGING_PGPORT || '5432' }}
  PGDATABASE: ${{ secrets.STAGING_PGDATABASE || 'severinno' }}

jobs:
  # ── Smoke Check ─────────────────────────────────────────────────────────
  smoke:
    name: Smoke Check
    runs-on: self-hosted
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Check benchmark scripts exist
        run: |
          MISSING=false
          for script in \
            scripts/geo-benchmark-gist.mjs \
            scripts/validate-gist-crossover.mjs \
            scripts/compare-benchmarks.mjs; do
            if [ ! -f "$script" ]; then
              echo "  ❌ Missing: $script"
              MISSING=true
            else
              echo "  ✅ Found:   $script"
            fi
          done
          if [ "$MISSING" = true ]; then
            exit 1
          fi

      - name: Check output directory
        run: |
          if [ ! -d "docs/benchmarks" ]; then
            echo "❌ Missing output directory: docs/benchmarks/"
            exit 1
          fi
          echo "  ✅ Output directory: docs/benchmarks/"

      - name: Verify staging credentials (redacted)
        run: |
          if [ -z "${{ secrets.STAGING_PGHOST }}" ] && [ -z "${{ secrets.STAGING_PGPASSWORD }}" ]; then
            echo "⚠  No staging database secrets configured."
            echo "   The benchmark will try to connect to localhost."
          else
            echo "  ✅ Staging database credentials configured."
            echo "  · Host: ${{ secrets.STAGING_PGHOST || 'localhost' }}:${{ secrets.STAGING_PGPORT || '5432' }}"
            echo "  · User: ${{ secrets.STAGING_PGUSER || 'severinno' }}"
            echo "  · Database: ${{ secrets.STAGING_PGDATABASE || 'severinno' }}"
          fi

  # ── GiST Index Benchmark ───────────────────────────────────────────────
  benchmark:
    name: GiST Index Benchmark
    runs-on: self-hosted
    needs: smoke
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Run the GiST benchmark ──────────────────────────────────────────
      - name: Run GiST index benchmark
        id: run
        env:
          PGUSER: ${{ env.PGUSER }}
          PGPASSWORD: ${{ env.PGPASSWORD }}
          PGHOST: ${{ env.PGHOST }}
          PGPORT: ${{ env.PGPORT }}
          PGDATABASE: ${{ env.PGDATABASE }}
        run: |
          CMD="node scripts/geo-benchmark-gist.mjs --json docs/benchmarks/geo-gist-latest.json"

          if [ -n "${{ github.event.inputs.providers }}" ]; then
            CMD="$CMD --providers ${{ github.event.inputs.providers }}"
          fi
          if [ -n "${{ github.event.inputs.radii }}" ]; then
            CMD="$CMD --radius-list ${{ github.event.inputs.radii }}"
          fi

          echo "  Running: $CMD"
          eval "$CMD"
          echo "✅ GiST Benchmark completed"

      # ── Validate result ─────────────────────────────────────────────────
      - name: Validate benchmark result
        run: |
          node -e "
            const fs = require('fs');
            const path = 'docs/benchmarks/geo-gist-latest.json';
            if (!fs.existsSync(path)) {
              throw Error('geo-gist-latest.json not found');
            }
            const data = JSON.parse(fs.readFileSync(path, 'utf-8'));
            if (!data.meta || !Array.isArray(data.crossover) || data.crossover.length === 0) {
              throw Error('geo-gist-latest.json: invalid or empty crossover data');
            }
            console.log('  ✅ Benchmark validation passed');
            console.log('  · Crossover rows: ' + data.crossover.length);
            console.log('  · Analyses:       ' + (data.analyses?.length ?? 0));
            console.log('  · Benchmarks:     ' + (data.benchmarks?.length ?? 0));
            console.log('  · Densities:      ' + (data.meta.densities ?? []).join(', '));
            console.log('  · Radii:          ' + (data.meta.radiiKm ?? []).join(', '));
            console.log('  · PostGIS:        ' + (data.meta.postgisVersion || '?'));
          "

      # ── Fetch or create baseline ───────────────────────────────────────
      - name: Fetch baseline from git
        id: baseline
        run: |
          if git show HEAD:docs/benchmarks/geo-gist-baseline.json > /tmp/geo-gist-baseline.json 2>/dev/null; then
            echo "baseline_exists=true" >> "$GITHUB_OUTPUT"
            echo "  ✅ Baseline loaded from HEAD"
          else
            echo "baseline_exists=false" >> "$GITHUB_OUTPUT"
            echo "  ℹ  No baseline yet. First run — results will become the baseline."
          fi

      # ── Detect thresholds from workflow inputs ─────────────────────────
      - name: Detect thresholds
        id: thresholds
        run: |
          echo "steps=${{ github.event.inputs.threshold-steps || 2 }}" >> "$GITHUB_OUTPUT"
          echo "ratio=${{ github.event.inputs.ratio-drift || 25 }}" >> "$GITHUB_OUTPUT"

      # ── Validate crossover against baseline ────────────────────────────
      - name: Validate crossover stability
        id: validate
        if: steps.baseline.outputs.baseline_exists == 'true'
        env:
          THRESHOLD_STEPS: ${{ steps.thresholds.outputs.steps }}
          RATIO_DRIFT: ${{ steps.thresholds.outputs.ratio }}
        continue-on-error: true
        run: |
          node scripts/validate-gist-crossover.mjs \
            --threshold "$THRESHOLD_STEPS" \
            --ratio-drift "$RATIO_DRIFT" \
            /tmp/geo-gist-baseline.json \
            docs/benchmarks/geo-gist-latest.json \
            2>&1 | tee /tmp/gist-crossover-diff.txt

          # Capture exit code
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: No baseline available
        if: steps.baseline.outputs.baseline_exists != 'true'
        run: |
          echo "No geo-gist-baseline.json found — this is the first run." | tee /tmp/gist-crossover-diff.txt
          echo "Results will be saved as the new baseline."

      # ── Sentry alert on significant crossover drift ────────────────────
      - name: Sentry alert on crossover regression
        if: steps.validate.outputs.exit_code == '1'
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -n "$SENTRY_DSN" ]; then
            # Send alert via Sentry CLI if available
            if command -v sentry-cli &>/dev/null; then
              cat /tmp/gist-crossover-diff.txt | sentry-cli send-event \
                --message "[GeoGiST] GiST crossover radius changed significantly" \
                --level warning 2>/dev/null || true
            fi
          fi

          # Always extract the alert details for the summary
          echo "🔔 GiST crossover regression detected — see workflow summary for details."

      # ── Copy latest to baseline ────────────────────────────────────────
      - name: Update baseline
        id: update
        run: |
          cp docs/benchmarks/geo-gist-latest.json docs/benchmarks/geo-gist-baseline.json
          echo "  ✅ Baseline updated from latest results"
          echo "UPDATED=true" >> "$GITHUB_OUTPUT"

      # ── Check for changes against HEAD ─────────────────────────────────
      - name: Check for changes against HEAD
        id: diff
        run: |
          FILE="docs/benchmarks/geo-gist-latest.json"
          if git ls-files --error-unmatch "$FILE" 2>/dev/null; then
            if git diff --quiet HEAD -- "$FILE"; then
              echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
            else
              echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Commit results ─────────────────────────────────────────────────
      - name: Commit benchmark results
        if: steps.diff.outputs.HAS_CHANGES == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/geo-gist-baseline.json docs/benchmarks/geo-gist-latest.json
          git commit -m "chore: auto-atualizar benchmark GiST Index (semanal)

          Executa geo-benchmark-gist.mjs contra o banco de staging,
          atualiza o baseline com o novo crossover radius e registra
          os resultados para monitoramento continuo do indice GiST.

          🤖 Generated with Codebuff"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Publish job summary ────────────────────────────────────────────
      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo '## 📊 Benchmark Semanal — GiST Index'
            echo ''
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Step Drift Threshold | ${{ steps.thresholds.outputs.steps }} steps |"
            echo "| Ratio Drift Threshold | ${{ steps.thresholds.outputs.ratio }} pp |"
            echo "| Baseline | ${{ steps.baseline.outputs.baseline_exists == 'true' && 'loaded' || 'first run' }} |"
            echo "| Crossover Valid | ${{ steps.validate.outputs.exit_code == '1' && '⚠ changed' || '✅ stable' }} |"
            echo "| Commit | ${{ steps.diff.outputs.HAS_CHANGES == 'true' && 'yes' || 'no changes' }} |"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

          # Attach the full validation output
          {
            echo '### Resultado da Validação de Crossover'
            echo ''
            echo '```'
            cat /tmp/gist-crossover-diff.txt 2>/dev/null || echo 'No validation data available.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Upload artifact ────────────────────────────────────────────────
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-gist-benchmark
          path: |
            docs/benchmarks/geo-gist-latest.json
            docs/benchmarks/geo-gist-baseline.json
          retention-days: 90
