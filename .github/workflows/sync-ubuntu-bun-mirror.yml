# =============================================================================
# Sync Ubuntu-Bun Mirror → GHCR
#
# Espelha a imagem custom ghcr.io/<owner>/ubuntu-bun:<versão> (base
# catthehacker/ubuntu:act-latest com bun PRÉ-INSTALADO no PATH) para o GHCR.
# A imagem habilita o TIER-1 FAST PATH do composite action
# ./.github/actions/setup-bun: quando o act local roda com
# `-P ubuntu-latest=ghcr.io/<owner>/ubuntu-bun:<versão>`, o bun já está no
# PATH → ZERO download, ZERO cache I/O (steps medidos em ~0.6-1.4s de
# overhead de container vs ~25-35s do oven-sh/setup-bun@v2 e ~1-2s do tier 2).
#
# Por que não reusar o sync-bun-mirror.yml (imagem scratch com /bun): aquela
# imagem serve o tier 3 (cold cache — docker pull + docker create/cp extrai o
# binário). Esta é a imagem RUNNER (catthehacker + bun no PATH + node 24 p/ JS
# actions), usada como plataforma do act local — outro artefato, outro build.
#
# FONTE ÚNICA DA VERSÃO: repository variable BUN_VERSION (vars.BUN_VERSION),
# passada como --build-arg (o Dockerfile.ubuntu-bun falha sem ela — fail-fast,
# sem segundo ponto de verdade). Trocar o Bun = alterar a variável em UM lugar
# (Settings → Secrets and variables → Actions).
#
# ⚠️ Pacotes GHCR criados via GITHUB_TOKEN nascem PRIVADOS por padrão. O pull
# do act local (fora do GitHub) NÃO se autentica — torne o pacote público em:
# https://github.com/orgs/severinno/packages (Settings do pacote → change
# visibility → public). Sem isso o act local com --pull=false usa a imagem
# local (docker build manual), e o CI do mirror ainda funciona.
#
# Usage:
#   Rode manualmente (workflow_dispatch) ou aguarde o cron semanal.
#
# Exit codes:
#   0 — mirror concluído (build + push + verify ok)
#   1 — falha (build ou push)
# =============================================================================

name: Sync Ubuntu-Bun Mirror (GHCR)

on:
  schedule:
    # Semanal 05:34 UTC — revalida o mirror (idempotente; build determinístico
    # pois a versão é pinada pela repository variable).
    - cron: "34 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BUN_VERSION: ${{ vars.BUN_VERSION }}

jobs:
  mirror:
    name: Mirror ubuntu-bun:v${{ vars.BUN_VERSION }} → GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # ── Valida a repository variable (fail-fast com mensagem clara) ──
      # Sem a variável, o build falharia com erro confuso do Dockerfile.
      - name: Validate BUN_VERSION variable
        run: |
          set -euo pipefail
          if [ -z "${BUN_VERSION}" ]; then
            echo "::error::Repository variable BUN_VERSION não definida — crie em Settings → Secrets and variables → Actions (ex.: gh variable set BUN_VERSION 1.3.14)."
            exit 1
          fi
          echo "  ✅ BUN_VERSION=${BUN_VERSION}"

      # ── Build da imagem custom (bun pré-instalado) ────────────────────
      # O Dockerfile.ubuntu-bun baixa o release linux-x64 do Bun, extrai para
      # /usr/local/bin/bun (+ symlink bunx) e valida a versão. node 24 vem da
      # base catthehacker/ubuntu:act-latest (JS actions: checkout, cache).
      - name: Build ubuntu-bun image
        run: |
          set -euo pipefail
          docker build \
            --build-arg BUN_VERSION="${BUN_VERSION}" \
            -f Dockerfile.ubuntu-bun \
            -t "ghcr.io/${{ github.repository_owner }}/ubuntu-bun:${BUN_VERSION}" \
            .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push mirror → GHCR
        run: |
          set -euo pipefail
          docker push "ghcr.io/${{ github.repository_owner }}/ubuntu-bun:${BUN_VERSION}"

      # ── Verify: puxa a imagem publicada e executa o bun (prova que o
      # mirror é consumível — mesmo fluxo do act local com --pull=false).
      - name: Verify mirror digest
        run: |
          set -euo pipefail
          IMG="ghcr.io/${{ github.repository_owner }}/ubuntu-bun:${BUN_VERSION}"
          docker run --rm "$IMG" bash -lc 'node --version; bun --version; bunx --version 2>/dev/null || true' \
            | sed 's/^/  /'
          echo "  ✅ Mirror ok — imagem: ${IMG}"
