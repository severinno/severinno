# =============================================================================
# Benchmark PR Comment
#
# Consumes the benchmark artifact generated by pr-check.yml and posts a
# performance diff as a PR comment.  This workflow does NOT run the
# benchmark itself — that happens in pr-check.yml.
#
# The baseline file lives at docs/benchmarks/geo-baseline.json and is
# committed to main.  When the baseline evolves (e.g. after a measured
# performance improvement that is intentionally accepted), update it by
# copying the PR's geo-latest.json over the baseline and committing:
#
#   cp docs/benchmarks/geo-latest.json docs/benchmarks/geo-baseline.json
#   git add docs/benchmarks/geo-baseline.json
#   git commit -m "chore: update geo benchmark baseline"
#
# =============================================================================

name: Benchmark PR Comment

on:
  # Triggered AFTER pr-check.yml completes — the benchmark itself ran there,
  # and this workflow just downloads the artifact and posts the comment.
  workflow_run:
    workflows: ["PR Check"]
    types:
      - completed

concurrency:
  group: benchmark-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post Benchmark Comment
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout default branch (main)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ── Download artifact from the triggering PR Check run ─────────────
      - name: Download benchmark artifact from PR Check run
        uses: actions/download-artifact@v8
        with:
          name: geo-benchmark
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Extract PR number from the triggering workflow run ────────────
      - name: Extract PR number
        id: pr-info
        run: |
          PR_NUMBER='${{ github.event.workflow_run.pull_requests[0].number }}'
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "number=0" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      # ── Auto-detect threshold based on changed files ──────────────────
      # When the PR touches benchmark/geo code, widen threshold to 10 %
      # to reduce flakiness from intentional algorithmic changes.
      - name: Auto-detect threshold
        id: threshold
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-info.outputs.number }}', 10);

            // No PR context — use default
            if (!prNumber || prNumber === 0) {
              core.setOutput('value', '5');
              return;
            }

            // Fetch changed files via GitHub API
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const benchmarkPaths = [
              'src/lib/geo-shared.ts',
              'src/lib/distance-fallback.ts',
              'src/lib/radius-expansion.ts',
              'src/lib/fetch-providers-data.ts',
              'src/lib/fetch-unrestricted-results.ts',
              'src/lib/sql-builder.ts',
              'src/app/api/providers/route.ts',
              'scripts/geo-benchmark.mjs',
              'scripts/compare-benchmarks.mjs',
              'scripts/run-benchmark.mjs',
            ];

            const changedFiles = files.map(f => f.filename);
            const touchesBenchmark = benchmarkPaths.some(p => changedFiles.includes(p));

            core.setOutput('value', touchesBenchmark ? '10' : '5');

      # ── Check if baseline exists on main ──────────────────────────────
      - name: Check baseline
        id: baseline
        run: |
          if [ -f docs/benchmarks/geo-baseline.json ]; then
            echo "baseline_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "baseline_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Compare ───────────────────────────────────────────────────────
      - name: Compare with baseline
        id: compare
        if: steps.baseline.outputs.baseline_exists == 'true'
        continue-on-error: true
        env:
          BENCHMARK_THRESHOLD: ${{ steps.threshold.outputs.value }}
        run: |
          node scripts/compare-benchmarks.mjs \
            docs/benchmarks/geo-baseline.json \
            docs/benchmarks/geo-latest.json \
            2>&1 | tee /tmp/benchmark-diff.txt

      - name: Capture diff output (no baseline)
        if: steps.baseline.outputs.baseline_exists != 'true'
        run: |
          echo "No baseline available on main branch yet." > /tmp/benchmark-diff.txt
          echo "" >> /tmp/benchmark-diff.txt
          node -e "
            const d = JSON.parse(require('fs').readFileSync('docs/benchmarks/geo-latest.json','utf8'));
            console.log('This PR introduces the first geo-benchmark results.');
            console.log('');
            console.log('| Benchmark | Mean (µs) | Min (µs) | Max (µs) | ops/sec |');
            console.log('|---|---|---|---|---|');
            d.benchmarks.forEach(b => {
              console.log('|', b.name, '|', b.mean, '|', b.min, '|', b.max, '|', b.opsPerSec, '|');
            });
          " >> /tmp/benchmark-diff.txt

      # ── Publish job summary ──────────────────────────────────────────
      # Writes the comparison to the GitHub Actions Job Summary so failures
      # are self-explanatory without opening artifacts or logs.
      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo '## 📊 Geo-Benchmark Comparison'
            echo ''
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Threshold | ${{ steps.threshold.outputs.value }}% |"
            echo "| Baseline | $(if [ -f docs/benchmarks/geo-baseline.json ]; then echo 'loaded'; else echo 'none'; fi) |"
            echo ''
            echo '```'
            cat /tmp/benchmark-diff.txt 2>/dev/null || echo 'No benchmark data available.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Post PR comment ───────────────────────────────────────────────
      - name: Post PR comment
        if: steps.pr-info.outputs.skip == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const diffText = fs.readFileSync('/tmp/benchmark-diff.txt', 'utf-8');
            const baselineExists = '${{ steps.baseline.outputs.baseline_exists }}' === 'true';
            const prNumber = parseInt('${{ steps.pr-info.outputs.number }}', 10);
            const threshold = '${{ steps.threshold.outputs.value }}';

            // Read current benchmark for summary stats
            const current = JSON.parse(fs.readFileSync('docs/benchmarks/geo-latest.json', 'utf-8'));
            const cpu = current.meta.cpuItersPerMs;

            // Build comment body
            const header = baselineExists
              ? '## 📊 Geo-Benchmark Diff\n\nPerformance comparison against the **main** baseline.'
              : '## 📊 Geo-Benchmark Results\n\nThis is the first benchmark run — no baseline from main yet.';

            const meta = '\n\n**Environment:** `' + current.meta.platform + ' ' + current.meta.arch + '` · Node ' + current.meta.nodeVersion + ' · CPU ' + cpu + ' iters/ms\n**Threshold:** ' + threshold + '%\n';

            // Wrap the diff output in a code block for monospace rendering
            const body = header + meta + '\n```\n' + diffText + '\n```';

            // Fetch existing comments to find and remove previous benchmark comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComments = comments.filter(c =>
              c.user.type === 'Bot' && c.body?.startsWith('## 📊 Geo-Benchmark')
            );

            for (const c of botComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: c.id,
              });
            }

            // Post fresh comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body,
            });

      # ── Fail if regression detected ───────────────────────────────────
      - name: Fail on regression
        if: steps.compare.outcome == 'failure' || steps.compare.conclusion == 'failure'
        run: |
          echo "❌ Performance regression detected — see PR comment and job summary above for details."
          exit 1
