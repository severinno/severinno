# =============================================================================
# GitHub Actions CI/CD — Severinno Marketplace
#
# Pipeline:
#   lint       → ESLint
#   typecheck  → tsc --noEmit
#   utf8-check → iconv-based UTF-8 validation on all .ts files
#   test       → vitest run
#   build      → next build (Docker or standalone)
#   budget     → ANALYZE=true next build (webpack) + JS size gate (parallel to build)
#   deploy     → (VPS / Docker Hub / SSH deploy)
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/severinno_test
  REDIS_URL: redis://localhost:6379
  SESSION_SECRET: ci-session-secret-at-least-32-characters-long

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run lint

  # ── TypeScript check ─────────────────────────────────────────────────────
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bunx tsc --noEmit

    # UTF-8 Encoding Check ----------------------------------------------------
  # Reusable via .github/workflows/utf8-check.yml
  utf8-check:
    uses: ./.github/workflows/utf8-check.yml

  # ── Quality Gate ──────────────────────────────────────────────────────────
  # Consolidated: coverage gaps + cache manifest + coverage badge generation.
  # Replaces the individual validate-coverage and validate-cache jobs.
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: severinno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run test:run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/severinno_test

      - name: Generate coverage badge
        run: npx tsx scripts/coverage-badge.ts --save

      - name: Commit updated badge (push to main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badge-coverage.svg
          if git diff --cached --quiet; then
            echo "No changes to badge — skipping commit"
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, utf8-check, quality-gate, test]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run build
        env:
          SKIP_TYPESCRIPT_CHECK: "true"

      # Archive the standalone build for deployment
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/
          retention-days: 3

  # ── JS Bundle Budget ──────────────────────────────────────────────────────
  # Runs an ANALYZE=true webpack build, caches the report, and enforces the
  # JS size budget (scripts/check-js-budget.mjs — fails the run if any
  # chunk/library exceeds its gzip limit). Runs in parallel with build; the
  # analyze report and Next.js build cache are persisted via actions/cache.
  #
  # NOTE: this job appears as the "JS Bundle Budget" check on PRs — but it
  # only BLOCKS merges once it's added to branch protection → required status
  # checks on main (repo settings, not configurable here). Also blocks the
  # deploy job below via needs: [build, budget].
  budget:
    name: JS Bundle Budget
    runs-on: ubuntu-latest
    needs: [lint, typecheck, utf8-check, quality-gate]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run db:generate

      - name: Cache Next.js build + analyze report
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .next/analyze
          key: ${{ runner.os }}-next-analyze-${{ hashFiles('bun.lock', 'package.json', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-analyze-

      # --webpack is required: @next/bundle-analyzer only emits reports for
      # webpack builds. analyze:webpack is package-manager agnostic (plain
      # `next build`), so it works under bun in CI and pnpm locally.
      - name: Analyze build (webpack + bundle report)
        run: bun run analyze:webpack
        env:
          SKIP_TYPESCRIPT_CHECK: "true"

      # The gate reads its budgets from env (scripts/check-js-budget.mjs); the
      # script defaults are the fallback, and these env values are the enforced
      # policy in CI. Route budgets are declared here as documented inputs so
      # per-route limits are visible and can be tuned without a code change.
      # Values = measured gzip (layout chain + page chunk) + ~20% headroom,
      # rounded to 10 KB. Recalibrate with `node scripts/check-js-budget.mjs
      # --update` after a meaningful bundle change and update this block.
      - name: Enforce JS bundle budget
        env:
          JS_BUDGET_ROUTE_ROOT_KB: 20
          JS_BUDGET_ROUTE_BUSCA_KB: 20
          JS_BUDGET_ROUTE_DASHBOARD_KB: 10
          JS_BUDGET_ROUTE_TRACKING_KB: 20
          JS_BUDGET_ROUTE_U_KB: 20
          JS_BUDGET_ROUTE_CATEGORIA_KB: 10
          JS_BUDGET_ROUTE_CATEGORIA_CHILD_KB: 10
          JS_BUDGET_ROUTE_LOGIN_KB: 20
          JS_BUDGET_ROUTE_REGISTER_KB: 20
          JS_BUDGET_ROUTE_RESET_PASSWORD_KB: 20
          JS_BUDGET_ROUTE_AUTH_RESET_KB: 10
          JS_BUDGET_ROUTE_AUTH_RESET_TOKEN_KB: 10
          JS_BUDGET_ROUTE_TERMOS_KB: 10
          JS_BUDGET_ROUTE_COMO_FUNCIONA_KB: 10
          JS_BUDGET_ROUTE_CONTATO_KB: 10
          # Real first-paint transfer per static/ISR route (prerendered HTML).
          # Calibrated 2026-08-08 after dashboard panels + search-page became
          # next/dynamic ssr:false / pure CSS: measured + ~20% headroom.
          JS_BUDGET_REAL_BUSCA_KB: 320
          JS_BUDGET_REAL_DASHBOARD_KB: 270
          JS_BUDGET_REAL_U_KB: 280
          JS_BUDGET_REAL_CATEGORIA_KB: 320  # calibrated via --update (measured 259.0 KB + 20%)
          # Eager-graph source lint (check 8): heavy libs that must never be
          # STATICALLY imported in any route's eager graph (dynamic ƒ routes
          # included — the HTML guard can't see them). Defaults already mirror
          # the heavy-lib guard policy; declared here as documented CI policy.
          # framer-motion: zero-cost regression sentinel — the lib was removed
          # from the app (2026-08-08, pure CSS); any static import in an eager
          # graph is a regression, caught pre-build by check 8 (source lint).
          JS_BUDGET_EAGER_LIBS: maplibre-gl,react-map-gl,recharts,socket.io-client,framer-motion
        run: bun run budget:js

      # ── Proof of gate ──────────────────────────────────────────────────────
      # Deterministic smoke test that the JS budget gate REALLY blocks: re-run
      # check-js-budget.mjs with every budget zeroed via the step env — no
      # dependency injection, no branch surgery, no rebuild. The gate MUST exit
      # non-zero with a budget violation; if it ever passes (exit 0) or fails
      # for the wrong reason (exit 2 = report missing), this step fails the
      # job, proving the size gate is not a no-op.
      # NOTE: only runs when the job reaches it (i.e. the real gate above is
      # green) — that's the case the proof matters for; on a red gate the job
      # already fails at 'Enforce JS bundle budget'.
      - name: Prove budget gate blocks (zeroed budgets)
        env:
          JS_BUDGET_INITIAL_KB: 1
          JS_BUDGET_TOTAL_KB: 1
          JS_BUDGET_LARGEST_CHUNK_KB: 1
          JS_BUDGET_LIB_MAPLIBRE_KB: 1
          JS_BUDGET_LIB_RECHARTS_KB: 1
          JS_BUDGET_LIB_SOCKETIO_KB: 1
          JS_BUDGET_ROUTE_ROOT_KB: 1
          JS_BUDGET_ROUTE_BUSCA_KB: 1
          JS_BUDGET_ROUTE_DASHBOARD_KB: 1
          JS_BUDGET_ROUTE_TRACKING_KB: 1
          JS_BUDGET_ROUTE_U_KB: 1
          JS_BUDGET_ROUTE_CATEGORIA_KB: 1
          JS_BUDGET_ROUTE_CATEGORIA_CHILD_KB: 1
          JS_BUDGET_ROUTE_LOGIN_KB: 1
          JS_BUDGET_ROUTE_REGISTER_KB: 1
          JS_BUDGET_ROUTE_RESET_PASSWORD_KB: 1
          JS_BUDGET_ROUTE_AUTH_RESET_KB: 1
          JS_BUDGET_ROUTE_AUTH_RESET_TOKEN_KB: 1
          JS_BUDGET_ROUTE_TERMOS_KB: 1
          JS_BUDGET_ROUTE_COMO_FUNCIONA_KB: 1
          JS_BUDGET_ROUTE_CONTATO_KB: 1
          # Real-transfer checks too: the assertion below also requires a
          # real-transfer violation, so a regression deleting the REAL_*
          # checks (or silently skipping them) fails the proof step.
          JS_BUDGET_REAL_BUSCA_KB: 1
          JS_BUDGET_REAL_DASHBOARD_KB: 1
          JS_BUDGET_REAL_U_KB: 1
          JS_BUDGET_REAL_CATEGORIA_KB: 1
          # Eager-graph lint is boolean (not a size): pinned to the same policy
          # as the real gate so a script-default drift can't silently shift CI.
          JS_BUDGET_EAGER_LIBS: maplibre-gl,react-map-gl,recharts,socket.io-client,framer-motion
        run: |
          set +e
          out=$(node scripts/check-js-budget.mjs 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out" | tail -30
          if [ "$code" -eq 0 ]; then
            echo "::error::Budget gate PASSED with zeroed budgets — the gate is not blocking!"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::error::Budget gate failed with exit 2 (report not found) — proof inconclusive"
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -q "Total client bundle.*> budget 1 KB"; then
            echo "::error::Budget gate failed but not on the total-size check — proof inconclusive"
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -qE "real: /.* transfer.*> budget 1 KB"; then
            echo "::error::Budget gate failed but not on a real-transfer check — proof inconclusive"
            exit 1
          fi
          echo "✅ Gate proof OK: budget check exited $code with zeroed budgets (expected failure)"

      # ── PR bundle preview ──────────────────────────────────────────────
      # Generates a read-only delta table vs the last versioned release
      # (bundle-report.mjs --preview) and uploads it as an artifact;
      # bundle-preview-comment.yml (workflow_run on CI/CD) posts it as a PR
      # comment. Runs even when the gate fails (always()) because the delta
      # is most informative then — but only when the ANALYZE report exists:
      # if the analyze build failed, the generate step exits 2 fast and the
      # upload is ignored, so the commenter posts a fallback message.
      # ── Versioned bundle report on main ──────────────────────────────────
      # The docs/bundle-report.md history is normally written per RELEASE
      # (release-deploy.yml, --version <tag>). During the pre-production
      # stretch we ALSO record it on every push to main so the bundle
      # evolution is tracked per merge, not just per tag: a rolling "main"
      # row (upserted each run — never accumulates duplicate rows) sits on
      # top of the table, with Δ columns vs the last versioned release.
      # The commit uses [skip ci] (same pattern as the coverage badge) so
      # the docs commit doesn't re-trigger this workflow.
      # always(): record the row EVEN when the budget gate is red — a bundle
      # regression merged to main is exactly the case the report must show
      # (mirrors the PR-preview step below; bundle-report.mjs tolerates exit 1,
      # only exit 2 / missing report fails it).
      # ANTI-REGRESSION GATE (bundle-report.mjs): the 'main' row is not just
      # tracking — the generator exits 1 if the merged bundle's Initial JS (/),
      # Total, or any key ROUTE's real transfer (check 7: /busca, /dashboard,
      # /u/[slug], /categoria/[slug]) worsened by more than the threshold vs
      # the last versioned release, blocking the push. Thresholds declared
      # here as the enforced policy (KB gzip); script defaults are the
      # fallback. Evaluated only for the rolling 'main' row (releases define
      # the baseline) and skipped when the initial metric came from the
      # rootMainFiles fallback (non-comparable).
      - name: Generate versioned bundle report (main push)
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          # +50 KB first-paint regression (or +200 KB total) vs the last
          # release blocks the push to main.
          JS_BUDGET_MAIN_DELTA_INITIAL_KB: 50
          JS_BUDGET_MAIN_DELTA_TOTAL_KB: 200
          # Per-route real-transfer regressions (check 7) — a route that
          # worsens 30 KB without touching / initial would escape the
          # initial/total thresholds alone, so each measured route is gated
          # with its own 30 KB default (env-overridable per route).
          JS_BUDGET_MAIN_DELTA_ROUTE_BUSCA_KB: 30
          JS_BUDGET_MAIN_DELTA_ROUTE_DASHBOARD_KB: 30
          JS_BUDGET_MAIN_DELTA_ROUTE_U_KB: 30
          JS_BUDGET_MAIN_DELTA_ROUTE_CATEGORIA_KB: 30
        run: bun run bundle:report --version main

      - name: Commit bundle report (main push)
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/bundle-report.md docs/bundle-badge.json
          if git diff --cached --quiet; then
            echo "No changes to bundle report — skipping commit"
          else
            git commit -m "docs: update bundle report (main) [skip ci]"
            git push
          fi

      # ── Rolling 'develop' row (tracking only) ─────────────────────────────
      # Same upsert mechanism as main, so feature-merge evolution is versioned
      # in the report BEFORE reaching main: a rolling "develop" row (sorted
      # below main, above releases — Δ vs the row below) is recorded on every
      # push to develop. NO anti-regression gate here by design: develop is WIP
      # and merges there must not be blocked; the gate stays main-only
      # (bundle-report.mjs evaluates it only for --version main). Same [skip ci]
      # commit pattern so this docs commit doesn't re-trigger the workflow.
      #
      # KNOWN TRADE-OFF: both branches commit docs/bundle-report.md on every
      # push, so a develop→main merge will conflict on that file. Resolve by
      # keeping THEIRS (develop's version — `git checkout --theirs
      # docs/bundle-report.md` and `--theirs docs/bundle-badge.json`), which
      # preserves the rolling develop row; then re-run
      # `bun run bundle:report --version main` — the generator reconciles the
      # table from the rows in the kept base and CI rewrites real values on
      # the next push. (Keeping OURS would drop develop's history from the
      # table, since the regeneration only sees the rows in the kept base.)
      # The commit steps end in `git push`: if the branch moves between
      # checkout and push the push fails and the row is lost — pre-existing
      # for main, now on both branches; the next push regenerates.
      - name: Generate versioned bundle report (develop push)
        if: always() && github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: bun run bundle:report --version develop

      - name: Commit bundle report (develop push)
        if: always() && github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/bundle-report.md docs/bundle-badge.json
          if git diff --cached --quiet; then
            echo "No changes to bundle report — skipping commit"
          else
            git commit -m "docs: update bundle report (develop) [skip ci]"
            git push
          fi

      - name: Generate bundle preview (PR only)
        if: always() && github.event_name == 'pull_request'
        # > file (no tee): GH bash runs with -o pipefail, so a failed
        # check-js-budget (exit 2 = analyze report missing) would fail the
        # pipeline AND leave a partial bundle-preview.md that the always()
        # upload step would ship as a garbage comment. On failure, remove
        # the file so the upload is skipped (if-no-files-found: ignore) and
        # the commenter posts its fallback message.
        run: node scripts/bundle-report.mjs --version preview --preview > bundle-preview.md || { rm -f bundle-preview.md; echo "::warning::bundle preview skipped (analyze report missing)"; }

      - name: Upload bundle preview (PR only)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-preview
          path: bundle-preview.md
          if-no-files-found: ignore
          retention-days: 7

      # Upload the report even when the gate fails so PR authors can see
      # exactly which chunk/library blew the budget.
      - name: Upload bundle analyze report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analyze-report
          path: .next/analyze/
          if-no-files-found: ignore
          retention-days: 7

  # ── Deploy (manual trigger or on push to main) ────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, budget]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/

      # Example: SSH deploy to VPS
      # Uncomment and configure secrets for your server:
      #
      # - name: Deploy via SSH
      #   uses: appleboy/scp-action@v0.1.7
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_KEY }}
      #     source: ".next/standalone/*"
      #     target: "/opt/severinno/"
      #     strip_components: 2
      #
      # - name: Restart server
      #   uses: appleboy/ssh-action@v1.2.0
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_KEY }}
      #     script: |
      #       cd /opt/severinno
      #       docker compose pull
      #       docker compose up -d --force-recreate

      - run: echo "Build ready for deployment"
