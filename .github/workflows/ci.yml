# =============================================================================
# GitHub Actions CI/CD — Severinno Marketplace
#
# Triggers:
#   - push to main/develop → full pipeline (lint → typecheck → test → build → deploy)
#   - pull_request → full pipeline except deploy
#
# Services:
#   - POSTGIS 16  for DB-dependent tests
#   - Valkey 7    (Redis-compatible) for cache/rate-limit tests
#   - RabbitMQ 4  for queue/consumer tests
#
# Optimizations:
#   - Bun dependency caching (hash of bun.lock)
#   - Prisma client cached between jobs
#   - Parallel job execution where safe
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  DATABASE_URL: postgresql://severinno:severinno_ci@localhost:5432/severinno_test
  REDIS_URL: redis://localhost:6379
  RABBITMQ_URL: amqp://guest:guest@localhost:5672
  SESSION_SECRET: ci-secret-key-at-least-32-characters-for-hmac

defaults:
  run:
    shell: bash

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: 📋 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        id: bun-cache
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Install dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  # ── TypeScript check ──────────────────────────────────────────────────────
  typecheck:
    name: 🔍 TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        id: bun-cache
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Install dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: TypeScript check
        run: bunx tsc --noEmit

  # ── Unit tests (fast, no external services) ───────────────────────────────
  unit-tests:
    name: ⚡ Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        id: bun-cache
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Install dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run unit tests
        run: bun run test:run
        env:
          NODE_ENV: test
          CI: "true"

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, unit-tests]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        id: bun-cache
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Install dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build application
        run: bun run build
        env:
          SKIP_TYPESCRIPT_CHECK: "true"

      # Archive the standalone build for deployment
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: |
            .next/standalone/
            .next/static/
            public/
          retention-days: 3

  # ── Deploy (only on push to main) ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/

      # ── Example: Docker deploy via SSH ──────────────────────────────────
      # Uncomment and configure secrets in your repo settings:
      #
      # - name: Deploy via SSH
      #   uses: appleboy/scp-action@v0.1.7
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_KEY }}
      #     source: ".next/standalone/*"
      #     target: "/opt/severinno/"
      #     strip_components: 2
      #
      # - name: Restart server
      #   uses: appleboy/ssh-action@v1.2.0
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_KEY }}
      #     script: |
      #       cd /opt/severinno
      #       docker compose pull
      #       docker compose up -d --force-recreate
      #       echo "✅ Deploy complete"

      - run: echo "✅ Build ready for deployment"
