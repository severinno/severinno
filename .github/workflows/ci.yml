# =============================================================================
# GitHub Actions CI/CD — Severinno Marketplace
#
# Pipeline:
#   lint       → bun run lint (prettier --check + eslint --max-warnings 0)
#                — o MESMO comando do job `lint-guard` (pr-check.yml) e do `lint`
#                da Gitea: a régua vive no script `lint` do package.json.
#   typecheck  → tsc --noEmit
#   utf8-check → iconv-based UTF-8 validation on all .ts files
#   test       → vitest run
#   build      → next build (Docker or standalone)
#   deploy     → (VPS / Docker Hub / SSH deploy)
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/severinno_test
  REDIS_URL: redis://localhost:6379
  SESSION_SECRET: ci-session-secret-at-least-32-characters-long

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  # ── TypeScript check ─────────────────────────────────────────────────────
  typecheck:
    name: TypeCheck
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      # Worker do MapLibre servido por URL deve estar alinhado com a versão
      # instalada (postinstall roda no `bun install`; isto falha o CI no drift).
      - run: bun run check:maplibre-worker

      # O comando INTEIRO vive no script `typecheck` do package.json, inclusive
      # o heap de 4GB (o crash de OOM documentado: o heap default do Node,
      # ~1.4GB, é insuficiente para o tsc neste codebase — SIGABRT exit 134, não
      # erro de tipo). Declarar `NODE_OPTIONS` TAMBÉM aqui seria uma segunda
      # régua para o mesmo valor: é este mesmo comando que a forja dona do merge
      # e o espelho do GitHub executam.
      - name: Type check
        run: bun run typecheck

    # UTF-8 Encoding Check ----------------------------------------------------
  # Reusable via .github/workflows/utf8-check.yml
  utf8-check:
    uses: ./.github/workflows/utf8-check.yml

  # ── Quality Gate ──────────────────────────────────────────────────────────
  # Consolidated: coverage gaps + cache manifest + coverage badge generation.
  # Replaces the individual validate-coverage and validate-cache jobs.
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: self-hosted

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: severinno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run test:run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/severinno_test

      - name: Generate coverage badge
        run: npx tsx scripts/coverage-badge.ts --save

      - name: Commit updated badge (push to main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badge-coverage.svg
          if git diff --cached --quiet; then
            echo "No changes to badge — skipping commit"
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: self-hosted
    needs: [lint, typecheck, utf8-check, quality-gate, test]

    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run build
        env:
          SKIP_TYPESCRIPT_CHECK: "true"
          BUILD_STANDALONE: "true"

      - name: Check bundle size budget
        run: bash scripts/check-bundle-size.sh

      # Archive the standalone build for deployment
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/
          retention-days: 3

  # ── Lighthouse Performance Audit ────────────────────────────────────────
  lighthouse:
    name: Lighthouse Audit
    runs-on: self-hosted
    needs: [build]
    if: github.event_name == 'pull_request' # Only on PRs to catch regressions

    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun run db:generate

      # Start the Next.js server in background
      - name: Start server
        run: |
          bun run build &
          sleep 5
          bun run start -- -p 3456 &
          sleep 10
        env:
          SKIP_TYPESCRIPT_CHECK: "true"
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          PORT: 3456

      # Run Lighthouse audit
      - name: Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
