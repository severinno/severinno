# =============================================================================
# GitHub Actions CI/CD — Severinno Marketplace
#
# Pipeline:
#   lint       → ESLint
#   typecheck  → tsc --noEmit
#   utf8-check → iconv-based UTF-8 validation on all .ts files
#   test       → vitest run
#   build      → next build (Docker or standalone)
#   budget     → ANALYZE=true next build (webpack) + JS size gate (parallel to build)
#   deploy     → (VPS / Docker Hub / SSH deploy)
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/severinno_test
  REDIS_URL: redis://localhost:6379
  SESSION_SECRET: ci-session-secret-at-least-32-characters-long

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run lint

  # ── TypeScript check ─────────────────────────────────────────────────────
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bunx tsc --noEmit

    # UTF-8 Encoding Check ----------------------------------------------------
  # Reusable via .github/workflows/utf8-check.yml
  utf8-check:
    uses: ./.github/workflows/utf8-check.yml

  # ── Quality Gate ──────────────────────────────────────────────────────────
  # Consolidated: coverage gaps + cache manifest + coverage badge generation.
  # Replaces the individual validate-coverage and validate-cache jobs.
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: severinno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run test:run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/severinno_test

      - name: Generate coverage badge
        run: npx tsx scripts/coverage-badge.ts --save

      - name: Commit updated badge (push to main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badge-coverage.svg
          if git diff --cached --quiet; then
            echo "No changes to badge — skipping commit"
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, utf8-check, quality-gate, test]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run build
        env:
          SKIP_TYPESCRIPT_CHECK: "true"

      # Archive the standalone build for deployment
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/
          retention-days: 3

  # ── JS Bundle Budget ──────────────────────────────────────────────────────
  # Runs an ANALYZE=true webpack build, caches the report, and enforces the
  # JS size budget (scripts/check-js-budget.mjs — fails the run if any
  # chunk/library exceeds its gzip limit). Runs in parallel with build; the
  # analyze report and Next.js build cache are persisted via actions/cache.
  #
  # NOTE: this job appears as the "JS Bundle Budget" check on PRs — but it
  # only BLOCKS merges once it's added to branch protection → required status
  # checks on main (repo settings, not configurable here). Also blocks the
  # deploy job below via needs: [build, budget].
  budget:
    name: JS Bundle Budget
    runs-on: ubuntu-latest
    needs: [lint, typecheck, utf8-check, quality-gate]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run db:generate

      - name: Cache Next.js build + analyze report
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .next/analyze
          key: ${{ runner.os }}-next-analyze-${{ hashFiles('bun.lock', 'package.json', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-analyze-

      # --webpack is required: @next/bundle-analyzer only emits reports for
      # webpack builds. analyze:webpack is package-manager agnostic (plain
      # `next build`), so it works under bun in CI and pnpm locally.
      - name: Analyze build (webpack + bundle report)
        run: bun run analyze:webpack
        env:
          SKIP_TYPESCRIPT_CHECK: "true"

      - name: Enforce JS bundle budget
        run: bun run budget:js

      # ── Proof of gate ──────────────────────────────────────────────────────
      # Deterministic smoke test that the JS budget gate REALLY blocks: re-run
      # check-js-budget.mjs with every budget zeroed via the step env — no
      # dependency injection, no branch surgery, no rebuild. The gate MUST exit
      # non-zero with a budget violation; if it ever passes (exit 0) or fails
      # for the wrong reason (exit 2 = report missing), this step fails the
      # job, proving the size gate is not a no-op.
      # NOTE: only runs when the job reaches it (i.e. the real gate above is
      # green) — that's the case the proof matters for; on a red gate the job
      # already fails at 'Enforce JS bundle budget'.
      - name: Prove budget gate blocks (zeroed budgets)
        env:
          JS_BUDGET_INITIAL_KB: 1
          JS_BUDGET_TOTAL_KB: 1
          JS_BUDGET_LARGEST_CHUNK_KB: 1
          JS_BUDGET_LIB_MAPLIBRE_KB: 1
          JS_BUDGET_LIB_RECHARTS_KB: 1
          JS_BUDGET_LIB_FRAMER_KB: 1
          JS_BUDGET_LIB_SOCKETIO_KB: 1
          JS_BUDGET_ROUTE_ROOT_KB: 1
          JS_BUDGET_ROUTE_BUSCA_KB: 1
          JS_BUDGET_ROUTE_DASHBOARD_KB: 1
          JS_BUDGET_ROUTE_TRACKING_KB: 1
          JS_BUDGET_ROUTE_U_KB: 1
        run: |
          set +e
          out=$(node scripts/check-js-budget.mjs 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out" | tail -30
          if [ "$code" -eq 0 ]; then
            echo "::error::Budget gate PASSED with zeroed budgets — the gate is not blocking!"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::error::Budget gate failed with exit 2 (report not found) — proof inconclusive"
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -q "Total client bundle.*> budget 1 KB"; then
            echo "::error::Budget gate failed but not on the total-size check — proof inconclusive"
            exit 1
          fi
          echo "✅ Gate proof OK: budget check exited $code with zeroed budgets (expected failure)"

      # Upload the report even when the gate fails so PR authors can see
      # exactly which chunk/library blew the budget.
      - name: Upload bundle analyze report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analyze-report
          path: .next/analyze/
          if-no-files-found: ignore
          retention-days: 7

  # ── Deploy (manual trigger or on push to main) ────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, budget]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/

      # Example: SSH deploy to VPS
      # Uncomment and configure secrets for your server:
      #
      # - name: Deploy via SSH
      #   uses: appleboy/scp-action@v0.1.7
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_KEY }}
      #     source: ".next/standalone/*"
      #     target: "/opt/severinno/"
      #     strip_components: 2
      #
      # - name: Restart server
      #   uses: appleboy/ssh-action@v1.2.0
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_KEY }}
      #     script: |
      #       cd /opt/severinno
      #       docker compose pull
      #       docker compose up -d --force-recreate

      - run: echo "Build ready for deployment"
