# =============================================================================
# Benchmark Weekly — Severinno Marketplace
#
# Runs the real PostGIS benchmark (scripts/geo-benchmark-real.mjs) weekly
# against the staging database, records results in the repository, and
# detects performance regressions.
#
# The benchmark:
#   1. Connects to the staging PostgreSQL via secrets
#   2. Creates temp tables with synthetic provider data
#   3. Benchmarks ST_Distance, ST_DWithin, COUNT queries at 100/500/1k/5k
#   4. Compares against baseline from the previous run
#   5. Commits updated baseline + latest results if they changed
#   6. Reports regression status as a workflow summary
#
# Security:
#   - Never exposes staging credentials in logs
#   - Temp tables are dropped after each benchmark tier
#   - Only commits benchmark JSON files (no secrets, no source code)
# =============================================================================

name: Benchmark Weekly

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Regression threshold percentage"
        required: false
        default: 10
        type: number
      providers:
        description: "Custom provider count (optional, default: 100,500,1000,5000)"
        required: false
        default: ""
        type: string

concurrency:
  group: benchmark-weekly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read

env:
  NODE_ENV: development
  # Staging database — must be configured in GitHub Secrets
  PGUSER: ${{ secrets.STAGING_PGUSER || 'severinno' }}
  PGPASSWORD: ${{ secrets.STAGING_PGPASSWORD || '' }}
  PGHOST: ${{ secrets.STAGING_PGHOST || 'localhost' }}
  PGPORT: ${{ secrets.STAGING_PGPORT || '5432' }}
  PGDATABASE: ${{ secrets.STAGING_PGDATABASE || 'severinno' }}
  # Origem do mirror ubuntu-bun — FONTE ÚNICA (default = ghcr.io/severinno).
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || 'severinno' }}

jobs:
  # ── Smoke Check ─────────────────────────────────────────────────────────
  smoke:
    name: Smoke Check
    runs-on: self-hosted
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Check benchmark scripts exist
        run: |
          MISSING=false
          for script in scripts/geo-benchmark-real.mjs scripts/compare-benchmarks.mjs; do
            if [ ! -f "$script" ]; then
              echo "  ❌ Missing: $script"
              MISSING=true
            else
              echo "  ✅ Found:   $script"
            fi
          done
          if [ "$MISSING" = true ]; then
            exit 1
          fi

      - name: Check docs/benchmarks/ directory
        run: |
          if [ ! -d "docs/benchmarks" ]; then
            echo "❌ Missing output directory: docs/benchmarks/"
            exit 1
          fi
          echo "  ✅ Output directory: docs/benchmarks/"

      - name: Verify staging credentials (redacted)
        run: |
          if [ -z "${{ secrets.STAGING_PGHOST }}" ] && [ -z "${{ secrets.STAGING_PGPASSWORD }}" ]; then
            echo "⚠  No staging database secrets configured."
            echo "   The benchmark will try to connect to localhost."
            echo "   Set STAGING_PGHOST, STAGING_PGPORT, STAGING_PGUSER,"
            echo "   STAGING_PGPASSWORD, STAGING_PGDATABASE in GitHub Secrets."
          else
            echo "  ✅ Staging database credentials configured."
            echo "  · Host: ${{ secrets.STAGING_PGHOST || 'localhost' }}:${{ secrets.STAGING_PGPORT || '5432' }}"
            echo "  · User: ${{ secrets.STAGING_PGUSER || 'severinno' }}"
            echo "  · Database: ${{ secrets.STAGING_PGDATABASE || 'severinno' }}"
          fi

  # ── Real PostGIS Benchmark ─────────────────────────────────────────────
  benchmark:
    name: PostGIS Real Benchmark
    runs-on: self-hosted
    needs: smoke
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Run the real benchmark ──────────────────────────────────────────
      # Note: --keep is intentionally omitted so temp tables are cleaned up
      # after each benchmark tier (important against a shared staging DB).
      - name: Run real PostGIS benchmark
        id: run
        env:
          PGUSER: ${{ env.PGUSER }}
          PGPASSWORD: ${{ env.PGPASSWORD }}
          PGHOST: ${{ env.PGHOST }}
          PGPORT: ${{ env.PGPORT }}
          PGDATABASE: ${{ env.PGDATABASE }}
        run: |
          if [ -n "${{ github.event.inputs.providers }}" ]; then
            echo "  Using custom provider count: ${{ github.event.inputs.providers }}"
            node scripts/geo-benchmark-real.mjs --json --providers "${{ github.event.inputs.providers }}"
          else
            node scripts/geo-benchmark-real.mjs --json
          fi
          echo "✅ Benchmark completed"

      # ── Validate result ─────────────────────────────────────────────────
      - name: Validate benchmark result
        run: |
          node -e "
            const fs = require('fs');
            const path = 'docs/benchmarks/geo-real-latest.json';
            if (!fs.existsSync(path)) {
              throw Error('geo-real-latest.json not found — benchmark may have failed');
            }
            const data = JSON.parse(fs.readFileSync(path, 'utf-8'));
            if (!data.meta || !Array.isArray(data.benchmarks) || data.benchmarks.length === 0) {
              throw Error('geo-real-latest.json: invalid or empty');
            }
            console.log('  ✅ Benchmark result validation passed');
            console.log('  · Benchmarks: ' + data.benchmarks.length);
            console.log('  · Platform:   ' + data.meta.platform + ' ' + data.meta.arch);
            console.log('  · Timestamp:  ' + data.meta.timestamp);
            console.log('  · PostGIS:    ' + (data.meta.postgisVersion || '?'));
          "

      # ── Fetch or create baseline ───────────────────────────────────────
      - name: Fetch baseline from git
        id: baseline
        run: |
          if git show HEAD:docs/benchmarks/geo-real-baseline.json > /tmp/geo-real-baseline.json 2>/dev/null; then
            echo "baseline_exists=true" >> "$GITHUB_OUTPUT"
            echo "  ✅ Baseline loaded from HEAD"
          else
            echo "baseline_exists=false" >> "$GITHUB_OUTPUT"
            echo "  ℹ  No baseline yet. First run — results will become the baseline."
          fi

      # ── Determine threshold ─────────────────────────────────────────────
      - name: Detect threshold
        id: changes
        run: |
          MANUAL_INPUT=${{ github.event.inputs.threshold || 0 }}
          if [ "$MANUAL_INPUT" -gt 0 ] 2>/dev/null; then
            echo "threshold=$MANUAL_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "threshold=10" >> "$GITHUB_OUTPUT"
          fi

      # ── Compare with baseline ──────────────────────────────────────────
      - name: Compare with baseline
        id: compare
        if: steps.baseline.outputs.baseline_exists == 'true'
        env:
          BENCHMARK_THRESHOLD: ${{ steps.changes.outputs.threshold }}
        continue-on-error: true
        run: |
          node scripts/compare-benchmarks.mjs \
            /tmp/geo-real-baseline.json \
            docs/benchmarks/geo-real-latest.json \
            2>&1 | tee /tmp/benchmark-diff.txt

      - name: No baseline available
        if: steps.baseline.outputs.baseline_exists != 'true'
        run: |
          echo "No geo-real-baseline.json found — this is the first run." | tee /tmp/benchmark-diff.txt
          echo "Results will be saved as the new baseline."

      # ── Regression Alerting ───────────────────────────────────────────
      # Create GitHub issue + optional webhook when regression detected
      - name: Create regression issue
        if: steps.compare.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diffText = fs.existsSync('/tmp/benchmark-diff.txt')
              ? fs.readFileSync('/tmp/benchmark-diff.txt', 'utf-8')
              : 'No diff available';

            const threshold = '${{ steps.changes.outputs.threshold }}';
            const repo = context.repo;
            const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;

            // Extract regression details from diff output
            const regressions = [];
            const lines = diffText.split('\n');
            for (const line of lines) {
              if (line.includes('→') && line.includes('%')) {
                const match = line.match(/·\s+(.+?)\s+—\s+mean\s+(.+?)\s+→\s+(.+?)\s+µs\s+\((.+?)%\)/);
                if (match) {
                  regressions.push({
                    name: match[1].trim(),
                    baseline: match[2],
                    current: match[3],
                    pct: match[4]
                  });
                }
              }
            }

            const regressionList = regressions.length > 0
              ? regressions.map(r => `- **${r.name}**: ${r.baseline} → ${r.current} µs (+${r.pct}%)`).join('\n')
              : '- See comparison output below';

            const body = `## ⚠️ Benchmark Regression Detected\n\nA performance regression was detected in the weekly PostGIS benchmark.\n\n### Regressions (> ${threshold}% threshold)\n\n${regressionList}\n\n### Details\n\n<details>\n<summary>Full comparison output</summary>\n\n\`\`\`\n${diffText}\n\`\`\`\n\n</details>\n\n### Action Required\n\n1. Review the regression details above\n2. Check if the regression is expected (e.g., new features, data changes)\n3. If unexpected, investigate the root cause\n4. Close this issue once resolved or marked as expected\n\n---\n\n**Workflow**: [Benchmark Weekly](${runUrl})\n**Threshold**: ${threshold}%\n**Run**: ${context.runId}`;

            // Check for existing open issues with same title
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: repo.owner,
              repo: repo.repo,
              state: 'open',
              labels: 'benchmark-regression',
              per_page: 10
            });

            const title = '⚠️ Benchmark Regression — PostGIS Weekly';
            const existing = existingIssues.find(i => i.title === title);

            if (existing) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: existing.number,
                body: `### New regression detected (${new Date().toISOString()})\n\n${body}`
              });
              console.log(`  📝 Updated existing issue #${existing.number}`);
            } else {
              // Create new issue
              const { data: issue } = await github.rest.issues.create({
                owner: repo.owner,
                repo: repo.repo,
                title: title,
                body: body,
                labels: ['benchmark-regression', 'performance', 'automated']
              });
              console.log(`  🐛 Created issue #${issue.number}`);
            }

      # ── Send webhook notification (optional) ──────────────────────────
      - name: Send regression webhook
        if: steps.compare.outcome == 'failure' && vars.BENCHMARK_WEBHOOK_URL != ''
        run: |
          DIFF_TEXT=$(cat /tmp/benchmark-diff.txt 2>/dev/null || echo 'No diff available')
          THRESHOLD=${{ steps.changes.outputs.threshold }}

          # Truncate diff for webhook payload
          DIFF_TRUNCATED=$(echo "$DIFF_TEXT" | head -c 2000)

          curl -s -X POST "${{ vars.BENCHMARK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"⚠️ Benchmark Regression Detected\",
              \"repo\": \"${{ github.repository }}\",
              \"threshold\": \"${THRESHOLD}%\",
              \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"diff\": $(echo "$DIFF_TRUNCATED" | jq -Rs .)
            }" || echo "  ⚠ Webhook failed (non-critical)"

      # ── Copy latest to baseline ────────────────────────────────────────
      - name: Update baseline
        id: update
        run: |
          cp docs/benchmarks/geo-real-latest.json docs/benchmarks/geo-real-baseline.json
          echo "  ✅ Baseline updated from latest results"
          echo "UPDATED=true" >> "$GITHUB_OUTPUT"

      # ── Check for changes against HEAD ────────────────────────────────
      # Compare against committed version, not the just-copied local file.
      # Handles both tracked files (diff) and untracked files (first run).
      - name: Check for changes against HEAD
        id: diff
        run: |
          FILE="docs/benchmarks/geo-real-latest.json"
          if git ls-files --error-unmatch "$FILE" 2>/dev/null; then
            # Tracked file — diff against HEAD
            if git diff --quiet HEAD -- "$FILE"; then
              echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
            else
              echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # Untracked file (first run) — always commit
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Commit results ─────────────────────────────────────────────────
      - name: Commit benchmark results
        if: steps.diff.outputs.HAS_CHANGES == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/geo-real-baseline.json docs/benchmarks/geo-real-latest.json
          git commit -m "chore: auto-atualizar benchmark real PostGIS (semanal)

          Executa geo-benchmark-real.mjs contra o banco de staging,
          atualiza o baseline e registra o resultado semanal para
          monitoramento continuo de performance da camada PostGIS.

          🤖 Generated with Codebuff"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Publish job summary ────────────────────────────────────────────
      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo '## 📊 Benchmark Semanal — PostGIS Real'
            echo ''
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Threshold | ${{ steps.changes.outputs.threshold }}% |"
            echo "| Baseline | ${{ steps.baseline.outputs.baseline_exists == 'true' && 'loaded' || 'first run' }} |"
            echo "| Commit | ${{ steps.diff.outputs.HAS_CHANGES == 'true' && 'yes' || 'no changes' }} |"
            echo ''
            echo '### Resultado da Comparação'
            echo ''
            echo '```'
            cat /tmp/benchmark-diff.txt 2>/dev/null || echo 'No comparison data available.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Upload artifact ────────────────────────────────────────────────
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-real-benchmark
          path: |
            docs/benchmarks/geo-real-latest.json
            docs/benchmarks/geo-real-baseline.json
          retention-days: 90

  # ── Setup-bun warm cache guard (semanal) ────────────────────────────
  # Revalida SEMANALMENTE o tier-2 do setup-bun (cache REAL do GitHub):
  # roda o bench-setup-bun.sh (cold→warm: run #1 cache frio, run #2 cache
  # quente) e falha se o warm cache exceder o limiar (default 10s, esperado
  # ~1-2s). Se o tier-2 regredir silenciosamente (cache key quebrada, warm
  # volta a baixar no tier-3 ~5-10s), o setup-bun continua FUNCIONANDO — só
  # fica mais lento — e o pr-check (que mede correção, não performance) não
  # percebe. Este guard é a rede de segurança periódica.
  #
  # O dispatch exige que o bench-setup-bun.yml exista no ref padrão (main).
  # O guard (scripts/check-setup-bun-warm.mjs) é o GATE — exit 1 falha o job.
  setup-bun-warm:
    name: Setup-bun warm cache (limiar 10s)
    runs-on: self-hosted
    timeout-minutes: 30

    permissions:
      contents: read
      # workflow_dispatch + jobs API (medir o run do bench) exigem actions.
      actions: write

    steps:
      - uses: actions/checkout@v4

      # ── Roda a medição real (cold→warm) e salva o JSON ───────────────
      # gh usa o token padrão do run (GITHUB_TOKEN) para dispatch + jobs API.
      # BENCH_TIMEOUT_S=300 (5min/run): menor que o timeout do job — se um
      # run estagnar, o script (não o wall-clock) é quem decide o verdict e
      # o job falha com a mensagem clara do guard, não com 'timed out'.
      - name: Rodar bench-setup-bun (cold→warm)
        env:
          BENCH_TIMEOUT_S: 300
        run: |
          ./scripts/bench-setup-bun.sh \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            --runs 2 \
            --json /tmp/bench-setup-bun.json

      # ── GATE: warm cache dentro do limiar? ───────────────────────────
      - name: Guard warm cache (limiar 10s)
        run: |
          node scripts/check-setup-bun-warm.mjs \
            --json /tmp/bench-setup-bun.json \
            --max 10

      # ── Evidência como artifact (debug de falhas) ────────────────────
      - name: Upload bench JSON (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-setup-bun-warm
          path: /tmp/bench-setup-bun.json
          if-no-files-found: ignore

  # ── Act startup bench (semanal) ──────────────────────────────────────
  # Revalida SEMANALMENTE que o fast path (tier-1) da imagem custom
  # ubuntu-bun continua compensando: roda o act-startup-bench.sh (5 runs do
  # secrets-guard × 2 imagens — catthehacker default vs ubuntu-bun custom)
  # com --assert-pct 30 e FALHA se a custom exceder a baseline catthehacker
  # em mais de 30% de startup. O pr-check mede CORREÇÃO, não performance —
  # se o startup da custom regredir silenciosamente (imagem inchou, base
  # mudou, bump de BUN_VERSION com re-sync mais pesado), o tier-1 continua
  # FUNCIONANDO — só fica mais lento — e nenhum guard de correção percebe.
  # Este guard é a rede de segurança periódica do fast path a cada bump.
  #
  # O act roda DENTRO do runner (docker disponível): baixamos o binário
  # Linux do release v0.2.89 (mesma versão da validação local — o default
  # do script é o act.exe do Windows; ACT_BIN aponta para o Linux) e puxamos
  # as DUAS imagens antes (o act usa --pull=false — sem re-download por
  # run). A tag da custom vem de vars.BUN_VERSION (fonte única) via --image.
  act-startup-bench:
    name: Act startup bench (delta 30%)
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      # ── act Linux (v0.2.89 — mesma da validação local no Windows) ────
      # O script aceita ACT_BIN para apontar para um binário alternativo;
      # sem ele, tenta tool-results/act/act.exe (não existe no runner).
      - name: Baixar act (Linux)
        run: |
          mkdir -p "$RUNNER_TEMP/act-bin"
          curl -fsSL -o /tmp/act.tar.gz \
            https://github.com/nektos/act/releases/download/v0.2.89/act_Linux_x86_64.tar.gz
          tar -xzf /tmp/act.tar.gz -C "$RUNNER_TEMP/act-bin"
          "$RUNNER_TEMP/act-bin/act" --version

      # ── Imagens locais (o act roda --pull=false) ─────────────────────
      # A custom segue a fonte única vars.BUN_VERSION — o pull falha cedo
      # se o mirror ubuntu-bun não foi re-sincronizado após o bump.
      - name: Puxar imagens do bench
        run: |
          docker pull catthehacker/ubuntu:act-latest
          docker pull "${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/ubuntu-bun:${{ vars.BUN_VERSION }}"

      # ── GATE: startup da custom dentro de +30% da baseline ───────────
      # --image explicita as DUAS imagens (a 1ª = baseline = catthehacker);
      # --assert-pct 30 falha o job se a custom exceder a baseline em >30%
      # (warm-med). 5 runs por imagem (default do script) ~ 5-10 min.
      # O log é capturado (tee) — a tabela de delta vira artifact quando o
      # assert falha, para debug da regressão (mesma simetria do setup-bun-warm).
      - name: Bench startup act (assert delta 30%)
        env:
          ACT_BIN: "${{ runner.temp }}/act-bin/act"
        run: |
          # pipefail EXPLÍCITO (o default do runner já o liga, mas o contrato
          # fica auto-documentado e imune a um override futuro de shell): o
          # tee é o último do pipe — sem pipefail, o exit 0 do tee mascararia
          # a falha do bun run/assert e o job passaria falso-positivo.
          set -eo pipefail
          bun run bench:act-startup --assert-pct 30 \
            --image "catthehacker|catthehacker/ubuntu:act-latest" \
            --image "ubuntu-bun|${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/ubuntu-bun:${{ vars.BUN_VERSION }}" \
            2>&1 | tee /tmp/act-startup-bench.log

      # ── Evidência como artifact (debug de falhas) ────────────────────
      # Tabela de delta completa do bench — útil quando a asserção 30%
      # dispara: mostra run-a-run + cold/warm de ambas as imagens.
      - name: Upload bench log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: act-startup-bench
          path: /tmp/act-startup-bench.log
          if-no-files-found: ignore

  # ── Blob CRLF history audit (semanal) ─────────────────────────────
  # Garante o zero-CRLF NO HISTÓRICO, não só no índice atual. O guard de
  # blob (check-blob-crlf.sh) inspeciona o index/HEAD — um blob CRLF
  # commitado NO PASSADO (ex.: antes do .gitattributes) reproduz CRLF em
  # todo checkout futuro daquele commit. scripts/audit-blob-crlf-history.sh
  # varre TODOS os blobs de .sh/.bash de TODOS os commits via
  # `git cat-file --batch` (wrapper python — byte-exato, robusto no MSYS) e
  # falha o job se QUALQUER blob histórico tiver CRLF.
  #
  # Requer o histórico completo (fetch-depth: 0). Node/Bun não são
  # necessários — o wrapper só precisa de git + python3.
  blob-crlf-history-audit:
    name: Blob CRLF history (zero-CRLF)
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo — auditamos TODOS os blobs

      # ── GATE: nenhum blob histórico de .sh/.bash pode ter CRLF ──────
      # Exit 1 do wrapper = CRLF encontrado no histórico → job falha.
      - name: Auditar blobs CRLF em todo o histórico
        run: |
          bash scripts/audit-blob-crlf-history.sh

  # ── Blob CRLF all-text REPORT → alerta semanal de ALCANCE ───────────
  # O modo --all-text do audit é REPORT (exit 0 SEMPRE — CRLF em .md/.ts/
  # .yml não quebra toolchain; prettier normaliza). O job usa o REPORT para
  # MAPEAR o alcance real de CRLF em blobs commitados antes do
  # .gitattributes e, como ALERTA PERIÓDICO, grepa o output por
  # 'com CRLF' — se o mapeamento revelar CRLF em qualquer tipo com eol=lf,
  # o job falha com aviso claro (vira incidente visível no Actions antes de
  # afetar checkouts futuros), em vez de um mapeamento silencioso.
  #
  # DIFERENÇA vs o job blob-crlf-history-audit (GATE .sh/.bash): este
  # audita os tipos do .gitattributes com 'text eol=lf' (--all-text — a
  # lista é DERIVADA do arquivo em runtime, não hardcoded: um tipo novo
  # adicionado ao .gitattributes entra automaticamente no alerta) e NÃO
  # bloqueia o repo inteiro por um blob .md — falha só para chamar atenção
  # ao escopo. Se o histórico estiver limpo, o sentinel 'com CRLF' não
  # aparece e o job passa silenciosamente.
  #
  # Requer o histórico completo (fetch-depth: 0). Node/Bun não são
  # necessários — só git + python3, como o job irmão acima.
  blob-crlf-all-text-alert:
    name: Blob CRLF all-text (alcance, aviso)
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo — auditamos TODOS os blobs

      # ── REPORT (--all-text): exit 0 sempre — o gatilho é o grep ──────
      # A saída do report com achados contém 'N bloco(s) com CRLF no
      # histórico' — o sentinel 'com CRLF' só existe nesse caso (o estado
      # limpo imprime 'sem CRLF no histórico'). Fail if found → alerta.
      - name: Auditar blobs CRLF em todos os tipos do .gitattributes (REPORT)
        id: alltext
        run: |
          set +e
          bash scripts/audit-blob-crlf-history.sh --all-text | tee all-text-report.txt
          report_exit=${PIPESTATUS[0]}
          set -e
          echo "report_exit=$report_exit" >> "$GITHUB_OUTPUT"
          if grep -Fq 'com CRLF' all-text-report.txt; then
            echo "found_crlf=true" >> "$GITHUB_OUTPUT"
          else
            echo "found_crlf=false" >> "$GITHUB_OUTPUT"
          fi

      # ── ALERTA: achados no REPORT OU falha do audit → falha com aviso.
      # O report_exit está no gate: exit 2 (erro de git / stream cat-file
      # truncado) SEM o sentinel 'com CRLF' não pode passar como limpo —
      # 'não achado' não é evidência de 'limpo' (mesma classe de falso
      # positivo que o repo bloqueia em act-repro-setup-bun/STEP_MISSING).
      - name: Alertar sobre CRLF ou falha do audit (--all-text)
        if: steps.alltext.outputs.report_exit != '0' || steps.alltext.outputs.found_crlf == 'true'
        run: |
          if [ "${{ steps.alltext.outputs.report_exit }}" != "0" ]; then
            echo "::error::Audit --all-text FALHOU (exit ${{ steps.alltext.outputs.report_exit }}) — 'não encontrou CRLF' em uma auditoria quebrada não é evidência de limpo; veja o log do passo anterior."
          else
            echo "::warning::CRLF encontrado no histórico em tipos além de .sh/.bash (veja all-text-report.txt)"
            echo "::error::Alcance do CRLF cresceu — revise all-text-report.txt e decida a correção retroativa (README: Auditoria histórica)."
          fi
          exit 1

      - name: Summary (histórico limpo em todos os tipos)
        if: steps.alltext.outputs.report_exit == '0' && steps.alltext.outputs.found_crlf != 'true'
        run: echo "✅ Nenhum CRLF no histórico em nenhum tipo do .gitattributes (--all-text)."

      # ── Secret leaks baseline (semanal) ────────────────────────────────
  # Revalida SEMANALMENTE que nenhum segredo NOVO entrou no histórico do
  # git. O histórico JÁ tem vazamentos conhecidos (baseline commitado
  # docs/security/secret-leaks-baseline.json — 141 achados em 2026-08; a
  # remediação é filter-repo + rotação, operação deliberada, não CI). Este
  # guard falha SOMENTE se achados NOVOS aparecerem (comparação por
  # assinatura commit+file+line+id+key) — alertando sobre vazamentos
  # futuros antes de virarem incidente.
  #
  # Node puro (sem bun/docker) — o audit usa git log -p --all + regex.
  # Requer o histórico completo (fetch-depth: 0), como o blob-crlf-history.
  # Baseline regenerável: node scripts/check-secret-leaks-baseline.mjs --update
  secret-leaks-audit:
    name: Secret leaks (baseline)
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo — o audit varre git log -p --all

      # ── GATE: QUALQUER achado NOVO falha o job (default) ──────────────
      # O default (sem --min-severity) falha em QUALQUER achado novo por
      # assinatura — incluindo TODOS os de severidade ALTA (chaves privadas,
      # tokens), que é o pedido do parecer. Não passamos --min-severity alta
      # aqui: isso ENFRAQUECERIA o gate (achados novos de severidade média
      # deixariam de falhar). A classificação de severidade (alta/média) fica
      # disponível via --min-severity para quem quiser RELAXAR o gate
      # deliberadamente (ex.: tolerar ruído médio), não para o default.
      - name: Auditar segredos no histórico vs baseline
        run: node scripts/check-secret-leaks-baseline.mjs

      - name: Summary
        run: echo "✅ Nenhum segredo novo no histórico (baseline docs/security/secret-leaks-baseline.json)."

  # ── README reverse semantic audit (semanal) ────────────────────────
  # Revalida SEMANALMENTE que nenhum DRIFT SEMÂNTICO de links do README
  # apareceu. O forward (link quebrado) já é gate no CI/hooks; o --reverse
  # pega o caso que o forward NÃO vê: um link que RESOLVE mas aponta para o
  # heading semanticamente errado (ex.: [CRLF Guard](#normalizador) com um
  # heading 'Normalizador' existente). O pr-check NÃO roda --reverse (0
  # falsos positivos é exigência de PR); este job é a rede de segurança
  # periódica que alerta SEM bloquear PRs.
  #
  # Node puro (sem bun/docker) — o guard spawna check-readme-anchors.mjs
  # --reverse --json e compara com o baseline commitado
  # docs/security/readme-reverse-baseline.json. Falha SOMENTE em achados
  # NOVOS (por assinatura file+slug+label — a linha NÃO participa: o README
  # cresce e as linhas migram). Baseline regenerável:
  # node scripts/check-readme-reverse-baseline.mjs --update
  #
  # ISSUE ACIONÁVEL: quando o GATE falha (achados novos), o step seguinte
  # (if: always()) roda scripts/readme-reverse-issue.mjs — publica UMA issue
  # por achado novo (gh issue create, label readme-drift) com o link + a
  # sugestão do heading correto, transformando o "job falhou" (alerta mudo)
  # em ticket. Dedup por assinatura file+slug+label contra issues abertas —
  # a issue vira o estado da dívida até ser fechada (sem duplicata a cada
  # run semanal). Requer permissions: issues: write.
  readme-reverse-audit:
    name: README reverse semantics (baseline)
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # gh issue create para achados novos de drift semântico

    steps:
      - uses: actions/checkout@v4

      # ── GATE: nenhum achado NOVO além do baseline commitado ──────────
      # Exit 1 = drift semântico novo detectado → job falha (alerta). O step
      # de issue roda DEPOIS (if: always()) — exatamente quando o GATE falha
      # é que o ticket precisa existir.
      - name: Auditar links do README (--reverse) vs baseline
        run: node scripts/check-readme-reverse-baseline.mjs

      # ── ISSUE: publica achados novos como tickets acionáveis ─────────
      # if: always() — roda também quando o GATE falhou (que é o caso com
      # achados novos). O script re-spawna o baseline em REPORT mode (--json),
      # deduplica por assinatura e cria as issues (GH_TOKEN do runner).
      - name: Publicar achados novos como GitHub Issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/readme-reverse-issue.mjs

      - name: Summary
        run: echo "✅ Nenhum drift semântico de links no README (baseline docs/security/readme-reverse-baseline.json)."

  # ── .actrc ↔ vars.BUN_VERSION sync (semanal) ────────────────────────
  # Revalida SEMANALMENTE que o espelho LOCAL do act (.actrc) está em
  # sincronia com a repository variable BUN_VERSION do GitHub.
  #
  # O guard estático scripts/check-bun-mirror.mjs só valida que o .actrc
  # DEFINE BUN_VERSION — o VALOR é impossível de conferir estaticamente (a
  # variável remota só existe em runtime no Actions). Se um dev trocar a
  # repository variable e esquecer o .actrc, o act local testa uma versão
  # DIFERENTE da produção sem o guard estático perceber. Este job passa o
  # valor REAL de vars.BUN_VERSION via --expected e o script emite
  # ::warning:: (NÃO-bloqueante — drift de dev experience, não bug de CI).
  #
  # A ISSUE É O CANAL, não a anotação: um `::warning::` dentro de um run VERDE
  # não é lido por ninguém (o run não fica vermelho em nenhum cenário). Por isso
  # o step `if: always()` roda `scripts/actrc-sync-issue.mjs`, que reusa o MESMO
  # `mirrorDriftReport` do guard (fonte única das regras — a issue e o log não
  # podem discordar) e publica/comenta uma issue com dedup por assinatura.
  # Antes deste step, a documentação prometia "aviso + issue" e a issue não
  # existia em lugar nenhum: alerta mudo.
  actrc-sync:
    name: espelhos ↔ vars.BUN_VERSION (aviso + issue)
    runs-on: self-hosted
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write # a issue é o canal acionável do aviso (o run fica verde de propósito)

    steps:
      - uses: actions/checkout@v4

      # ── Compara os DOIS espelhos do working tree com vars.BUN_VERSION ──
      # `.actrc` e `deploy/env.gitea.example` (o arquivo comitado de onde o
      # deploy/.env.gitea do VPS deriva). Node puro (sem deps) — não precisa
      # de bun para o aviso. O exit 0 em divergência é INTENCIONAL:
      # ::warning:: não quebra o CI — nenhum dos dois espelhos governa
      # corretude de CI (um é a dev experience do act, o outro é a velocidade
      # do runner da forja). Vale a pena avisar mesmo assim porque os dois
      # falham em SILÊNCIO: o env desatualizado deixa o CI igualzinho, só
      # sem o fast path de 0s do tier-1.
      - name: Comparar espelhos (.actrc + env da forja) com vars.BUN_VERSION
        run: |
          node scripts/check-actrc-sync.mjs --expected "${{ vars.BUN_VERSION }}"

      # ── ISSUE: o aviso acima vira ticket acionável ────────────────────────
      # if: always() — roda TAMBÉM quando o guard sai 0 (que é o caso em
      # divergência, por desenho). O script decide sozinho se há drift, com a
      # mesma função do guard, e deduplica por assinatura contra issues abertas
      # (a issue é o estado da dívida até ser fechada, não ruído semanal).
      #
      # E, quando NÃO há drift, ele RECONCILIA: comenta a prova e fecha as
      # issues que ele mesmo abriu. Publicar sem fechar deixava uma dívida
      # MENTINDO no board depois de resolvida — o alerta perderia o valor no
      # próximo bump, que seria investigado duas vezes. Se o drift voltar, a
      # mesma regra abre uma issue nova (o dedup é entre as ABERTAS).
      #
      # NUNCA passe --dry-run aqui: o modo não toca no `gh` de propósito (o
      # contrato dele é não ter efeito nenhum), e a reconciliação sumiria em
      # silêncio dentro de um run verde — o defeito de novo, na forma mais barata.
      # GH_TOKEN explícito: o `gh` do runner já usa o GITHUB_TOKEN por padrão.
      - name: Publicar o drift como Issue acionável (e fechar quando resolver)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/actrc-sync-issue.mjs --expected "${{ vars.BUN_VERSION }}"

  # ── Seed Guards E2E (semanal) ────────────────────────────────────────
  # Revalida SEMANALMENTE que os DOIS seeds (prod + dev) continuam
  # funcionais contra um banco efêmero — espelho do PR check.
  #
  # A definição do job vive no reusable workflow seed-guards.yml
  # (o mesmo usado pelo pr-check) — sem duplicação de lógica.
  seed-guards:
    name: Seed Guards (semanal)
    uses: ./.github/workflows/seed-guards.yml

  # ── Default-branch workflow guard (semanal) ─────────────────────────
  # Valida que os workflows de MEDIÇÃO de CI (ex.: seed-guards.yml — a
  # fonte do tempo real do mutation-coord-update) EXISTEM na branch
  # DEFAULT do repo — prevenindo o falso estado 'pendente de medição':
  # o gh run list responde '404: workflow not found on the default
  # branch' quando o workflow NÃO foi mergeado, e isso PARECE 'nada
  # para medir'. O bloqueio real é o MERGE, não a falta de run — este
  # guard falha com a causa raiz explícita (exit 1) em vez do silêncio
  # ambíguo que deixou a tabela do README 'pendente' para sempre.
  #
  # Fail-closed: exit 1 = workflow ausente (gate — mergeie o branch que
  # o contém); exit 2 = infra (mecanismo de verificação quebrou).
  # GH_TOKEN explícito: o gh do runner já usa o GITHUB_TOKEN por padrão.
  # Não é gate do PR — roda no cron semanal (a default branch muda com o
  # merge, não com o PR em si).
  default-branch-workflow-guard:
    name: Default-branch workflow guard (medição deployada?)
    runs-on: self-hosted
    timeout-minutes: 5

    permissions:
      contents: read # gh api repos/X/contents (existência do workflow)

    steps:
      - uses: actions/checkout@v4

      # ── Valida a existência dos workflows de medição na default ─────
      # NÃO passar --default-branch de propósito: em eventos schedule o
      # github.event.repository é VAZIO (payload mínimo do cron), então o
      # script resolve a branch via gh api repos/X — a única fonte
      # confiável no contexto semanal. Não 'otimizar' para
      # "${{ github.event.repository.default_branch }}" — quebraria o cron.
      - name: Validar workflows de medição na branch default
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-default-branch-workflows.mjs \
            --repo "${{ github.repository }}" \
            --workflow seed-guards.yml \
            --json /tmp/default-branch-guard.json

      # ── Evidência como artifact (debug + insumo da tabela) ──────────
      - name: Upload guard JSON (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: default-branch-workflow-guard
          path: /tmp/default-branch-guard.json
          if-no-files-found: ignore

      # ── Summary (diagnóstico visível no run) ────────────────────────
      - name: Summary
        if: always()
        run: |
          {
            echo '## 🛡️ Default-branch workflow guard (medição deployada?)'
            echo ''
            if [ -f /tmp/default-branch-guard.json ]; then
              node -e "
                const r = require('/tmp/default-branch-guard.json');
                if (r.infra) {
                  console.log('❌ **INFRA**: ' + r.error);
                } else {
                  console.log('Branch default: ' + r.defaultBranch);
                  for (const w of r.workflows) {
                    console.log('- ' + (w.exists ? '✅' : '❌') + ' ' + w.file);
                  }
                  if (!r.allPresent) {
                    console.log('');
                    console.log('❌ **BLOQUEIO REAL**: ' + r.missing.join(', ') + ' não está na default — mergeie o branch que o contém (não é falta de run).');
                  } else {
                    console.log('');
                    console.log('✅ Todos os workflows de medição estão na default branch.');
                  }
                }
              "
            else
              echo '⚠️ Relatório ausente (gh indisponível?)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Mutation coord timing (semanal) ─────────────────────────────────
  # Re-medição semanal do tempo REAL do step 'Run mutation test (contrato
  # coordenado — 5 cenários, 2 elos)' do seed-guards.yml — fecha a linha
  # '~35-45s (est.)¹ pendente de medição real' da tabela de overhead do
  # README com o número verdadeiro, SEM depender de auth local: o gh do
  # runner usa o GITHUB_TOKEN do próprio Actions (autenticado
  # automaticamente) e a jobs API consulta o run ATUAL (github.run_id — o
  # mutation-coord-update é job do seed-guards.yml, um reusable workflow
  # chamado por ESTE arquivo, então os jobs dele aparecem no mesmo run).
  #
  # if: always() + needs: seed-guards: espera o seed-guards terminar, mas
  # mede TAMBÉM quando ele falhou — um timeout de step é exatamente o que
  # a medição deve capturar (se o job estourar os 15 min, o tempo real
  # fica visível em vez de sumir). O script é fail-closed: exit 1 = infra
  # (mecanismo de medição quebrou), exit 2 = drift de contrato (renomearam
  # o step e ninguém percebeu) — 'não achado' não é evidência de 'limpo'
  # (mesma classe do report_exit do blob-crlf-all-text-alert). Sem bun —
  # só node + o gh pré-instalado do runner.
  mutation-coord-timing:
    name: Mutation coord timing (re-medição semanal)
    runs-on: self-hosted
    needs: seed-guards
    if: always() # mede também quando o seed-guards falhou (timeout é o alvo)
    timeout-minutes: 5

    permissions:
      contents: read
      actions: read # gh api jobs (read) + gh run list (read) — NÃO publica baseline (faixa soft DERIVA da mediana)

    steps:
      - uses: actions/checkout@v4

      # ── Mede o tempo real do step no run ATUAL com a faixa soft DERIVADA ──
      # GH_TOKEN explícito: o gh do runner já usa o GITHUB_TOKEN por
      # padrão — explicitar torna o contrato auto-documentado e imune a um
      # override futuro de env. Exit 0 = achado; 1 = infra; 2 = drift.
      # --warn-median 4 --warn-margin 0.2 DERIVA a faixa soft da MEDIANA dos
      # últimos 4 runs medidos do MESMO step (gh run list + jobs API — o
      # mesmo mecanismo do trend guard): o warn se AUTO-AJUSTA ao runner
      # real, sem variable publicada. O gate DURO (--max 240) não muda — o
      # drift é detectado por desvio RELATIVO à mediana, e o primeiro run
      # mede o baseline (::notice:: + gate só no duro).
      - name: Medir tempo do step mutation test (budget 240/mediana 4)
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/measure-mutation-timing.mjs \
            --run "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --max 240 \
            --warn-median 4 \
            --warn-margin 0.2 \
            --json /tmp/mutation-timing.json

      # ── Evidência como artifact (debug + insumo da tabela) ─────────
      - name: Upload timing JSON (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-coord-timing
          path: /tmp/mutation-timing.json
          if-no-files-found: ignore

      # ── Summary (a linha do CI real na tabela do README) ───────────
      - name: Summary
        if: always()
        run: |
          {
            echo '## ⏱️ Mutation coord — tempo real (re-medição semanal)'
            echo ''
            if [ -f /tmp/mutation-timing.json ]; then
              node -e "
                const r = require('/tmp/mutation-timing.json');
                if (r.found) {
                  console.log('| Campo | Valor |');
                  console.log('|---|---|');
                  console.log('| Step | ' + r.stepName + ' |');
                  console.log('| Duração | **' + r.durationSecs + 's** (duro ' + (r.budgetSecs ?? 'n/a') + 's / soft ' + (r.warnSecs ?? 'n/a') + 's) |');
                  console.log('| Conclusão | ' + r.conclusion + ' |');
                  console.log('| Run | ' + r.runId + ' |');
                  if (r.zone === 'fail') console.log('| Budget | ❌ **EXCEDIDO** (faixa dura) — regressão de overhead |');
                  else if (r.zone === 'warn') console.log('| Budget | ⚠️ faixa SOFT (::warning::) — observa o drift antes do gate |');
                  else console.log('| Budget | ✅ dentro do limite |');
                } else {
                  console.log('⚠ Medição falhou: ' + (r.error || 'sem detalhes'));
                }
              "
            else
              echo '⚠ Medição não produziu JSON — veja o passo "Medir tempo do step mutation test".'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Mutation coord TREND (semanal) ──────────────────────────────────
  # Rede de segurança de TENDÊNCIA do overhead do mutation-coord: compara o
  # tempo do step 'Run mutation test (contrato coordenado)' do run ATUAL
  # contra a MEDIANA dos N runs anteriores do MESMO workflow e emite
  # ::warning:: quando o drift relativo passa de X%.
  #
  # Por que existe: o gate duro (--max 240 do mutation-coord-timing) só falha
  # quando o step JÁ estourou o budget. Uma regressão LENTA (40s → 55s → 75s
  # → 90s — ex.: o contrato coordenado ganhou um cenário por release) passa
  # silenciosamente por MESES até cruzar 240s. Este job mede a DERIVADA:
  # drift % do run atual vs a mediana dos anteriores = tendência ANTES do
  # duro disparar (alerta não-bloqueante — o ::warning:: acende no run sem
  # falhar o CI). Mediana (não média): imune a outlier de runner lento.
  #
  # Mecânica: gh run list --workflow benchmark-weekly.yml (o GITHUB_TOKEN do
  # Actions autentica) + jobs API por run para extrair a duração do step
  # (reusa extractMutationStep/computeDurationSecs do medidor — a MESMA fonte
  # do gate). if: always() + needs: seed-guards: mede TAMBÉM quando o
  # seed-guards falhou (timeout é o alvo). Fail-closed: exit 1 = infra, exit
  # 2 = drift de contrato (renomearam o step). Sem bun — só node + gh.
  #
  # Baseline no summary: a mediana dos N anteriores é publicada na tabela do
  # summary (junto com drift % e veredito) — o número que o PR/pre-release
  # deve olhar antes do gate duro.
  mutation-coord-trend:
    name: Mutation coord trend (mediana vs drift %)
    runs-on: self-hosted
    needs: seed-guards
    if: always() # mede também quando o seed-guards falhou (timeout é o alvo)
    timeout-minutes: 5

    permissions:
      contents: read
      actions: read # gh run list + jobs API (só leitura — não publica baseline)

    steps:
      - uses: actions/checkout@v4

      # ── Mede o drift de tendência: run atual vs mediana dos N anteriores ──
      # --window N (default 4) e --max-drift X% (default 30) vêm de vars com
      # fallback — tuning coordenado como o --max/--warn do timing job. O
      # gh do runner usa o GITHUB_TOKEN por padrão (GH_TOKEN explícito =
      # contrato auto-documentado). Exit 0 SEMPRE no drift (::warning:: é
      # não-bloqueante); 1 = infra; 2 = drift de contrato. ATENÇÃO: se o
      # seed-guards falhar ANTES do step de mutation (ex.: erro de bun install
      # no upstream), o step some e este job sai exit 2 — o run semanal fica
      # vermelho de PROPÓSITO (fail-closed), não é contrato quebrado; o
      # artifact/summary (if: always()) guardam a evidência real.
      - name: Medir drift de tendência do mutation-coord (window/mediana)
        id: trend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/measure-mutation-trend.mjs \
            --run "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --window "${{ vars.MUTATION_TIMING_TREND_WINDOW || '4' }}" \
            --max-drift "${{ vars.MUTATION_TIMING_TREND_MAX_DRIFT || '30' }}" \
            --json /tmp/mutation-trend.json

      # ── Evidência como artifact (debug + histórico da tendência) ─────
      - name: Upload trend JSON (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-coord-trend
          path: /tmp/mutation-trend.json
          if-no-files-found: ignore

      # ── Summary (baseline = mediana dos N anteriores publicada) ───────
      - name: Summary
        if: always()
        run: |
          {
            echo '## 📈 Mutation coord — tendência de overhead (mediana vs drift)'
            echo ''
            if [ -f /tmp/mutation-trend.json ]; then
              node -e "
                const r = require('/tmp/mutation-trend.json');
                if (r.current && r.current.found) {
                  console.log('| Campo | Valor |');
                  console.log('|---|---|');
                  console.log('| Run atual | **' + r.current.durationSecs + 's** |');
                  console.log('| Baseline (mediana ' + r.window + ' runs anteriores) | **' + r.medianSecs + 's** |');
                  console.log('| Drift relativo | ' + (typeof r.driftPct === 'number' ? r.driftPct.toFixed(1) + '%' : 'n/a') + ' (limiar ' + r.maxDriftPct + '%) |');
                  if (r.warned) console.log('| Tendência | ⚠️ **ACIMA do limiar** — overhead subindo antes do gate duro disparar |');
                  else console.log('| Tendência | ✅ saudável (dentro do limiar) |');
                  if (r.history && r.history.length) {
                    console.log('');
                    console.log('Últimos ' + r.history.length + ' runs: ' + r.history.map(h => h.durationSecs + 's').join(' → '));
                  }
                } else {
                  console.log('⚠ Tendência não medida: ' + (r.error || 'sem detalhes'));
                }
              "
            else
              echo '⚠ Tendência não produziu JSON — veja o passo "Medir drift de tendência".'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Mutation coord ALERTA (semanal) — o CANAL dos ::warning:: ────────
  # AUDITORIA DOS JOBS PERIÓDICOS: os dois jobs acima terminam VERDES de
  # propósito quando o overhead sobe — o medidor de tendência emite
  # `::warning::` e sai 0, e o medidor de budget faz o mesmo na faixa SOFT.
  # Um aviso dentro de um run verde é alerta MUDO: ninguém abre o log de um
  # cron que passou. Este job é o canal: publica o drift como ISSUE (label
  # `mutation-trend-drift`, dedup por assinatura) e FECHA quando o overhead
  # volta à faixa. O run continua verde — o alerta de TENDÊNCIA é
  # deliberadamente não-bloqueante (transformar o soft no duro apagaria a
  # distinção entre "observa o drift" e "estourou o budget").
  #
  # POR QUE UM JOB SEPARADO (e não um step em cada medidor): os dois medem o
  # MESMO step com limiares diferentes (margem relativa vs drift % por var).
  # Se cada um publicasse/reconciliasse por si, o mais frouxo fecharia a
  # dívida que o mais estrito acabou de abrir — e o limiar é variável, então
  # a aninhagem não pode ser presumida. Aqui os DOIS relatórios entram juntos:
  # `warned` = algum fora da faixa; reconciliar exige TODOS medidos e NENHUM
  # fora. `if: always()` + `needs` nos dois: mede também quando um deles
  # falhou, porque o artifact é `if: always()` e a evidência existe.
  mutation-coord-alert:
    name: Mutation coord overhead (aviso → issue)
    runs-on: self-hosted
    needs: [mutation-coord-timing, mutation-coord-trend]
    if: always()
    timeout-minutes: 5

    permissions:
      contents: read
      actions: read # download-artifact dos dois JSON de medição
      issues: write # a issue é o canal do ::warning:: (o run fica verde)

    steps:
      - uses: actions/checkout@v4

      # ── Os dois relatórios, dos artifacts dos jobs de medição ─────────
      - name: Baixar os relatórios de medição (artifacts)
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-coord-*
          merge-multiple: true
          path: /tmp/mutation-alert

      # ── Publica (ou fecha) — e 'não medido' NUNCA passa como verde ────
      # O `find` resolve a localização REAL dos JSON em vez de cravar um
      # layout de artifact (o upload preserva pedaços do caminho absoluto);
      # sem relatório nenhum o step FALHA — publicar (ou fechar) a partir de
      # nada é a forma mais barata do alerta mudo que este job elimina.
      - name: Publicar o overhead como Issue (fecha quando volta à faixa)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t REPORTS < <(find /tmp/mutation-alert -name 'mutation-*.json' | sort)
          if [ "${#REPORTS[@]}" -eq 0 ]; then
            echo "::error::Nenhum relatório de medição nos artifacts — sem medir, 'não medido' NÃO pode parecer verde."
            exit 1
          fi
          ARGS=()
          for report in "${REPORTS[@]}"; do ARGS+=(--report "$report"); done
          node scripts/mutation-trend-issue.mjs "${ARGS[@]}"
