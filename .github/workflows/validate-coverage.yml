# =============================================================================
# Validate Coverage Gaps — Severinno Marketplace
#
# Reusable workflow that runs npx tsx scripts/coverage-gaps.ts --ci to
# cross-reference all 80 API route.ts files against the 27+ test files and
# fail if any new route is added without a corresponding test.
#
# Usage:
#   jobs:
#     validate-coverage:
#       uses: ./.github/workflows/validate-coverage.yml
#
# Fast gate: <30s (checkout + bun install + prisma generate + tsx run).
# =============================================================================

name: Validate Coverage Gaps

on:
  workflow_call:

jobs:
  validate-coverage:
    name: Coverage Gaps
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Validate all API routes have test coverage
        run: npx tsx scripts/coverage-gaps.ts --ci
