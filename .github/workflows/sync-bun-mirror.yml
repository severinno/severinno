# =============================================================================
# Sync Bun Mirror → GHCR
#
# Espelha o binário do Bun (release bun-v${BUN_VERSION}, linux-x64) para o
# GHCR como uma imagem scratch MÍNIMA (ghcr.io/<owner>/bun:<versão>) com o
# binário em /bun. O setup scripts/setup-bun-ci.sh (tier 3, cold cache)
# puxa DESTA imagem via docker pull + docker create/docker cp —
# pull dentro da rede do GitHub, SEM o rate limit anônimo do GitHub Releases.
#
# Por que não crane copy como o postgis: o postgis já é uma imagem de
# registro; o bun é um binário solto em release zip — é preciso CONSTRUIR a
# imagem a partir do binário. A imagem é scratch (só o binário), ~93MB.
#
# FONTE ÚNICA DA VERSÃO: repository variable BUN_VERSION (vars.BUN_VERSION),
# lida no env abaixo. Trocar o Bun = alterar a variável em UM lugar (Settings
# → Secrets and variables → Actions). O guard scripts/check-bun-mirror.mjs
# falha se este env voltar a ser um literal ou se um default literal voltar
# ao action.yml.
#
# ⚠️ Pacotes GHCR criados via GITHUB_TOKEN nascem PRIVADOS por padrão. O pull
# anônimo (sem login) só funciona para pacotes PÚBLICOS — runners do GitHub
# NÃO se autenticam automaticamente no docker pull do GHCR com o token do
# job. Para o composite action puxar sem login explícito, torne o pacote
# público em: https://github.com/orgs/severinno/packages (não é bloqueante —
# o action tem fallback p/ GitHub Releases se o pull falhar).
#
# Usage:
#   Rode manualmente (workflow_dispatch) ou aguarde o cron semanal.
#
# Exit codes:
#   0 — mirror concluído (push + digest ok)
#   1 — falha (download, build ou push)
# =============================================================================

name: Sync Bun Mirror (GHCR)

on:
  schedule:
    # Semanal 04:23 UTC — revalida o mirror (idempotente; o build é
    # determinístico pois a versão é pinada).
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BUN_VERSION: ${{ vars.BUN_VERSION }}
  # Registry de destino dos mirrors — FONTE ÚNICA (repo variable
  # IMAGE_REGISTRY). Default = o registry OCI próprio (nada muda enquanto a
  # variável não existir).
  # Para o registry OCI do Gitea/Forgejo: defina IMAGE_REGISTRY e os secrets
  # IMAGE_REGISTRY_USER / IMAGE_REGISTRY_TOKEN (o GITHUB_TOKEN do run não
  # autentica em outra forja).
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'git.severinno.cloud' }}
  MIRROR_PREFIX: ${{ vars.IMAGE_REGISTRY || 'git.severinno.cloud' }}/${{ github.repository_owner }}

jobs:
  mirror:
    name: Mirror bun:v${{ vars.BUN_VERSION }} → GHCR
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # ── Valida a repository variable (fail-fast com mensagem clara) ──
      # Sem a variável, o download abaixo montaria um URL quebrado
      # (bun-v/bun-linux-x64.zip) com erro 404 confuso. Falha cedo.
      - name: Validate BUN_VERSION variable
        run: |
          set -euo pipefail
          if [ -z "${BUN_VERSION}" ]; then
            echo "::error::Repository variable BUN_VERSION não definida — crie em Settings → Secrets and variables → Actions (ex.: gh variable set BUN_VERSION 1.3.14)."
            exit 1
          fi
          echo "  ✅ BUN_VERSION=${BUN_VERSION}"

      # ── Download do release zip + extração do binário ────────────────
      - name: Download bun release (linux-x64)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          unzip -qo "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun-extract"
          # O zip extrai para uma pasta bun-linux-x64/bun — normaliza para a
          # raiz do contexto de build (mesmo find/mv do tier 3 do action).
          find "$RUNNER_TEMP/bun-extract" -type f -name bun \
            -exec mv -f {} "$RUNNER_TEMP/bun" \;
          chmod +x "$RUNNER_TEMP/bun"
          "$RUNNER_TEMP/bun" --version

      # ── Build da imagem scratch ───────────────────────────────────────
      # Contexto = diretório contendo o binário `bun` (Dockerfile.bun-mirror
      # faz COPY bun /bun). O checkout fornece o Dockerfile.
      - name: Build scratch image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ctx"
          cp "$RUNNER_TEMP/bun" "$RUNNER_TEMP/ctx/bun"
          docker build \
            -f Dockerfile.bun-mirror \
            -t "${MIRROR_PREFIX}/bun:${BUN_VERSION}" \
            "$RUNNER_TEMP/ctx"

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.IMAGE_REGISTRY_USER || github.actor }}
          password: ${{ secrets.IMAGE_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Push mirror → registry
        run: |
          set -euo pipefail
          docker push "${MIRROR_PREFIX}/bun:${BUN_VERSION}"

      # ── Verify: puxa a imagem publicada e executa o binário (prova que o
      # mirror é consumível — mesmo fluxo do tier 3 do composite action).
      - name: Verify mirror digest
        run: |
          set -euo pipefail
          IMG="${MIRROR_PREFIX}/bun:${BUN_VERSION}"
          CID="$(docker create "$IMG")"
          docker cp "$CID:/bun" "$RUNNER_TEMP/bun-verify"
          docker rm -f "$CID" >/dev/null 2>&1 || true
          chmod +x "$RUNNER_TEMP/bun-verify"
          echo "  ✅ Mirror ok — bun $("$RUNNER_TEMP/bun-verify" --version)"
          echo "  Imagem: ${IMG}"
