# =============================================================================
# guard-gates — Push-triggered vitest net for the guard contract suites
#
# WHY (2026-08): the fragile-range-guard BASELINE (real repo == 0 fragile
# character-class ranges) and the golden-copy-utils divergence guards are
# the contracts that keep the encoding gates honest. They run inside
# test:unit (ci.yml + pr-check.yml check job) and in pr-check.yml's
# fragile-guard job — but those are PR-gated. A push to main/develop that
# skips or reorders the test job would orphan the BASELINE from execution
# entirely (the exact failure mode a lint failure used to cause before the
# test-first reorder). This workflow is the push-time net: a standalone job
# with NO lint dependency — no lint step, no needs: on lint — running ONLY
# the guard suites on every push to main/develop. The BASELINE of 0
# offenders can never become orphaned from execution.
#
# MIRROR of the PR side: pr-check.yml's fragile-guard job runs the SAME
# suites on pull_request (test-first order + this standalone job = double
# immunity there); guard-gates.yml is the merge-side twin (push trigger).
# Both run the identical vitest invocation, so the contract the suites pin
# is exercised on every PR AND every push.
#
# NO paths filter BY DESIGN (same decision as utf8-check.yml): the guard
# suites audit gate files (scripts/*, workflows, root *.sh, hooks) + e2e/ +
# src/ + mini-services/ + .zscripts/ (TARGET_DIRS -- the derived surface).
# A paths filter would have to replicate that derived surface, creating a
# new drift point (exactly what the SPREAD CONTRACT eliminates) -- and a
# push touching only a NEW surface the filter forgot would silently skip
# this net: the orphan risk this workflow exists to close.
#
# COST MEASURED (run 31336318902, Prova 7): the guard pair itself runs in
# 4s of CI time (step "Run guard vitest suites": 21:15:01 -> 21:15:05).
# The job total is ~41s (~45s run-level with queue), and it is fixed setup
# that a filter cannot reduce: checkout 4s + setup-bun 2s + cache restore
# 11s + install 9s = 26s, plus post-step cache upload 10s. NOTE: the
# measured run predates this workflow's scan-timeouts step (added later,
# ~1-2s -- local ground truth 1.6s); the numbers above are the
# pre-scan-timeouts baseline, and the conclusion is unchanged. A filter
# only skips the WHOLE job -- it never makes a running job cheaper -- so it
# would save nothing on gate/src changes and would only skip docs-only
# pushes, which the scan surface does not cover anyway. Local ground truth
# (Windows): test:guard 16.7s + scan-timeouts 1.6s + warm bun install
# 3.4s. Filtering saves nothing meaningful; the unconditional net keeps
# the BASELINE structurally guaranteed to run.
#
# RE-MEASURED (run 31453991361, 2026-08-11, sec 8.1 of gates-proofs.md):
# test:guard grew to 13 suites / 236 tests and the step now takes 20s of
# CI time (02:59:18 -> 02:59:38); the three scanner steps (timeouts +
# curls + eol-anchor) add ~2s; job total stayed stable at ~43s because
# fixed setup (checkout + setup-bun + cache + post) dominates and a paths
# filter cannot reduce it. Local ground truth (Windows, warm): test:guard
# 41.2s + scan-timeouts 1.3s. The no-filter decision is unchanged - sec
# 8.1 recalibrated on the new numbers, conclusion intact.
# =============================================================================

name: Guard Gates

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-gates:
    name: Guard Gates (fragile-range + golden-copy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      # The SAME script as pr-check.yml's fragile-guard job (bun run
      # test:guard — the single source of truth in package.json, so a future
      # guard suite lands in ONE place, not two workflows): fragile-range-
      # guard (repo-wide BASELINE == 0 offenders + the mutation/CLI/growth
      # contracts) and golden-copy-utils (the shared canonicalizer +
      # divergence guards + the writeModuleCopy scaffold). No prisma
      # generate, no build — both suites are pure node subprocess + vitest,
      # exactly like the pr-check twin.
      - name: Run guard vitest suites (BASELINE + divergence guards)
        run: bun run test:guard

      # scan-timeouts — the versioned explicit-timeout gate (see the
      # scanner's header): every subprocess-heavy it()/test() must carry an
      # explicit timeout of its own (the global testTimeout: 30000 safety
      # net in vitest.config.unit.ts covers only tests the guard does NOT
      # flag — a subprocess-heavy test's ceiling must not depend on config
      # defaults). Pure node, no bun deps — runs on the pre-installed runner
      # node, so it sits here as a STANDALONE CLI step (the vitest twin —
      # scripts/__tests__/scan-timeouts.test.ts, BASELINE over the whole
      # surface — runs inside test:unit everywhere). Mirror of the PR side:
      # pr-check.yml's fragile-guard job runs the SAME command.
      - name: Scan subprocess-heavy tests for explicit timeouts
        run: node scripts/scan-timeouts.mjs --ci

      # scan-curl-timeouts — the versioned curl-timeout gate for CI gate
      # scripts (the .sh files DERIVED from .github/workflows/*.yml — a new
      # gate script cited by a workflow is auto-covered): every curl
      # invocation in a gate script must carry an explicit --max-time. WHY:
      # in 2026-08 the security-headers job hung 9:08 in run 31430040398
      # (sec 11.20 + docs/security-headers-gate-2026-08.md) — the site
      # responds in ~200ms, the tail was a stalled curl (HTTP 000000) with
      # NO bound. --connect-timeout is recommended but not required; the
      # --max-time is what bounds the class. Pure node, no bun deps — runs
      # on the pre-installed runner node, same standalone-CLI pattern as
      # scan-timeouts above. The vitest twin
      # (scripts/__tests__/scan-curl-timeouts.test.ts, BASELINE over the
      # derived gate-script surface) runs inside test:unit everywhere.
      - name: Scan gate-script curls for explicit timeouts
        run: node scripts/scan-curl-timeouts.mjs --ci

      # scan-eol-anchor — the versioned EOL-anchor gate for the test/
      # mutation surface, MIRROR of the PR side: pr-check.yml's
      # fragile-guard job runs the SAME command. WHY: a raw
      # `.replace("...\n...")` string anchor silently no-ops on CRLF gate
      # files (Windows autocrlf working tree) — the Prova 17 ACHADO, sec
      # 8.14 of gates-proofs.md; the 1st mutation attempt failed exactly
      # like that. The fix is the shared replaceEolAgnostic helper (CRLF->LF
      # normalize + throw on anchor-miss); this guard fails if the raw
      # idiom returns. Pure node, no bun deps. The vitest twin
      # (scripts/__tests__/scan-eol-anchor.test.ts, BASELINE over the
      # surface) runs inside test:unit everywhere.
      - name: Scan string \n anchors in the test/mutation surface
        run: node scripts/scan-eol-anchor.mjs --ci
