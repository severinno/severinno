# =============================================================================
# Seed Dev E2E — reusable workflow
#
# Valida o seed de DESENVOLVIMENTO (prisma/seed.ts) contra um PostGIS efêmero,
# garantindo que nenhum PR quebre o seed de dev (usuários demo, árvore de
# categorias, bookings/reviews, wipe+recreate idempotente).
#
#   test-seed-dev-e2e.ts (147 checks):
#     - guard recusa em NODE_ENV=production (sem escrever nada)
#     - 9 usuários demo (1 admin + 2 clients + 6 providers)
#     - árvore completa (27 = 3+7+17) com slugs/parents corretos
#     - settings (9), services (13), bookings (4) + payments (4) + reviews (4)
#     - guard contra banco populado não destrói dados (roda antes do wipe)
#     - re-execução idempotente (wipe + recreate → mesmos counts)
#     - guard ENTRE re-execuções (NODE_ENV=production no meio — banco 100% intacto)
#     - cenários SEED_SPEC_PATCH (update mid-cycle + rename via wipe)
#
# Espelho do seed-prod-bootstrap.yml: mesmo service container PostGIS efêmero,
# mesmo cache do Prisma client (SKIP_PRISMA_GENERATE em cache hit), mesmo
# pipeline (.sh com --skip-docker). Imagem via vars.POSTGIS_IMAGE com
# fallback alpine — mire no GHCR com sync-postgis-mirror.yml.
#
# Job PRÓPRIO e INDEPENDENTE do prod E2E: roda em PARALELO aos demais checks
# e não depende do sucesso do seed-prod. Antes, o dev E2E era gateado no
# sucesso do prod dentro do job mesclado seed-guards — um PR que quebrasse o
# seed de dev enquanto o prod falhasse não era detectado. Este job fecha esse
# gap e dá feedback mais rápido.
#
# Centralizado aqui para que PR check e cron semanal validem SEMPRE a mesma
# definição — sem drift entre os dois contextos.
#
# Chamado por:
#   - pr-check.yml          (a cada pull request)
#   - benchmark-weekly.yml  (cron semanal)
# =============================================================================

name: Seed Dev E2E (reusable)

on:
  workflow_call:

jobs:
  seed-dev-e2e:
    name: Seed Dev E2E (147 checks)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # ── Ephemeral PostGIS service container ───────────────────────────
    services:
      postgres:
        image: ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine' }}
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      # ── Cache do Prisma client (keyed no schema + versão do client) ──
      # Mesmo padrão do seed-prod-bootstrap: o cache é restaurado DEPOIS do
      # bun install (senão o install poderia reinstalar/regenerar o client e
      # invalidar o cache restaurado). Em cache hit o .sh roda com
      # SKIP_PRISMA_GENERATE=1 (o generate é determinístico dado o schema).
      - name: Cache Prisma client
        id: prisma-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}-${{ hashFiles('bun.lock') }}
          restore-keys: prisma-

      # ── PostGIS extension no service container ──────────────────────
      # A imagem postgis só habilita a extensão em postgres/template_postgis,
      # NÃO no POSTGRES_DB (criado de template1) — sem ela o prisma db push
      # falha nas colunas Unsupported("geography(Point, 4326)"). Não dá para
      # usar init-script montado aqui: o service container inicia ANTES do
      # checkout (workspace vazio) — por isso o docker exec explícito.
      - name: Enable PostGIS extension
        run: |
          docker exec ${{ job.services.postgres.id }} \
            psql -U severinno -d severinno -c "CREATE EXTENSION IF NOT EXISTS postgis"

      # ── DEV E2E ─────────────────────────────────────────────────────
      # Container FRESCO neste job (sem o prod E2E antes) — então o .sh faz
      # prisma generate (se cache miss) + db push (schema) + validator.
      # O dev seed faz wipe+recreate: a re-execução idempotente é validada
      # dentro do próprio E2E (cenário 8).
      - name: Run seed-dev E2E
        id: dev
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
          SKIP_PRISMA_GENERATE: ${{ steps.prisma-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          bun run test:seed-dev-e2e --skip-docker
          echo "  ✅ Seed dev E2E passou (147 checks)"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🌱 Seed Dev E2E'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Dev E2E (147 checks) | ${{ steps.dev.conclusion == 'success' && '✅' || '❌' }} |"
            echo "| Imagem PostGIS | ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine (default)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
