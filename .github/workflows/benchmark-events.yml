# =============================================================================
# Benchmark Events — Consolidated
#
# Merge of benchmark-pr-comment.yml + benchmark-auto-baseline.yml:
#
# 1. PR Comment: Posts benchmark diff as PR comment after PR Check completes
# 2. Auto-Baseline: Updates baseline JSONs on push to main (specific paths)
#
# Preserves all functionality from the original workflows.
# =============================================================================

name: Benchmark Events

on:
  # ── PR Comment trigger (was benchmark-pr-comment.yml) ──────────────
  workflow_run:
    workflows: ["PR Check"]
    types:
      - completed

  # ── Auto-Baseline trigger (was benchmark-auto-baseline.yml) ───────
  push:
    branches: [main]
    paths:
      - "src/lib/geo-shared.ts"
      - "src/lib/distance-fallback.ts"
      - "src/lib/radius-expansion.ts"
      - "src/lib/fetch-providers-data.ts"
      - "src/lib/fetch-unrestricted-results.ts"
      - "src/lib/sql-builder.ts"
      - "src/lib/benchmark-utils.ts"
      - "src/lib/cpu-calibrate.ts"
      - "scripts/geo-benchmark.mjs"
      - "scripts/cache-benchmark.mjs"
      - "scripts/compare-benchmarks.mjs"
      - "scripts/run-benchmark.mjs"

  workflow_dispatch:

concurrency:
  group: benchmark-events-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  NODE_ENV: development

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # JOB 1: PR Comment (was benchmark-pr-comment.yml)
  # Posts benchmark diff as PR comment after PR Check completes
  # ══════════════════════════════════════════════════════════════════════
  comment:
    name: Post Benchmark Comment
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout default branch (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Download artifact from the triggering PR Check run ─────────────
      - name: Download benchmark artifact from PR Check run
        uses: actions/download-artifact@v4
        with:
          name: geo-benchmark
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Extract PR number from the triggering workflow run ────────────
      - name: Extract PR number
        id: pr-info
        run: |
          PR_NUMBER='${{ github.event.workflow_run.pull_requests[0].number }}'
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "number=0" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      # ── Auto-detect threshold based on changed files ──────────────────
      - name: Auto-detect threshold
        id: threshold
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr-info.outputs.number }}', 10);

            if (!prNumber || prNumber === 0) {
              core.setOutput('value', '5');
              return;
            }

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const benchmarkPaths = [
              'src/lib/geo-shared.ts',
              'src/lib/distance-fallback.ts',
              'src/lib/radius-expansion.ts',
              'src/lib/fetch-providers-data.ts',
              'src/lib/fetch-unrestricted-results.ts',
              'src/lib/sql-builder.ts',
              'src/app/api/providers/route.ts',
              'scripts/geo-benchmark.mjs',
              'scripts/compare-benchmarks.mjs',
              'scripts/run-benchmark.mjs',
            ];

            const changedFiles = files.map(f => f.filename);
            const touchesBenchmark = benchmarkPaths.some(p => changedFiles.includes(p));

            core.setOutput('value', touchesBenchmark ? '10' : '5');

      # ── Check if baseline exists on main ──────────────────────────────
      - name: Check baseline
        id: baseline
        run: |
          if [ -f docs/benchmarks/geo-baseline.json ]; then
            echo "baseline_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "baseline_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Compare ───────────────────────────────────────────────────────
      - name: Compare with baseline
        id: compare
        if: steps.baseline.outputs.baseline_exists == 'true'
        continue-on-error: true
        env:
          BENCHMARK_THRESHOLD: ${{ steps.threshold.outputs.value }}
        run: |
          node scripts/compare-benchmarks.mjs \
            docs/benchmarks/geo-baseline.json \
            docs/benchmarks/geo-latest.json \
            2>&1 | tee /tmp/benchmark-diff.txt

      - name: Capture diff output (no baseline)
        if: steps.baseline.outputs.baseline_exists != 'true'
        run: |
          echo "No baseline available on main branch yet." > /tmp/benchmark-diff.txt
          echo "" >> /tmp/benchmark-diff.txt
          node -e "
            const d = JSON.parse(require('fs').readFileSync('docs/benchmarks/geo-latest.json','utf8'));
            console.log('This PR introduces the first geo-benchmark results.');
            console.log('');
            console.log('| Benchmark | Mean (µs) | Min (µs) | Max (µs) | ops/sec |');
            console.log('|---|---|---|---|---|');
            d.benchmarks.forEach(b => {
              console.log('|', b.name, '|', b.mean, '|', b.min, '|', b.max, '|', b.opsPerSec, '|');
            });
          " >> /tmp/benchmark-diff.txt

      # ── Publish job summary ──────────────────────────────────────────
      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo '## 📊 Geo-Benchmark Comparison'
            echo ''
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Threshold | ${{ steps.threshold.outputs.value }}% |"
            echo "| Baseline | $(if [ -f docs/benchmarks/geo-baseline.json ]; then echo 'loaded'; else echo 'none'; fi) |"
            echo ''
            echo '```'
            cat /tmp/benchmark-diff.txt 2>/dev/null || echo 'No benchmark data available.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Post PR comment ───────────────────────────────────────────────
      - name: Post PR comment
        if: steps.pr-info.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diffText = fs.readFileSync('/tmp/benchmark-diff.txt', 'utf-8');
            const baselineExists = '${{ steps.baseline.outputs.baseline_exists }}' === 'true';
            const prNumber = parseInt('${{ steps.pr-info.outputs.number }}', 10);
            const threshold = '${{ steps.threshold.outputs.value }}';

            const current = JSON.parse(fs.readFileSync('docs/benchmarks/geo-latest.json', 'utf-8'));
            const cpu = current.meta.cpuItersPerMs;

            const header = baselineExists
              ? '## 📊 Geo-Benchmark Diff\n\nPerformance comparison against the **main** baseline.'
              : '## 📊 Geo-Benchmark Results\n\nThis is the first benchmark run — no baseline from main yet.';

            const meta = '\n\n**Environment:** `' + current.meta.platform + ' ' + current.meta.arch + '` · Node ' + current.meta.nodeVersion + ' · CPU ' + cpu + ' iters/ms\n**Threshold:** ' + threshold + '%\n';

            const body = header + meta + '\n```\n' + diffText + '\n```';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComments = comments.filter(c =>
              c.user.type === 'Bot' && c.body?.startsWith('## 📊 Geo-Benchmark')
            );

            for (const c of botComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: c.id,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body,
            });

      # ── Fail if regression detected ───────────────────────────────────
      - name: Fail on regression
        if: steps.compare.outcome == 'failure' || steps.compare.conclusion == 'failure'
        run: |
          echo "❌ Performance regression detected — see PR comment and job summary above for details."
          exit 1

  # ══════════════════════════════════════════════════════════════════════
  # JOB 2: Auto-Baseline (was benchmark-auto-baseline.yml)
  # Updates baseline JSONs on push to main
  # ══════════════════════════════════════════════════════════════════════
  auto-baseline:
    name: Auto-Baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Geo baseline ──────────────────────────────────────────────────
      - name: Run geo benchmark
        run: |
          node scripts/run-benchmark.mjs --type geo --baseline

      # ── Cache baseline ────────────────────────────────────────────────
      - name: Run cache benchmark
        run: |
          node scripts/run-benchmark.mjs --type cache --baseline

      # ── Search baseline ───────────────────────────────────────────────
      - name: Run search benchmark
        run: |
          node scripts/run-benchmark.mjs --type search --baseline

      # ── Validate baseline JSONs ───────────────────────────────────────
      - name: Validate baseline JSON files
        run: |
          node -e "
            const fs = require('fs');
            const g = JSON.parse(fs.readFileSync('docs/benchmarks/geo-baseline.json','utf-8'));
            const c = JSON.parse(fs.readFileSync('docs/benchmarks/cache-baseline.json','utf-8'));
            const s = JSON.parse(fs.readFileSync('docs/benchmarks/search-baseline.json','utf-8'));
            if (!g.meta || !Array.isArray(g.benchmarks) || g.benchmarks.length === 0) {
              throw Error('geo-baseline.json: invalid or empty');
            }
            if (!c.meta || !Array.isArray(c.benchmarks) || c.benchmarks.length === 0) {
              throw Error('cache-baseline.json: invalid or empty');
            }
            if (!s.meta || !Array.isArray(s.benchmarks) || s.benchmarks.length === 0) {
              throw Error('search-baseline.json: invalid or empty');
            }
            console.log('  ✅ Baseline validation passed');
            console.log('  · geo-baseline.json:    ' + g.benchmarks.length + ' benchmarks, ' + g.meta.platform + ' ' + g.meta.arch);
            console.log('  · cache-baseline.json:  ' + c.benchmarks.length + ' benchmarks, ' + c.meta.platform + ' ' + c.meta.arch);
            console.log('  · search-baseline.json: ' + s.benchmarks.length + ' benchmarks, ' + s.meta.platform + ' ' + s.meta.arch);
          "

      # ── Check for actual changes ───────────────────────────────────────
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/benchmarks/geo-baseline.json docs/benchmarks/cache-baseline.json docs/benchmarks/search-baseline.json; then
            echo "No baseline files changed."
            echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Commit and push ───────────────────────────────────────────────
      - name: Commit updated baseline
        if: steps.changes.outputs.HAS_CHANGES == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/geo-baseline.json docs/benchmarks/cache-baseline.json docs/benchmarks/search-baseline.json
          git commit -m "chore: auto-atualizar baselines de benchmark (merge em main)

          Re-executa geo-benchmark, cache-benchmark e search-benchmark
          apos merge em main e atualiza os arquivos de baseline para
          manter referencias frescas para comparacao em PRs.

          🤖 Generated with Codebuff"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
