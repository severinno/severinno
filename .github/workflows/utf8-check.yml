# =============================================================================
# utf8-check — Reusable UTF-8 encoding + line-ending validation workflow
#
# Call from other workflows via:
#
#   jobs:
#     utf8-check:
#       uses: ./.github/workflows/utf8-check.yml
#
# Four fast gates (each <10s, no deps beyond python3/bash/node pre-installed):
#
#   1. UTF-8: validates all .ts/.tsx source files against UTF-8 encoding to
#      prevent Windows-1252 byte-0x97 corruption (common on Brazilian Windows
#      setups). Uses Python's UTF-8 decoder (equivalent to iconv -f utf-8)
#      with safe byte-0x97 detection that avoids false positives on valid
#      multi-byte sequences (e.g. emoji like 🔗 = F0 9F 94 97).
#
#   2. CRLF: fails if any tracked .sh/.bash file has CRLF in the working
#      tree. Git Bash tolerates CRLF, but Linux containers (act/CI) do not
#      ('set: pipefail: invalid option name'). See scripts/check-crlf.sh.
#      The BLOB CRLF guard (check-blob-crlf.sh) additionally fails on
#      i/crlf or i/mixed in committed blobs.
#      CRLF SCOPE guard (check-crlf-scope.mjs): locks the intentional
#      decision that the CRLF guards scan ONLY *.sh/*.bash — never
#      .ts/.tsx (CRLF in .ts/.tsx breaks nothing; blobs are 100% LF via
#      .gitattributes; prettier+lint-staged normalize on commit). Fails if
#      someone extends the git ls-files pathspecs of the CRLF guards.
#
#   3. Single-line out=: fails if a tracked .sh/.bash under scripts/ has
#      `command "..." out=$(...)` on ONE line — `out=` becomes a positional
#      argument (never set), so the script silently breaks while count
#      strings still pass the check-e2e-counts guard. See
#      scripts/check-single-line-out-assign.sh.
#
#   4. No setup-bun: fails if any workflow uses oven-sh/setup-bun@v2 — the
#      external action re-downloads the LATEST Bun release on every job
#      (~25-35s/job). All workflows must use the local composite action
#      ./.github/actions/setup-bun (pre-installed fast path + actions/cache
#      keyed on the pinned version). See scripts/check-no-setup-bun.mjs.
#
#   5. Bun mirror: fails if the GHCR mirror workflow (sync-bun-mirror.yml)
#      is missing, its BUN_VERSION doesn't reference the repository variable
#      vars.BUN_VERSION (single source), the setup-bun action pins a literal
#      default (metadata can't evaluate ${{ }}), a literal Bun version
#      appears anywhere in workflows, the action's cold-cache tier no longer
#      references the mirror (ghcr.io/<owner>/bun:<version>), or .actrc
#      doesn't define BUN_VERSION (act local). See scripts/check-bun-mirror.mjs.
#
#   6. README repro marker: fails if the README mentions repro commands of
#      bugs ALREADY FIXED without a temporal marker (e.g. "hoje não é
#      reproduzível em main") — prevents stale docs when a bug is migrated.
#      See scripts/check-readme-repro-marker.mjs.
#
#   7. README anchors: fails if an internal link [text](#slug) in the README
#      doesn't resolve to a real heading, using the EXACT github-slugger
#      algorithm (accented chars kept, em dash removed, spaces→hyphens, no
#      collapse) — catches a heading renamed without updating its links.
#      See scripts/check-readme-anchors.mjs.
#
#   8. UTF-8 scope: fails if check-utf8.sh or check_utf8.py is called WITHOUT
#      the 'src/' directory argument, or with a different directory — locks
#      the intentional decision that the UTF-8 scanner only walks src/ (not
#      node_modules/, .next/, or other dirs). Mirror of the CRLF scope guard.
#      See scripts/check-utf8-scope.mjs.
#
#   9. README TOC: fails if a section TOC (index) of the README points to a
#      nonexistent heading, OR a new direct child heading of a section that
#      declares a TOC is left out of the index — bidirectional, catching
#      stale TOC links AND incomplete indexes when headings are added or
#      renamed. Reuses the github-slugger from check-readme-anchors.mjs.
#      See scripts/check-readme-toc.mjs.
#
#  10. README images: fails if any image in the README doesn't resolve — a
#      RELATIVE path must exist on disk (GitHub renders relative to the
#      markdown file), http(s) URLs must be syntactically valid (scheme +
#      host; --network additionally does a real HEAD per URL, but that mode
#      is opt-in and out of this fast gate), and unsupported schemes
#      (mailto:, ftp:) are violations. data: URIs and {owner}/{repo} template
#      placeholders are intentionally exempt (never broken in the rendered
#      page). Covers BOTH markdown `![alt](src)` and HTML `<img src=...>`
#      syntaxes, fence-aware (images inside code blocks don't count).
#      See scripts/check-readme-images.mjs.
# =============================================================================

name: UTF-8 Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  utf8-check:
    name: UTF-8 Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run UTF-8 validation on all .ts and .tsx files
        run: bash scripts/check-utf8.sh --ci src/

      - name: Run UTF-8 scope guard (check-utf8 only walks src/)
        run: node scripts/check-utf8-scope.mjs

      - name: Run CRLF guard on tracked .sh/.bash files (working tree)
        run: bash scripts/check-crlf.sh --ci

      - name: Run CRLF scope guard (CRLF guards scan only *.sh/*.bash)
        run: node scripts/check-crlf-scope.mjs

      - name: Run BLOB CRLF guard on tracked .sh/.bash files (committed)
        run: bash scripts/check-blob-crlf.sh --ci

      - name: Run single-line out= assignment guard on scripts/
        run: bash scripts/check-single-line-out-assign.sh --ci

      - name: Run encoding-guards badge guard (README badge ↔ table)
        run: node scripts/check-encoding-guards-badge.mjs

      - name: Run no-setup-bun guard on workflows
        run: node scripts/check-no-setup-bun.mjs

      - name: Run bun-mirror guard (GHCR mirror ↔ action version)
        run: node scripts/check-bun-mirror.mjs

      - name: Run README repro-marker guard (stale docs for fixed bugs)
        run: node scripts/check-readme-repro-marker.mjs

      - name: Run README anchors guard (internal #slug links ↔ real headings)
        run: node scripts/check-readme-anchors.mjs

      - name: Run README TOC guard (section indexes ↔ headings, forward + reverse + label)
        run: node scripts/check-readme-toc.mjs

      - name: Run README images guard (images ↔ existing files / valid URLs)
        run: node scripts/check-readme-images.mjs

      - name: Run hooks-symmetry guard (README Git Hooks table ↔ .husky/*)
        run: node scripts/check-hooks-symmetry.mjs

      - name: Summary
        run: echo "All source files validated as valid UTF-8, LF line endings, locked CRLF scope (.sh/.bash only), and clean shell assignments."
