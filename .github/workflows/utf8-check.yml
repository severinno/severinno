# =============================================================================
# utf8-check — Reusable encoding validation workflow
#
# Call from other workflows via:
#
#   jobs:
#     utf8-check:
#       uses: ./.github/workflows/utf8-check.yml
#
# SINGLE ENTRY (since 2026-08): the ONE command this workflow runs is
#   bash scripts/verify-encoding.sh --ci src/
# which consolidates the encoding gates that used to be separate steps
# (they share ~0.9s of interpreter startup, so one step pays it once):
#   1. check-utf8.sh — valid UTF-8 for .ts/.tsx/.sh (Windows-1252 byte-0x97
#      prevention via Python's UTF-8 decoder, safe on valid multi-byte
#      sequences e.g. emoji 🔗 = F0 9F 94 97). ALL .sh pure-ASCII checking
#      is delegated to layer 2 (the always-on VPS gate and the --ascii
#      opt-in scan were removed as redundant — see check-utf8.sh header).
#   2. verify-ascii-proof.sh — strict repo-wide pure-ASCII proof on every .sh
#      + .husky hook + the frozen docs/ascii-safe.md baseline drift check
#   3. fragile-range-patterns.mjs --ci — the fragile character-class RANGE
#      scan (the 2026-08 em-dash bug class: `[^ -~]`, `[\x80-\xFF]`,
#      `[:print:]`, grep -P ranges). Same patterns the vitest guard imports;
#      wired here so the class is blocked even when the gate runs without
#      the vitest suite (someone running only check-utf8/verify-ascii-proof
#      used to never execute the guard).
#   4. scan-non-ascii.mjs --utf8 --report over the YAML GATE files
#      (.github/workflows/*.yml + .github/actions/*/action.yml) — BLOCKING
#      UTF-8 well-formedness scan (the corruption class). A corrupt byte
#      (0x97) in a workflow YAML BREAKS the parse entirely (js-yaml and
#      PyYAML both throw "invalid start byte") — the workflow silently
#      fails to load and CI checks silently stop running, so unlike the
#      docs surface (informational docs-encoding job) this layer BLOCKS.
#      Legit accents/em-dashes in workflow comments are valid UTF-8 and
#      pass. Surface: git ls-files of the gate files (not docker-compose*).
#   5. scan-non-ascii.mjs --report over the scripts/*.mjs GATE files —
#      BLOCKING pure-ASCII scan (byte >= 0x80). The 1:1 ASCII conversion
#      the .sh files got (f17ffdd) never reached the .mjs — a stray
#      accent/emoji/em-dash in a gate .mjs is the same silent-failure
#      class as a .sh. Surface DERIVED from encoding-surface.mjs
#      --print-mjs-gate (MJS_GATE_PATTERNS), same single-source pattern
#      as layer 4.
# The exit code is the worst of the five layers. Scripts stay directly
# invokable for their focused use (--fix, --sync, --dry-run).
#
# TRIGGER MODEL (single source of truth, since 2026-08): the check command
# lives ONLY here, and every caller uses workflow_call — ci.yml, pr-check.yml,
# deploy.yml, e2e-cache.yml, release-deploy.yml. There is NO pull_request
# self-trigger anymore: that was triplication on PR (this workflow's own PR
# trigger + ci.yml's workflow_call + pr-check.yml's inline copy). PR coverage
# comes from the ci.yml + pr-check.yml callers; the push trigger remains the
# always-on net for main/develop merges. Edit the step HERE only.
#
# NO paths filter on the push trigger BY DESIGN (decision recorded 2026-08):
# this gate audits MORE than e2e/ + src/ - layer 2 scans every .sh + .husky
# hook + the docs/ascii-safe.md baseline, and layer 3 scans the gate files
# (scripts/*, workflows, root *.sh) too. A filter limited to e2e/** src/**
# would silently skip this self-trigger on exactly the gate-file changes
# these layers exist to catch. The consolidated gate is one <3s step, so
# filtering saves nothing meaningful; real coverage comes from the callers
# (ci.yml invokes this on every main/develop push, unfiltered).
#
# PROOF that this gate really bites (run locally, no CI needed):
#   1. cp scripts/health-check.sh /tmp/hc.bak
#   2. printf '\x97' >> scripts/health-check.sh   # Windows-1252 em dash byte
#   3. bash scripts/verify-encoding.sh --ci src/  # -> exit 1, flags health-check.sh
#      (both layers hit: check_utf8.py byte-0x97 warning AND the delegated
#       proof — layer 2 — reporting scripts/health-check.sh; line:col is the
#       observed value, e.g. 50:1, and drifts as the script evolves)
#   4. git checkout -- scripts/health-check.sh    # revert (verified byte-identical to HEAD)
#   5. bash scripts/verify-encoding.sh --ci src/  # -> exit 0, all clean
#
# Fast gate: <3s, no dependencies beyond python3 + node (both pre-installed on runners).
# =============================================================================

name: UTF-8 Check

on:
  push:
    branches: [main, develop]
  workflow_call:

jobs:
  utf8-check:
    name: UTF-8 Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ONE command = the whole encoding gate (see header): UTF-8 validity +
      # VPS ASCII gate + strict repo-wide ASCII proof + frozen baseline +
      # the fragile character-class RANGE scan (2026-08 bug class) + the
      # YAML gate UTF-8 scan + the scripts/*.mjs pure-ASCII scan. All
      # covered by verify-encoding.sh now.
      - name: Run encoding validation (UTF-8 + VPS ASCII + ASCII-proof + fragile-range + baseline + YAML gate + .mjs ASCII)
        run: bash scripts/verify-encoding.sh --ci src/

      - name: Summary
        run: echo 'All sources validated (UTF-8 for .ts/.tsx/.sh, pure-ASCII for every .sh + .husky hook + every scripts/*.mjs gate file).'
