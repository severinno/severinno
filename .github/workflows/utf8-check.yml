# =============================================================================
# utf8-check — Reusable UTF-8 encoding validation workflow
#
# Call from other workflows via:
#
#   jobs:
#     utf8-check:
#       uses: ./.github/workflows/utf8-check.yml
#
# Validates all .ts/.tsx source files against UTF-8 encoding to prevent
# Windows-1252 byte-0x97 corruption (common on Brazilian Windows setups).
# Uses Python's UTF-8 decoder (equivalent to iconv -f utf-8) with safe
# byte-0x97 detection that avoids false positives on valid multi-byte
# sequences (e.g. emoji like 🔗 = F0 9F 94 97).
#
# Fast gate: <10s, no dependencies beyond python3 (pre-installed on runners).
# =============================================================================

name: UTF-8 Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  utf8-check:
    name: UTF-8 Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run UTF-8 validation on all .ts and .tsx files
        run: bash scripts/check-utf8.sh --ci src/

      - name: Summary
        run: echo "All source files validated as valid UTF-8 encoding."
