name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Origem das imagens — FONTE ÚNICA (repo variable IMAGE_REGISTRY).
  # O default é o registry OCI próprio (o Gitea/Forgejo da própria operação); a
  # variável da forja é a fonte única e sobrepõe este default. O path é
  # <namespace>/<repo>, então vars.IMAGE_NAME cobre o caso de o path não ser
  # <owner>/<repo>.
  # Guard: `bun run check:registry-source`.
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'git.severinno.com' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}

jobs:
  # UTF-8 Encoding Gate ----------------------------------------------------
  # Fast gate: <10s. Validates encoding before building Docker images.
  utf8-check:
    uses: ./.github/workflows/utf8-check.yml

  # Seed Test Hooks Guard ------------------------------------------------
  # Fail-closed gate ANTES de tocar produção: SEED_SPEC_PATCH e
  # PROD_SEED_ALLOW_DEV são hooks TEST-ONLY (E2Es de seed contra banco
  # efêmero). Se aparecerem neste workflow de produção (ou em qualquer
  # workflow fora do allowlist de teste), o guard falha e o deploy não roda
  # — impedindo que o seed de produção rode com spec patchado ou com o
  # guard de produção contornado.
  seed-hooks-guard:
    name: Seed Test Hooks Guard
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # O guard lê os workflows com `js-yaml` (dependência do repositório, via
      # `scripts/forge-workflows.mjs`): sem `node_modules` ele cai no fail-closed e
      # reprova todos os arquivos, barrando o deploy por um defeito do PRÓPRIO job.
      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Check no seed test hooks in non-test workflows
        run: node scripts/check-seed-hooks.mjs

  # Docker Build & Test (local, no push) ----------------------------------
  # Builds the image locally and runs a health-check smoke test to catch
  # runtime regressions before the image is pushed to the registry.
  docker-test:
    name: Docker Build & Test
    needs: [utf8-check, seed-hooks-guard]
    runs-on: self-hosted
    timeout-minutes: 20

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally, no push)
        uses: docker/build-push-action@v6
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          BUN_VERSION: ${{ vars.BUN_VERSION }}
        with:
          context: .
          load: true
          push: false
          tags: severinno-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_AUTH_TOKEN=${{ env.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ env.SENTRY_ORG }}
            SENTRY_PROJECT=${{ env.SENTRY_PROJECT }}
            BUN_VERSION=${{ env.BUN_VERSION }}

      - name: Start container
        run: |
          docker run -d \
            --name severinno-test \
            --network host \
            -e DATABASE_URL="postgresql://severinno:severinno@127.0.0.1:5432/severinno" \
            -e REDIS_URL="redis://127.0.0.1:6379" \
            -e SESSION_SECRET="test-secret-at-least-32-chars-long" \
            -e NODE_ENV=production \
            severinno-test:latest

      - name: Wait for health check
        run: |
          for i in $(seq 1 20); do
            sleep 3
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "503" ]; then
              echo "Health check passed (HTTP $HTTP_CODE) after ${i}s"
              exit 0
            fi
            echo "Attempt $i/20 - HTTP $HTTP_CODE"
          done
          echo "Health check failed after 20 attempts"
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs severinno-test 2>&1 | tail -50

      - name: Clean up container
        if: always()
        run: docker rm -f severinno-test 2>/dev/null || true

  build:
    needs: [docker-test]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and push app image
        uses: docker/build-push-action@v6
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          BUN_VERSION: ${{ vars.BUN_VERSION }}
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_AUTH_TOKEN=${{ env.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ env.SENTRY_ORG }}
            SENTRY_PROJECT=${{ env.SENTRY_PROJECT }}
            BUN_VERSION=${{ env.BUN_VERSION }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:worker-${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUN_VERSION=${{ vars.BUN_VERSION }}

      # Caddy com os plugins que o Caddyfile.prod exige (rate_limit +
      # transform-encoder — ver Dockerfile.caddy). Duas tags: a FIXA
      # caddy-2.11.4-plugins (a que o compose declara) e caddy-<sha> para
      # rollback exato. Publicar AQUI evita compilar xcaddy na VPS a cada
      # deploy (o job pr-check já valida o parse com essa imagem).
      - name: Build and push caddy image (plugins)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:caddy-2.11.4-plugins
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:caddy-${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    needs: build
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Run database migrations
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            echo "Running database migrations..."
            docker compose run --rm --no-deps app bunx prisma migrate deploy || \
              docker compose run --rm --no-deps app bunx prisma db push --accept-data-loss

  deploy:
    needs: migrate
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            echo "Pulling new images..."
            # caddy incluso: a tag caddy-2.11.4-plugins é publicada no build
            # acima; up -d é idempotente (só recria o edge se a imagem/compose mudou).
            docker compose pull app realtime email-worker notification-worker caddy
            echo "Restarting services..."
            docker compose up -d --no-deps --remove-orphans app realtime caddy
            docker compose --profile workers up -d --no-deps email-worker notification-worker
            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              sleep 5
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Health check passed (HTTP $HTTP_CODE)"
                # Clean up old images
                docker image prune -f
                exit 0
              fi
              echo "Attempt $i/12 — HTTP $HTTP_CODE, retrying..."
            done
            echo "Health check failed after 12 attempts" && exit 1
