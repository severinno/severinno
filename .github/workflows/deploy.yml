name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Dispatch com census_only=true roda APENAS o censo de SVG legado na VPS
      # (dry-run, leitura pura) e pula TODOS os jobs de deploy — é o gatilho
      # manual do alarme semanal /api/cron/svg-legacy-census.
      census_only:
        description: "Só o censo SVG (dry-run na VPS); pula o deploy"
        type: boolean
        default: false
        required: false

concurrency:
  group: deploy-${{ github.ref }}
  # Expressão (não literal): o censo NÃO pode cancelar um deploy em andamento
  # (group é o mesmo — mesma branch). Só deploy cancela deploy.
  cancel-in-progress: "${{ github.event_name == 'workflow_dispatch' && !inputs.census_only }}"

env:
  # Origem das imagens — FONTE ÚNICA (repo variable IMAGE_REGISTRY).
  # O default é o registry OCI próprio (o Gitea/Forgejo da própria operação); a
  # variável da forja é a fonte única e sobrepõe este default. O path é
  # <namespace>/<repo>, então vars.IMAGE_NAME cobre o caso de o path não ser
  # <owner>/<repo>.
  # Guard: `bun run check:registry-source`.
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'git.severinno.com' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}

jobs:
  # UTF-8 Encoding Gate ----------------------------------------------------
  # Fast gate: <10s. Validates encoding before building Docker images.
  utf8-check:
    uses: ./.github/workflows/utf8-check.yml

  # Seed Test Hooks Guard ------------------------------------------------
  # Fail-closed gate ANTES de tocar produção: SEED_SPEC_PATCH e
  # PROD_SEED_ALLOW_DEV são hooks TEST-ONLY (E2Es de seed contra banco
  # efêmero). Se aparecerem neste workflow de produção (ou em qualquer
  # workflow fora do allowlist de teste), o guard falha e o deploy não roda
  # — impedindo que o seed de produção rode com spec patchado ou com o
  # guard de produção contornado.
  seed-hooks-guard:
    name: Seed Test Hooks Guard
    runs-on: self-hosted
    if: "!(github.event_name == 'workflow_dispatch' && inputs.census_only)"
    steps:
      - uses: actions/checkout@v4

      # O guard lê os workflows com `js-yaml` (dependência do repositório, via
      # `scripts/forge-workflows.mjs`): sem `node_modules` ele cai no fail-closed e
      # reprova todos os arquivos, barrando o deploy por um defeito do PRÓPRIO job.
      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Check no seed test hooks in non-test workflows
        run: node scripts/check-seed-hooks.mjs

  # Docker Build & Test (local, no push) ----------------------------------
  # ── Build & Test (host-artifacts) ─────────────────────────────────────────
  # O build do Next.js roda no host do runner (~70s), fora do buildkit
  # (evitando o tarpit conhecido do Turbopack em container).
  # Em seguida monta a imagem COPY-only diretamente no daemon da VPS.
  build:
    name: Build & Test (host-artifacts)
    needs: [utf8-check, seed-hooks-guard]
    runs-on: self-hosted
    if: "!(github.event_name == 'workflow_dispatch' && inputs.census_only)"
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build Next.js standalone artifacts
        run: |
          set -e
          export DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder"
          npx prisma generate
          BUILD_STANDALONE=true SKIP_TYPESCRIPT_CHECK=true DOCKER_BUILD=true npm run build
          test -f .next/standalone/server.js

      - name: Montagem da imagem do app (COPY-only no daemon da VPS)
        run: |
          set -e
          mv .dockerignore /tmp/.dockerignore.bak
          node scripts/stage-migrate-closure.mjs node_modules migrate-closure
          cat > /tmp/fallback-app.Dockerfile <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          ENV NODE_ENV=production
          RUN addgroup --system --gid 1001 nodejs && adduser --system --uid 1001 --gid 1001 nextjs
          RUN apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl && rm -rf /var/lib/apt/lists/*
          RUN mkdir -p /data && chown nextjs:nodejs /data
          WORKDIR /app
          COPY --chown=nextjs:nodejs public ./public
          COPY --chown=nextjs:nodejs .next/standalone ./
          COPY --chown=nextjs:nodejs .next/static ./.next/static
          COPY --chown=nextjs:nodejs migrate-closure ./node_modules
          COPY --chown=nextjs:nodejs prisma ./prisma
          COPY --chown=nextjs:nodejs prisma.config.ts ./prisma.config.ts
          RUN npm install -g prisma@6.19.3
          USER nextjs
          EXPOSE 3000
          ENV PORT=3000
          CMD ["node", "server.js"]
          DOCKERFILE
          docker build -f /tmp/fallback-app.Dockerfile -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" .
          mv /tmp/.dockerignore.bak .dockerignore
          rm -rf migrate-closure

      - name: Build worker image (load no daemon da VPS)
        run: |
          set -e
          docker build -f Dockerfile.worker --build-arg BUN_VERSION=${{ vars.BUN_VERSION }} -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:worker-latest" .

      - name: Prova de boot (servidor sobe e responde 200/503)
        run: |
          set -e
          docker run -d --name severinno-test --network host \
            -e DATABASE_URL="postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder" \
            -e REDIS_URL="redis://127.0.0.1:6379" \
            -e SESSION_SECRET="test-secret-at-least-32-chars-long" \
            -e NODE_ENV=production \
            -e HOSTNAME=0.0.0.0 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          HTTP_LAST="000"
          for i in $(seq 1 20); do
            sleep 3
            HTTP_LAST=$(docker exec severinno-test node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{console.log(r.status)}).catch(()=>{console.log(0)})" 2>/dev/null || echo "000")
            case "$HTTP_LAST" in
              200|503) echo "Boot OK (HTTP $HTTP_LAST em $i tentativas)"; break;;
            esac
            echo "attempt $i/20 - HTTP $HTTP_LAST"
          done
          docker logs severinno-test 2>&1 | tail -20 || true
          docker rm -f severinno-test >/dev/null 2>&1 || true
          case "$HTTP_LAST" in
            200|503) exit 0;;
            *) echo "Boot falhou após 20 tentativas (último HTTP $HTTP_LAST)"; exit 1;;
          esac

  migrate:
    name: Migrate Database
    needs: build
    runs-on: self-hosted
    if: "(github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && inputs.census_only)"

    steps:
      - name: Run database migrations
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            echo "Subindo a camada de dados (postgres/redis/rabbitmq/minio/pgbouncer)..."
            docker compose -f docker-compose.hostinger.yml --env-file .env.production.local \
              up -d --wait postgres redis rabbitmq minio pgbouncer
            echo "Running database migrations..."
            docker compose -f docker-compose.hostinger.yml --env-file .env.production.local \
              run --rm --no-deps app prisma migrate deploy

      - name: Bootstrap do admin real (após o migrate)
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            if [ ! -s secrets/admin_email.secret ] || [ ! -s secrets/admin_password.secret ]; then
              echo "AVISO: secrets/admin_{email,password}.secret vazios/ausentes — bootstrap do admin pulado"
              exit 0
            fi
            docker compose -f docker-compose.hostinger.yml --env-file .env.production.local \
              run --rm --no-deps --user root \
              -v "$PWD/scripts/bootstrap-admin.mjs:/app/scripts/bootstrap-admin.mjs:ro" \
              -v "$PWD/secrets/admin_email.secret:/run/secrets/admin_email:ro" \
              -v "$PWD/secrets/admin_password.secret:/run/secrets/admin_password:ro" \
              -e ADMIN_EMAIL_FILE=/run/secrets/admin_email \
              -e ADMIN_PASSWORD_FILE=/run/secrets/admin_password \
              app node /app/scripts/bootstrap-admin.mjs \
              || echo "AVISO: bootstrap do admin falhou — deploy continua"

  deploy:
    name: Deploy to VPS
    needs: migrate
    runs-on: self-hosted
    if: "(github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && inputs.census_only)"

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            COMPOSE="docker compose -f docker-compose.hostinger.yml --env-file .env.production.local"
            echo "Aplicando app/realtime/workers..."
            $COMPOSE up -d --no-deps --remove-orphans app realtime
            $COMPOSE up -d --no-deps email-worker notification-worker
            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              sleep 5
              HTTP_CODE=$($COMPOSE exec -T app node -e "fetch('http://localhost:3000/api/health').then(r=>{console.log(r.status);process.exit(r.ok?0:1)}).catch(()=>{console.log(0);process.exit(1)})" || echo 000)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Health check passed (HTTP $HTTP_CODE)"
                docker image prune -f
                exit 0
              fi
              echo "Attempt $i/12 — HTTP $HTTP_CODE, retrying..."
            done
            echo "Health check failed after 12 attempts" && exit 1

  # ── Censo SVG legado (dry-run na VPS, via SSH) ───────────────────────────
  # Disparo: workflow_dispatch com census_only=true. Roda o
  # reprocess-svg-uploads.ts em DRY-RUN (leitura pura: list+get — sem --apply
  # NADA é escrito/removido) DENTRO da rede Docker da VPS, onde o
  # S3_ENDPOINT=http://minio:9000 resolve, e imprime o svgFound no log.
  # Por que `docker compose run --no-deps` com bind :ro: a imagem final é
  # standalone e NÃO copia scripts/ (ver Dockerfile) — o bind monta o script
  # sem mutar o container; --no-deps evita subir serviços vizinhos; o mesmo
  # padrão run --rm --no-deps app é o que o migrate usa. O `.env` do
  # DEPLOY_PATH fornece as S3_* (o compose as repassa ao serviço app).
  # O alarme contínuo é o cron semanal /api/cron/svg-legacy-census (setup-cron-push.sh);
  # este job é o gatilho manual do mesmo censo, com o svgFound no log do Actions.
  svg-legacy-census:
    name: SVG legacy census (dry-run)
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' && inputs.census_only
    steps:
      - name: Census SVG legacy (dry-run) via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          script: |
            set -e
            cd "$DEPLOY_PATH"
            echo "Running SVG legacy census (DRY-RUN, read-only)..."
            # --delete no censo: dry-run sem sharp (o container app nao o tem);
            # svgFound e identico ao modo convert.
            docker compose run --rm --no-deps -v ./scripts:/app/scripts:ro app \
              bun scripts/reprocess-svg-uploads.ts --delete
            echo "═══ RESUMO (svgFound > 0 = remediação pendente) ═══"
            echo "Próximo passo se svgFound > 0: reexecute com --apply (converte para PNG;" \
                 "original preservado em quarantine/svg-legacy/) — ver docs/RUNBOOK.md"
