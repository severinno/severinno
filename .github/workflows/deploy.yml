name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # UTF-8 Encoding Gate ----------------------------------------------------
  # Fast gate: <10s. Validates encoding before building Docker images.
  utf8-check:
    uses: ./.github/workflows/utf8-check.yml

  # Docker Build & Test (local, no push) ----------------------------------
  # Builds the image locally and runs a health-check smoke test to catch
  # runtime regressions before the image is pushed to the registry.
  docker-test:
    name: Docker Build & Test
    needs: [utf8-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: severinno-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}

      - name: Start container
        run: |
          docker run -d             --name severinno-test             -p 3000:3000             -e DATABASE_URL="postgresql://severinno:severinno@postgis:5432/severinno"             -e REDIS_URL=""             -e SESSION_SECRET="test-secret-at-least-32-chars-long"             -e NODE_ENV=production             severinno-test:latest

      # NOT a reusable-workflow call (unlike the ssh deploys): the container
      # runs on THIS job's runner, and a `uses:` workflow runs on a fresh
      # runner that could not reach it. Keeps the inline call to the shared
      # scripts/health-check.sh (env 20/3) — still DRY via the same script.
      - name: Wait for health check
        env:
          HEALTH_ATTEMPTS: 20
          HEALTH_SLEEP: 3
        run: bash scripts/health-check.sh

      - name: Show container logs on failure
        if: failure()
        run: docker logs severinno-test 2>&1 | tail -50

      - name: Clean up container
        if: always()
        run: docker rm -f severinno-test 2>/dev/null || true

  build:
    needs: [docker-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:worker-${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Run database migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Running database migrations..."
            docker compose run --rm --no-deps app bunx prisma migrate deploy || \
              docker compose run --rm --no-deps app bunx prisma db push --accept-data-loss

  deploy:
    needs: migrate
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/health-check.yml
    with:
      url: http://localhost:3000/api/health
      attempts: 12
      sleep: 5
      expect-code: 200
      docker-prune: true
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
