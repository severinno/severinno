# =============================================================================
# Release & Deploy — Severinno Marketplace
#
# Full CI/CD pipeline triggered by git tags (v*):
#   1. Encoding check (reusable)
#   2. Lint + TypeCheck + Tests (via CI)
#   3. Cache manifest validation
#   4. Lighthouse CI — Core Web Vitals gate (desktop + mobile)
#   5. Build & push Docker images (app + worker) to GHCR
#   6. Run DB migrations on VPS
#   7. Deploy (pull + restart containers)
#
# Usage:
#   git tag v0.3.0-cache-mvp
#   git push origin v0.3.0-cache-mvp
#
# Can also be triggered manually via workflow_dispatch (with optional tag input).
# =============================================================================

name: Release & Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.1)"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: 22

jobs:
  # -- Quality gates (fast, parallel) ---------------------------------------

  utf8-check:
    uses: ./.github/workflows/utf8-check.yml

  # ── Quality Gate ──────────────────────────────────────────────────────────
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bunx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest

    # Postgres service — same setup as ci.yml. The unit suite (vitest) hits
    # the DB for route tests; without it the release gate fails on DB-dependent
    # tests even though they pass locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: severinno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/severinno_test
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-session-secret-at-least-32-characters-long

      - name: Generate coverage badge (for commit)
        run: npx tsx scripts/coverage-badge.ts --save

      - name: Commit updated badge (tag pushes only)
        # This workflow is triggered by v* tags; the badge commit on main is
        # handled by ci.yml (push to main). Here we also update on tags
        # so the badge reflects the state at release time.
        if: github.ref_type == 'tag' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badge-coverage.svg
          if git diff --cached --quiet; then
            echo "No changes to badge — skipping commit"
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi

  # -- E2E Cache Layer --------------------------------------------------------
  # Same cache gates as the PR workflow: validate-cache-manifest.ts (manifest
  # + stale-while-revalidate header format) + SWR cache-header unit tests +
  # Playwright all-cache-routes. Blocks the release if the cache layer
  # regresses — cache is a first-class release gate, not just a PR check.
  e2e-cache:
    uses: ./.github/workflows/e2e-cache.yml

  # -- JS Bundle Budget ------------------------------------------------------
  # Same gate as ci.yml: ANALYZE=true webpack build + scripts/check-js-budget.mjs
  # enforces the JS size budget. Blocks the release if any chunk/library blew
  # its gzip limit. Runs in parallel with the other gates; report uploaded even
  # on failure so release blockers are visible.
  budget:
    name: JS Bundle Budget
    runs-on: ubuntu-latest
    needs: [utf8-check, quality-gate, lint, typecheck]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run db:generate

      - name: Cache Next.js build + analyze report
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .next/analyze
          key: ${{ runner.os }}-next-analyze-${{ hashFiles('bun.lock', 'package.json', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-analyze-

      # --webpack is required: @next/bundle-analyzer only emits reports for
      # webpack builds. analyze:webpack is package-manager agnostic (plain
      # `next build`), so it works under bun in CI and pnpm locally.
      - name: Analyze build (webpack + bundle report)
        run: bun run analyze:webpack
        env:
          SKIP_TYPESCRIPT_CHECK: "true"

      - name: Enforce JS bundle budget
        run: bun run budget:js

      # Versioned bundle report: persists size evolution (initial/total/
      # maplibre/recharts/framer-motion) in docs/bundle-report.md across
      # releases. Only meaningful on tag pushes (github.ref_name = vX.Y.Z);
      # on plain main pushes it would record a bogus "main" row, so skip.
      - name: Generate versioned bundle report
        if: github.ref_type == 'tag' && github.event_name == 'push'
        run: bun run bundle:report --version "${{ github.ref_name }}"

      - name: Commit bundle report (tag pushes only)
        if: github.ref_type == 'tag' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/bundle-report.md
          if git diff --cached --quiet; then
            echo "No changes to bundle report — skipping commit"
          else
            git commit -m "docs: update bundle report [skip ci]"
            # Tag-triggered runs check out detached HEAD, so a bare `git push`
            # has no upstream branch. Push the report commit to the default
            # branch explicitly (works from detached HEAD).
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Upload bundle analyze report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analyze-report
          path: .next/analyze/
          if-no-files-found: ignore
          retention-days: 7

  # -- Core Web Vitals gate --------------------------------------------------
  # Reuses the full Lighthouse CI pipeline from lighthouse-ci.yml (Postgres/
  # Redis services + deterministic seed + production build + lhci autorun,
  # desktop & mobile) as a release gate: the docker build below only fires
  # with green CWV on the 3 main public routes. Runs after the fast quality
  # gates so we don't burn ~45 min of LHCI on a red lint/typecheck.
  lhci:
    uses: ./.github/workflows/lighthouse-ci.yml
    needs: [utf8-check, quality-gate, lint, typecheck]

  # -- Docker build & push (depends on quality gates) -----------------------

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [utf8-check, quality-gate, lint, typecheck, test, budget, e2e-cache, lhci]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:worker-${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:worker-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -- Deploy (depends on Docker build) -------------------------------------

  migrate:
    name: DB Migrations
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Run database migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            echo "Running database migrations..."
            docker compose run --rm --no-deps app bunx prisma migrate deploy || \
              docker compose run --rm --no-deps app bunx prisma db push --accept-data-loss

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [migrate]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e

            echo "Pulling new images..."
            docker compose pull app realtime email-worker notification-worker

            echo "Restarting services..."
            docker compose up -d --no-deps --remove-orphans app realtime
            docker compose --profile workers up -d --no-deps email-worker notification-worker

            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              sleep 5
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Health check passed (HTTP $HTTP_CODE)"
                docker image prune -f
                exit 0
              fi
              echo "Attempt $i/12 - HTTP $HTTP_CODE, retrying..."
            done

            echo "Health check failed after 12 attempts"
            exit 1
