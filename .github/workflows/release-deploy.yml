# =============================================================================
# Release & Deploy — Severinno Marketplace
#
# Full CI/CD pipeline triggered by git tags (v*):
#   1. Encoding check (reusable)
#   2. Lint + TypeCheck + Tests (via CI)
#   3. Cache manifest validation
#   4. Build & push Docker images (app + worker) to GHCR
#   5. Run DB migrations on VPS
#   6. Deploy (pull + restart containers)
#
# Usage:
#   git tag v0.3.0-cache-mvp
#   git push origin v0.3.0-cache-mvp
#
# Also runs on push to main (without tag) for continuous deployment.
# =============================================================================

name: Release & Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.1)"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: 22
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/severinno_test
  REDIS_URL: redis://localhost:6379
  SESSION_SECRET: ci-session-secret-at-least-32-characters-long

jobs:
  # -- Quality gates (fast, parallel) ---------------------------------------

  utf8-check:
    uses: ./.github/workflows/utf8-check.yml

  # -- Seed Test Hooks Guard ------------------------------------------------
  # Fail-closed gate ANTES de qualquer deploy de release: SEED_SPEC_PATCH e
  # PROD_SEED_ALLOW_DEV são hooks TEST-ONLY (E2Es de seed contra banco
  # efêmero). Se aparecerem neste workflow de produção (ou em qualquer
  # workflow fora do allowlist de teste em scripts/check-seed-hooks.mjs), o
  # guard falha e o release não roda — impedindo que o seed de produção rode
  # com spec patchado ou com o guard de produção contornado.
  seed-hooks-guard:
    name: Seed Test Hooks Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no seed test hooks in non-test workflows
        run: node scripts/check-seed-hooks.mjs

  # ── Quality Gate ──────────────────────────────────────────────────────────
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run db:generate

      # O heap default do Node (~1.4GB) é insuficiente para o tsc neste
      # codebase — o processo crasha com 'JavaScript heap out of memory'
      # (SIGABRT exit 134, não erro de tipo). Reproduzido e validado em
      # 08/2026: com 4096MB o typecheck passa limpo em ~2min.
      - name: Type check
        run: bunx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:run

      - name: Generate coverage badge (for commit)
        run: npx tsx scripts/coverage-badge.ts --save

      - name: Commit updated badge (tag pushes only)
        # This workflow is triggered by v* tags; the badge commit on main is
        # handled by ci.yml (push to main). Here we also update on tags
        # so the badge reflects the state at release time.
        if: github.ref_type == 'tag' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badge-coverage.svg
          if git diff --cached --quiet; then
            echo "No changes to badge — skipping commit"
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi

  # -- Docker build & push (depends on quality gates) -----------------------

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [utf8-check, seed-hooks-guard, quality-gate, lint, typecheck, test]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:worker-${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:worker-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -- Deploy (depends on Docker build) -------------------------------------

  migrate:
    name: DB Migrations
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Run database migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            echo "Running database migrations..."
            docker compose run --rm --no-deps app bunx prisma migrate deploy || \
              docker compose run --rm --no-deps app bunx prisma db push --accept-data-loss

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [migrate]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e

            echo "Pulling new images..."
            docker compose pull app realtime email-worker notification-worker

            echo "Restarting services..."
            docker compose up -d --no-deps --remove-orphans app realtime
            docker compose --profile workers up -d --no-deps email-worker notification-worker

            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              sleep 5
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Health check passed (HTTP $HTTP_CODE)"
                docker image prune -f
                exit 0
              fi
              echo "Attempt $i/12 - HTTP $HTTP_CODE, retrying..."
            done

            echo "Health check failed after 12 attempts"
            exit 1
