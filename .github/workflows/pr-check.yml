name: PR Check

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Regression threshold percentage (default: auto-detect 10% for benchmark code, 5% otherwise)"
        required: false
        default: 0
        type: number

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://localhost:5432/test
  REDIS_URL: redis://localhost:6379
  RABBITMQ_URL: amqp://localhost:5672
  # Origem dos mirrors OCI (bun/ubuntu-bun/postgis) — FONTE ÚNICA.
  # Default = o registry OCI próprio (git.severinno.cloud/<namespace>).
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'git.severinno.cloud' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}

jobs:
  # ── UTF-8 Encoding Check ────────────────────────────────────────────────
  # Fast gate: <10s, no dependencies beyond python3 (pre-installed on runners).
  # Runs in parallel with the main check job.
  utf8-check:
    name: UTF-8 Check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Run UTF-8 validation on all .ts files
        run: bash scripts/check-utf8.sh --ci src/

      - name: Summary
        run: echo "All .ts files validated as valid UTF-8 encoding."

  # ── Blob CRLF History Audit (PR) ─────────────────────────────────────
  # Zero-CRLF NO HISTÓRICO revalidado a CADA PR (não só no cron semanal —
  # o job blob-crlf-history-audit do benchmark-weekly.yml só roda na cron).
  #
  # Por quê: o guard de blob (check-blob-crlf.sh) inspeciona o index/HEAD —
  # um blob .sh/.bash CRLF commitado NO PASSADO (ex.: antes do
  # .gitattributes) reproduz CRLF em todo checkout futuro daquele commit.
  # scripts/audit-blob-crlf-history.sh varre TODOS os blobs de TODOS os
  # commits via `git cat-file --batch` (wrapper python — byte-exato,
  # robusto no MSYS) e falha o job se QUALQUER blob histórico tiver CRLF.
  # Um PR que committe um .sh CRLF (autocrlf desabilitado, commit fora do
  # .gitattributes) só seria pego semanas depois sem este job.
  #
  # Requer o histórico completo (fetch-depth: 0). Node/Bun não são
  # necessários — só git + python3 (pré-instalados no runner). Espelho do
  # job semanal (blob-crlf-history-audit em benchmark-weekly.yml) —
  # alterações no script/args DEVEM ser replicadas nos dois lugares.
  blob-crlf-history-audit:
    name: Blob CRLF history (zero-CRLF)
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo — auditamos TODOS os blobs

      # ── GATE: nenhum blob histórico de .sh/.bash pode ter CRLF ──────
      # Exit 1 do wrapper = CRLF encontrado no histórico → job falha.
      - name: Auditar blobs CRLF em todo o histórico
        run: |
          bash scripts/audit-blob-crlf-history.sh

      # ── Unit test do parser --all-text (Python direto) ─────────────
      # python3 pré-instalado no runner (zero deps, unittest stdlib): trava
      # o parse do load_all_text_patterns com um .gitattributes FAKE em
      # memória (comentário, espaçamento múltiplo, 'eol=lf text' invertido,
      # '*.MD' maiúsculo, binary/text=auto, nomes exatos sem extensão) —
      # além dos testes de integração vitest, que só exercitam o parser via
      # fixture de repo git real. Onde o audit roda, o parser é testado.
      - name: Testar parser load_all_text_patterns (unittest)
        run: python3 scripts/test_audit_blob_crlf_history.py -v

      - name: Summary
        run: echo "✅ Zero-CRLF no histórico revalidado (audit de todos os blobs .sh/.bash)."

  # ── All-Text Alert Validation (fixture → audit → gate) ────────────────
  # Prova o fluxo do job semanal blob-crlf-all-text-alert (benchmark-weekly.yml)
  # ponta-a-ponta em CADA PR, sem depender do cron: cria fixtures git reais
  # (o mesmo procedimento do docs/TESTING.md automatizado por
  # scripts/validate-all-text-alert.sh), roda o REPORT --all-text e replica o
  # gate do job (grep -Fq 'com CRLF' → found_crlf). Falha se o sentinel NÃO
  # aparecer com um blob CRLF commitado (guard cega) ou se aparecer no estado
  # limpo (falso positivo). O contrato do job é travado em teste unitário
  # (benchmark-weekly-all-text-crlf-workflow.test.ts) e a consistência
  # produtor↔job pelo check-sentinel-producer.mjs — mas nenhum RODA o audit
  # contra um blob CRLF real. Bash + git + python3 (pré-instalados), <5s.
  all-text-alert-validation:
    name: All-text alert validation (fixture → gate)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Validate all-text alert fixture + gate replica
        run: bash scripts/validate-all-text-alert.sh

      - name: Summary
        run: echo "✅ All-text alert gate catches a CRLF blob and ignores a clean history."
  # Fast gate: falha o PR se qualquer .env voltar a ser rastreado pelo git
  # (padrão dos demais guards — node puro, sem bun install; roda em <5s em
  # paralelo com os demais checks).
  #
  # Contexto: os arquivos .env estiveram rastreados com secrets reais
  # (SESSION_SECRET, VAPID, DB_PASSWORD, S3). A remediação foi rotacionar os
  # valores (scripts/rotate-secrets.mjs) + git rm --cached. Este guard garante
  # que nenhum .env (exceto *.example, que são templates seguros) seja
  # adicionado de volta ao tracking sem o PR ser bloqueado.
  secrets-guard:
    name: Secrets Guard (no .env tracked)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check no .env tracked in git
        run: node scripts/rotate-secrets.mjs --check

      - name: Summary
        run: echo "✅ No .env files tracked in git."

  # ── Seed Test Hooks Guard ─────────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se SEED_SPEC_PATCH ou
  # PROD_SEED_ALLOW_DEV aparecerem em qualquer workflow FORA do allowlist
  # de teste (scripts/check-seed-hooks.mjs — fail-closed).
  #
  # Por que existe: esses hooks são TEST-ONLY (E2Es de seed contra banco
  # efêmero). Se vazarem para um workflow de produção (deploy.yml,
  # release-deploy.yml, ou um workflow novo), o seed de produção pode rodar
  # com spec patchado ou com o guard de produção contornado — o pipeline de
  # deploy precisa bloquear isso antes de tocar o servidor.
  seed-hooks-guard:
    name: Seed Test Hooks Guard (no prod leak)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check no seed test hooks in non-test workflows
        run: node scripts/check-seed-hooks.mjs

      - name: Summary
        run: echo "✅ No seed test hooks outside the test workflow allowlist."

  # ── Workflow References Guard ──────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se qualquer workflow referenciar
  # um script inexistente (node|bash|bun scripts/X), uma entry removida de
  # package.json (bun|npm run X), um reusable workflow local inexistente
  # (uses: ./.github/workflows/X.yml sem o arquivo ou sem workflow_call) ou
  # um composite action local inexistente (uses: ./.github/actions/<name>).
  #
  # Por que existe: consolidações como a matrix 2×2 do seed-guards.yml
  # deletam/renomeiam workflows e scripts em lote — uma referência quebrada
  # só falharia no JOB que a executa (com custo de runner pago e mensagem
  # confusa). Este guard falha o PR no início com a referência exata.
  #
  # --pkg-internal adiciona a consistência INTERNA do package.json: TODA
  # entry que invoca scripts/X (mesmo sem workflow referenciando — ex.:
  # hooks locais/manuais `bun run <entry>`) deve ter X existente em
  # scripts/. Um script deletado com a entry órfã de workflow quebraria o
  # hook local no runtime sem este modo.
  workflow-refs-guard:
    name: Workflow References Guard (no dangling refs)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow → script/package.json/uses references
        run: node scripts/check-workflow-refs.mjs --pkg-internal

      # A CATRACA do corte do GitHub: o inventario (27 workflows, 9 crons, 14
      # actions de terceiro, o GHCR como registry, o `gh` em 14 scripts, o plano
      # de configuracao do Actions e 7 servicos) e conferido contra a declaracao
      # versionada em ci/github-dependencies.json — nos DOIS sentidos. Uma
      # dependencia nova (um workflow, um cron, uma action, um servico) nao entra
      # sem a etapa do corte e o substituto escritos; e um corte feito sem baixar
      # o numero e declaracao envelhecida (o `--update` e o ato, no mesmo commit).
      # node puro, sem node_modules, <0,5s — o plano narrativo esta em
      # docs/GITHUB_CUT.md.
      - name: Corte do GitHub (inventário com catraca)
        run: node scripts/check-github-dependencies.mjs

      # O branch protection exige os checks declarados em ci/required-checks.json.
      # Um required check que não corresponde a nenhum job real não falha: ele
      # ESPERA — o PR trava para sempre. Aqui o manifesto é validado contra os
      # workflows (job existe, não é condicional, contexto não duplicado).
      # node direto (não `bun run`): este job não instala node_modules nem
      # depende de bun no PATH — o guard é node-puro, de propósito.
      - name: Required checks manifest ↔ workflows
        run: node scripts/check-required-checks.mjs

      # Fonte única do registry OCI (imagens da aplicação + mirrors de
      # toolchain). Pega a regressão que reacoplaria o projeto ao GHCR — um
      # `ghcr.io/...` solto volta a exigir cota de storage/egress do registry
      # proprietário e quebra o flip de UMA variável (IMAGE_REGISTRY).
      # node direto pelo mesmo motivo acima: guard node-puro, sem node_modules.
      #
      # O `env` explicitamente aqui NAO e redundancia: as referencias da imagem
      # vivem em configuracao NAO VERSIONADA (as repository variables), e o guard
      # le o valor do AMBIENTE. Sem entregar o valor, ele so pode dizer
      # INDETERMINADO — "nao consegui provar" — e o gate verde esconderia isso.
      # Entregando-o, o guard COMPARA a variable com o que o repositorio declara
      # (`.actrc`, `deploy/env.gitea.example`, `.env.production.example`): um
      # espelho velho deixa de ser invisivel aqui dentro.
      # (Variavel nao criada: o env fica vazio e o passo volta a ser INDETERMINADO,
      # que e o certo — nao da para comparar com o que nao existe.)
      - name: OCI registry single source
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
          BUN_VERSION: ${{ vars.BUN_VERSION }}
        run: node scripts/check-registry-source.mjs

      # A BASE da imagem que roda ESTES jobs: pinada por digest e com o contrato
      # da imagem provado por EXECUÇÃO (o bloco `RUN` real do Dockerfile, contra
      # bases dubladas: com o plugin `compose` passa, sem ele FALHA).
      #
      # Por que aqui e não só no build do mirror: `catthehacker/ubuntu:act-latest`
      # é uma tag FLUTUANTE. Um rebuild da base troca a imagem inteira — inclusive
      # o plugin `compose` que a invariante 7 usa para renderizar o compose da
      # forja — sem nenhuma linha do repositório mudar. O digest é o que torna o
      # build reprodutível; a prova por mutação é o que impede um pin velho (ou de
      # outra imagem) passar como pin.
      #
      # O probe da tag é o ÚNICO passo que depende de rede: sem ele o passo
      # continua verde DIZENDO que não conferiu o pin contra o que a tag serve
      # (o pin, o contrato e as mutações são offline).
      - name: Runner base pin (digest + contrato)
        run: node scripts/check-runner-base.mjs

      # Cabeçalho de script: `Usage:` + `Exit code` no BLOCO DE DOCUMENTAÇÃO
      # LÍDER (as linhas de comentário do topo, até a primeira linha de código —
      # a posição dentro do bloco não importa).
      #
      # Estava embutido no `barrel-lint` e invisível como gate: o nome não casa o
      # prefixo `check-` (o guard de paridade não o descobria, então ele não
      # precisava de classificação) e o CI tratava o exit 3 como aviso. Extraído,
      # ele passa a ser gate do CORE nas duas pipelines.
      - name: Script header docs
        run: node scripts/check-script-headers.mjs

      # Contrato de documentação das PROVAS (família `prove-*`/`doctor`): exige,
      # para CADA comando, um bloco com o resultado esperado — e CONFRONTA esse
      # bloco com a saída real (exit declarado + linhas exigidas). É o mesmo gate
      # do CORE nas duas forjas (a família não tem nada de GitHub).
      #
      # As provas que exigem docker/imagem rodam com o `docker` AUSENTE de
      # propósito, cobrando o desfecho INDETERMINADO que elas DOCUMENTAM: a
      # invariante é "ausência de prova nunca vira sucesso" (~1s, hermético).
      - name: Probe docs contract
        run: node scripts/check-prove-docs.mjs

      # A classe SIGPIPE (o mesmo gate do CORE na forja dona do merge): sob
      # `set -o pipefail`, `algo | grep -q PADRAO` pode terminar 141 MESMO com o
      # padrão encontrado — `grep -q` fecha o stdin no primeiro casamento e o
      # produtor leva SIGPIPE se ainda tiver bytes para escrever. É intermitente
      # por construção (depende do tamanho da saída) e o sintoma aponta para a
      # asserção que ACHOU o texto, não para a causa. O remédio é herestring
      # (`grep -q X <<< "$OUT"`): nenhum pipe, nenhum produtor para levar o sinal.
      #
      # Sem cota, sem allowlist: a dívida foi APOSENTADA (o `--fix` do guard
      # reescreveu as 216 ocorrências mecânicas) e o baseline foi removido —
      # QUALQUER ocorrência reprova o PR, em qualquer arquivo.
      - name: Pipefail x grep quieto (SIGPIPE)
        run: node scripts/check-pipefail-sigpipe.mjs

      # Escopo dos guards: nenhum script pode cravar um diretório de forja.
      # Fecha a CLASSE de falha que deixou a pipeline dona do merge fora da
      # cobertura de 14 guards quando ela nasceu (e que produziu, na prática,
      # bun literal + oven-sh/setup-bun + ts-nocheck fora de alcance).
      - name: Forge workflow scope
        run: node scripts/check-forge-workflow-scope.mjs

      # Paridade de gates: a forja self-hosted é dona do merge e o GitHub é
      # espelho — um invariante do CORE que roda em só uma das pipelines é um
      # buraco silencioso (o PR passa verde por onde rodou).
      - name: Forge gate parity
        run: node scripts/check-forge-parity.mjs

      # O RETRATO ARQUIVADO (`.woodpecker.yml`) declara a condição de cada passo
      # e este gate prova que ela é a que a FORJA aplica à contraparte (os
      # gatilhos `on:` + o `if:` do job, derivados de `.gitea/workflows/`).
      - name: Archived pipeline conditions (retrato ↔ forja)
        run: node scripts/check-archived-pipeline.mjs

      # DEPENDÊNCIAS DOS JOBS: um job que roda comando cujo VEREDITO exige
      # `node_modules` tem de INSTALAR as dependências ou declarar a isenção
      # (com data e janela de revisão). A classe é medida, não suposta: oito
      # guards "node puro" leem YAML com `js-yaml` e, sem o pacote, saem 2
      # ("NÃO JULGÁVEL") — o verde deles num job sem install não tem causa no
      # repositório, depende do `node_modules` do ambiente, e o sintoma que o
      # operador vê não diz isto. A isenção é verificada contra o grafo de
      # imports: dizer "não precisa" para um `import` de topo ou um binário de
      # dependência é provadamente falso.
      - name: Job dependencies (install or declared exemption)
        run: node scripts/check-job-deps.mjs

      # Paridade hook ↔ CI (nas DUAS direções): cada comando que os hooks
      # locais executam tem de ser o MESMO comando do CI ou um recorte/local
      # com DECISÃO ESCRITA em HOOK_DECLARED; e cada invariante do CORE tem de
      # rodar em algum hook ou estar declarado em HOOK_NOT_RUN.
      #
      # Por que é gate e não convenção: o veredito local (o hook) e o do
      # merge (esta pipeline) são dois conjuntos de comandos escritos em dois
      # arquivos. Divergindo, o sintoma é "passou aqui e quebrou lá" — ou
      # pior, "travou aqui e nem era o gate do CI": `.husky/pre-push` rodava
      # `bunx tsc --noEmit` SEM o heap de 4GB do script `typecheck`, então o
      # MESMO commit estourava a memória no push (SIGABRT, 134) e passava no
      # merge. Dois lados citando "o typecheck", duas réguas.
      - name: Hook x CI parity
        run: node scripts/check-hook-ci-parity.mjs

      # Os COMANDOS que os hooks executam, na direção do CAMINHO: cada script
      # citado (`node scripts/x.mjs`, `bash scripts/y.sh`, entrada de
      # `bun run`, binário de `bun x`, arquivo de `source`) tem de existir no
      # repositório. O guard irmão acima compara o comando do hook com o do CI
      # (o mesmo comando? recorte declarado?); este responde a OUTRA pergunta:
      # o comando que o hook executa aponta para algo que existe? Um caminho
      # com erro de digitação é um PASSO que nunca roda — o commit passa achando
      # que foi verificado. Node-puro, <0.1s, e roda também no pre-commit.
      - name: Hook commands resolve (arquivo/entrada real)
        run: node scripts/check-hook-commands.mjs

      # A LATÊNCIA DE MERGE do dono do merge: todo job do PR da FORJA tem
      # duração declarada ou derivada. O espelho pode declarar jobs sem medição
      # (é um fato, não uma promessa) — o dono do merge não, senão o número que
      # o repositório publica passa a cobrir menos pipeline do que existe. Roda
      # aqui também porque um PR do GitHub pode editar `.gitea/workflows/ci.yml`
      # e deixar a conta da forja furada sem nada falhar. Node-puro, <1s.
      - name: Merge latency (o dono do merge cobre o PR?)
        run: node scripts/merge-latency.mjs --check

      - name: Summary
        run: echo "✅ No dangling references between workflows and scripts/package.json (incl. internal pkg targets); required checks, registry de imagens, escopo de forja, paridade hook↔CI e latência de merge do dono consistentes."

  # ── Workflow run syntax (bash -n) — JOB PRÓPRIO ───────────────────────
  # O corpo de um `run:` é SHELL, e um shell que não faz parsing morre no
  # RUNNER — no meio do job, depois de minutos de setup, longe da causa. O
  # repositório reescreve corpo de `run:` por MÁQUINA de propósito (o `--fix`
  # do check-pipefail-sigpipe reescreveu 216 ocorrências), e é exatamente onde
  # entra um `<<<` desbalanceado, um `"` a mais ou um heredoc sem terminador.
  # Os guards que LEEM o YAML não veem isso: para eles um corpo quebrado
  # continua sendo um `run:` válido. `bash -n` faz o PARSING sem executar nada
  # — o gate é o parsing, não a semântica; um passo com `shell:` não-bash é
  # contado e NOMEADO (nunca pulado em silêncio).
  #
  # POR QUE UM JOB PRÓPRIO (e não um passo do `workflow-refs-guard`): o veredito
  # passa a ser um CHECK com o nome do defeito. Um PR que quebra um corpo `run:`
  # — a classe que nasce de reescrita mecânica em massa — falha num check que
  # DIZ o que houve, em vez de derrubar um job que cobre seis invariantes e
  # obrigar quem revisa a procurar no log QUAL delas caiu; e o check entra no
  # manifesto de required checks, então renomear ou remover o job deixa de ser
  # drift silencioso no contrato de merge. Node-puro (<1s e hermético), roda em
  # paralelo com os demais fast gates e nada é medido duas vezes.
  #
  # NA FORJA o invariante roda como PASSO do job `guards` (que é o gate único
  # dela por desenho: 40 guards num job só, um runner). O que o contrato de
  # paridade exige é o MESMO COMANDO nas duas pipelines, e é isso que o
  # `jobIds` por forja declara em check-forge-parity.
  workflow-run-syntax:
    name: Workflow run syntax (bash -n)
    runs-on: self-hosted
    # O remendo chega ao PR como COMENTÁRIO (passo abaixo): comentar é escrita,
    # e permissão implícita faria o canal depender da configuração da instância.
    # Sem ela (ou num PR de fork) o publicador trata o 403 como AVISO nomeado e
    # sai 0 — o GATE é o veredito, o comentário é o canal a mais.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      # O gate REAL contra o working tree do PR: os DOIS escopos de shell do
      # repositório — todos os corpos `run:` das duas forjas (com a expressão do
      # runner mascarada e o AVISO contando tanto quanto o erro: um heredoc sem
      # terminador sai 0 do bash e o corpo truncado rodaria outra coisa) e todos
      # os scripts de shell versionados (`*.sh`/`*.bash` + hooks do `.husky/`, a
      # mesma lista do check:pipefail-sigpipe), que morrem no PASSO que os executa.
      - name: Workflow run syntax (bash -n)
        run: node scripts/check-workflow-run-syntax.mjs

      # O REMÉDIO vai ao PR, não só ao log do job: o passo acima imprime a
      # mensagem do bash, e quem abriu o PR reescreveria à mão a cicatriz que o
      # `--fix` já sabe remendar — é o MESMO defeito mecânico que o remédio do
      # pre-commit oferece com confirmação, no momento do commit. Aqui o
      # publicador manda o PATCH exato (`--fix --dry-run`, o mesmo fixer) como
      # COMENTÁRIO no PR — copiar o bloco e colar no terminal aplica — e o
      # RECONCILIA: quando a cicatriz sumir, o comentário é RETIRADO sozinho.
      #
      # UM passo, e o CONJUNTO de fixers sai do REGISTRO (`FIXERS`), não da linha
      # de comando: `--all` publica um comentário por fixer mecânico, com o
      # marcador de cada um (a reconciliação de um não retira o comentário do
      # outro, que ainda vale). Um fixer NOVO herda este passo sem edição de
      # workflow — antes havia UM passo por fixer aqui, e o terceiro fixer só
      # chegaria ao PR se alguém lembrasse de copiar o passo nas DUAS forjas.
      #
      # `always()` porque o caso de uso é exatamente o gate VERMELHO (sem ele o
      # passo seria pulado quando mais importa); com o gate verde ele apenas
      # retira os comentários que ficaram para trás. A decisão do que publicar é
      # do SCRIPT, não de um `if:` aqui: um passo condicionado a `failure()`
      # deixaria o comentário velho aberto no PR que já consertou o defeito.
      - name: Publicar o remendo como comentário no PR (todos os fixers do registro)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          REMEDY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/pr-remedy-comment.mjs --backend github --all

      # A prova de SENSIBILIDADE, no mesmo job: o guard REAL roda no PR (acima) e
      # o mutation test prova que ele MORDE — erro de sintaxe, aviso que o bash
      # aprova, o mascaramento preservando contexto, o índice do recorte, a
      # semântica do `shell:`, a guarda do fixer, a segunda fonte (os scripts) e o
      # PULO NOMEADO — duas vezes, porque a decisão tem DUAS fontes: o `shell:` do
      # passo não-bash e o SHEBANG do arquivo não-bash (julgar qualquer um deles
      # ACUSA quem não tem defeito) — contra fixtures. As DUAS mutações do pulo
      # nomeado têm duas testemunhas cada: o gate por EXECUÇÃO e a suíte unitária,
      # que tem de ficar VERMELHA (onde o vitest está instalado; onde não está, o
      # script DIZ que não julgou essa metade). Sem isto, um guard que virasse
      # no-op passaria verde para sempre.
      - name: Mutation test — o guard deve FALHAR nas 15 metades
        run: bash scripts/test-mutation-workflow-run-syntax.sh

      - name: Summary
        run: echo "✅ Todo corpo de passo dos workflows das duas forjas, todo script de shell versionado E todo texto de shell EMBUTIDO (o `RUN` de um Dockerfile e o payload de um `sh -c`) fazem PARSING (bash -n, sem erro E sem aviso; passo não-bash, script de shebang não-bash e shell embutido indeterminado são contados e nomeados) e o mutation test prova que o guard morde nas quinze metades."

  # ── Bring-up Gate Proof (o PRÉ-REQUISITO 0, por EXECUÇÃO) ──────────────
  # O mesmo invariante do CORE da forja, provado aqui pelo caminho real: o
  # `deploy/gitea-up.sh` executa contra um env DIVERGENTE (com a imagem
  # PRESENTE) e tem de RECUSAR antes de qualquer docker. As asserções são sobre
  # o REGISTRO das chamadas: zero `compose up`, zero idas ao registry, zero
  # chamadas ao binário `docker`.
  #
  # POR QUE UM JOB PRÓPRIO (e não um passo do `workflow-refs-guard`): o doctor
  # EXECUTA a bateria do job `guards` da forja como fato, e o próprio
  # `deploy/gitea-up.sh` chama o doctor com `--no-proof` para não chamar de volta
  # a prova que executa ELE. A prova é a contrapartida executável do
  # `checkGiteaBringUp` (que só lê o TEXTO do script) — e é ela que transforma
  # "o passo 0 recusa" de afirmação sobre texto em comportamento medido.
  bring-up-proof:
    name: Bring-up Gate Proof (pré-requisito 0, por execução)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # `node` direto: guard node-puro (sem node_modules) e node é requisito do
      # próprio caminho executado (`command -v node` no gitea-up.sh).
      - name: Bring-up contra env divergente (a stack não sobe)
        run: node scripts/prove-runner-image-gate.mjs

      - name: Summary
        run: echo "✅ O passo 0 do bring-up RECUSA um env divergente (medido executando o gitea-up.sh real) — a imagem existe e a stack mesmo assim não sobe."

  # ── Prova do bloqueio do PRE-COMMIT dentro da imagem do runner ────────
  # O doctor publica o fato do bloqueio do pre-commit e EXECUTA a prova de
  # verdade (`proveCommitBlocks`) — mas ele roda onde o doctor roda: na máquina
  # de quem opera. A mesma promessa vale para a suíte dos hooks. Ou seja: "um
  # corpo `run:` quebrado no índice não vira commit" era medido num ambiente que
  # NÃO é o que julga o merge — e a diferença entre os dois é exatamente onde a
  # classe já mordeu (git ausente, `bash` de outra implementação, o `node` de
  # outro caminho, hook sem bit de execução, que o git IGNORA em silêncio).
  #
  # Aqui o MESMO módulo de prova roda dentro da imagem do runner: neste runner o
  # job é executado numa MÁQUINA com docker (labels `self-hosted,linux,x64,docker`),
  # então a prova é lançada com `docker run` na imagem (`Dockerfile.ubuntu-bun`),
  # com o checkout montado NO MESMO CAMINHO — o `node_modules` do fixture é um
  # link ABSOLUTO, e montar em outro caminho faria o guard morrer de "module not
  # found" (o não-zero seria do fixture, não do defeito). Na forja, onde o job JÁ
  # roda no container da imagem (label `docker://` do act_runner, sem o socket do
  # docker montado), o MESMO comando prova em lugar e declara o modo — é o
  # `placeReport` que escolhe e diz onde; os marcadores do runtime
  # (`/.dockerenv` + `/opt/acttoolcache`) são VERIFICADOS, nunca presumidos.
  #
  # O que ele NÃO conseguiu medir sai como INDETERMINADO (exit 2) nomeando o que
  # faltou — nunca verde. É o mesmo tri-estado do doctor.
  #
  # POR QUE UM JOB PRÓPRIO: a prova precisa de `node_modules` (o guard importa o
  # parser) e de um docker que responda, e o veredito passa a ser um CHECK com o
  # nome do que ele cobre. E `node_modules` aqui significa INSTALAR — é o
  # `check-job-deps` quem cobra isso de todo job que roda script dependente de
  # pacotes.
  pre-commit-in-runner-proof:
    name: Pre-commit Proof (dentro da imagem do runner)
    runs-on: self-hosted
    # packages: read — pull da imagem PRIVADA ghcr.io/<owner>/ubuntu-bun quando
    # ela ainda não estiver local (auth automático do runner; mesmo contrato do
    # tier1-fastpath-guard e do mutation-coord-timing-act-guard).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: A prova do bloqueio do pre-commit (dentro da imagem do runner)
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
          BUN_VERSION: ${{ vars.BUN_VERSION }}
        run: node scripts/prove-pre-commit-in-runner.mjs

      # A MESMA prova SEM o dublê dos guards irmãos: o hook REAL sobre uma cópia
      # do checkout, com os CINCO guards de fase A rodando de verdade. É o que
      # fecha o limite que o passo acima declara ("os irmãos rodam no dublê") e o
      # que atribui a recusa: um refutador só, e é o GATE.
      - name: A prova SEM o dublê (a fase A real recusa o corpo quebrado)
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
          BUN_VERSION: ${{ vars.BUN_VERSION }}
        run: node scripts/prove-pre-commit-in-runner.mjs --sem-duble

      # A forma padrão mede DUAS metades (o exit code é o da pior): além do
      # bloqueio, ela exercita o REMÉDIO — a OFERTA da classe `bun-mirror-removal`
      # medida pela CLI `--oferta` do mesmo script que o hook executa, o vínculo
      # provado na saída do commit, e o fixer do dono fechando o ciclo (o
      # `--staged` volta a 0 e o commit de CONTROLE entra).
      - name: Summary
        run: echo "✅ Um 'git commit' de verdade DENTRO do runtime do CI invocou o hook REAL do checkout — o corpo 'run:' quebrado no índice foi RECUSADO (zero objetos de commit) e o mesmo commit com o corpo fechado ENTROU (o CONTROLE). A MESMA medição exercita o REMÉDIO da declaração de espelho apagada — o guard dono recusa o commit que remove o arg `BUN_VERSION`, a OFERTA nomeia a classe `bun-mirror-removal` (e o hook a publica no próprio commit), e o fixer do dono devolve a declaração ao índice — o `--staged` volta a 0 e o commit de CONTROLE entra. E a forma sem o dublê dos irmãos — a fase A REAL (os cinco guards do índice, rodados de verdade) aprova o índice e o GATE é o ÚNICO refutador do corpo quebrado."

  # ── Sentinel Producer Guard ────────────────────────────────────────────
  # Fast gate (node puro, <1s): GENERALIZA a consistência produtor↔job de
  # sentinels — verifica que TODO `grep -Fq '<sentinel>' <file>` nos
  # workflows (e actions) tem o sentinel emitido pelo PRODUTOR do <file>
  # (script .sh/.mjs/.ts/.py, com chase de delegação .sh→.py — ex.:
  # audit-blob-crlf-history.sh → audit_blob_crlf_history.py) OU inline no
  # próprio workflow (echo "S" > file).
  #
  # Por que existe: o teste específico do sentinel 'com CRLF'
  # (benchmark-weekly-all-text-crlf-workflow.test.ts) bloqueava o drift
  # daquele ÚNICO sentinel — mas um FUTURO grep -Fq adicionado a um
  # workflow SEM o produtor emitir a string criaria uma guarda CEGA
  # (found_* nunca acende; 'não achou' vira falso positivo de 'limpo') sem
  # nenhum teste novo por sentinel. Este guard cobre TODOS os sentinels
  # automaticamente: se o produtor reformular a frase (ou um grep novo
  # apontar para string que o script não emite), o PR falha no início com
  # workflow:linha, o sentinel e o produtor.
  #
  # CI-only (espelha o workflow-refs-guard — não entra nos hooks, pois a
  # tabela de simetria do README é de encoding guards). Node puro, sem deps.
  sentinel-producer-guard:
    name: Sentinel Producer Guard (grep -Fq ↔ produtor)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check every grep -Fq sentinel has a matching producer
        run: node scripts/check-sentinel-producer.mjs

      - name: Summary
        run: echo "✅ All workflow grep -Fq sentinels are emitted by their producer scripts."

  # ── No setup-bun Guard ────────────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se qualquer workflow voltar a usar
  # oven-sh/setup-bun@v2 (o action externo re-downloada o release LATEST do
  # Bun em todo job, ~25-35s/job). Todos os 54 call sites foram migrados para
  # o script local scripts/setup-bun-ci.sh, chamado por `run:` (pre-installed
  # fast path → actions/cache keyed na versão → mirror OCI/download no cold
  # cache).
  no-setup-bun-guard:
    name: No setup-bun Guard (script local)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check no workflow uses oven-sh/setup-bun
        run: node scripts/check-no-setup-bun.mjs

      - name: Summary
        run: echo "✅ All workflows use scripts/setup-bun-ci.sh (cached)."

  # ── Bun Mirror Guard ─────────────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se a FONTE ÚNICA da versão do
  # Bun for violada. A versão vive APENAS na repository variable
  # vars.BUN_VERSION (Settings → Secrets and variables → Actions): workflows
  # passam a versão como ARGUMENTO de scripts/setup-bun-ci.sh
  # ('bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"'), o sync-bun-mirror.yml
  # usa a mesma variável no env. O guard falha se: mirror ausente, mirror com
  # BUN_VERSION literal, script sem leitura do argumento, script sem ref à
  # variável, tier 3 (cold cache) sem ref ao mirror GHCR, qualquer literal de versão
  # do Bun em workflows (bun-version: 1.3.14, bun-1.3.14-...), ou .actrc
  # sem BUN_VERSION (act local).
  #
  # Por que existe: trocar o Bun deve ser ALTERAR A VARIÁVEL EM UM LUGAR.
  # Antes, a versão estava espalhada em 40+ ocorrências (bun-version:,
  # cache keys bun-/prisma-, mirror env, default do action) — o drift entre
  # elas quebrava a key do cache silenciosamente. O guard falha o PR no
  # início com a violação exata (arquivo:linha).
  bun-mirror-guard:
    name: Bun Mirror Guard (fonte única vars.BUN_VERSION)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check bun single-source + GHCR mirror consistency
        run: node scripts/check-bun-mirror.mjs

      - name: Summary
        run: echo "✅ Bun version single-source (vars.BUN_VERSION) + GHCR mirror in sync."

  # ── Doctor Guard (o VALOR das repository variables, a cada PR) ────────
  # O job semanal `actrc-sync` (benchmark-weekly.yml) faz esta pergunta, mas
  # ele é SEMANAL: um PR que mexe num espelho (ou uma variable trocada na
  # forja) espera dias pelo veredito — e o defeito é SILENCIOSO (o espelho
  # velho não quebra nada visível: o setup-bun funciona igual, só mais lento,
  # e o pull da imagem só falha quando um job tenta iniciar). Aqui a MESMA
  # pergunta roda no merge, pelo doctor, que chama a MESMA função do guard
  # periódico (`mirrorDriftReport`) — o log deste job e a issue do semanal não
  # podem discordar, porque quem decide o que é drift é uma função só.
  #
  # A LÓGICA MORA EM `scripts/check-doctor-ci.mjs`, e a linha aqui é uma só:
  # o doctor exige que todo gate da pipeline dona do merge seja uma linha
  # `run: <cmd>` executável por LISTA DE ARGUMENTOS (é assim que ele roda a
  # bateria a partir do job `guards` da forja) — um `run: |` com o comando lá
  # dentro ficaria invisível para ele.
  #
  # ESPELHO DA FORJA: o MESMO gate roda no job `guards` de
  # `.gitea/workflows/ci.yml`, onde a resposta decide o merge de verdade. É
  # invariante CORE do `check:forge-parity`: dois lados, uma régua.
  #
  # O `env` explícito (sem fallback) não é redundância: no AMBIENTE a
  # invariante 7c do check-registry-source compara o valor com o que o
  # repositório declara — e herdá-lo do env do workflow (`|| 'ghcr.io'`) seria
  # comparar contra um FALLBACK, que é intenção declarada, nunca valor.
  doctor-mirrors-guard:
    name: Doctor Guard (valor das repository variables nos espelhos)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Doctor Ci (o VALOR das repository variables nos espelhos)
        env:
          BUN_VERSION: ${{ vars.BUN_VERSION }}
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
        run: node scripts/check-doctor-ci.mjs

      - name: Summary
        run: echo "✅ Espelhos (imagem do runner) conferidos contra as repository variables."

  # ── Mutation Jobs Guard (staged diff) ───────────────────────────────
  # Fast gate (node puro, <1s): roda o check de cobertura de mutation tests
  # contra o DIFF DO PR (git diff origin/main...HEAD — escopo scripts/ E
  # .github/workflows/) em vez do working tree inteiro — detecta antes do
  # merge, mesmo que o restante do repositório já esteja consistente:
  #   → (forward)  um test-mutation-*.sh NOVO introduzido pelo PR sem job
  #                (sem ref direta num workflow run: nem na matriz do master);
  #   ← (reverse)  um run: de workflow NOVO (linha adicionada pelo diff)
  #                apontando para test-mutation-*.sh INEXISTENTE em scripts/
  #                (ref quebrada introduzida pelo próprio PR — o par fecha
  #                nos dois lados, espelhando o scan global).
  # Só o que o diff ADICIONA é avaliado (linhas `+`) — violações
  # pré-existentes do base não poluem o PR.
  #
  # Requer fetch-depth: 0 para o git diff base...HEAD funcionar (mesmo
  # padrão do bun-mirror-staged-guard). Local/pre-commit: node
  # scripts/check-mutation-jobs.mjs --staged usa git diff --cached.
  mutation-jobs-staged-guard:
    name: Mutation Jobs Guard (staged diff)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for origin/main...HEAD diff

      - name: Check mutation test coverage on the PR diff
        run: node scripts/check-mutation-jobs.mjs --staged --base origin/main

      - name: Summary
        run: echo "✅ No orphan test-mutation-*.sh and no broken workflow ref introduced by this PR diff."

  # ── Mutation Guards MASTER (consolidado) ────────────────────────────
  # Roda os 39 mutation tests node-puro dos guards de CI num JOB SÓ via
  # scripts/test-mutation-guards.sh — matriz de sub-tests que orquestra os
  # scripts granulares (que continuam sendo a fonte única de
  # fixtures/mutações/asserções de cada guard):
  #   bun-literal    → test-mutation-bun-literal.sh
  #                    (versão LITERAL na chamada do setup deve FALHAR)
  #   bun-removal    → test-mutation-bun-removal.sh
  #                    (REMOÇÃO da chamada do setup --staged deve FALHAR)
  #   hooks-symmetry → test-mutation-hooks-symmetry.sh
  #                    (guard novo no pre-commit + linha stale devem FALHAR)
  #   readme         → test-mutation-readme-guards.sh (matriz ANINHADA:
  #                    anchors + toc + images — 1 sub-test, sem re-rodada)
  #   readme-reverse → test-mutation-readme-reverse.sh
  #                    (drift SEMÂNTICO do README — baseline reverse — deve
  #                    FALHAR com exit 1 exato, sem depender do cron)
  #   docs-anchor    → test-mutation-readme-docs-anchor.sh
  #                    (âncora quebrada em docs/*.md — fixture COM docs/ —
  #                    deve FALHAR: cobre o scan default dos docs)
  #   producer-sent  → test-mutation-producer-sentinel.sh
  #                    (sentinel 'com CRLF' removido do audit all-text —
  #                    cópia em temp — deve FALHAR o validate-all-text-alert)
  #   mutation-jobs  → test-mutation-mutation-jobs.sh
  #                    (script órfão forward + matriz quebrada reverse do
  #                    check-mutation-jobs devem FALHAR)
  #   workflow-refs  → test-mutation-workflow-refs.sh
  #                    (alvo TRANSITIVO de entry deletado — workflow bun run
  #                    → scripts/X — + entry órfã do --pkg-internal devem
  #                    FALHAR: prova o par transitivo end-to-end no CI)
  #   utf8-scope     → test-mutation-utf8-scope.sh
  #                    (call site sem src/ deve FALHAR)
  #   timing-budget  → test-mutation-timing-budget.sh
  #                    (payload 300s > budget 240s do measure-mutation-timing
  #                    deve FALHAR exit 1 + controle 35s passa + warn-only
  #                    + DRIFT: step renomeado → exit 2 + faixa soft DERIVADA
  #                    da mediana --warn-median: controle/warn/mutação/validação)
  #   e2e-cache-budget → test-mutation-e2e-cache-budget.sh
  #                    (gate de budget 600s/10 min do job 'E2E Cache': payload
  #                    900s > 600s deve FALHAR exit 1 + drift exit 2 — SKIP
  #                    exit 0 enquanto measure-e2e-cache.mjs não existir)
  #   lint-guard      → test-mutation-lint-guard.sh
  #                    (prettier --check + eslint --max-warnings 0 devem
  #                    FALHAR: arquivo mal formatado / warning de lint)
  #   no-leaked-imports → test-mutation-no-leaked-imports.sh
  #                    (import resolvendo no node_modules do PAI — o bug do
  #                    z-ai-web-dev-sdk — + dep inexistente devem FALHAR;
  #                    dep declarada com install pendente deve PASSAR)
  #   workflow-run-syntax → test-mutation-workflow-run-syntax.sh
  #                    (quinze metades — a do AVISO, o stdin do bash, o LIMITE da
  #                    máscara, o índice do `--staged`, os shells medidos, a
  #                    guarda do fixer, a SEGUNDA fonte, o PULO NOMEADO do passo
  #                    não-bash, o PULO NOMEADO do ARQUIVO de shebang não-bash — a
  #                    simetria do anterior, com a decisão da outra fonte — e as
  #                    CINCO da terceira fonte: o `RUN` do Dockerfile, o payload
  #                    do `sh -c`, a leitura por ESTRUTURA do YAML, o de-escape do
  #                    `$$` do compose e o pulo do heredoc), mais a GARANTIA DO
  #                    PREVIEW (`--fix --dry-run` não grava o patch que publica no
  #                    PR) — cada mutação cirúrgica; as DUAS do pulo e a do
  #                    preview exigem a suíte unitária VERMELHA e o job próprio
  #                    deste mesmo gate segue abaixo, rodando o guard REAL)
  #   hook-commands  → test-mutation-hook-commands.sh
  #                    (o comando que os hooks EXECUTAM tem de resolver: o
  #                    caminho tipado, a entrada de `scripts` ausente e o
  #                    indeterminado NÃO declarado devem CEGAR o guard; a
  #                    função do próprio hook deve ACUSAR O SÃO — violação
  #                    falsa medida no hook real — e as duas testemunhas
  #                    (o CLI e a suíte unitária) têm de mudar de veredito)
  #   gate-registration → test-mutation-gate-registration.sh
  #                    (o REGISTRO da proteção da forja — `registrationDelta`:
  #                    contexto a MENOS, a MAIS e CONTAGEM no nome — medido POR
  #                    EXECUÇÃO: o motor da prova roda contra uma forja DUBLADA
  #                    (`merge-gate-fake-forge.mjs`, sem docker) e cada metade
  #                    mutada muda o veredito; a régua da contagem GULOSA acusa
  #                    o contexto editorial legítimo — violação FALSA; a suíte
  #                    unitária entra pelas âncoras da metade mutada)
  #   github-deps    → test-mutation-github-dependencies.sh
  #                    (a CATRACA do inventário do GitHub — a comparação de
  #                    CONJUNTOS do item NOVO e do item SUMIDO, a do CONTADOR, a
  #                    NOMEAÇÃO do item novo e do delta, e os TRÊS fail-closed do
  #                    dado: o AUSENTE, o ILEGÍVEL e o contador que não é número.
  #                    O defeito é injetado no dado versionado e o CLI mede antes
  #                    e depois de cada mutação; a suíte unitária roda com o dado
  #                    já RESTAURADO — senão o vermelho dela viria do defeito, e
  #                    não da mutação)
  # Cada sub-test roda SEMPRE (fail-CONTINUE) e o harness imprime o output
  # completo do script granular + verdict por sub-test + tabela final —
  # granularidade de diagnóstico preservada. Exit final agregado: 0 se
  # TODOS passarem, 1 se QUALQUER sub-test falhar (guard cego / asserção
  # quebrada).
  #
  # ANTES eram 5 jobs (bun-literal + bun-removal + hooks-symmetry + readme
  # + utf8-scope), cada um com o overhead de setup do container/checkout —
  # consolidar reduz o setup por job sem perder a granularidade
  # (--scenario <id> roda um sub-test isolado para diagnóstico local).
  # Node-puro, <9s total, sem docker.
  #
  # Um sub-test NOVO se soma à matriz sem tocar o CONTEXTO do required check
  # (o `name:` acima é count-free) — é o `check-mutation-count` que cobra o
  # count onde ele é diagnóstico: summary, comentário, header e README.
  #
  # ⚠️ O `name:` ABAIXO NÃO CARREGA O COUNT — DE PROPÓSITO.
  # O nome de um job é o CONTEXTO do status check na forja, e o branch
  # protection exige esse contexto (ci/required-checks.json →
  # scripts/apply-required-checks.mjs). Enquanto o nome dizia
  # "(27 node-pure mutation tests)", CADA bump da matriz reescrevia o contexto
  # protegido: a proteção aplicada na forja passava a exigir um check que já não
  # existe, e o PR travava esperando para sempre — bastava adicionar um sub-test.
  # O count é DIAGNÓSTICO: vive no summary e no comentário abaixo, no header do
  # master e no README, e o `check-mutation-count` compara todos com o derivado.
  # Aqui ele é PROIBIDO (o guard falha se um número voltar): o contrato de merge
  # não pode depender do tamanho da matriz.
  # ── Cada COMMIT da pilha passa SOZINHO (worktree próprio) ────────────────
  # O PR mede o TOPO; a pilha tem commits no MEIO. Medido: o `2757e3a5` pôs o
  # `check-mutation-count` na bateria local e invalidou a expectativa do teste
  # da descida — o vermelho viajou 12 commits acima, e quem media só o topo (o
  # `test:run` do PR) nunca viu o commit que nasceu vermelho.
  #
  # Este job mede CADA commit da pilha SOZINHO, num `git worktree` próprio: os
  # testes que o DIFF daquele commit alcança (o grafo de imports e a convenção
  # de nome) e três invariantes de ÁRVORE que qualquer commit pode quebrar sem
  # tocar o dono delas (a contagem da matriz, a paridade das forjas e a prosa da
  # versão). Um commit que não passa sozinho REPROVA o job nomeando o commit e o
  # gate; acima do teto de commits o veredito é INDETERMINADO (exit 2), nunca
  # verde.
  #
  # `fetch-depth: 0` é CONDIÇÃO da medição (sem a história não há worktree do
  # commit) e `node_modules` é INSTALADO — o job roda `vitest` dentro dos
  # worktrees, e é o `check-job-deps` quem cobra isso de todo job.
  stack-per-commit:
    name: Stack Per-Commit (cada commit sozinho)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A CONTA DA ACTIONS-PLANE FECHA — e é por isso que este job é o ÚNICO
      # sem cache: as duas chaves de cache carregam a versão do Bun, e cada
      # referência à variável de repositório é dependência NOVA para a catraca
      # do `check-github-dependencies`, que só anda para baixo (o contador lê o
      # arquivo INTEIRO — nem um comentário pode citá-la). O `setup-bun-ci.sh`
      # fica na forma CANÔNICA, que é a régua do `check-bun-mirror`: UMA
      # ocorrência, paga pela remoção de uma citação em prosa no
      # `benchmark-weekly.yml`. O que se perde é o cache (o Bun é baixado a cada
      # execução) e o custo disso está DECLARADO no modelo de latência.
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      # `PILHA_HEAD`: no PR o checkout é o commit de MERGE — medir a pilha a
      # partir dele mediria outra pilha. O head real do PR entra por env, e a
      # BASE sai do `GITHUB_BASE_REF` (a mesma régua do `--base`).
      - name: Cada commit da pilha, sozinho
        env:
          PILHA_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/prove-stack-per-commit.mjs

      - name: Summary
        run: echo "✅ Cada commit da pilha foi materializado num worktree próprio e medido SOZINHO — os testes que o diff dele alcança (grafo de imports + convenção de nome) e as três invariantes de árvore (contagem da matriz, paridade das forjas, prosa da versão). Um commit que não passa sozinho nomeia o commit e o gate; a pilha acima do teto sai INDETERMINADA (nunca verde)."

  mutation-guards:
    name: Mutation guards master
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Mutation tests — todos os guards devem FALHAR nas mutações
        run: bash scripts/test-mutation-guards.sh

      - name: Summary
        run: echo "✅ All 39 node-pure mutation tests passed (bun literal, bun remoção, hooks simetria, README anchors/toc/images, README reverse, docs anchor, produtor sentinel, mutation-jobs, workflow-refs, UTF-8 escopo, timing-budget, e2e-cache-budget, lint-guard, mutation-count, no-leaked-imports, pipefail-sigpipe, paridade hook↔CI, comandos dos hooks, defaults de shell, sintaxe dos corpos `run:`, latência de merge, defaults do registry/namespace, dependências dos jobs, resposta do remédio no TTY, o REGISTRO do CANAL do remédio — a descoberta das declarações e as duas direções do par com a classe, contrato dos required checks APLICADOS — o rename sem a reaplicação declarada, o REGISTRO da proteção da forja — o contexto a menos, a mais e contagem no nome, as CONDIÇÕES do retrato arquivado — cada passo contra a forja, e a CATRACA do inventário do GitHub — a comparação de conjuntos e de contador, a nomeação e os três fail-closed do dado, e as ETAPAS DO CORTE — o gate da dona do merge, o required check dela e o gate que o espelho perde sem declaração, a COBERTURA DO RECORTE — o CONTROLE (o comando que falha por ambiente sai da medição), a soma por tabela e a recusa do pulo sem motivo, e a PROVA SEM DUBLÊ do pre-commit — a declaração dos recusadores, a descida do runner e o CONTROLE, e a RÉGUA DA IDADE — a derivação da origem pela DATA, a âncora de mês, o teto por tipo e o fail-closed das duas fontes, e a PILHA COMMIT A COMMIT — as duas réguas dos testes afetados, o veredito por commit e o da série e o teto que se recusa a medir acima dele, e a RÉGUA DAS CITAÇÕES DE COMMIT na prosa — a regra da HISTÓRIA (o órfão de rewrite), o NÚMERO PURO, o DIGEST de artefato, o fail-closed sem git, o auditor que não se conta e a extensão fora do escopo, e a MATRIZ × O ATO que a versiona — a defasagem que nomeia o sub-test que ninguém versionou, o count GRAVADO divergente e o fail-closed do registro ilegível)."

  # ── Forge Parity Mutation (job DEDICADO, fora do master) ────────────────
  # A prova por mutação das TRÊS regras de classificação do
  # check-forge-parity: (1) nenhum gate sem classificação — na forja dona do
  # merge E no espelho; (2) nenhuma isenção GITHUB_ONLY pode RODAR na forja
  # (classificação stale); (3) todo invariante do CORE roda nas DUAS pipelines
  # COM O COMANDO CANÔNICO — nem invocação indireta, nem o mesmo comando sem
  # os argumentos canônicos.
  #
  # Por que DEDICADO (e não mais um sub-test do master): esta é a única prova
  # do repositório cujo sujeito é o CONTRATO DE MERGE em si — quais gates podem
  # pular uma forja e com qual forma de comando. Um vermelho dela dentro de uma
  # matriz de 22 sub-tests diz "alguma mutação falhou"; como job próprio ela diz
  # QUAL regra de classificação quebrou, e vira check com nome no contrato de
  # merge (ci/required-checks.json). Custo: ~2s node-puro, sem docker.
  forge-parity-mutation:
    name: Forge Parity Mutation (regras de classificação)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Mutation test — as três regras de classificação devem FALHAR
        run: bash scripts/test-mutation-forge-parity.sh

      - name: Summary
        run: echo "✅ check-forge-parity pega gate sem classificação (nas DUAS pipelines), isenção GITHUB_ONLY rodando na forja, invariante do CORE ausente e o invariante presente fora da forma canônica."

  # ── Hooks Symmetry Guard (dedicado) ─────────────────────────────────
  # Fast gate (node puro, <1s): roda o guard REAL de simetria
  # (scripts/check-hooks-symmetry.mjs — bidirecional) no PR, em paralelo com
  # os demais fast gates.
  #
  # Por que dedicado: o mesmo guard também roda no reusable utf8-check.yml
  # (chamado por ci/deploy/e2e-cache/release-deploy), mas o PR-check só
  # chamava o mutation test (que prova SENSIBILIDADE do guard em repo
  # fixture) — o guard REAL nunca era executado contra o working tree do PR
  # (o job inline utf8-check roda apenas check-utf8.sh). Um PR que quebre a
  # tabela '## Git Hooks' do README (forward: guard nos hooks sem linha, ou
  # reverse: linha stale sem guard real) passaria no CI. Este job fecha o
  # ciclo: detecção end-to-end (guard real) + prova de sensibilidade
  # (mutation test) no mesmo workflow.
  hooks-symmetry-guard:
    name: Hooks Symmetry Guard (README ↔ hooks)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check README Git Hooks table ↔ real hooks (bidirectional)
        run: node scripts/check-hooks-symmetry.mjs

      - name: Summary
        run: echo "✅ README '## Git Hooks' table in sync with .husky/* + run-encoding-guards.sh."

  # ── Mutation Jobs Guard (dedicado) ──────────────────────────────────
  # Fast gate (node puro, <1s): roda o guard REAL de cobertura de mutation
  # tests (scripts/check-mutation-jobs.mjs) no PR — todo
  # scripts/test-mutation-*.sh DEVE ter um job correspondente no CI (via run:
  # direto num workflow OU na matriz SUBTESTS/SCENARIOS do master, que este
  # job roda).
  #
  # O guard é BIDIRECIONAL (par fechado nos dois lados): além do forward
  # (script órfão sem job), o reverse também falha quando um run: direto de
  # workflow OU uma entrada da matriz referencia um test-mutation-*.sh
  # INEXISTENTE em scripts/ (ref quebrada — arquivo fantasma).
  #
  # Por que dedicado: o job mutation-guards roda o MASTER (que orquestra os
  # mutation tests node-puro EXISTENTES), mas não valida que um NOVO
  # test-mutation-*.sh adicionado num PR foi wireado num job — um PR que
  # adicione o script sem o job passaria no CI e o mutation test nunca
  # rodaria. Este job fecha o ciclo: script órfão = PR vermelho, antes do
  # merge (e o mesmo guard roda no reusable utf8-check.yml + hooks locais).
  mutation-jobs-guard:
    name: Mutation Jobs Guard (test-mutation-*.sh ↔ CI jobs)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check every test-mutation-*.sh has a CI job (transitive)
        run: node scripts/check-mutation-jobs.mjs

      - name: Summary
        run: echo "✅ Every scripts/test-mutation-*.sh is wired to a CI job (direct or via master matrix)."

  # ── README Reverse-Strict Alert (workflow_dispatch, NÃO-bloqueante) ──
  # Alerta AUDÍVEL do modo opt-in --reverse-strict do check-readme-anchors.mjs:
  # roda via workflow_dispatch (manual/periódico) contra o README.md e emite
  # ::warning:: para CADA achado — SEM falhar o PR (exit 0 sempre).
  #
  # POR QUE NÃO É GATE: o --reverse-strict fecha a brecha da heurística
  # single-token (labels de UM token não-stopword) e, por isso, acusa
  # FALSOS POSITIVOS de prosa (ex.: o label 'abaixo' → heading legítimo —
  # medido 08/2026: 1 achado no README real, 0 no --reverse). Gate no PR
  # quebraria por prosa; este job transforma o modo em alerta periódico:
  # ::warning:: no Actions, sem bloquear o merge. O --json (REPORT mode)
  # exit 0 SEMPRE — o caller (aqui o job) decide o gate (nenhum: só emite
  # warning).
  readme-reverse-strict-alert:
    name: "README Reverse-Strict Alert (::warning::, não-bloqueante)"
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # PROSE ALLOWLIST: exime palavras de prosa comum ('abaixo', 'acima',
      # 'seguir', 'aqui', 'fluxo') que o strict flagaria como falso positivo
      # (medido 08/2026: 1 achado no README real SEM allowlist — o label
      # 'abaixo' → heading legítimo). A renomeação single-token REAL continua
      # pega: token permitido que exista como heading em outro lugar → regra 4
      # (violação com sugestão). Bump do guard deve manter esta lista em
      # sincronia com a doc do check-readme-anchors.mjs.
      - name: Run reverse-strict check (REPORT mode — exit 0 sempre)
        run: >
          node scripts/check-readme-anchors.mjs
          --reverse-strict
          --prose-allowlist abaixo,acima,seguir,aqui,fluxo
          --json README.md
          > /tmp/reverse-strict-report.json

      - name: "Emit ::warning:: per finding (não falha o PR)"
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const reportPath = "/tmp/reverse-strict-report.json";
          if (!fs.existsSync(reportPath) || fs.statSync(reportPath).size === 0) {
            // Guard falhou antes de escrever o report (ex.: erro no parse do
            // README). Job dispatch-only e não-bloqueante: emite ::warning::
            // e termina limpo em vez de ir a vermelho.
            console.log(
              "::warning::report reverse-strict vazio/ausente — guard falhou antes de escrever (job dispatch-only, não-bloqueante).",
            );
            process.exit(0);
          }
          const { count, findings } = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          if (count === 0) {
            console.log("✅ Nenhum achado reverse-strict no README.md.");
          } else {
            console.log(`⚠️ ${count} achado(s) reverse-strict (não-bloqueante):`);
            for (const f of findings) {
              const kind = f.strict ? "reverse-strict" : "reverse";
              const msg = `${kind}: label "${f.label}" → #${f.slug} (heading: "${f.heading}")`
                .replace(/%/g, "%25")
                .replace(/\r/g, "%0D")
                .replace(/\n/g, "%0A")
                .replace(/::/g, ":");
              console.log(`::warning file=${f.file},line=${f.line}::${msg}`);
            }
          }
          NODE

      - name: Summary
        run: echo "✅ README reverse-strict alert done (warnings emitted, PR not blocked)."

  # ── Tier-1 Fastpath Guard (PR, paths) ───────────────────────────────
  # Gate OPCIONAL (dry, sem cron): detecta regressão do tier-1 fast path
  # do setup-bun ANTES do merge, apenas quando o PR tocar o script do setup
  # (scripts/setup-bun-ci.sh) ou o Dockerfile.ubuntu-bun.
  #
  # POR QUE: o guard periódico (tier1-fastpath-guard.yml) roda SÓ na cron
  # semanal — uma mudança de PR que quebre o tier-1 (imagem para de
  # embarcar bun, o passo 'Detect pre-installed Bun' quebra, ou a versão
  # embarcada diverge de vars.BUN_VERSION) só seria detectada DIAS depois,
  # com o setup-bun silenciosamente mais lento (tier 2/3) — o pr-check
  # mede correção, não performance, e não percebe a regressão. Este job
  # re-executa o MESMO `act -j check` com a imagem custom
  # (ghcr.io/<owner>/ubuntu-bun:<versão>, bun PRÉ-INSTALADO) e gateia no
  # marcador 'Usando Bun pré-instalado' + threshold do passo fast-path
  # (scripts/check-tier1-fastpath.mjs).
  #
  # DRY vs periódico: sem schedule (roda no PR via paths), sem
  # upload-artifact (não precisa de actions: write), só o guard decide
  # (exit 0/1). Custo: ~15 min de act só quando os paths mudam — o preço
  # de travar o tier-1 antes do merge.
  #
  # ⚠️ Imagem no GHCR: pacote PRIVADO (verificado 08/2026: pull anônimo
  # local retorna 'denied'). No CI o pull do act usa o auth automático do
  # runner — exige GITHUB_TOKEN com 'packages: read' (garantir no
  # permissions dos workflows; o periódico tier1-fastpath-guard.yml já
  # tem). Pública só é necessária para reprodução local/externa.
  # ⚠️ Os 4 steps pesados espelham o tier1-fastpath-guard.yml (periódico) —
  # alterações no act/args do guard DEVEM ser replicadas nos dois lugares.
  tier1-fastpath-guard:
    name: Tier-1 Fastpath Guard (setup-bun changes)
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for origin/main...HEAD diff

      # ── Path filter: steps pesados só rodam quando o PR toca o script do
      # setup (ou o Dockerfile.ubuntu-bun) — mesmo padrão de diff dos jobs
      # benchmark/geo, sem action externa de paths.
      # Falha LOUD se o diff não puder ser calculado: um guard que pula em
      # silêncio (changed=false por erro de git) trairia o propósito.
      - name: Detect tier-1 relevant changes
        id: changes
        run: |
          set -euo pipefail
          if ! git diff --name-only origin/main...HEAD > /tmp/pr-diff.txt 2>/tmp/pr-diff.err; then
            echo "::error::não foi possível calcular o diff origin/main...HEAD"
            cat /tmp/pr-diff.err
            exit 1
          fi
          if grep -qE '^(scripts/setup-bun-ci\.sh|Dockerfile\.ubuntu-bun)' /tmp/pr-diff.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "  ✅ PR toca o setup do Bun/Dockerfile.ubuntu-bun — rodando guard"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "  ℹ️ PR não toca o setup do Bun/Dockerfile.ubuntu-bun — guard pulado"
          fi

      # ── Valida a repository variable (fail-fast com mensagem clara) ──
      - name: Validate BUN_VERSION variable
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if [ -z "${{ vars.BUN_VERSION }}" ]; then
            echo "::error::Repository variable BUN_VERSION não definida — crie em Settings → Secrets and variables → Actions (ex.: gh variable set BUN_VERSION 1.3.14)."
            exit 1
          fi
          echo "  ✅ BUN_VERSION=${{ vars.BUN_VERSION }}"

      # ── Instala o act pinado (mesma versão do ambiente local) ────────
      # Sem setup-bun aqui de propósito: o objetivo é testar o setup-bun
      # DENTRO do act, não usar o setup-bun para testar o setup-bun.
      - name: Install act (v0.2.89)
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/act.tar.gz \
            "https://github.com/nektos/act/releases/download/v0.2.89/act_Linux_x86_64.tar.gz"
          tar -xzf /tmp/act.tar.gz -C /tmp act
          /tmp/act --version

      # ── Re-executa o job check com a imagem custom (tier-1) ──────────
      # O timeout do step limita o custo do job completo — a evidência do
      # setup-bun (passo #2) já está no log nos primeiros ~30s; o guard
      # decide o verdict, não o exit do act (mesma semântica do periódico).
      - name: Run act -j check (imagem custom)
        if: steps.changes.outputs.changed == 'true'
        id: act
        run: |
          set +e
          timeout 900 /tmp/act -b \
            -W .github/workflows/pr-check.yml \
            -j check \
            -P "ubuntu-latest=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ubuntu-bun:${{ vars.BUN_VERSION }}" \
            --var "BUN_VERSION=${{ vars.BUN_VERSION }}" \
            --secret "GITHUB_TOKEN=${{ github.token }}" \
            > /tmp/act-check.log 2>&1
          ACT_EXIT=$?
          echo "ACT_EXIT=${ACT_EXIT}" >> "$GITHUB_OUTPUT"
          echo "  act exit: ${ACT_EXIT} (o guard decide o verdict)"
          echo "  log: /tmp/act-check.log ($(wc -l < /tmp/act-check.log) linhas)"

      # ── GATE: o guard decide PASS/FAIL baseado na evidência tier-1 ───
      # --act-exit recebe o exit code do act (steps.act.outputs.ACT_EXIT): se
      # o act morreu ANTES do setup-bun (exit != 0 sem evidência no log — ex.:
      # imagem não publicada), o guard FALHA com diagnóstico claro (regra 7).
      - name: Guard tier-1 fast path (threshold 5s)
        if: steps.changes.outputs.changed == 'true'
        run: |
          node scripts/check-tier1-fastpath.mjs \
            --log /tmp/act-check.log \
            --threshold 5 \
            --version "${{ vars.BUN_VERSION }}" \
            --act-exit "${{ steps.act.outputs.ACT_EXIT }}"

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "✅ Tier-1 fast path validated on the custom image (setup-bun change)."
          else
            echo "ℹ️ Skipped — PR does not touch setup-bun action or Dockerfile.ubuntu-bun."
          fi

  # ── E2E Counts Guard ──────────────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se os counts de checks
  # documentados nos comentários dos workflows (pr-check.yml, seed-guards.yml,
  # validate-seed-guards-matrix-local.sh) divergirem do EXPECTED_TOTAL
  # declarado nos E2Es de seed (128 prod / 162 dev — fonte da verdade).
  #
  # Por que existe: os counts crescem quando asserções são adicionadas aos
  # E2Es (o dev E2E passou de 132 → 147 → 162 ao longo dos cenários). Sem
  # este guard, um dev atualiza o E2E mas esquece o comentário do workflow —
  # o CI não pega e o número documentado fica errado para sempre. Este guard
  # fecha o loop: qualquer divergência entre o que está escrito nos workflows
  # e o EXPECTED_TOTAL do source falha o PR no início com arquivo:linha.
  # Complemento runtime: cada E2E também valida no final que o total REAL
  # impresso (📊 Resultados) bate com a própria constante (exit 1 se divergir).
  e2e-counts-guard:
    name: E2E Counts Guard (comentários = derivação)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Check documented E2E check counts match the derivation
        run: node scripts/check-e2e-counts.mjs

      - name: Summary
        run: echo "✅ Documented E2E counts match the derivation (scripts/seed-e2e-count.ts)."

  # ── Seed Count Literals Guard ───────────────────────────────────────
  # Fast gate (node puro, <2s): varre TODO o repo — scripts/, docs/,
  # .github/ — por literais de count de seed em CONTEXTO ("N checks" ou o
  # ternary da matrix do seed-guards.yml) que NÃO batam com a derivação
  # real (bun scripts/seed-e2e-count.ts --json → {prod: 128, dev: 162}).
  #
  # Por que existe: o incidente do "count drifted" (doc dizia 128, âncora de
  # teste esperava 123) mostrou que um literal órfão pode sobreviver a um
  # bump do seed sem ninguém perceber — o e2e-counts-guard cobre os
  # workflows e o script local, mas NÃO varre docs/ nem todos os scripts/.
  # Este guard fecha o buraco: QUALQUER literal "N checks" fora do conjunto
  # válido {prod, dev} (ex.: um 123 esquecido numa doc após a derivação
  # passar para 128) falha o PR na hora, com arquivo:linha.
  #
  # Contexto evita falso positivo: número PRECEDIDO por espaço/pontuação
  # (nunca hífen — "UTF-8 check" não casa), 2-3 dígitos (counts de seed),
  # e o ternary ancorado em 'prod' + '}} checks' (o `&& '1'` do
  # SKIP_PRISMA_GENERATE é single-digit e não casa). Mock data (CVC "123",
  # endereços, rgba, senhas) e prosa histórica sem "checks" adjacente não
  # são flags.
  seed-count-literals-guard:
    name: Seed Count Literals Guard (scripts/docs/.github = derivação)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Check seed count literals across scripts/, docs/, .github/
        run: node scripts/check-seed-count-literals.mjs

      - name: Summary
        run: echo "✅ No orphan seed-count literals outside the derivation (scripts/seed-e2e-count.ts)."

  # ── Actionlint (workflow syntax) ───────────────────────────────────────
  actionlint:
    name: Actionlint (workflow syntax)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint on all workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      - name: Summary
        run: echo "✅ All .github/workflows/*.yml pass actionlint (syntax + shellcheck)."

  # ── Lint Guard (prettier + eslint zero) ──────────────────────────────
  # Fase 3/4 do parecer (lint/prettier zero): falha o PR se QUALQUER
  # arquivo do repo estiver fora do padrão do prettier OU se o eslint
  # emitir QUALQUER warning/erro (--max-warnings 0).
  #
  # Por que existe: formatação e lint eram feitos só no hook local
  # (pre-commit lint-staged) — um PR criado fora do ambiente local (web
  # editor, squash, CI-only) ou um warning introduzido por um arquivo que
  # o lint-staged não cobre (diretório novo, extensão nova) passaria sem
  # revisão. Este job fecha o loop: prettier --check + eslint
  # --max-warnings 0 no working tree completo do PR, com arquivo:linha
  # na falha.
  #
  # UM COMANDO SÓ, NAS DUAS FORJAS: o par (prettier + eslint zero) mora no
  # script `lint` do package.json — a ÚNICA fonte da régua — e este job roda
  # exatamente `bun run lint`, o MESMO comando do job `lint` da Gitea.
  #
  # Antes o par estava INLINE aqui e o `lint` do package.json era só
  # `eslint .` (sem o teto de warnings, sem prettier): o mesmo commit passava
  # no merge da Gitea e era rejeitado aqui — dois vereditos para um merge só,
  # e o pior deles era o que liberava. O escopo do prettier (src/ scripts/
  # docs/ prisma/ configs raiz — artefatos gerados excluídos pelo
  # .prettierignore; `prettier --check .` puro quebra em globs *.prisma/*.sql da
  # raiz) é o mesmo que a Fase 3 validou — a diferença é só ONDE ele vive. Quem prende a simetria é o invariante `lint`
  # do check:forge-parity (UM `matches`, sem régua por forja) e os contratos
  # do forge-doctor (o job exigido tem de RODAR este comando).
  lint-guard:
    name: Lint Guard (prettier + eslint zero)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      # O comando INTEIRO (prettier --check + eslint . --max-warnings 0) — o
      # mesmo que o job `lint` da Gitea executa e o mesmo que qualquer pessoa
      # roda na máquina. Nenhum passo inline: um comando duplicado em dois
      # lugares é um comando que vai divergir no dia em que alguém apertar um
      # dos lados.
      - name: Check lint (prettier + eslint zero)
        run: bun run lint

      # CONTRATO REPO-WIDE (não PR-scope): o `eslint . --max-warnings 0` do
      # script cobre TODO o repo — um warning introduzido em QUALQUER arquivo
      # (mesmo via merge de base com warning, sem o PR tocar o arquivo) falha o
      # job. Semântica intencional da Fase 3/4: zero warnings é contrato duro.

      - name: Summary
        run: echo "✅ All files formatted (prettier) and zero eslint warnings/errors."

  # ── JSDOM Component Suite — drift baseline (P0 qualidade) ─────────────
  # A suíte jsdom de componentes (src/components, vitest.config.ts) NÃO roda
  # no test:unit do CI (o vitest.config.unit.ts exclui src/components/**).
  # Este job roda a suíte REAL (~6 min) e compara as falhas com um baseline
  # commitado (docs/quality/jsdom-failures-baseline.json) — padrão
  # check-secret-leaks-baseline: NENHUM drift PARA CIMA é permitido (arquivo
  # de teste novo falhando OU count crescendo = exit 1); falhas que SUMEM
  # passam. As 141 falhas pré-existentes (08/2026) são documentadas no
  # baseline — este gate as torna VISÍVEIS e impede o crescimento enquanto
  # a remediação por arquivo anda. --update regenera o baseline e é USO
  # LOCAL (nunca no PR — um PR que reduz falhas precisa de revisão manual
  # do baseline, não de re-baseline automático).
  #
  # O mutation test (test-mutation-jsdom-baseline.sh — fixtures
  # --results-file, node-puro <5s) roda ANTES do guard real: se a
  # sensibilidade do guard quebrar, o job falha rápido sem pagar os ~6 min
  # do run da suíte completa.
  jsdom-drift-guard:
    name: JSDOM component suite — drift baseline
    runs-on: self-hosted
    # Folga para o pior caso: install + run real (~6 min) + 2ª run de
    # CONFIRMAÇÃO quando drift é detectado (anti-flake) ≈ 14-15 min.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Mutation test — drift guard sensitivity (fixtures)
        run: bash scripts/test-mutation-jsdom-baseline.sh

      - name: Check jsdom failure drift (baseline)
        run: node scripts/check-jsdom-baseline.mjs

      - name: Summary
        run: echo "✅ JSDOM component suite — drift dentro do baseline (falhas pré-existentes não cresceram)."

  # ── Bun Audit — drift baseline (P0 segurança) ────────────────────────
  # Gate de vulnerabilidades de deps no padrão check-secret-leaks-baseline:
  # roda o `bun audit --json` REAL e falha SOMENTE em achados NOVOS de
  # severidade alta (high/critical) contra o baseline commitado
  # (docs/security/bun-audit-baseline.json — 73 advisories conhecidos em
  # 08/2026: 1 critical, 33 high, 33 moderate, 6 low).
  #
  # Por que existe: o antigo security:audit rodava `pnpm audit` (lockfile
  # pnpm REMOVIDO — o repo unificou em só bun.lock) com `|| echo` — o job
  # security-audit do quality-gate.yml NUNCA falhava e ninguém rodava
  # `bun audit` no CI (83 vulns sem gate). Este job fecha o buraco: um bump
  # de dep que traga advisory NOVO de severidade alta = PR vermelho, com
  # pacote/url/title no output. Achados novos de severidade MENOR viram
  # aviso (--min-severity alta é o default).
  #
  # O mutation test (fixtures --results-file, node-puro <5s) roda ANTES do
  # guard real (bun audit ~10-30s com rede) — se a sensibilidade quebrar, o
  # job falha rápido. Sem cache/install de propósito: o bun audit lê o
  # bun.lock direto (não precisa de node_modules).
  unused-deps-guard:
    name: Unused Deps Guard (package.json hygiene)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Mutation test — unused deps guard sensitivity (fixtures)
        run: bash scripts/test-mutation-unused-deps.sh

      - name: Check unused deps (package.json vs code refs)
        run: node scripts/check-unused-deps.mjs

      - name: Summary
        run: echo "✅ No unused dependencies — every package.json dep is referenced in code (sharp/@types/CLIs are implicit)."

  # Guard do Nº de sub-tests do master — deriva N do array SUBTESTS do
  # scripts/test-mutation-guards.sh e falha se o name/summary deste MESMO
  # job (mutation-guards) ou o README divergirem (drift 12→13 em 08/2026 foi
  # corrigido à mão; o guard impede a repetição). Node-puro, <1s, sem deps.
  mutation-count-guard:
    name: Mutation Count Guard (matrix ↔ job name/summary ↔ README)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      # O `node_modules` deste job: a suíte de mutação tem DUAS testemunhas, e a
      # segunda é a suíte unitária do guard (`bun x vitest`) — sem instalar, ela sai
      # como "NÃO julgada" e a metade "suíte VERMELHA" fica declarada mas não
      # medida. Medido: o `check-job-deps` acusou este job exatamente por isso (o
      # corpo da suíte chama `vitest`, que é binário do `node_modules`).
      #
      # Só o INSTALL, sem o passo de cache do `node_modules`: o cache canônico
      # carrega a variável de versão do Bun na chave, e cada referência a variável
      # de repositório (ou a segredo) conta na classe `actions-plane` do inventário
      # do GitHub — uma catraca que só ANDA PARA BAIXO, onde um par novo de
      # referências exigiria declarar a alta com `--update`. O "Restore Bun cache"
      # acima já devolve o cache global de pacotes do Bun, então o download não é
      # repetido: o que falta é o link.
      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Mutation test — count guard sensitivity (fixtures)
        run: bash scripts/test-mutation-mutation-count.sh

      - name: Check mutation count consistency (matrix vs pr-check vs README)
        run: node scripts/check-mutation-count.mjs

      # O N do summary sai do GUARD, nunca escrito à mão: enquanto ele dizia
      # "(21 sub-tests)" com a matriz em 36, o resumo do job mentia — e nenhum
      # guard cobria esta linha (as refs conferidas são o summary do job
      # `mutation-guards` e o comentário dele).
      - name: Summary
        run: |
          N=$(node scripts/check-mutation-count.mjs --json | node --input-type=module -e 'let s="";for await (const c of process.stdin) s+=c; console.log(JSON.parse(s).derivedCount)')
          echo "✅ Mutation test count ($N sub-tests) is consistent across the matrix, pr-check.yml and README."

  bun-audit-guard:
    name: Bun Audit Guard (deps — drift baseline)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Mutation test — bun audit guard sensitivity (fixtures)
        run: bash scripts/test-mutation-bun-audit-baseline.sh

      - name: Check bun audit drift (baseline)
        run: node scripts/check-bun-audit-baseline.mjs

      - name: Summary
        run: echo "✅ No new high-severity dependency vulnerabilities beyond the baseline (docs/security/bun-audit-baseline.json)."

  # ── Fuzz Tests ─────────────────────────────────────────────────────────
  # Runs in parallel with other checks. No external dependencies needed.
  fuzz:
    name: Fuzz Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run fuzz tests
        run: bun run fuzz:ci > fuzz-results.json

      - name: Archive fuzz results
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: fuzz-results.json
          retention-days: 30

  # ── Geo Benchmark ──────────────────────────────────────────────────────
  # Runs the geo-distance benchmark and compares against the baseline from
  # main.  Fails the PR if any benchmark regresses >threshold % in mean
  # latency.  The threshold is 5 % by default; when the PR touches
  # benchmark or geolocation code paths, it widens to 10 % to reduce
  # flakiness from algorithmic changes.
  benchmark:
    name: Geo Benchmark
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to fetch main branch for baseline

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run geo benchmark
        run: |
          node scripts/run-benchmark.mjs --type geo --json

      - name: Fetch baseline from main
        id: baseline
        run: |
          if git show main:docs/benchmarks/geo-baseline.json > /tmp/geo-baseline.json 2>/dev/null; then
            echo "baseline_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "baseline_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Detect threshold ────────────────────────────────────────────
      # Priority: workflow_dispatch input > auto-detect > default 5.
      # Auto-detect: when the PR touches benchmark/geo code, widen to 10%
      # to reduce flakiness from intentional algorithmic changes.
      - name: Detect threshold
        id: changes
        run: |
          MANUAL_INPUT=${{ github.event.inputs.threshold || 0 }}
          if [ "$MANUAL_INPUT" -gt 0 ] 2>/dev/null; then
            echo "threshold=$MANUAL_INPUT" >> "$GITHUB_OUTPUT"
          elif grep -qE '^(src/lib/(geo-shared|distance-fallback|radius-expansion|fetch-providers-data|fetch-unrestricted-results|sql-builder)\.ts|src/app/api/providers/route\.ts|scripts/(geo-benchmark|compare-benchmarks|run-benchmark)\.mjs)$' <<< "$(git diff --name-only origin/main...HEAD)"; then
            echo "threshold=10" >> "$GITHUB_OUTPUT"
          else
            echo "threshold=5" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare with baseline
        id: compare
        if: steps.baseline.outputs.baseline_exists == 'true'
        env:
          BENCHMARK_THRESHOLD: ${{ steps.changes.outputs.threshold }}
        run: |
          node scripts/compare-benchmarks.mjs \
            /tmp/geo-baseline.json \
            docs/benchmarks/geo-latest.json \
            2>&1 | tee /tmp/benchmark-diff.txt

      - name: No baseline available
        if: steps.baseline.outputs.baseline_exists != 'true'
        run: |
          echo "No geo-baseline.json on main — skipping comparison." | tee /tmp/benchmark-diff.txt

      # ── Publish job summary ──────────────────────────────────────────
      # Writes a condensed version of the comparison to the GitHub Actions
      # Job Summary so failures are self-explanatory at a glance.
      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo '## 📊 Geo-Benchmark Comparison'
            echo ''
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Threshold | ${{ steps.changes.outputs.threshold }}% |"
            echo "| Baseline | $(if [ -f /tmp/geo-baseline.json ]; then echo 'loaded'; else echo 'none'; fi) |"
            echo ''
            echo '```'
            cat /tmp/benchmark-diff.txt 2>/dev/null || echo 'No benchmark data available.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload artifact even on failure so results can be inspected
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-benchmark
          path: docs/benchmarks/geo-latest.json
          retention-days: 30

  # ── GiST Index Benchmark (PR Check) ─────────────────────────────────────
  # Spins up an ephemeral PostGIS container, runs the GiST index benchmark
  # against it, and validates that the crossover radius hasn't shifted
  # significantly relative to the baseline on main.
  #
  # Uses a reduced scope (500/2000 providers, 5 radii) so it completes in
  # ~5-8 min instead of the full 45 min weekly run.
  #
  # The PostGIS container is a service container — it starts before the job
  # steps and is torn down automatically when the job completes, costing
  # nothing beyond the runner minutes.
  benchmark-gist:
    name: GiST Benchmark (PR)
    runs-on: self-hosted

    # ── Ephemeral PostGIS service container ───────────────────────────
    # Imagem via vars.POSTGIS_IMAGE (default alpine — menor: 154 MiB vs
    # ~203 MiB do full). Mire no GHCR com sync-postgis-mirror.yml para
    # pull dentro da rede do GitHub + sem rate limit do Docker Hub.
    services:
      postgis:
        image: ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine' }}
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      # ── PostGIS extension no service container ──────────────────────
      # A imagem postgis só habilita a extensão em postgres/template_postgis,
      # NÃO no POSTGRES_DB (criado de template1) — sem ela o benchmark falha
      # em checkPostGIS()/geo-benchmark-gist.mjs (exit 1) ao conectar no
      # database 'severinno'. Mesmo fix dos E2Es de seed (docker exec antes
      # do passo que usa o banco). ATENÇÃO: o service container deste job é
      # 'postgis' (não 'postgres' como nos seed E2Es) — job.services.<id>.
      - name: Enable PostGIS extension
        run: |
          # O docker-postgis (alpine E full) carrega a extensão no POSTGRES_DB
          # DEPOIS do servidor aceitar conexões ('Loading PostGIS extensions
          # into severinno') — o healthcheck passa antes. Um CREATE EXTENSION
          # IF NOT EXISTS nesse momento RACEIA com o load da imagem e falha
          # esporadicamente com duplicate key pg_extension_name_index.
          # Solução: poll até a extensão aparecer (a imagem SEMPRE carrega),
          # com fallback de criação (IF NOT EXISTS + re-verificação).
          POSTGIS_READY=0
          for _ in $(seq 1 30); do
            if grep -qx 1 <<< "$(docker exec ${{ job.services.postgis.id }} psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null)"; then
              POSTGIS_READY=1
              break
            fi
            sleep 1
          done
          if [ "$POSTGIS_READY" != "1" ]; then
            docker exec ${{ job.services.postgis.id }} \
              psql -U severinno -d severinno -c "CREATE EXTENSION IF NOT EXISTS postgis" >/dev/null 2>&1 || true
            if ! grep -qx 1 <<< "$(docker exec ${{ job.services.postgis.id }} psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null)"; then
              echo "❌ postgis não disponível após espera/fallback"
              exit 1
            fi
          fi
          echo "✅ postgis disponível"

      # ── Run GiST benchmark ────────────────────────────────────────────
      # Reduced scope: 500 + 2000 providers, 5 radii (1,5,10,25,50 km)
      # Full scope (1000/5000/10000 × 8 radii) takes ~45 min — too long for
      # a PR check.  This reduced scope completes in ~5-8 min and is
      # sufficient to detect GiST index regressions.
      - name: Run GiST index benchmark
        id: run
        env:
          PGUSER: severinno
          PGPASSWORD: severinno_dev
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: severinno
        run: |
          node scripts/geo-benchmark-gist.mjs \
            --json docs/benchmarks/geo-gist-latest.json \
            --providers 500,2000 \
            --radius-list 1,5,10,25,50 \
            2>&1 | tee /tmp/gist-benchmark-output.txt
          echo "✅ GiST PR Benchmark completed"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ── Validate result ───────────────────────────────────────────────
      - name: Validate benchmark result
        run: |
          node -e "
            const fs = require('fs');
            const path = 'docs/benchmarks/geo-gist-latest.json';
            if (!fs.existsSync(path)) throw Error('geo-gist-latest.json not found');
            const data = JSON.parse(fs.readFileSync(path, 'utf-8'));
            if (!data.meta || !Array.isArray(data.crossover) || data.crossover.length === 0) {
              throw Error('geo-gist-latest.json: invalid or empty crossover data');
            }
            console.log('  ✅ Benchmark validation passed');
            console.log('  · Crossover rows: ' + data.crossover.length);
            console.log('  · Densities:      ' + (data.meta.densities ?? []).join(', '));
            console.log('  · Radii:          ' + (data.meta.radiiKm ?? []).join(', '));
            console.log('  · PostGIS:        ' + (data.meta.postgisVersion || '?'));
          "

      # ── Fetch baseline from main ──────────────────────────────────────
      - name: Fetch GiST baseline from main
        id: baseline
        run: |
          if git show main:docs/benchmarks/geo-gist-baseline.json > /tmp/geo-gist-baseline.json 2>/dev/null; then
            echo "baseline_exists=true" >> "$GITHUB_OUTPUT"
            echo "  ✅ GiST baseline loaded from main"
          else
            echo "baseline_exists=false" >> "$GITHUB_OUTPUT"
            echo "  ℹ  No GiST baseline on main yet — first run will create reference."
          fi

      # ── Detect PR scope ───────────────────────────────────────────────
      # Wider threshold when the PR touches GiST/PostGIS code paths.
      - name: Detect PR scope
        id: scope
        run: |
          if grep -qE '^(scripts/(geo-benchmark-gist|validate-gist-crossover)\.mjs|src/lib/(geo-shared|postgis|distance-fallback)\.ts)' <<< "$(git diff --name-only origin/main...HEAD)"; then
            echo "threshold_steps=3" >> "$GITHUB_OUTPUT"
            echo "threshold_ratio=30" >> "$GITHUB_OUTPUT"
            echo "  ℹ  PR touches GiST code — widened thresholds (3 steps / 30pp)"
          else
            echo "threshold_steps=2" >> "$GITHUB_OUTPUT"
            echo "threshold_ratio=25" >> "$GITHUB_OUTPUT"
            echo "  ℹ  Default thresholds (2 steps / 25pp)"
          fi

      # ── Validate crossover stability ──────────────────────────────────
      - name: Validate crossover stability
        id: validate
        if: steps.baseline.outputs.baseline_exists == 'true'
        env:
          THRESHOLD_STEPS: ${{ steps.scope.outputs.threshold_steps }}
          RATIO_DRIFT: ${{ steps.scope.outputs.threshold_ratio }}
        continue-on-error: true
        run: |
          node scripts/validate-gist-crossover.mjs \
            --threshold "$THRESHOLD_STEPS" \
            --ratio-drift "$RATIO_DRIFT" \
            /tmp/geo-gist-baseline.json \
            docs/benchmarks/geo-gist-latest.json \
            2>&1 | tee /tmp/gist-crossover-diff.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: No baseline available
        if: steps.baseline.outputs.baseline_exists != 'true'
        run: |
          echo "No GiST baseline on main — this run creates the reference." | tee /tmp/gist-crossover-diff.txt

      # ── Publish job summary ───────────────────────────────────────────
      - name: Publish GiST benchmark summary
        if: always()
        run: |
          {
            echo '## 🗄️ GiST Index Benchmark — PR Check'
            echo ''
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Scope | 500, 2000 providers × 5 radii |"
            echo "| Threshold | ${{ steps.scope.outputs.threshold_steps }} steps / ${{ steps.scope.outputs.threshold_ratio }}pp |"
            if [ "${{ steps.run.outputs.exit_code }}" != "0" ]; then
              echo "| Benchmark Status | ❌ Failed |"
            else
              echo "| Benchmark Status | ✅ Completed |"
            fi
            echo "| Baseline | ${{ steps.baseline.outputs.baseline_exists == 'true' && 'loaded from main' || 'none' }} |"
            echo ''
            echo '### Resultado da Validação de Crossover'
            echo ''
            echo '```'
            cat /tmp/gist-crossover-diff.txt 2>/dev/null || echo 'No validation data available.'
            echo '```'
            echo ''
            echo '### Benchmark Output'
            echo ''
            echo '```'
            cat /tmp/gist-benchmark-output.txt 2>/dev/null || echo 'No benchmark output.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Upload artifact ───────────────────────────────────────────────
      - name: Upload GiST benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-gist-benchmark-pr
          path: |
            docs/benchmarks/geo-gist-latest.json
            /tmp/gist-crossover-diff.txt
            /tmp/gist-benchmark-output.txt
          retention-days: 30

      # ── Fail on regression ────────────────────────────────────────────
      - name: Fail on crossover regression
        if: steps.validate.outputs.exit_code == '1'
        run: |
          echo "❌ GiST crossover regression detected — see job summary for details."
          echo "   Affected densities and radius steps:"
          cat /tmp/gist-crossover-diff.txt 2>/dev/null | grep -E '^(.*provider|⚠|crossover|step)' || true
          exit 1

  # ── Seed Guards E2E (prod + dev em UM service container) ───────────
  # Valida os DOIS seeds contra UM ÚNICO PostGIS efêmero (sugestão #1 —
  # economia ~1 min/PR vs. jobs separados: 1 pull de imagem + 1 bun install
  # + 1 prisma generate/push em vez de 2 de cada).
  #
  # ORDEM: prod E2E PRIMEIRO (127 checks — banco limpo, asserta ZERO
  # usuários), dev E2E DEPOIS (161 checks — o wipe+recreate do dev seed não
  # conflita com os dados do prod).
  #
  # Independência PRESERVADA: o step do dev roda com if: always() — um PR
  # que quebre o seed de dev é detectado MESMO se o prod E2E falhar antes
  # (mesmo comportamento do antigo job seed-dev-e2e dedicado, sem o custo
  # de container/imagem extras). SKIP_DB_PUSH no dev é condicional ao
  # sucesso do prod (schema já pushado → pula; prod falhou → dev faz push).
  #
  # A definição do job vive no reusable workflow seed-guards.yml — chamado
  # também pelo cron semanal (benchmark-weekly.yml) para revalidar contra
  # um banco efêmero sem duplicar a lógica.
  #
  # O reusable workflow define DUAS famílias de job (a lista viva está no
  # próprio seed-guards.yml):
  #   • SEED E2E — (1) seed-guards, a MATRIX 2×2 seed×imagem: prod e dev E2E
  #     rodam contra as DUAS variantes do PostGIS (alpine + full — 4
  #     combinações: prod×alpine, prod×full, dev×alpine, dev×full), validando a
  #     compatibilidade de ambas as imagens em PRs, não só em cron/deploy;
  #     (2) seed-prod-e2e-dev-env, o prod E2E com PROD_SEED_ALLOW_DEV=1 NO
  #     AMBIENTE do job (container próprio), cobrindo o fluxo de override de
  #     banco efêmero em dev que o CI de produção não exercita (a produção roda
  #     NODE_ENV=production sem override);
  #   • MUTATION TESTS que precisam do vitest REAL (node_modules) — o seed dev
  #     E2E, o contrato coordenado, os três fios do doctor, o perfil --ci e as
  #     quatro defesas do check-env-mirror. Cada um introduz a regressão
  #     conhecida e exige que a suíte fique VERMELHA pela âncora certa (guarda
  #     cego → job falha).
  seed-guards:
    name: Seed Guards (prod + dev E2E)
    uses: ./.github/workflows/seed-guards.yml

  # ── Mutation Coord Timing Guard (PR, budget de payload) ─────────────
  # GATE de REGRESSÃO DE OVERHEAD do contrato coordenado ANTES do merge:
  # mede o tempo REAL do step 'Run mutation test (contrato coordenado —
  # 5 cenários, 2 elos)' (timing NATIVO do Actions — started_at/completed_at
  # da jobs API, o mesmo que a UI mostra) e FALHA o PR se o step
  # ultrapassar o budget (180s = 3 min). O pr-check mede CORREÇÃO, não
  # performance — se o payload do mutation test crescer silenciosamente
  # (6 vitest + 6 guard runs ficarem lentos por bump de dep ou cenário
  # novo), o CI de correção não percebe; este guard é a rede de segurança
  # que trava o overhead antes do merge.
  #
  # needs: seed-guards + if: always() — espera o seed-guards terminar mas
  # mede TAMBÉM quando ele falhou (um timeout de step é exatamente a
  # regressão que o budget deve acusar). GH_TOKEN do próprio Actions (o gh
  # usa automaticamente). O script é fail-closed: exit 1 = infra OU budget
  # excedido (report.exceeded=true distingue), exit 2 = drift de contrato
  # ('não achado' não é 'limpo'). Espelho do job semanal
  # mutation-coord-timing (benchmark-weekly.yml) — alterações no
  # script/args DEVEM ser replicadas nos dois lugares.
  #
  # TUINING DO GATE (DRIFT RELATIVO + TETO ABSOLUTO): alterar em lugares
  # coordenados — este job (--max 240 --fail-drift ${{ vars.MUTATION_TIMING_DRIFT_MAX || '50' }}
  # --window 4), o job semanal
  # mutation-coord-timing do benchmark-weekly.yml (mantém o --warn-median da
  # faixa soft — a re-medição alerta; o PR gateia) e as asserções de teste
  # de workflow — o README (seção Git Hooks, bloco de overhead) documenta os
  # valores como fonte da verdade. O PR compara o timing contra a MEDIANA do
  # histórico (gh run list nos runs anteriores do seed-guards + jobs API por
  # run) e FALHA quando o DRIFT RELATIVO (d - mediana)/mediana ultrapassa o
  # threshold configurável (vars.MUTATION_TIMING_DRIFT_MAX, default 50%) —
  # pegando regressão por desvio relativo ANTES do teto; --max 240 vira o
  # TETO ABSOLUTO de segurança (d > 240 falha SEMPRE, mesmo com drift
  # pequeno). Sem histórico (primeiro run) → ::notice:: + gate só no teto.
  mutation-coord-timing-guard:
    name: Mutation coord timing (drift 50%/teto 240)
    runs-on: self-hosted
    needs: seed-guards
    if: always() # mede também quando o seed-guards falhou (timeout é o alvo)
    timeout-minutes: 5

    permissions:
      contents: read
      actions: read # gh api repos/X/actions/runs/<id>/jobs (jobs API) + gh run list + gh repo view

    steps:
      - uses: actions/checkout@v4

      # ── Mede o step no run ATUAL e gateia por DRIFT RELATIVO + TETO ──
      # --max 240 (TETO ABSOLUTO) = 4 min — falha SEMPRE acima disso;
      # --fail-drift compara a duração contra a MEDIANA do histórico (gh run
      # list --workflow benchmark-weekly.yml — os runs anteriores do
      # seed-guards vivem nos runs do caller — + jobs API por run, o mesmo
      # mecanismo do trend guard; branch DEFAULT resolvida via gh repo view)
      # e falha quando o desvio relativo ultrapassa o threshold configurável
      # (default 50%). Exit 1 = drift relativo OU teto excedido (gate) ou
      # infra; exit 2 = drift de contrato. GH_TOKEN explícito (o gh do runner
      # já usa o GITHUB_TOKEN por padrão — explicitar torna o contrato
      # auto-documentado). PR NÃO publica baseline (nada para publicar).
      - name: Medir tempo do step mutation test (drift relativo vs mediana)
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/measure-mutation-timing.mjs \
            --run "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --max 240 \
            --fail-drift "${{ vars.MUTATION_TIMING_DRIFT_MAX || '50' }}" \
            --window 4 \
            --json /tmp/mutation-timing.json

      # ── Evidência como artifact (debug de falhas do budget) ────────
      - name: Upload timing JSON (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-coord-timing-pr
          path: /tmp/mutation-timing.json
          if-no-files-found: ignore

      # ── Summary (a evidência do budget E do drift no PR) ───────────
      # Mostra o NÚMERO que falhou, não só o JSON bruto: a tabela
      # 'atual vs mediana vs threshold' (mesmo shape do summary do
      # mutation-coord-trend do benchmark-weekly.yml — drift relativo vs a
      # mediana do histórico com o limiar configurável) + o veredito do
      # budget. r.driftPct é o número real do --fail-drift; o PR mostra por
      # que falhou (quanto % acima da mediana) sem abrir o artifact.
      - name: Summary
        if: always()
        run: |
          {
            echo '## ⏱️ Mutation coord — budget de payload (PR, 240/mediana drift)'
            echo ''
            if [ -f /tmp/mutation-timing.json ]; then
              node -e "
                const r = require('/tmp/mutation-timing.json');
                if (r.found) {
                  console.log('| Campo | Valor |');
                  console.log('|---|---|');
                  console.log('| Step | ' + r.stepName + ' |');
                  console.log('| Duração | **' + r.durationSecs + 's** (duro ' + (r.budgetSecs ?? 'n/a') + 's / soft ' + (r.warnSecs ?? 'n/a') + 's) |');
                  if (typeof r.driftPct === 'number') {
                    console.log('| Atual vs mediana | **' + r.durationSecs + 's vs ' + r.driftMedianSecs + 's** (janela ' + (r.driftWindow ?? 'n/a') + ' runs anteriores) |');
                    console.log('| Drift relativo | **' + r.driftPct.toFixed(1) + '%** (threshold ' + r.driftMaxPct + '%) |');
                  }
                  console.log('| Conclusão | ' + r.conclusion + ' |');
                  console.log('| Run | ' + r.runId + ' |');
                  if (r.zone === 'fail') console.log('| Budget | ❌ **EXCEDIDO** (faixa dura) — regressão de overhead |');
                  else if (r.zone === 'warn') console.log('| Budget | ⚠️ faixa SOFT (::warning::) — observa o drift antes do gate |');
                  else console.log('| Budget | ✅ dentro do limite |');
                } else {
                  console.log('⚠ Medição falhou: ' + (r.error || 'sem detalhes'));
                }
              "
            else
              echo '⚠ Medição não produziu JSON — veja o passo "Medir tempo do step mutation test".'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Mutation Coord Timing — via ACT (PRs sem seed-guards na default) ───
  # Re-executa o job mutation-coord-update do seed-guards.yml LOCALMENTE com
  # o act + imagem custom (ghcr.io/<owner>/ubuntu-bun:<versão>, bun
  # PRÉ-INSTALADO — o mesmo pipeline do tier1-fastpath-guard) e aplica o
  # MESMO gate de budget de duas faixas (--max 240 duro / faixa soft
  # DERIVADA da mediana — --warn-median 4 --warn-margin 0.2, como no gate
  # real) sobre a duração do step 'Run mutation test (contrato coordenado — 5
  # cenários, 2 elos)' extraída do LOG do act (measure-mutation-timing.mjs
  # --act-log, mesma técnica de parse do check-tier1-fastpath.mjs).
  #
  # POR QUE: o gate real (mutation-coord-timing-guard, acima) mede o step
  # via jobs API do run ATUAL — mas o seed-guards.yml é um reusable
  # workflow_call: se ele NÃO existir na branch DEFAULT (ex.: branch de
  # criação ainda não mergeada, como aconteceu com release/v0.4.0), o
  # reusable não roda no CI e a jobs API não mede NADA (exit 2 drift / 404
  # no gh). Este job cobre o PR ANTES do merge rodando o job via act com a
  # imagem custom — o budget fica validado mesmo quando o run real ainda
  # não pode medir. DRY vs periódico: sem schedule, sem upload-artifact, só
  # o guard decide (exit 0/1). Custo: ~act + pull da imagem (~15 min) só
  # quando os paths do contrato coordenado mudam.
  #
  # ⚠️ Imagem no GHCR: pacote PRIVADO (verificado 08/2026) — o pull do act
  # usa o auth automático do runner (GITHUB_TOKEN com 'packages: read').
  # ⚠️ Espelho do gate real acima: alterações nos args do guard (--max
  # --warn-median --warn-margin) DEVEM ser replicadas nos dois jobs +
  # benchmark-weekly.yml + os 2 testes de workflow (ver README, bloco de
  # overhead).
  mutation-coord-timing-act-guard:
    name: Mutation coord timing (act, budget 240/mediana 4)
    runs-on: self-hosted
    timeout-minutes: 25

    # packages: read — pull da imagem PRIVADA ghcr.io/<owner>/ubuntu-bun pelo
    # act (auth automático do runner; mesmo contrato do periódico
    # tier1-fastpath-guard.yml). Sem ele o pull falha → act exit != 0 sem
    # evidência → o guard falha com diagnóstico (fail-closed, mas ruidoso).
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for origin/main...HEAD diff

      # ── Path filter: steps pesados só rodam quando o PR toca o contrato
      # coordenado (seed-guards.yml ou o medidor/scripts do contrato) —
      # mesmo padrão do tier1-fastpath-guard (sem action externa de paths).
      # Falha LOUD se o diff não puder ser calculado (guard que pula em
      # silêncio trairia o propósito).
      - name: Detect mutation-timing relevant changes
        id: changes
        run: |
          set -euo pipefail
          if ! git diff --name-only origin/main...HEAD > /tmp/pr-diff.txt 2>/tmp/pr-diff.err; then
            echo "::error::não foi possível calcular o diff origin/main...HEAD"
            cat /tmp/pr-diff.err
            exit 1
          fi
          if grep -qE '^(\.github/workflows/seed-guards\.yml|scripts/measure-mutation-timing\.mjs|scripts/test-mutation-timing-budget\.sh|scripts/test-mutation-coord-update\.sh|scripts/seed-e2e-count\.ts|scripts/check-e2e-counts\.mjs)' /tmp/pr-diff.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "  ✅ PR toca o contrato coordenado — rodando act benchmark"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "  ℹ️ PR não toca o contrato coordenado — guard pulado"
          fi

      # ── Valida a repository variable (fail-fast com mensagem clara) ──
      - name: Validate BUN_VERSION variable
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if [ -z "${{ vars.BUN_VERSION }}" ]; then
            echo "::error::Repository variable BUN_VERSION não definida — crie em Settings → Secrets and variables → Actions (ex.: gh variable set BUN_VERSION 1.3.14)."
            exit 1
          fi
          echo "  ✅ BUN_VERSION=${{ vars.BUN_VERSION }}"

      # ── Instala o act pinado (mesma versão do ambiente local) ────────
      - name: Install act (v0.2.89)
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/act.tar.gz \
            "https://github.com/nektos/act/releases/download/v0.2.89/act_Linux_x86_64.tar.gz"
          tar -xzf /tmp/act.tar.gz -C /tmp act
          /tmp/act --version

      # ── Re-executa o job mutation-coord-update com a imagem custom ──
      # -j mutation-coord-update: o act roda o JOB do seed-guards.yml
      # diretamente (o reusable é o alvo). O seed-guards.yml é
      # workflow_call-ONLY — o act precisa de um evento para selecionar o
      # workflow: o --eventpath com o JSON mínimo satisfaz o parse (sem ele,
      # o act pode recusar com 'no workflows found' por não achar trigger).
      # O log é salvo em /tmp/act-mutation.log para o guard extrair a
      # duração do step. O timeout limita o custo.
      - name: Run act -j mutation-coord-update (imagem custom)
        if: steps.changes.outputs.changed == 'true'
        id: act
        run: |
          set +e
          printf '{"workflow_call": {}}' > /tmp/wfc-event.json
          timeout 900 /tmp/act -b \
            -W .github/workflows/seed-guards.yml \
            -j mutation-coord-update \
            --eventpath /tmp/wfc-event.json \
            -P "ubuntu-latest=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ubuntu-bun:${{ vars.BUN_VERSION }}" \
            --var "BUN_VERSION=${{ vars.BUN_VERSION }}" \
            --secret "GITHUB_TOKEN=${{ github.token }}" \
            > /tmp/act-mutation.log 2>&1
          ACT_EXIT=$?
          echo "ACT_EXIT=${ACT_EXIT}" >> "$GITHUB_OUTPUT"
          echo "  act exit: ${ACT_EXIT} (o guard decide o verdict)"
          echo "  log: /tmp/act-mutation.log ($(wc -l < /tmp/act-mutation.log) linhas)"

      # ── GATE: o guard mede a duração do step no log do act ──────────
      # --act-exit recebe o exit code do act (steps.act.outputs.ACT_EXIT): se
      # o act morreu ANTES do step (exit != 0 sem evidência no log — ex.:
      # imagem não publicada), o guard FALHA com diagnóstico claro. Exit 1 =
      # budget DURO excedido; exit 0 na faixa soft (::warning::).
      # --warn-median 4 --warn-margin 0.2 DERIVA a faixa soft da MEDIANA dos
      # últimos 4 runs do MESMO step (o histórico vem do gh run list — o act
      # NÃO publica baseline; a faixa deriva da mediana, como no gate real).
      - name: Guard mutation coord timing (act log, 240/mediana 4)
        if: steps.changes.outputs.changed == 'true'
        run: |
          node scripts/measure-mutation-timing.mjs \
            --act-log /tmp/act-mutation.log \
            --max 240 \
            --warn-median 4 \
            --warn-margin 0.2 \
            --act-exit "${{ steps.act.outputs.ACT_EXIT }}" \
            --json /tmp/mutation-timing-act.json

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "✅ Mutation coord budget validated via act on the custom image (PR sem seed-guards na default)."
          else
            echo "ℹ️ Skipped — PR does not touch the coordinated contract (seed-guards.yml/measure script)."
          fi

  # ── Security Headers ──────────────────────────────────────────────────
  # Verifica CSP, HSTS, X-Frame-Options e demais headers de segurança
  # via curl. Roda no checkout sem dependências além de curl (pré-instalado).
  # Falha se algum header obrigatório estiver ausente ou mal configurado.
  security-headers:
    name: Security Headers
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check security headers (CSP, HSTS, XFO, etc.)
        run: bash scripts/test-security-headers.sh --ci --url "${{ secrets.BASE_URL || 'https://severinno.com.br' }}"

      - name: Summary
        run: |
          echo "✅ Security headers verification complete."
          echo "Headers checked: CSP, HSTS, X-Content-Type-Options, X-Frame-Options,"
          echo "X-XSS-Protection, Referrer-Policy, Permissions-Policy, Server removal"

  # ── Main PR Check ──────────────────────────────────────────────────────
  # ── TypeScript check (PARALELO) ────────────────────────────────────────
  # Item #6 da auditoria: o typecheck rodava SERIAL dentro do job check
  # (lint → ts-nocheck → typecheck → unit tests — o tsc de ~2min no meio do
  # caminho crítico). Extraído para job PRÓPRIO que roda em paralelo com o
  # check e os demais gates — o PR espera o tsc sem bloquear o resto. O tsc
  # requer o prisma client gerado (bunx prisma generate) — mesmo pré-requisito
  # do job typecheck do ci.yml.
  typecheck:
    name: TypeCheck (tsc --noEmit)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      # UM COMANDO SÓ, NAS DUAS FORJAS. O comando INTEIRO vive no script
      # `typecheck` do package.json — inclusive o heap de 4GB, que era passado
      # INLINE aqui e só aqui. Um `NODE_OPTIONS` no step e outro no script são
      # DUAS réguas para a mesma invariante: o mesmo commit podia estourar a
      # memória na forja dona do merge e passar neste espelho (e vice-versa,
      # quando um dos lados mudasse o valor).
      #
      # O heap default do Node (~1.4GB) é insuficiente para o tsc neste
      # codebase — o processo crasha com 'JavaScript heap out of memory'
      # (SIGABRT exit 134, não erro de tipo). Reproduzido e validado em
      # 08/2026: com 4096MB o typecheck passa limpo em ~2min.
      - name: Type check
        run: bun run typecheck

      - name: Summary
        run: echo "✅ TypeScript typecheck (bun run typecheck — tsc --noEmit com heap 4096MB, uma régua só) passed."

  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: "Guard: no @ts-nocheck in non-generated files"
        run: bun run check:ts-nocheck

      # A COBERTURA do recorte do commit, derivada das TABELAS-FONTE dos
      # espelhos (as quatro: bun-version, registry-source, actrc-sync e o
      # env-mirror, que traz o segredo para a conta). Um espelho que só a
      # varredura GLOBAL julga passa pelo pre-commit em silêncio — e o que o
      # commit TIRA não está em linha adicionada nenhuma. Ela MEDE por execução:
      # muta cada espelho num worktree temporário, estagia e roda os comandos do
      # recorte, com um CONTROLE na árvore intacta (um comando que falha SEM
      # mutação falha por ambiente — dependência não instalada — e não pode
      # contar como detector: com o controle o veredito vira INDETERMINADO,
      # exit 2, em vez de um verde vindo de uma suíte quebrada). Ela roda aqui, e
      # não num job node-puro, porque SPAWNA os guards do recorte: as dependências
      # têm de existir para a medição responder o que ela promete.
      - name: Cobertura do recorte (espelhos × commit)
        run: node scripts/check-mirror-coverage.mjs

      # A RÉGUA DO FECHO DE TLA, que vivia em prosa na cabeça dos loaders do
      # remédio: nenhum módulo com TOP-LEVEL AWAIT pode ser alcançável a partir
      # de uma declaração de classe (`remedy-classes/`) ou de canal
      # (`remedy-canal/`). Quando o alcance fecha CICLO, o `await import()` do
      # loader trava: o `node` sai com exit 13 e ZERO bytes nos dois fluxos, e o
      # hook perde a oferta do remédio em silêncio. O comando é o MESMO do hook
      # local e da forja dona do merge (o `check-hook-ci-parity` cobra isso).
      - name: Régua do fecho de TLA (guard)
        run: node scripts/check-tla-closure.mjs

      # E a PREMISSA da régua, por EXECUÇÃO (a cópia da árvore com a aresta de
      # volta injetada na classe e no canal, o `node` morrendo com rc=13 e 0B nos
      # dois fluxos e a árvore intacta como CONTROLE): quem a executa nesta
      # bateria é o contrato do `check:prove-docs` — o guard logo abaixo EXECUTA
      # cada bloco `prove-doc` documentado, e o bloco do `tla-cycle:prove` está
      # em `docs/GUARDS.md` §29. Um step próprio de `prove-*` seria recusado pela
      # régua do doctor (que roda a bateria do dono do merge por lista de
      # argumentos: `prove-*` não é comando de VERIFICAÇÃO) — o gate ficaria
      # decorativo no job.

      # ── A suíte — o MESMO comando da forja dona do merge ────────────
      #
      # `bun run test:run` (= `vitest run`, config do app: `src/**/*.test.{ts,tsx}`
      # INCLUINDO `src/components/**`) e `bun run test:unit` (config unit, que
      # EXCLUI `src/components/**`) são DUAS réguas para a MESMA invariante: a
      # forja rodava a mais ampla e este espelho a mais estreita — o PR podia
      # estar verde aqui e vermelho no merge (e o check exigido do GitHub era o
      # lado mais FRACO do par). Quem decide o merge roda a suíte completa, então
      # `test:run` é o comando canônico, e as duas forjas passam a rodá-lo.
      #
      # Cobertura do contrato de escopo CRLF revalidada a CADA PR: o glob
      # do test:run (src/**/*.test.{ts,tsx}) inclui check-blob-crlf.test.ts
      # (12 testes — blob CRLF via hash-object --literally, --fix, e o
      # contrato de escopo .ts-fora), check-crlf.test.ts e
      # validate-all-text-alert.test.ts (a semântica do alerta all-text —
      # sentinel 'com CRLF' presente no achado, ausente no limpo — roda via
      # spawn do wrapper real num repo git temp, sem depender do bash script
      # nem do cron). O job dedicado blob-crlf-history-audit (acima) cobre o
      # zero-CRLF do histórico; o all-text-alert-validation (acima) o gate
      # via bash script. Este job revalida a MESMA semântica em vitest a cada
      # PR (e no pre-push via test:unit do smart-skip quando fonte mudou).
      - name: Unit tests
        run: bun run test:run

  # ── Allowlist de dados de usuário (PII) ───────────────────────────────────
  #
  # Este job é a barreira mais específica do repositório contra a classe de bug
  # que já aconteceu uma vez (09/2026): `db.user.findFirst({ include })` sem
  # `select` devolve TODA coluna escalar de User e a rota serializa com "a linha
  # menos o passwordHash" — vazando cpfCnpj, e-mail, endereço e twoFactorSecret
  # de TERCEIROS (em `/api/providers/[id]`, público e sem autenticação).
  #
  # Ele roda como job PRÓPRIO, e não só dentro de `test:unit`, por dois motivos:
  #   1. Diagnóstico — a falha aponta para vazamento de campo, não para "testes
  #      unitários falharam" no meio de milhares de casos.
  #   2. Gate bloqueante explícito — o branch protection pode exigir ESTE check.
  #
  # As três camadas verificadas aqui:
  #   - `response-pii-guard.test.ts`  — contrato da query + projeção da resposta
  #     dos endpoints que descrevem terceiros, mais um guard estático que falha
  #     se o idioma `{ passwordHash: x, ...rest }` voltar a `src/`.
  #   - `prisma-client-single-source.test.ts` — o client do Prisma tem fonte
  #     única (o artefato gerado versionado exportava `UserRole` enquanto o
  #     schema já dizia `Role`: build quebrado esperando acontecer).
  #   - o typecheck deste mesmo PR (`src/lib/api-server.ts`) — a allowlist é
  #     travada em tempo de compilação: adicionar campo sensível ou espalhar uma
  #     linha larga na resposta deixa de compilar.
  #
  # O E2E com banco real (mesma allowlist, resposta HTTP de verdade) roda no
  # workflow `e2e-cache.yml`, que provisiona PostGIS e sobe o app.
  pii-allowlist-guard:
    name: PII Allowlist Guard (user payload projection)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ vars.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Bun
        shell: bash
        run: bash scripts/setup-bun-ci.sh "${{ vars.BUN_VERSION }}"
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: PII allowlist + Prisma single source
        run: bun run check:pii-allowlist

      # Prova que o step acima NÃO é decoração: injeta uma regressão em sandbox
      # isolado (`.tmp/`, fora do checkout) e exige que o gate a detecte. Um
      # gate que nunca falhou não protege nada — este step é o que garante que
      # ele ainda falharia hoje.
      - name: PII gate self-test (injeta regressão em sandbox)
        run: bun run check:pii-gate

      - name: Summary
        run: echo "✅ Nenhum payload cross-user expõe credencial/PII; client do Prisma com fonte única; gate comprovadamente sensível a regressão."
