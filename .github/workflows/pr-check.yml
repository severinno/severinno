name: PR Check

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Regression threshold percentage (default: auto-detect 10% for benchmark code, 5% otherwise)"
        required: false
        default: 0
        type: number

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://localhost:5432/test
  REDIS_URL: redis://localhost:6379
  RABBITMQ_URL: amqp://localhost:5672

jobs:
  # ── UTF-8 Encoding Check ────────────────────────────────────────────────
  # Fast gate: <10s, no dependencies beyond python3 (pre-installed on runners).
  # Runs in parallel with the main check job.
  utf8-check:
    name: UTF-8 Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run UTF-8 validation on all .ts files
        run: bash scripts/check-utf8.sh --ci src/

      - name: Summary
        run: echo "All .ts files validated as valid UTF-8 encoding."

  # ── Blob CRLF History Audit (PR) ─────────────────────────────────────
  # Zero-CRLF NO HISTÓRICO revalidado a CADA PR (não só no cron semanal —
  # o job blob-crlf-history-audit do benchmark-weekly.yml só roda na cron).
  #
  # Por quê: o guard de blob (check-blob-crlf.sh) inspeciona o index/HEAD —
  # um blob .sh/.bash CRLF commitado NO PASSADO (ex.: antes do
  # .gitattributes) reproduz CRLF em todo checkout futuro daquele commit.
  # scripts/audit-blob-crlf-history.sh varre TODOS os blobs de TODOS os
  # commits via `git cat-file --batch` (wrapper python — byte-exato,
  # robusto no MSYS) e falha o job se QUALQUER blob histórico tiver CRLF.
  # Um PR que committe um .sh CRLF (autocrlf desabilitado, commit fora do
  # .gitattributes) só seria pego semanas depois sem este job.
  #
  # Requer o histórico completo (fetch-depth: 0). Node/Bun não são
  # necessários — só git + python3 (pré-instalados no runner). Espelho do
  # job semanal (blob-crlf-history-audit em benchmark-weekly.yml) —
  # alterações no script/args DEVEM ser replicadas nos dois lugares.
  blob-crlf-history-audit:
    name: Blob CRLF history (zero-CRLF)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo — auditamos TODOS os blobs

      # ── GATE: nenhum blob histórico de .sh/.bash pode ter CRLF ──────
      # Exit 1 do wrapper = CRLF encontrado no histórico → job falha.
      - name: Auditar blobs CRLF em todo o histórico
        run: |
          bash scripts/audit-blob-crlf-history.sh

      # ── Unit test do parser --all-text (Python direto) ─────────────
      # python3 pré-instalado no runner (zero deps, unittest stdlib): trava
      # o parse do load_all_text_patterns com um .gitattributes FAKE em
      # memória (comentário, espaçamento múltiplo, 'eol=lf text' invertido,
      # '*.MD' maiúsculo, binary/text=auto, nomes exatos sem extensão) —
      # além dos testes de integração vitest, que só exercitam o parser via
      # fixture de repo git real. Onde o audit roda, o parser é testado.
      - name: Testar parser load_all_text_patterns (unittest)
        run: python3 scripts/test_audit_blob_crlf_history.py -v

      - name: Summary
        run: echo "✅ Zero-CRLF no histórico revalidado (audit de todos os blobs .sh/.bash)."

  # ── All-Text Alert Validation (fixture → audit → gate) ────────────────
  # Prova o fluxo do job semanal blob-crlf-all-text-alert (benchmark-weekly.yml)
  # ponta-a-ponta em CADA PR, sem depender do cron: cria fixtures git reais
  # (o mesmo procedimento do docs/TESTING.md automatizado por
  # scripts/validate-all-text-alert.sh), roda o REPORT --all-text e replica o
  # gate do job (grep -Fq 'com CRLF' → found_crlf). Falha se o sentinel NÃO
  # aparecer com um blob CRLF commitado (guard cega) ou se aparecer no estado
  # limpo (falso positivo). O contrato do job é travado em teste unitário
  # (benchmark-weekly-all-text-crlf-workflow.test.ts) e a consistência
  # produtor↔job pelo check-sentinel-producer.mjs — mas nenhum RODA o audit
  # contra um blob CRLF real. Bash + git + python3 (pré-instalados), <5s.
  all-text-alert-validation:
    name: All-text alert validation (fixture → gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all-text alert fixture + gate replica
        run: bash scripts/validate-all-text-alert.sh

      - name: Summary
        run: echo "✅ All-text alert gate catches a CRLF blob and ignores a clean history."
  # Fast gate: falha o PR se qualquer .env voltar a ser rastreado pelo git
  # (padrão dos demais guards — node puro, sem bun install; roda em <5s em
  # paralelo com os demais checks).
  #
  # Contexto: os arquivos .env estiveram rastreados com secrets reais
  # (SESSION_SECRET, VAPID, DB_PASSWORD, S3). A remediação foi rotacionar os
  # valores (scripts/rotate-secrets.mjs) + git rm --cached. Este guard garante
  # que nenhum .env (exceto *.example, que são templates seguros) seja
  # adicionado de volta ao tracking sem o PR ser bloqueado.
  secrets-guard:
    name: Secrets Guard (no .env tracked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no .env tracked in git
        run: node scripts/rotate-secrets.mjs --check

      - name: Summary
        run: echo "✅ No .env files tracked in git."

  # ── Seed Test Hooks Guard ─────────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se SEED_SPEC_PATCH ou
  # PROD_SEED_ALLOW_DEV aparecerem em qualquer workflow FORA do allowlist
  # de teste (scripts/check-seed-hooks.mjs — fail-closed).
  #
  # Por que existe: esses hooks são TEST-ONLY (E2Es de seed contra banco
  # efêmero). Se vazarem para um workflow de produção (deploy.yml,
  # release-deploy.yml, ou um workflow novo), o seed de produção pode rodar
  # com spec patchado ou com o guard de produção contornado — o pipeline de
  # deploy precisa bloquear isso antes de tocar o servidor.
  seed-hooks-guard:
    name: Seed Test Hooks Guard (no prod leak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no seed test hooks in non-test workflows
        run: node scripts/check-seed-hooks.mjs

      - name: Summary
        run: echo "✅ No seed test hooks outside the test workflow allowlist."

  # ── Workflow References Guard ──────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se qualquer workflow referenciar
  # um script inexistente (node|bash|bun scripts/X), uma entry removida de
  # package.json (bun|npm run X), um reusable workflow local inexistente
  # (uses: ./.github/workflows/X.yml sem o arquivo ou sem workflow_call) ou
  # um composite action local inexistente (uses: ./.github/actions/<name>).
  #
  # Por que existe: consolidações como a matrix 2×2 do seed-guards.yml
  # deletam/renomeiam workflows e scripts em lote — uma referência quebrada
  # só falharia no JOB que a executa (com custo de runner pago e mensagem
  # confusa). Este guard falha o PR no início com a referência exata.
  workflow-refs-guard:
    name: Workflow References Guard (no dangling refs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow → script/package.json/uses references
        run: node scripts/check-workflow-refs.mjs

      - name: Summary
        run: echo "✅ No dangling references between workflows and scripts/package.json."

  # ── Sentinel Producer Guard ────────────────────────────────────────────
  # Fast gate (node puro, <1s): GENERALIZA a consistência produtor↔job de
  # sentinels — verifica que TODO `grep -Fq '<sentinel>' <file>` nos
  # workflows (e actions) tem o sentinel emitido pelo PRODUTOR do <file>
  # (script .sh/.mjs/.ts/.py, com chase de delegação .sh→.py — ex.:
  # audit-blob-crlf-history.sh → audit_blob_crlf_history.py) OU inline no
  # próprio workflow (echo "S" > file).
  #
  # Por que existe: o teste específico do sentinel 'com CRLF'
  # (benchmark-weekly-all-text-crlf-workflow.test.ts) bloqueava o drift
  # daquele ÚNICO sentinel — mas um FUTURO grep -Fq adicionado a um
  # workflow SEM o produtor emitir a string criaria uma guarda CEGA
  # (found_* nunca acende; 'não achou' vira falso positivo de 'limpo') sem
  # nenhum teste novo por sentinel. Este guard cobre TODOS os sentinels
  # automaticamente: se o produtor reformular a frase (ou um grep novo
  # apontar para string que o script não emite), o PR falha no início com
  # workflow:linha, o sentinel e o produtor.
  #
  # CI-only (espelha o workflow-refs-guard — não entra nos hooks, pois a
  # tabela de simetria do README é de encoding guards). Node puro, sem deps.
  sentinel-producer-guard:
    name: Sentinel Producer Guard (grep -Fq ↔ produtor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every grep -Fq sentinel has a matching producer
        run: node scripts/check-sentinel-producer.mjs

      - name: Summary
        run: echo "✅ All workflow grep -Fq sentinels are emitted by their producer scripts."

  # ── No setup-bun Guard ────────────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se qualquer workflow voltar a usar
  # oven-sh/setup-bun@v2 (o action externo re-downloada o release LATEST do
  # Bun em todo job, ~25-35s/job). Todos os 32 call sites foram migrados para
  # o composite action local ./.github/actions/setup-bun (pre-installed fast
  # path → actions/cache keyed na versão → download direto só em cache miss).
  no-setup-bun-guard:
    name: No setup-bun Guard (local action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no workflow uses oven-sh/setup-bun
        run: node scripts/check-no-setup-bun.mjs

      - name: Summary
        run: echo "✅ All workflows use ./.github/actions/setup-bun (cached)."

  # ── Bun Mirror Guard ─────────────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se a FONTE ÚNICA da versão do
  # Bun for violada. A versão vive APENAS na repository variable
  # vars.BUN_VERSION (Settings → Secrets and variables → Actions): workflows
  # passam 'bun-version: ${{ vars.BUN_VERSION }}', o sync-bun-mirror.yml usa
  # a mesma variável no env, e o composite action setup-bun resolve a versão
  # em runtime (metadata de action NÃO avalia ${{ }}, então default literal é
  # proibido). O guard falha se: mirror ausente, mirror com BUN_VERSION
  # literal, action com default literal, action sem referência à variável,
  # tier 3 (cold cache) sem ref ao mirror GHCR, qualquer literal de versão
  # do Bun em workflows (bun-version: 1.3.14, bun-1.3.14-...), ou .actrc
  # sem BUN_VERSION (act local).
  #
  # Por que existe: trocar o Bun deve ser ALTERAR A VARIÁVEL EM UM LUGAR.
  # Antes, a versão estava espalhada em 40+ ocorrências (bun-version:,
  # cache keys bun-/prisma-, mirror env, default do action) — o drift entre
  # elas quebrava a key do cache silenciosamente. O guard falha o PR no
  # início com a violação exata (arquivo:linha).
  bun-mirror-guard:
    name: Bun Mirror Guard (fonte única vars.BUN_VERSION)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bun single-source + GHCR mirror consistency
        run: node scripts/check-bun-mirror.mjs

      - name: Summary
        run: echo "✅ Bun version single-source (vars.BUN_VERSION) + GHCR mirror in sync."

  # ── Bun Mirror Guard (staged diff) ──────────────────────────────────
  # Fast gate (node puro, <1s): roda o check de cache keys e literais do
  # Bun contra o DIFF DO PR (git diff origin/main...HEAD) em vez do working
  # tree inteiro — detecta keys antigas (ex.: bun-1.3.14-...) ou literais
  # INTRODUZIDOS PELO PR antes do merge, mesmo que o restante do
  # repositório já esteja migrado. Só linhas ADICIONADAS (+ no diff) são
  # avaliadas — violações pré-existentes do base não poluem o PR.
  #
  # Requer fetch-depth: 0 para o git diff base...HEAD funcionar (mesmo
  # padrão do job benchmark). Local/pre-commit: node scripts/check-bun-mirror.mjs
  # --staged usa git diff --cached.
  bun-mirror-staged-guard:
    name: Bun Mirror Guard (staged diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for origin/main...HEAD diff

      - name: Check bun single-source on the PR diff
        run: node scripts/check-bun-mirror.mjs --staged --base origin/main

      - name: Summary
        run: echo "✅ No stale bun cache keys/literals introduced by this PR diff."

  # ── Mutation Jobs Guard (staged diff) ───────────────────────────────
  # Fast gate (node puro, <1s): roda o check de cobertura de mutation tests
  # contra o DIFF DO PR (git diff origin/main...HEAD) em vez do working tree
  # inteiro — detecta um test-mutation-*.sh NOVO INTRODUZIDO PELO PR sem job
  # (sem ref direta num workflow run: nem na matriz do master) antes do
  # merge, mesmo que o restante do repositório já esteja consistente. Só
  # arquivos NOVOS (new file mode) são avaliados — violações pré-existentes
  # do base não poluem o PR.
  #
  # Requer fetch-depth: 0 para o git diff base...HEAD funcionar (mesmo
  # padrão do bun-mirror-staged-guard). Local/pre-commit: node
  # scripts/check-mutation-jobs.mjs --staged usa git diff --cached.
  mutation-jobs-staged-guard:
    name: Mutation Jobs Guard (staged diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for origin/main...HEAD diff

      - name: Check mutation test coverage on the PR diff
        run: node scripts/check-mutation-jobs.mjs --staged --base origin/main

      - name: Summary
        run: echo "✅ No orphan test-mutation-*.sh introduced by this PR diff."

  # ── Mutation Guards MASTER (consolidado) ────────────────────────────
  # Roda os 9 mutation tests node-puro dos guards de CI num JOB SÓ via
  # scripts/test-mutation-guards.sh — matriz de sub-tests que orquestra os
  # scripts granulares (que continuam sendo a fonte única de
  # fixtures/mutações/asserções de cada guard):
  #   bun-literal    → test-mutation-bun-literal.sh
  #                    (bun-version LITERAL em workflow deve FALHAR)
  #   bun-removal    → test-mutation-bun-removal.sh
  #                    (REMOÇÃO do input bun-version --staged deve FALHAR)
  #   hooks-symmetry → test-mutation-hooks-symmetry.sh
  #                    (guard novo no pre-commit + linha stale devem FALHAR)
  #   readme         → test-mutation-readme-guards.sh (matriz ANINHADA:
  #                    anchors + toc + images — 1 sub-test, sem re-rodada)
  #   readme-reverse → test-mutation-readme-reverse.sh
  #                    (drift SEMÂNTICO do README — baseline reverse — deve
  #                    FALHAR com exit 1 exato, sem depender do cron)
  #   docs-anchor    → test-mutation-readme-docs-anchor.sh
  #                    (âncora quebrada em docs/*.md — fixture COM docs/ —
  #                    deve FALHAR: cobre o scan default dos docs)
  #   producer-sent  → test-mutation-producer-sentinel.sh
  #                    (sentinel 'com CRLF' removido do audit all-text —
  #                    cópia em temp — deve FALHAR o validate-all-text-alert)
  #   mutation-jobs  → test-mutation-mutation-jobs.sh
  #                    (script órfão forward + matriz quebrada reverse do
  #                    check-mutation-jobs devem FALHAR)
  #   utf8-scope     → test-mutation-utf8-scope.sh
  #                    (call site sem src/ deve FALHAR)
  # Cada sub-test roda SEMPRE (fail-CONTINUE) e o harness imprime o output
  # completo do script granular + verdict por sub-test + tabela final —
  # granularidade de diagnóstico preservada. Exit final agregado: 0 se
  # TODOS passarem, 1 se QUALQUER sub-test falhar (guard cego / asserção
  # quebrada).
  #
  # ANTES eram 5 jobs (bun-literal + bun-removal + hooks-symmetry + readme
  # + utf8-scope), cada um com o overhead de setup do container/checkout —
  # consolidar reduz o setup por job sem perder a granularidade
  # (--scenario <id> roda um sub-test isolado para diagnóstico local).
  # Node-puro, <9s total, sem docker.
  mutation-guards:
    name: Mutation guards master (9 node-pure mutation tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mutation tests — todos os guards devem FALHAR nas mutações
        run: bash scripts/test-mutation-guards.sh

      - name: Summary
        run: echo "✅ All 9 node-pure mutation tests passed (bun literal, bun remoção, hooks simetria, README anchors/toc/images, README reverse, docs anchor, produtor sentinel, mutation-jobs, UTF-8 escopo)."

  # ── Hooks Symmetry Guard (dedicado) ─────────────────────────────────
  # Fast gate (node puro, <1s): roda o guard REAL de simetria
  # (scripts/check-hooks-symmetry.mjs — bidirecional) no PR, em paralelo com
  # os demais fast gates.
  #
  # Por que dedicado: o mesmo guard também roda no reusable utf8-check.yml
  # (chamado por ci/deploy/e2e-cache/release-deploy), mas o PR-check só
  # chamava o mutation test (que prova SENSIBILIDADE do guard em repo
  # fixture) — o guard REAL nunca era executado contra o working tree do PR
  # (o job inline utf8-check roda apenas check-utf8.sh). Um PR que quebre a
  # tabela '## Git Hooks' do README (forward: guard nos hooks sem linha, ou
  # reverse: linha stale sem guard real) passaria no CI. Este job fecha o
  # ciclo: detecção end-to-end (guard real) + prova de sensibilidade
  # (mutation test) no mesmo workflow.
  hooks-symmetry-guard:
    name: Hooks Symmetry Guard (README ↔ hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check README Git Hooks table ↔ real hooks (bidirectional)
        run: node scripts/check-hooks-symmetry.mjs

      - name: Summary
        run: echo "✅ README '## Git Hooks' table in sync with .husky/* + run-encoding-guards.sh."

  # ── Mutation Jobs Guard (dedicado) ──────────────────────────────────
  # Fast gate (node puro, <1s): roda o guard REAL de cobertura de mutation
  # tests (scripts/check-mutation-jobs.mjs) no PR — todo
  # scripts/test-mutation-*.sh DEVE ter um job correspondente no CI (via run:
  # direto num workflow OU na matriz SUBTESTS/SCENARIOS do master, que este
  # job roda).
  #
  # O guard é BIDIRECIONAL (par fechado nos dois lados): além do forward
  # (script órfão sem job), o reverse também falha quando um run: direto de
  # workflow OU uma entrada da matriz referencia um test-mutation-*.sh
  # INEXISTENTE em scripts/ (ref quebrada — arquivo fantasma).
  #
  # Por que dedicado: o job mutation-guards roda o MASTER (que orquestra os
  # mutation tests node-puro EXISTENTES), mas não valida que um NOVO
  # test-mutation-*.sh adicionado num PR foi wireado num job — um PR que
  # adicione o script sem o job passaria no CI e o mutation test nunca
  # rodaria. Este job fecha o ciclo: script órfão = PR vermelho, antes do
  # merge (e o mesmo guard roda no reusable utf8-check.yml + hooks locais).
  mutation-jobs-guard:
    name: Mutation Jobs Guard (test-mutation-*.sh ↔ CI jobs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every test-mutation-*.sh has a CI job (transitive)
        run: node scripts/check-mutation-jobs.mjs

      - name: Summary
        run: echo "✅ Every scripts/test-mutation-*.sh is wired to a CI job (direct or via master matrix)."

  # ── README Reverse-Strict Alert (workflow_dispatch, NÃO-bloqueante) ──
  # Alerta AUDÍVEL do modo opt-in --reverse-strict do check-readme-anchors.mjs:
  # roda via workflow_dispatch (manual/periódico) contra o README.md e emite
  # ::warning:: para CADA achado — SEM falhar o PR (exit 0 sempre).
  #
  # POR QUE NÃO É GATE: o --reverse-strict fecha a brecha da heurística
  # single-token (labels de UM token não-stopword) e, por isso, acusa
  # FALSOS POSITIVOS de prosa (ex.: o label 'abaixo' → heading legítimo —
  # medido 08/2026: 1 achado no README real, 0 no --reverse). Gate no PR
  # quebraria por prosa; este job transforma o modo em alerta periódico:
  # ::warning:: no Actions, sem bloquear o merge. O --json (REPORT mode)
  # exit 0 SEMPRE — o caller (aqui o job) decide o gate (nenhum: só emite
  # warning).
  readme-reverse-strict-alert:
    name: "README Reverse-Strict Alert (::warning::, não-bloqueante)"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PROSE ALLOWLIST: exime palavras de prosa comum ('abaixo', 'acima',
      # 'seguir', 'aqui', 'fluxo') que o strict flagaria como falso positivo
      # (medido 08/2026: 1 achado no README real SEM allowlist — o label
      # 'abaixo' → heading legítimo). A renomeação single-token REAL continua
      # pega: token permitido que exista como heading em outro lugar → regra 4
      # (violação com sugestão). Bump do guard deve manter esta lista em
      # sincronia com a doc do check-readme-anchors.mjs.
      - name: Run reverse-strict check (REPORT mode — exit 0 sempre)
        run: >
          node scripts/check-readme-anchors.mjs
          --reverse-strict
          --prose-allowlist abaixo,acima,seguir,aqui,fluxo
          --json README.md
          > /tmp/reverse-strict-report.json

      - name: "Emit ::warning:: per finding (não falha o PR)"
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const reportPath = "/tmp/reverse-strict-report.json";
          if (!fs.existsSync(reportPath) || fs.statSync(reportPath).size === 0) {
            // Guard falhou antes de escrever o report (ex.: erro no parse do
            // README). Job dispatch-only e não-bloqueante: emite ::warning::
            // e termina limpo em vez de ir a vermelho.
            console.log(
              "::warning::report reverse-strict vazio/ausente — guard falhou antes de escrever (job dispatch-only, não-bloqueante).",
            );
            process.exit(0);
          }
          const { count, findings } = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          if (count === 0) {
            console.log("✅ Nenhum achado reverse-strict no README.md.");
          } else {
            console.log(`⚠️ ${count} achado(s) reverse-strict (não-bloqueante):`);
            for (const f of findings) {
              const kind = f.strict ? "reverse-strict" : "reverse";
              const msg = `${kind}: label "${f.label}" → #${f.slug} (heading: "${f.heading}")`
                .replace(/%/g, "%25")
                .replace(/\r/g, "%0D")
                .replace(/\n/g, "%0A")
                .replace(/::/g, ":");
              console.log(`::warning file=${f.file},line=${f.line}::${msg}`);
            }
          }
          NODE

      - name: Summary
        run: echo "✅ README reverse-strict alert done (warnings emitted, PR not blocked)."

  # ── Tier-1 Fastpath Guard (PR, paths) ───────────────────────────────
  # Gate OPCIONAL (dry, sem cron): detecta regressão do tier-1 fast path
  # do setup-bun ANTES do merge, apenas quando o PR tocar o composite
  # action ./.github/actions/setup-bun/ ou o Dockerfile.ubuntu-bun.
  #
  # POR QUE: o guard periódico (tier1-fastpath-guard.yml) roda SÓ na cron
  # semanal — uma mudança de PR que quebre o tier-1 (imagem para de
  # embarcar bun, o passo 'Detect pre-installed Bun' quebra, ou a versão
  # embarcada diverge de vars.BUN_VERSION) só seria detectada DIAS depois,
  # com o setup-bun silenciosamente mais lento (tier 2/3) — o pr-check
  # mede correção, não performance, e não percebe a regressão. Este job
  # re-executa o MESMO `act -j check` com a imagem custom
  # (ghcr.io/<owner>/ubuntu-bun:<versão>, bun PRÉ-INSTALADO) e gateia no
  # marcador 'Usando Bun pré-instalado' + threshold do passo fast-path
  # (scripts/check-tier1-fastpath.mjs).
  #
  # DRY vs periódico: sem schedule (roda no PR via paths), sem
  # upload-artifact (não precisa de actions: write), só o guard decide
  # (exit 0/1). Custo: ~15 min de act só quando os paths mudam — o preço
  # de travar o tier-1 antes do merge.
  #
  # ⚠️ Imagem no GHCR: pacote PRIVADO (verificado 08/2026: pull anônimo
  # local retorna 'denied'). No CI o pull do act usa o auth automático do
  # runner — exige GITHUB_TOKEN com 'packages: read' (garantir no
  # permissions dos workflows; o periódico tier1-fastpath-guard.yml já
  # tem). Pública só é necessária para reprodução local/externa.
  # ⚠️ Os 4 steps pesados espelham o tier1-fastpath-guard.yml (periódico) —
  # alterações no act/args do guard DEVEM ser replicadas nos dois lugares.
  tier1-fastpath-guard:
    name: Tier-1 Fastpath Guard (setup-bun changes)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for origin/main...HEAD diff

      # ── Path filter: steps pesados só rodam quando o PR toca o setup-bun
      # action ou o Dockerfile.ubuntu-bun (mesmo padrão de diff dos jobs
      # benchmark/geo — sem action externa de paths).
      # Falha LOUD se o diff não puder ser calculado: um guard que pula em
      # silêncio (changed=false por erro de git) trairia o propósito.
      - name: Detect tier-1 relevant changes
        id: changes
        run: |
          set -euo pipefail
          if ! git diff --name-only origin/main...HEAD > /tmp/pr-diff.txt 2>/tmp/pr-diff.err; then
            echo "::error::não foi possível calcular o diff origin/main...HEAD"
            cat /tmp/pr-diff.err
            exit 1
          fi
          if grep -qE '^(\.github/actions/setup-bun/|Dockerfile\.ubuntu-bun)' /tmp/pr-diff.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "  ✅ PR toca setup-bun/Dockerfile.ubuntu-bun — rodando guard"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "  ℹ️ PR não toca setup-bun/Dockerfile.ubuntu-bun — guard pulado"
          fi

      # ── Valida a repository variable (fail-fast com mensagem clara) ──
      - name: Validate BUN_VERSION variable
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if [ -z "${{ vars.BUN_VERSION }}" ]; then
            echo "::error::Repository variable BUN_VERSION não definida — crie em Settings → Secrets and variables → Actions (ex.: gh variable set BUN_VERSION 1.3.14)."
            exit 1
          fi
          echo "  ✅ BUN_VERSION=${{ vars.BUN_VERSION }}"

      # ── Instala o act pinado (mesma versão do ambiente local) ────────
      # Sem setup-bun aqui de propósito: o objetivo é testar o setup-bun
      # DENTRO do act, não usar o setup-bun para testar o setup-bun.
      - name: Install act (v0.2.89)
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/act.tar.gz \
            "https://github.com/nektos/act/releases/download/v0.2.89/act_Linux_x86_64.tar.gz"
          tar -xzf /tmp/act.tar.gz -C /tmp act
          /tmp/act --version

      # ── Re-executa o job check com a imagem custom (tier-1) ──────────
      # O timeout do step limita o custo do job completo — a evidência do
      # setup-bun (passo #2) já está no log nos primeiros ~30s; o guard
      # decide o verdict, não o exit do act (mesma semântica do periódico).
      - name: Run act -j check (imagem custom)
        if: steps.changes.outputs.changed == 'true'
        id: act
        run: |
          set +e
          timeout 900 /tmp/act -b \
            -W .github/workflows/pr-check.yml \
            -j check \
            -P "ubuntu-latest=ghcr.io/${{ github.repository_owner }}/ubuntu-bun:${{ vars.BUN_VERSION }}" \
            --var "BUN_VERSION=${{ vars.BUN_VERSION }}" \
            --secret "GITHUB_TOKEN=${{ github.token }}" \
            > /tmp/act-check.log 2>&1
          ACT_EXIT=$?
          echo "ACT_EXIT=${ACT_EXIT}" >> "$GITHUB_OUTPUT"
          echo "  act exit: ${ACT_EXIT} (o guard decide o verdict)"
          echo "  log: /tmp/act-check.log ($(wc -l < /tmp/act-check.log) linhas)"

      # ── GATE: o guard decide PASS/FAIL baseado na evidência tier-1 ───
      # --act-exit recebe o exit code do act (steps.act.outputs.ACT_EXIT): se
      # o act morreu ANTES do setup-bun (exit != 0 sem evidência no log — ex.:
      # imagem não publicada), o guard FALHA com diagnóstico claro (regra 7).
      - name: Guard tier-1 fast path (threshold 5s)
        if: steps.changes.outputs.changed == 'true'
        run: |
          node scripts/check-tier1-fastpath.mjs \
            --log /tmp/act-check.log \
            --threshold 5 \
            --version "${{ vars.BUN_VERSION }}" \
            --act-exit "${{ steps.act.outputs.ACT_EXIT }}"

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "✅ Tier-1 fast path validated on the custom image (setup-bun change)."
          else
            echo "ℹ️ Skipped — PR does not touch setup-bun action or Dockerfile.ubuntu-bun."
          fi

  # ── E2E Counts Guard ──────────────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se os counts de checks
  # documentados nos comentários dos workflows (pr-check.yml, seed-guards.yml,
  # validate-seed-guards-matrix-local.sh) divergirem do EXPECTED_TOTAL
  # declarado nos E2Es de seed (128 prod / 162 dev — fonte da verdade).
  #
  # Por que existe: os counts crescem quando asserções são adicionadas aos
  # E2Es (o dev E2E passou de 132 → 147 → 162 ao longo dos cenários). Sem
  # este guard, um dev atualiza o E2E mas esquece o comentário do workflow —
  # o CI não pega e o número documentado fica errado para sempre. Este guard
  # fecha o loop: qualquer divergência entre o que está escrito nos workflows
  # e o EXPECTED_TOTAL do source falha o PR no início com arquivo:linha.
  # Complemento runtime: cada E2E também valida no final que o total REAL
  # impresso (📊 Resultados) bate com a própria constante (exit 1 se divergir).
  e2e-counts-guard:
    name: E2E Counts Guard (comentários = derivação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Check documented E2E check counts match the derivation
        run: node scripts/check-e2e-counts.mjs

      - name: Summary
        run: echo "✅ Documented E2E counts match the derivation (scripts/seed-e2e-count.ts)."

  # ── Actionlint (workflow syntax) ───────────────────────────────────────
  actionlint:
    name: Actionlint (workflow syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint on all workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      - name: Summary
        run: echo "✅ All .github/workflows/*.yml pass actionlint (syntax + shellcheck)."

  # ── Fuzz Tests ─────────────────────────────────────────────────────────
  # Runs in parallel with other checks. No external dependencies needed.
  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run fuzz tests
        run: bun run fuzz:ci > fuzz-results.json

      - name: Archive fuzz results
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: fuzz-results.json
          retention-days: 30

  # ── Geo Benchmark ──────────────────────────────────────────────────────
  # Runs the geo-distance benchmark and compares against the baseline from
  # main.  Fails the PR if any benchmark regresses >threshold % in mean
  # latency.  The threshold is 5 % by default; when the PR touches
  # benchmark or geolocation code paths, it widens to 10 % to reduce
  # flakiness from algorithmic changes.
  benchmark:
    name: Geo Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to fetch main branch for baseline

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run geo benchmark
        run: |
          node scripts/run-benchmark.mjs --type geo --json

      - name: Fetch baseline from main
        id: baseline
        run: |
          if git show main:docs/benchmarks/geo-baseline.json > /tmp/geo-baseline.json 2>/dev/null; then
            echo "baseline_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "baseline_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Detect threshold ────────────────────────────────────────────
      # Priority: workflow_dispatch input > auto-detect > default 5.
      # Auto-detect: when the PR touches benchmark/geo code, widen to 10%
      # to reduce flakiness from intentional algorithmic changes.
      - name: Detect threshold
        id: changes
        run: |
          MANUAL_INPUT=${{ github.event.inputs.threshold || 0 }}
          if [ "$MANUAL_INPUT" -gt 0 ] 2>/dev/null; then
            echo "threshold=$MANUAL_INPUT" >> "$GITHUB_OUTPUT"
          elif git diff --name-only origin/main...HEAD | grep -qE '^(src/lib/(geo-shared|distance-fallback|radius-expansion|fetch-providers-data|fetch-unrestricted-results|sql-builder)\.ts|src/app/api/providers/route\.ts|scripts/(geo-benchmark|compare-benchmarks|run-benchmark)\.mjs)$'; then
            echo "threshold=10" >> "$GITHUB_OUTPUT"
          else
            echo "threshold=5" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare with baseline
        id: compare
        if: steps.baseline.outputs.baseline_exists == 'true'
        env:
          BENCHMARK_THRESHOLD: ${{ steps.changes.outputs.threshold }}
        run: |
          node scripts/compare-benchmarks.mjs \
            /tmp/geo-baseline.json \
            docs/benchmarks/geo-latest.json \
            2>&1 | tee /tmp/benchmark-diff.txt

      - name: No baseline available
        if: steps.baseline.outputs.baseline_exists != 'true'
        run: |
          echo "No geo-baseline.json on main — skipping comparison." | tee /tmp/benchmark-diff.txt

      # ── Publish job summary ──────────────────────────────────────────
      # Writes a condensed version of the comparison to the GitHub Actions
      # Job Summary so failures are self-explanatory at a glance.
      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo '## 📊 Geo-Benchmark Comparison'
            echo ''
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Threshold | ${{ steps.changes.outputs.threshold }}% |"
            echo "| Baseline | $(if [ -f /tmp/geo-baseline.json ]; then echo 'loaded'; else echo 'none'; fi) |"
            echo ''
            echo '```'
            cat /tmp/benchmark-diff.txt 2>/dev/null || echo 'No benchmark data available.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload artifact even on failure so results can be inspected
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-benchmark
          path: docs/benchmarks/geo-latest.json
          retention-days: 30

  # ── GiST Index Benchmark (PR Check) ─────────────────────────────────────
  # Spins up an ephemeral PostGIS container, runs the GiST index benchmark
  # against it, and validates that the crossover radius hasn't shifted
  # significantly relative to the baseline on main.
  #
  # Uses a reduced scope (500/2000 providers, 5 radii) so it completes in
  # ~5-8 min instead of the full 45 min weekly run.
  #
  # The PostGIS container is a service container — it starts before the job
  # steps and is torn down automatically when the job completes, costing
  # nothing beyond the runner minutes.
  benchmark-gist:
    name: GiST Benchmark (PR)
    runs-on: ubuntu-latest

    # ── Ephemeral PostGIS service container ───────────────────────────
    # Imagem via vars.POSTGIS_IMAGE (default alpine — menor: 154 MiB vs
    # ~203 MiB do full). Mire no GHCR com sync-postgis-mirror.yml para
    # pull dentro da rede do GitHub + sem rate limit do Docker Hub.
    services:
      postgis:
        image: ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine' }}
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      # ── PostGIS extension no service container ──────────────────────
      # A imagem postgis só habilita a extensão em postgres/template_postgis,
      # NÃO no POSTGRES_DB (criado de template1) — sem ela o benchmark falha
      # em checkPostGIS()/geo-benchmark-gist.mjs (exit 1) ao conectar no
      # database 'severinno'. Mesmo fix dos E2Es de seed (docker exec antes
      # do passo que usa o banco). ATENÇÃO: o service container deste job é
      # 'postgis' (não 'postgres' como nos seed E2Es) — job.services.<id>.
      - name: Enable PostGIS extension
        run: |
          # O docker-postgis (alpine E full) carrega a extensão no POSTGRES_DB
          # DEPOIS do servidor aceitar conexões ('Loading PostGIS extensions
          # into severinno') — o healthcheck passa antes. Um CREATE EXTENSION
          # IF NOT EXISTS nesse momento RACEIA com o load da imagem e falha
          # esporadicamente com duplicate key pg_extension_name_index.
          # Solução: poll até a extensão aparecer (a imagem SEMPRE carrega),
          # com fallback de criação (IF NOT EXISTS + re-verificação).
          POSTGIS_READY=0
          for _ in $(seq 1 30); do
            if docker exec ${{ job.services.postgis.id }} \
              psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null | grep -qx 1; then
              POSTGIS_READY=1
              break
            fi
            sleep 1
          done
          if [ "$POSTGIS_READY" != "1" ]; then
            docker exec ${{ job.services.postgis.id }} \
              psql -U severinno -d severinno -c "CREATE EXTENSION IF NOT EXISTS postgis" >/dev/null 2>&1 || true
            if ! docker exec ${{ job.services.postgis.id }} \
              psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null | grep -qx 1; then
              echo "❌ postgis não disponível após espera/fallback"
              exit 1
            fi
          fi
          echo "✅ postgis disponível"

      # ── Run GiST benchmark ────────────────────────────────────────────
      # Reduced scope: 500 + 2000 providers, 5 radii (1,5,10,25,50 km)
      # Full scope (1000/5000/10000 × 8 radii) takes ~45 min — too long for
      # a PR check.  This reduced scope completes in ~5-8 min and is
      # sufficient to detect GiST index regressions.
      - name: Run GiST index benchmark
        id: run
        env:
          PGUSER: severinno
          PGPASSWORD: severinno_dev
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: severinno
        run: |
          node scripts/geo-benchmark-gist.mjs \
            --json docs/benchmarks/geo-gist-latest.json \
            --providers 500,2000 \
            --radius-list 1,5,10,25,50 \
            2>&1 | tee /tmp/gist-benchmark-output.txt
          echo "✅ GiST PR Benchmark completed"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ── Validate result ───────────────────────────────────────────────
      - name: Validate benchmark result
        run: |
          node -e "
            const fs = require('fs');
            const path = 'docs/benchmarks/geo-gist-latest.json';
            if (!fs.existsSync(path)) throw Error('geo-gist-latest.json not found');
            const data = JSON.parse(fs.readFileSync(path, 'utf-8'));
            if (!data.meta || !Array.isArray(data.crossover) || data.crossover.length === 0) {
              throw Error('geo-gist-latest.json: invalid or empty crossover data');
            }
            console.log('  ✅ Benchmark validation passed');
            console.log('  · Crossover rows: ' + data.crossover.length);
            console.log('  · Densities:      ' + (data.meta.densities ?? []).join(', '));
            console.log('  · Radii:          ' + (data.meta.radiiKm ?? []).join(', '));
            console.log('  · PostGIS:        ' + (data.meta.postgisVersion || '?'));
          "

      # ── Fetch baseline from main ──────────────────────────────────────
      - name: Fetch GiST baseline from main
        id: baseline
        run: |
          if git show main:docs/benchmarks/geo-gist-baseline.json > /tmp/geo-gist-baseline.json 2>/dev/null; then
            echo "baseline_exists=true" >> "$GITHUB_OUTPUT"
            echo "  ✅ GiST baseline loaded from main"
          else
            echo "baseline_exists=false" >> "$GITHUB_OUTPUT"
            echo "  ℹ  No GiST baseline on main yet — first run will create reference."
          fi

      # ── Detect PR scope ───────────────────────────────────────────────
      # Wider threshold when the PR touches GiST/PostGIS code paths.
      - name: Detect PR scope
        id: scope
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE '^(scripts/(geo-benchmark-gist|validate-gist-crossover)\.mjs|src/lib/(geo-shared|postgis|distance-fallback)\.ts)'; then
            echo "threshold_steps=3" >> "$GITHUB_OUTPUT"
            echo "threshold_ratio=30" >> "$GITHUB_OUTPUT"
            echo "  ℹ  PR touches GiST code — widened thresholds (3 steps / 30pp)"
          else
            echo "threshold_steps=2" >> "$GITHUB_OUTPUT"
            echo "threshold_ratio=25" >> "$GITHUB_OUTPUT"
            echo "  ℹ  Default thresholds (2 steps / 25pp)"
          fi

      # ── Validate crossover stability ──────────────────────────────────
      - name: Validate crossover stability
        id: validate
        if: steps.baseline.outputs.baseline_exists == 'true'
        env:
          THRESHOLD_STEPS: ${{ steps.scope.outputs.threshold_steps }}
          RATIO_DRIFT: ${{ steps.scope.outputs.threshold_ratio }}
        continue-on-error: true
        run: |
          node scripts/validate-gist-crossover.mjs \
            --threshold "$THRESHOLD_STEPS" \
            --ratio-drift "$RATIO_DRIFT" \
            /tmp/geo-gist-baseline.json \
            docs/benchmarks/geo-gist-latest.json \
            2>&1 | tee /tmp/gist-crossover-diff.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: No baseline available
        if: steps.baseline.outputs.baseline_exists != 'true'
        run: |
          echo "No GiST baseline on main — this run creates the reference." | tee /tmp/gist-crossover-diff.txt

      # ── Publish job summary ───────────────────────────────────────────
      - name: Publish GiST benchmark summary
        if: always()
        run: |
          {
            echo '## 🗄️ GiST Index Benchmark — PR Check'
            echo ''
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Scope | 500, 2000 providers × 5 radii |"
            echo "| Threshold | ${{ steps.scope.outputs.threshold_steps }} steps / ${{ steps.scope.outputs.threshold_ratio }}pp |"
            if [ "${{ steps.run.outputs.exit_code }}" != "0" ]; then
              echo "| Benchmark Status | ❌ Failed |"
            else
              echo "| Benchmark Status | ✅ Completed |"
            fi
            echo "| Baseline | ${{ steps.baseline.outputs.baseline_exists == 'true' && 'loaded from main' || 'none' }} |"
            echo ''
            echo '### Resultado da Validação de Crossover'
            echo ''
            echo '```'
            cat /tmp/gist-crossover-diff.txt 2>/dev/null || echo 'No validation data available.'
            echo '```'
            echo ''
            echo '### Benchmark Output'
            echo ''
            echo '```'
            cat /tmp/gist-benchmark-output.txt 2>/dev/null || echo 'No benchmark output.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Upload artifact ───────────────────────────────────────────────
      - name: Upload GiST benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-gist-benchmark-pr
          path: |
            docs/benchmarks/geo-gist-latest.json
            /tmp/gist-crossover-diff.txt
            /tmp/gist-benchmark-output.txt
          retention-days: 30

      # ── Fail on regression ────────────────────────────────────────────
      - name: Fail on crossover regression
        if: steps.validate.outputs.exit_code == '1'
        run: |
          echo "❌ GiST crossover regression detected — see job summary for details."
          echo "   Affected densities and radius steps:"
          cat /tmp/gist-crossover-diff.txt 2>/dev/null | grep -E '^(.*provider|⚠|crossover|step)' || true
          exit 1

  # ── Seed Guards E2E (prod + dev em UM service container) ───────────
  # Valida os DOIS seeds contra UM ÚNICO PostGIS efêmero (sugestão #1 —
  # economia ~1 min/PR vs. jobs separados: 1 pull de imagem + 1 bun install
  # + 1 prisma generate/push em vez de 2 de cada).
  #
  # ORDEM: prod E2E PRIMEIRO (128 checks — banco limpo, asserta ZERO
  # usuários), dev E2E DEPOIS (162 checks — o wipe+recreate do dev seed não
  # conflita com os dados do prod).
  #
  # Independência PRESERVADA: o step do dev roda com if: always() — um PR
  # que quebre o seed de dev é detectado MESMO se o prod E2E falhar antes
  # (mesmo comportamento do antigo job seed-dev-e2e dedicado, sem o custo
  # de container/imagem extras). SKIP_DB_PUSH no dev é condicional ao
  # sucesso do prod (schema já pushado → pula; prod falhou → dev faz push).
  #
  # A definição do job vive no reusable workflow seed-guards.yml — chamado
  # também pelo cron semanal (benchmark-weekly.yml) para revalidar contra
  # um banco efêmero sem duplicar a lógica.
  #
  # O reusable workflow define TRÊS jobs: (1) seed-guards — MATRIX 2×2
  # seed×imagem: prod e dev E2E rodam contra as DUAS variantes do PostGIS
  # (alpine + full — 4 combinações: prod×alpine, prod×full, dev×alpine,
  # dev×full), validando a compatibilidade de ambas as imagens em PRs, não só
  # em cron/deploy; (2) seed-prod-e2e-dev-env — o prod E2E com
  # PROD_SEED_ALLOW_DEV=1 NO AMBIENTE do job (container próprio), cobrindo o
  # fluxo de override de banco efêmero em dev que o CI de produção não
  # exercita (a produção roda NODE_ENV=production sem override);
  # (3) mutation-seed-dev-e2e — MUTATION TEST: introduz um bug conhecido no
  # prisma/seed.ts, roda o dev E2E e exige que ele FALHE (guard cego → falha).
  seed-guards:
    name: Seed Guards (prod + dev E2E)
    uses: ./.github/workflows/seed-guards.yml

  # ── Security Headers ──────────────────────────────────────────────────
  # Verifica CSP, HSTS, X-Frame-Options e demais headers de segurança
  # via curl. Roda no checkout sem dependências além de curl (pré-instalado).
  # Falha se algum header obrigatório estiver ausente ou mal configurado.
  security-headers:
    name: Security Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check security headers (CSP, HSTS, XFO, etc.)
        run: bash scripts/test-security-headers.sh --ci --url "${{ secrets.BASE_URL || 'https://severinno.com.br' }}"

      - name: Summary
        run: |
          echo "✅ Security headers verification complete."
          echo "Headers checked: CSP, HSTS, X-Content-Type-Options, X-Frame-Options,"
          echo "X-XSS-Protection, Referrer-Policy, Permissions-Policy, Server removal"

  # ── Main PR Check ──────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: "Guard: no @ts-nocheck in non-generated files"
        run: bun run check:ts-nocheck

      # O heap default do Node (~1.4GB) é insuficiente para o tsc neste
      # codebase — o processo crasha com 'JavaScript heap out of memory'
      # (SIGABRT exit 134, não erro de tipo). Reproduzido e validado em
      # 08/2026: com 4096MB o typecheck passa limpo em ~2min.
      - name: Type check
        run: bunx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # ── Unit tests ──────────────────────────────────────────────────
      # Cobertura do contrato de escopo CRLF revalidada a CADA PR: o glob
      # do test:unit (src/**/*.test.{ts,tsx}) inclui check-blob-crlf.test.ts
      # (12 testes — blob CRLF via hash-object --literally, --fix, e o
      # contrato de escopo .ts-fora), check-crlf.test.ts e
      # validate-all-text-alert.test.ts (a semântica do alerta all-text —
      # sentinel 'com CRLF' presente no achado, ausente no limpo — roda via
      # spawn do wrapper real num repo git temp, sem depender do bash script
      # nem do cron). O job dedicado blob-crlf-history-audit (acima) cobre o
      # zero-CRLF do histórico; o all-text-alert-validation (acima) o gate
      # via bash script. Este job revalida a MESMA semântica em vitest a cada
      # PR (e no pre-push via test:unit do smart-skip quando fonte mudou).
      - name: Unit tests
        run: bun run test:unit
