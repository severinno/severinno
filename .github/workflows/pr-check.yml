name: PR Check

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Regression threshold percentage (default: auto-detect 10% for benchmark code, 5% otherwise)"
        required: false
        default: 0
        type: number

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://localhost:5432/test
  REDIS_URL: redis://localhost:6379
  RABBITMQ_URL: amqp://localhost:5672

jobs:
  # ── UTF-8 Encoding Check ────────────────────────────────────────────────
  # Fast gate: <10s, no dependencies beyond python3 (pre-installed on runners).
  # Runs in parallel with the main check job.
  utf8-check:
    name: UTF-8 Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run UTF-8 validation on all .ts files
        run: bash scripts/check-utf8.sh --ci src/

      - name: Summary
        run: echo "All .ts files validated as valid UTF-8 encoding."

  # ── Fuzz Tests ─────────────────────────────────────────────────────────
  # Runs in parallel with other checks. No external dependencies needed.
  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run fuzz tests
        run: bun run fuzz:ci > fuzz-results.json

      - name: Archive fuzz results
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: fuzz-results.json
          retention-days: 30

  # ── Geo Benchmark ──────────────────────────────────────────────────────
  # Runs the geo-distance benchmark and compares against the baseline from
  # main.  Fails the PR if any benchmark regresses >threshold % in mean
  # latency.  The threshold is 5 % by default; when the PR touches
  # benchmark or geolocation code paths, it widens to 10 % to reduce
  # flakiness from algorithmic changes.
  benchmark:
    name: Geo Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to fetch main branch for baseline

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run geo benchmark
        run: |
          node scripts/run-benchmark.mjs --type geo --json

      - name: Fetch baseline from main
        id: baseline
        run: |
          if git show main:docs/benchmarks/geo-baseline.json > /tmp/geo-baseline.json 2>/dev/null; then
            echo "baseline_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "baseline_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Detect threshold ────────────────────────────────────────────
      # Priority: workflow_dispatch input > auto-detect > default 5.
      # Auto-detect: when the PR touches benchmark/geo code, widen to 10%
      # to reduce flakiness from intentional algorithmic changes.
      - name: Detect threshold
        id: changes
        run: |
          MANUAL_INPUT=${{ github.event.inputs.threshold || 0 }}
          if [ "$MANUAL_INPUT" -gt 0 ] 2>/dev/null; then
            echo "threshold=$MANUAL_INPUT" >> "$GITHUB_OUTPUT"
          elif git diff --name-only origin/main...HEAD | grep -qE '^(src/lib/(geo-shared|distance-fallback|radius-expansion|fetch-providers-data|fetch-unrestricted-results|sql-builder)\.ts|src/app/api/providers/route\.ts|scripts/(geo-benchmark|compare-benchmarks|run-benchmark)\.mjs)$'; then
            echo "threshold=10" >> "$GITHUB_OUTPUT"
          else
            echo "threshold=5" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare with baseline
        id: compare
        if: steps.baseline.outputs.baseline_exists == 'true'
        env:
          BENCHMARK_THRESHOLD: ${{ steps.changes.outputs.threshold }}
        run: |
          node scripts/compare-benchmarks.mjs \
            /tmp/geo-baseline.json \
            docs/benchmarks/geo-latest.json \
            2>&1 | tee /tmp/benchmark-diff.txt

      - name: No baseline available
        if: steps.baseline.outputs.baseline_exists != 'true'
        run: |
          echo "No geo-baseline.json on main — skipping comparison." | tee /tmp/benchmark-diff.txt

      # ── Publish job summary ──────────────────────────────────────────
      # Writes a condensed version of the comparison to the GitHub Actions
      # Job Summary so failures are self-explanatory at a glance.
      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo '## 📊 Geo-Benchmark Comparison'
            echo ''
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Threshold | ${{ steps.changes.outputs.threshold }}% |"
            echo "| Baseline | $(if [ -f /tmp/geo-baseline.json ]; then echo 'loaded'; else echo 'none'; fi) |"
            echo ''
            echo '```'
            cat /tmp/benchmark-diff.txt 2>/dev/null || echo 'No benchmark data available.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload artifact even on failure so results can be inspected
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-benchmark
          path: docs/benchmarks/geo-latest.json
          retention-days: 30

  # ── GiST Index Benchmark (PR Check) ─────────────────────────────────────
  # Spins up an ephemeral PostGIS container, runs the GiST index benchmark
  # against it, and validates that the crossover radius hasn't shifted
  # significantly relative to the baseline on main.
  #
  # Uses a reduced scope (500/2000 providers, 5 radii) so it completes in
  # ~5-8 min instead of the full 45 min weekly run.
  #
  # The PostGIS container is a service container — it starts before the job
  # steps and is torn down automatically when the job completes, costing
  # nothing beyond the runner minutes.
  benchmark-gist:
    name: GiST Benchmark (PR)
    runs-on: ubuntu-latest

    # ── Ephemeral PostGIS service container ───────────────────────────
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      # ── Run GiST benchmark ────────────────────────────────────────────
      # Reduced scope: 500 + 2000 providers, 5 radii (1,5,10,25,50 km)
      # Full scope (1000/5000/10000 × 8 radii) takes ~45 min — too long for
      # a PR check.  This reduced scope completes in ~5-8 min and is
      # sufficient to detect GiST index regressions.
      - name: Run GiST index benchmark
        id: run
        env:
          PGUSER: severinno
          PGPASSWORD: severinno_dev
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: severinno
        run: |
          node scripts/geo-benchmark-gist.mjs \
            --json docs/benchmarks/geo-gist-latest.json \
            --providers 500,2000 \
            --radius-list 1,5,10,25,50 \
            2>&1 | tee /tmp/gist-benchmark-output.txt
          echo "✅ GiST PR Benchmark completed"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ── Validate result ───────────────────────────────────────────────
      - name: Validate benchmark result
        run: |
          node -e "
            const fs = require('fs');
            const path = 'docs/benchmarks/geo-gist-latest.json';
            if (!fs.existsSync(path)) throw Error('geo-gist-latest.json not found');
            const data = JSON.parse(fs.readFileSync(path, 'utf-8'));
            if (!data.meta || !Array.isArray(data.crossover) || data.crossover.length === 0) {
              throw Error('geo-gist-latest.json: invalid or empty crossover data');
            }
            console.log('  ✅ Benchmark validation passed');
            console.log('  · Crossover rows: ' + data.crossover.length);
            console.log('  · Densities:      ' + (data.meta.densities ?? []).join(', '));
            console.log('  · Radii:          ' + (data.meta.radiiKm ?? []).join(', '));
            console.log('  · PostGIS:        ' + (data.meta.postgisVersion || '?'));
          "

      # ── Fetch baseline from main ──────────────────────────────────────
      - name: Fetch GiST baseline from main
        id: baseline
        run: |
          if git show main:docs/benchmarks/geo-gist-baseline.json > /tmp/geo-gist-baseline.json 2>/dev/null; then
            echo "baseline_exists=true" >> "$GITHUB_OUTPUT"
            echo "  ✅ GiST baseline loaded from main"
          else
            echo "baseline_exists=false" >> "$GITHUB_OUTPUT"
            echo "  ℹ  No GiST baseline on main yet — first run will create reference."
          fi

      # ── Detect PR scope ───────────────────────────────────────────────
      # Wider threshold when the PR touches GiST/PostGIS code paths.
      - name: Detect PR scope
        id: scope
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE '^(scripts/(geo-benchmark-gist|validate-gist-crossover)\.mjs|src/lib/(geo-shared|postgis|distance-fallback)\.ts)'; then
            echo "threshold_steps=3" >> "$GITHUB_OUTPUT"
            echo "threshold_ratio=30" >> "$GITHUB_OUTPUT"
            echo "  ℹ  PR touches GiST code — widened thresholds (3 steps / 30pp)"
          else
            echo "threshold_steps=2" >> "$GITHUB_OUTPUT"
            echo "threshold_ratio=25" >> "$GITHUB_OUTPUT"
            echo "  ℹ  Default thresholds (2 steps / 25pp)"
          fi

      # ── Validate crossover stability ──────────────────────────────────
      - name: Validate crossover stability
        id: validate
        if: steps.baseline.outputs.baseline_exists == 'true'
        env:
          THRESHOLD_STEPS: ${{ steps.scope.outputs.threshold_steps }}
          RATIO_DRIFT: ${{ steps.scope.outputs.threshold_ratio }}
        continue-on-error: true
        run: |
          node scripts/validate-gist-crossover.mjs \
            --threshold "$THRESHOLD_STEPS" \
            --ratio-drift "$RATIO_DRIFT" \
            /tmp/geo-gist-baseline.json \
            docs/benchmarks/geo-gist-latest.json \
            2>&1 | tee /tmp/gist-crossover-diff.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: No baseline available
        if: steps.baseline.outputs.baseline_exists != 'true'
        run: |
          echo "No GiST baseline on main — this run creates the reference." | tee /tmp/gist-crossover-diff.txt

      # ── Publish job summary ───────────────────────────────────────────
      - name: Publish GiST benchmark summary
        if: always()
        run: |
          {
            echo '## 🗄️ GiST Index Benchmark — PR Check'
            echo ''
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Scope | 500, 2000 providers × 5 radii |"
            echo "| Threshold | ${{ steps.scope.outputs.threshold_steps }} steps / ${{ steps.scope.outputs.threshold_ratio }}pp |"
            if [ "${{ steps.run.outputs.exit_code }}" != "0" ]; then
              echo "| Benchmark Status | ❌ Failed |"
            else
              echo "| Benchmark Status | ✅ Completed |"
            fi
            echo "| Baseline | ${{ steps.baseline.outputs.baseline_exists == 'true' && 'loaded from main' || 'none' }} |"
            echo ''
            echo '### Resultado da Validação de Crossover'
            echo ''
            echo '```'
            cat /tmp/gist-crossover-diff.txt 2>/dev/null || echo 'No validation data available.'
            echo '```'
            echo ''
            echo '### Benchmark Output'
            echo ''
            echo '```'
            cat /tmp/gist-benchmark-output.txt 2>/dev/null || echo 'No benchmark output.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Upload artifact ───────────────────────────────────────────────
      - name: Upload GiST benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-gist-benchmark-pr
          path: |
            docs/benchmarks/geo-gist-latest.json
            /tmp/gist-crossover-diff.txt
            /tmp/gist-benchmark-output.txt
          retention-days: 30

      # ── Fail on regression ────────────────────────────────────────────
      - name: Fail on crossover regression
        if: steps.validate.outputs.exit_code == '1'
        run: |
          echo "❌ GiST crossover regression detected — see job summary for details."
          echo "   Affected densities and radius steps:"
          cat /tmp/gist-crossover-diff.txt 2>/dev/null | grep -E '^(.*provider|⚠|crossover|step)' || true
          exit 1

  # ── Production Seed Guard ─────────────────────────────────────────────
  # Valida a proteção da Ação 2 (docs/SECURITY.md): o seed NÃO pode rodar
  # em produção — deve recusar ANTES de qualquer escrita, para nunca criar
  # admin@severinno.com/admin123 nem destruir um banco produtivo.
  #
  # Roda `NODE_ENV=production bun run db:seed` contra um Postgres efêmero
  # e FALHA se o seed NÃO recusar (exit 0 = guard removido/quebrado).
  #
  # Sanity em development no MESMO banco efêmero: se o banco estiver
  # quebrado o job falha — sem falso positivo (a recusa em prod só é válida
  # se em dev o seed funciona de verdade).
  seed-prod-guard:
    name: Seed Guard (production refusal)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ── Ephemeral PostGIS service container ───────────────────────────
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      # ── Push schema so the ephemeral DB is functional ────────────────
      - name: Push schema to ephemeral DB
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
        run: bunx prisma db push --skip-generate

      # ── Sanity: seed MUST succeed in development ─────────────────────
      # Proves the DB is functional, so a production refusal is attributable
      # to the guard (action 2) and not to a broken environment.
      - name: Sanity — seed succeeds in development
        id: sanity
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
        run: |
          bun run db:seed 2>&1 | tee /tmp/seed-dev.log
          if ! grep -q "Seed completed successfully" /tmp/seed-dev.log; then
            echo "❌ Dev seed falhou — banco efêmero não funcional; teste inválido."
            cat /tmp/seed-dev.log
            exit 1
          fi
          echo "✅ Sanity ok — banco efêmero funcional, seed roda em development"

      # ── The guard: seed MUST refuse in production ────────────────────
      # Capture the exit code without failing the step (refusal = exit 1
      # by design); the next step asserts the refusal happened.
      - name: Production seed must be refused
        id: guard
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
        run: |
          set +e
          bun run db:seed 2>&1 | tee /tmp/seed-prod.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "seed exit code: $code"

      # ── Assert the refusal is real and early ─────────────────────────
      - name: Assert production refusal
        env:
          EXIT_CODE: ${{ steps.guard.outputs.exit_code }}
        run: |
          if [ "$EXIT_CODE" = "0" ]; then
            echo "❌ GUARD QUEBRADO: seed RODOU em produção (exit 0)."
            echo "   O seed criaria admin@severinno.com/admin123 em produção!"
            cat /tmp/seed-prod.log
            exit 1
          fi
          if ! grep -q "Seed recusado" /tmp/seed-prod.log; then
            echo "❌ Seed falhou em produção sem a mensagem de recusa do guard."
            cat /tmp/seed-prod.log
            exit 1
          fi
          if grep -q "wiping existing data" /tmp/seed-prod.log; then
            echo "❌ Guard posicionado errado: o wipe rodou ANTES da recusa."
            cat /tmp/seed-prod.log
            exit 1
          fi
          echo "✅ Guard validado: seed recusou em produção (exit $EXIT_CODE) antes de qualquer escrita"

      - name: Publish summary
        if: always()
        env:
          EXIT_CODE: ${{ steps.guard.outputs.exit_code }}
        run: |
          {
            echo '## 🛡️ Seed Production Guard'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            if [ "${{ steps.guard.conclusion }}" = "success" ]; then
              if [ "$EXIT_CODE" != "0" ]; then
                echo '| Seed recusa em produção | ✅ |'
              else
                echo '| Seed recusa em produção | ❌ |'
              fi
            else
              echo '| Seed recusa em produção | ⚪ não executado |'
            fi
            if [ "${{ steps.sanity.outcome }}" = "success" ]; then
              echo '| Sanity em development | ✅ |'
            else
              echo '| Sanity em development | ❌ |'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Production Seed Bootstrap Guard ────────────────────────────────────
  # Valida o prisma/seed-prod.ts (seed LEGÍTIMO de produção):
  #   1. Recusa rodar sem NODE_ENV=production (guard obrigatório)
  #   2. Com o override explícito PROD_SEED_ALLOW_DEV=1, popula categorias +
  #      settings e NÃO cria NENHUM usuário (zero contas demo em produção)
  #
  # Espelho do seed-prod-guard (que valida o seed de DEV recusar em prod);
  # este valida o caminho inverso: o seed de PRODUÇÃO funcionar de verdade.
  #
  # A definição do job vive no reusable workflow seed-prod-bootstrap.yml —
  # chamado também pelo cron semanal (benchmark-weekly.yml) para revalidar
  # o seed de produção contra um banco efêmero sem duplicar a lógica.
  seed-prod-bootstrap:
    name: Seed Prod Bootstrap
    uses: ./.github/workflows/seed-prod-bootstrap.yml

  # ── Security Headers ──────────────────────────────────────────────────
  # Verifica CSP, HSTS, X-Frame-Options e demais headers de segurança
  # via curl. Roda no checkout sem dependências além de curl (pré-instalado).
  # Falha se algum header obrigatório estiver ausente ou mal configurado.
  security-headers:
    name: Security Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check security headers (CSP, HSTS, XFO, etc.)
        run: bash scripts/test-security-headers.sh --ci --url "${{ secrets.BASE_URL || 'https://severinno.com.br' }}"

      - name: Summary
        run: |
          echo "✅ Security headers verification complete."
          echo "Headers checked: CSP, HSTS, X-Content-Type-Options, X-Frame-Options,"
          echo "X-XSS-Protection, Referrer-Policy, Permissions-Policy, Server removal"

  # ── Main PR Check ──────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: "Guard: no @ts-nocheck in non-generated files"
        run: bun run check:ts-nocheck

      - name: Type check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test:unit
