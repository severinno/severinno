name: PR Check

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://localhost:5432/test
  REDIS_URL: redis://localhost:6379
  RABBITMQ_URL: amqp://localhost:5672

jobs:
  # ── UTF-8 Encoding Check ────────────────────────────────────────────────
  # Fast gate: <10s, no dependencies beyond python3 (pre-installed on runners).
  # Runs in parallel with the main check job.
  utf8-check:
    name: UTF-8 Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run UTF-8 validation on all .ts files
        run: bash scripts/check-utf8.sh --ci src/

      - name: Summary
        run: echo "All .ts files validated as valid UTF-8 encoding."

  # ── Main PR Check ──────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test:unit
