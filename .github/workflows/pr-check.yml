name: PR Check

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Regression threshold percentage (default: auto-detect 10% for benchmark code, 5% otherwise)"
        required: false
        default: 0
        type: number

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://localhost:5432/test
  REDIS_URL: redis://localhost:6379
  RABBITMQ_URL: amqp://localhost:5672

jobs:
  # ── UTF-8 Encoding Check ────────────────────────────────────────────────
  # Fast gate: <10s, no dependencies beyond python3 (pre-installed on runners).
  # Runs in parallel with the main check job.
  utf8-check:
    name: UTF-8 Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run UTF-8 validation on all .ts files
        run: bash scripts/check-utf8.sh --ci src/

      - name: Summary
        run: echo "All .ts files validated as valid UTF-8 encoding."

  # ── Secrets Guard ─────────────────────────────────────────────────────
  # Fast gate: falha o PR se qualquer .env voltar a ser rastreado pelo git
  # (padrão dos demais guards — node puro, sem bun install; roda em <5s em
  # paralelo com os demais checks).
  #
  # Contexto: os arquivos .env estiveram rastreados com secrets reais
  # (SESSION_SECRET, VAPID, DB_PASSWORD, S3). A remediação foi rotacionar os
  # valores (scripts/rotate-secrets.mjs) + git rm --cached. Este guard garante
  # que nenhum .env (exceto *.example, que são templates seguros) seja
  # adicionado de volta ao tracking sem o PR ser bloqueado.
  secrets-guard:
    name: Secrets Guard (no .env tracked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no .env tracked in git
        run: node scripts/rotate-secrets.mjs --check

      - name: Summary
        run: echo "✅ No .env files tracked in git."

  # ── Seed Test Hooks Guard ─────────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se SEED_SPEC_PATCH ou
  # PROD_SEED_ALLOW_DEV aparecerem em qualquer workflow FORA do allowlist
  # de teste (scripts/check-seed-hooks.mjs — fail-closed).
  #
  # Por que existe: esses hooks são TEST-ONLY (E2Es de seed contra banco
  # efêmero). Se vazarem para um workflow de produção (deploy.yml,
  # release-deploy.yml, ou um workflow novo), o seed de produção pode rodar
  # com spec patchado ou com o guard de produção contornado — o pipeline de
  # deploy precisa bloquear isso antes de tocar o servidor.
  seed-hooks-guard:
    name: Seed Test Hooks Guard (no prod leak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no seed test hooks in non-test workflows
        run: node scripts/check-seed-hooks.mjs

      - name: Summary
        run: echo "✅ No seed test hooks outside the test workflow allowlist."

  # ── Workflow References Guard ──────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se qualquer workflow referenciar
  # um script inexistente (node|bash|bun scripts/X), uma entry removida de
  # package.json (bun|npm run X), um reusable workflow local inexistente
  # (uses: ./.github/workflows/X.yml sem o arquivo ou sem workflow_call) ou
  # um composite action local inexistente (uses: ./.github/actions/<name>).
  #
  # Por que existe: consolidações como a matrix 2×2 do seed-guards.yml
  # deletam/renomeiam workflows e scripts em lote — uma referência quebrada
  # só falharia no JOB que a executa (com custo de runner pago e mensagem
  # confusa). Este guard falha o PR no início com a referência exata.
  workflow-refs-guard:
    name: Workflow References Guard (no dangling refs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow → script/package.json/uses references
        run: node scripts/check-workflow-refs.mjs

      - name: Summary
        run: echo "✅ No dangling references between workflows and scripts/package.json."

  # ── No setup-bun Guard ────────────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se qualquer workflow voltar a usar
  # oven-sh/setup-bun@v2 (o action externo re-downloada o release LATEST do
  # Bun em todo job, ~25-35s/job). Todos os 32 call sites foram migrados para
  # o composite action local ./.github/actions/setup-bun (pre-installed fast
  # path → actions/cache keyed na versão → download direto só em cache miss).
  no-setup-bun-guard:
    name: No setup-bun Guard (local action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no workflow uses oven-sh/setup-bun
        run: node scripts/check-no-setup-bun.mjs

      - name: Summary
        run: echo "✅ All workflows use ./.github/actions/setup-bun (cached)."

  # ── Bun Mirror Guard ─────────────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se a FONTE ÚNICA da versão do
  # Bun for violada. A versão vive APENAS na repository variable
  # vars.BUN_VERSION (Settings → Secrets and variables → Actions): workflows
  # passam 'bun-version: ${{ vars.BUN_VERSION }}', o sync-bun-mirror.yml usa
  # a mesma variável no env, e o composite action setup-bun resolve a versão
  # em runtime (metadata de action NÃO avalia ${{ }}, então default literal é
  # proibido). O guard falha se: mirror ausente, mirror com BUN_VERSION
  # literal, action com default literal, action sem referência à variável,
  # tier 3 (cold cache) sem ref ao mirror GHCR, qualquer literal de versão
  # do Bun em workflows (bun-version: 1.3.14, bun-1.3.14-...), ou .actrc
  # sem BUN_VERSION (act local).
  #
  # Por que existe: trocar o Bun deve ser ALTERAR A VARIÁVEL EM UM LUGAR.
  # Antes, a versão estava espalhada em 40+ ocorrências (bun-version:,
  # cache keys bun-/prisma-, mirror env, default do action) — o drift entre
  # elas quebrava a key do cache silenciosamente. O guard falha o PR no
  # início com a violação exata (arquivo:linha).
  bun-mirror-guard:
    name: Bun Mirror Guard (fonte única vars.BUN_VERSION)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bun single-source + GHCR mirror consistency
        run: node scripts/check-bun-mirror.mjs

      - name: Summary
        run: echo "✅ Bun version single-source (vars.BUN_VERSION) + GHCR mirror in sync."

  # ── Bun Mirror Guard (staged diff) ──────────────────────────────────
  # Fast gate (node puro, <1s): roda o check de cache keys e literais do
  # Bun contra o DIFF DO PR (git diff origin/main...HEAD) em vez do working
  # tree inteiro — detecta keys antigas (ex.: bun-1.3.14-...) ou literais
  # INTRODUZIDOS PELO PR antes do merge, mesmo que o restante do
  # repositório já esteja migrado. Só linhas ADICIONADAS (+ no diff) são
  # avaliadas — violações pré-existentes do base não poluem o PR.
  #
  # Requer fetch-depth: 0 para o git diff base...HEAD funcionar (mesmo
  # padrão do job benchmark). Local/pre-commit: node scripts/check-bun-mirror.mjs
  # --staged usa git diff --cached.
  bun-mirror-staged-guard:
    name: Bun Mirror Guard (staged diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for origin/main...HEAD diff

      - name: Check bun single-source on the PR diff
        run: node scripts/check-bun-mirror.mjs --staged --base origin/main

      - name: Summary
        run: echo "✅ No stale bun cache keys/literals introduced by this PR diff."

  # ── E2E Counts Guard ──────────────────────────────────────────────────
  # Fast gate (node puro, <1s): falha o PR se os counts de checks
  # documentados nos comentários dos workflows (pr-check.yml, seed-guards.yml,
  # validate-seed-guards-matrix-local.sh) divergirem do EXPECTED_TOTAL
  # declarado nos E2Es de seed (128 prod / 162 dev — fonte da verdade).
  #
  # Por que existe: os counts crescem quando asserções são adicionadas aos
  # E2Es (o dev E2E passou de 132 → 147 → 162 ao longo dos cenários). Sem
  # este guard, um dev atualiza o E2E mas esquece o comentário do workflow —
  # o CI não pega e o número documentado fica errado para sempre. Este guard
  # fecha o loop: qualquer divergência entre o que está escrito nos workflows
  # e o EXPECTED_TOTAL do source falha o PR no início com arquivo:linha.
  # Complemento runtime: cada E2E também valida no final que o total REAL
  # impresso (📊 Resultados) bate com a própria constante (exit 1 se divergir).
  e2e-counts-guard:
    name: E2E Counts Guard (comentários = derivação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Check documented E2E check counts match the derivation
        run: node scripts/check-e2e-counts.mjs

      - name: Summary
        run: echo "✅ Documented E2E counts match the derivation (scripts/seed-e2e-count.ts)."

  # ── Actionlint (workflow syntax) ───────────────────────────────────────
  actionlint:
    name: Actionlint (workflow syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint on all workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      - name: Summary
        run: echo "✅ All .github/workflows/*.yml pass actionlint (syntax + shellcheck)."

  # ── Fuzz Tests ─────────────────────────────────────────────────────────
  # Runs in parallel with other checks. No external dependencies needed.
  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run fuzz tests
        run: bun run fuzz:ci > fuzz-results.json

      - name: Archive fuzz results
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: fuzz-results.json
          retention-days: 30

  # ── Geo Benchmark ──────────────────────────────────────────────────────
  # Runs the geo-distance benchmark and compares against the baseline from
  # main.  Fails the PR if any benchmark regresses >threshold % in mean
  # latency.  The threshold is 5 % by default; when the PR touches
  # benchmark or geolocation code paths, it widens to 10 % to reduce
  # flakiness from algorithmic changes.
  benchmark:
    name: Geo Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to fetch main branch for baseline

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run geo benchmark
        run: |
          node scripts/run-benchmark.mjs --type geo --json

      - name: Fetch baseline from main
        id: baseline
        run: |
          if git show main:docs/benchmarks/geo-baseline.json > /tmp/geo-baseline.json 2>/dev/null; then
            echo "baseline_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "baseline_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Detect threshold ────────────────────────────────────────────
      # Priority: workflow_dispatch input > auto-detect > default 5.
      # Auto-detect: when the PR touches benchmark/geo code, widen to 10%
      # to reduce flakiness from intentional algorithmic changes.
      - name: Detect threshold
        id: changes
        run: |
          MANUAL_INPUT=${{ github.event.inputs.threshold || 0 }}
          if [ "$MANUAL_INPUT" -gt 0 ] 2>/dev/null; then
            echo "threshold=$MANUAL_INPUT" >> "$GITHUB_OUTPUT"
          elif git diff --name-only origin/main...HEAD | grep -qE '^(src/lib/(geo-shared|distance-fallback|radius-expansion|fetch-providers-data|fetch-unrestricted-results|sql-builder)\.ts|src/app/api/providers/route\.ts|scripts/(geo-benchmark|compare-benchmarks|run-benchmark)\.mjs)$'; then
            echo "threshold=10" >> "$GITHUB_OUTPUT"
          else
            echo "threshold=5" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare with baseline
        id: compare
        if: steps.baseline.outputs.baseline_exists == 'true'
        env:
          BENCHMARK_THRESHOLD: ${{ steps.changes.outputs.threshold }}
        run: |
          node scripts/compare-benchmarks.mjs \
            /tmp/geo-baseline.json \
            docs/benchmarks/geo-latest.json \
            2>&1 | tee /tmp/benchmark-diff.txt

      - name: No baseline available
        if: steps.baseline.outputs.baseline_exists != 'true'
        run: |
          echo "No geo-baseline.json on main — skipping comparison." | tee /tmp/benchmark-diff.txt

      # ── Publish job summary ──────────────────────────────────────────
      # Writes a condensed version of the comparison to the GitHub Actions
      # Job Summary so failures are self-explanatory at a glance.
      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo '## 📊 Geo-Benchmark Comparison'
            echo ''
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Threshold | ${{ steps.changes.outputs.threshold }}% |"
            echo "| Baseline | $(if [ -f /tmp/geo-baseline.json ]; then echo 'loaded'; else echo 'none'; fi) |"
            echo ''
            echo '```'
            cat /tmp/benchmark-diff.txt 2>/dev/null || echo 'No benchmark data available.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload artifact even on failure so results can be inspected
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-benchmark
          path: docs/benchmarks/geo-latest.json
          retention-days: 30

  # ── GiST Index Benchmark (PR Check) ─────────────────────────────────────
  # Spins up an ephemeral PostGIS container, runs the GiST index benchmark
  # against it, and validates that the crossover radius hasn't shifted
  # significantly relative to the baseline on main.
  #
  # Uses a reduced scope (500/2000 providers, 5 radii) so it completes in
  # ~5-8 min instead of the full 45 min weekly run.
  #
  # The PostGIS container is a service container — it starts before the job
  # steps and is torn down automatically when the job completes, costing
  # nothing beyond the runner minutes.
  benchmark-gist:
    name: GiST Benchmark (PR)
    runs-on: ubuntu-latest

    # ── Ephemeral PostGIS service container ───────────────────────────
    # Imagem via vars.POSTGIS_IMAGE (default alpine — menor: 154 MiB vs
    # ~203 MiB do full). Mire no GHCR com sync-postgis-mirror.yml para
    # pull dentro da rede do GitHub + sem rate limit do Docker Hub.
    services:
      postgis:
        image: ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine' }}
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      # ── PostGIS extension no service container ──────────────────────
      # A imagem postgis só habilita a extensão em postgres/template_postgis,
      # NÃO no POSTGRES_DB (criado de template1) — sem ela o benchmark falha
      # em checkPostGIS()/geo-benchmark-gist.mjs (exit 1) ao conectar no
      # database 'severinno'. Mesmo fix dos E2Es de seed (docker exec antes
      # do passo que usa o banco). ATENÇÃO: o service container deste job é
      # 'postgis' (não 'postgres' como nos seed E2Es) — job.services.<id>.
      - name: Enable PostGIS extension
        run: |
          # O docker-postgis (alpine E full) carrega a extensão no POSTGRES_DB
          # DEPOIS do servidor aceitar conexões ('Loading PostGIS extensions
          # into severinno') — o healthcheck passa antes. Um CREATE EXTENSION
          # IF NOT EXISTS nesse momento RACEIA com o load da imagem e falha
          # esporadicamente com duplicate key pg_extension_name_index.
          # Solução: poll até a extensão aparecer (a imagem SEMPRE carrega),
          # com fallback de criação (IF NOT EXISTS + re-verificação).
          POSTGIS_READY=0
          for _ in $(seq 1 30); do
            if docker exec ${{ job.services.postgis.id }} \
              psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null | grep -qx 1; then
              POSTGIS_READY=1
              break
            fi
            sleep 1
          done
          if [ "$POSTGIS_READY" != "1" ]; then
            docker exec ${{ job.services.postgis.id }} \
              psql -U severinno -d severinno -c "CREATE EXTENSION IF NOT EXISTS postgis" >/dev/null 2>&1 || true
            if ! docker exec ${{ job.services.postgis.id }} \
              psql -U severinno -d severinno -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" 2>/dev/null | grep -qx 1; then
              echo "❌ postgis não disponível após espera/fallback"
              exit 1
            fi
          fi
          echo "✅ postgis disponível"

      # ── Run GiST benchmark ────────────────────────────────────────────
      # Reduced scope: 500 + 2000 providers, 5 radii (1,5,10,25,50 km)
      # Full scope (1000/5000/10000 × 8 radii) takes ~45 min — too long for
      # a PR check.  This reduced scope completes in ~5-8 min and is
      # sufficient to detect GiST index regressions.
      - name: Run GiST index benchmark
        id: run
        env:
          PGUSER: severinno
          PGPASSWORD: severinno_dev
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: severinno
        run: |
          node scripts/geo-benchmark-gist.mjs \
            --json docs/benchmarks/geo-gist-latest.json \
            --providers 500,2000 \
            --radius-list 1,5,10,25,50 \
            2>&1 | tee /tmp/gist-benchmark-output.txt
          echo "✅ GiST PR Benchmark completed"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ── Validate result ───────────────────────────────────────────────
      - name: Validate benchmark result
        run: |
          node -e "
            const fs = require('fs');
            const path = 'docs/benchmarks/geo-gist-latest.json';
            if (!fs.existsSync(path)) throw Error('geo-gist-latest.json not found');
            const data = JSON.parse(fs.readFileSync(path, 'utf-8'));
            if (!data.meta || !Array.isArray(data.crossover) || data.crossover.length === 0) {
              throw Error('geo-gist-latest.json: invalid or empty crossover data');
            }
            console.log('  ✅ Benchmark validation passed');
            console.log('  · Crossover rows: ' + data.crossover.length);
            console.log('  · Densities:      ' + (data.meta.densities ?? []).join(', '));
            console.log('  · Radii:          ' + (data.meta.radiiKm ?? []).join(', '));
            console.log('  · PostGIS:        ' + (data.meta.postgisVersion || '?'));
          "

      # ── Fetch baseline from main ──────────────────────────────────────
      - name: Fetch GiST baseline from main
        id: baseline
        run: |
          if git show main:docs/benchmarks/geo-gist-baseline.json > /tmp/geo-gist-baseline.json 2>/dev/null; then
            echo "baseline_exists=true" >> "$GITHUB_OUTPUT"
            echo "  ✅ GiST baseline loaded from main"
          else
            echo "baseline_exists=false" >> "$GITHUB_OUTPUT"
            echo "  ℹ  No GiST baseline on main yet — first run will create reference."
          fi

      # ── Detect PR scope ───────────────────────────────────────────────
      # Wider threshold when the PR touches GiST/PostGIS code paths.
      - name: Detect PR scope
        id: scope
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE '^(scripts/(geo-benchmark-gist|validate-gist-crossover)\.mjs|src/lib/(geo-shared|postgis|distance-fallback)\.ts)'; then
            echo "threshold_steps=3" >> "$GITHUB_OUTPUT"
            echo "threshold_ratio=30" >> "$GITHUB_OUTPUT"
            echo "  ℹ  PR touches GiST code — widened thresholds (3 steps / 30pp)"
          else
            echo "threshold_steps=2" >> "$GITHUB_OUTPUT"
            echo "threshold_ratio=25" >> "$GITHUB_OUTPUT"
            echo "  ℹ  Default thresholds (2 steps / 25pp)"
          fi

      # ── Validate crossover stability ──────────────────────────────────
      - name: Validate crossover stability
        id: validate
        if: steps.baseline.outputs.baseline_exists == 'true'
        env:
          THRESHOLD_STEPS: ${{ steps.scope.outputs.threshold_steps }}
          RATIO_DRIFT: ${{ steps.scope.outputs.threshold_ratio }}
        continue-on-error: true
        run: |
          node scripts/validate-gist-crossover.mjs \
            --threshold "$THRESHOLD_STEPS" \
            --ratio-drift "$RATIO_DRIFT" \
            /tmp/geo-gist-baseline.json \
            docs/benchmarks/geo-gist-latest.json \
            2>&1 | tee /tmp/gist-crossover-diff.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: No baseline available
        if: steps.baseline.outputs.baseline_exists != 'true'
        run: |
          echo "No GiST baseline on main — this run creates the reference." | tee /tmp/gist-crossover-diff.txt

      # ── Publish job summary ───────────────────────────────────────────
      - name: Publish GiST benchmark summary
        if: always()
        run: |
          {
            echo '## 🗄️ GiST Index Benchmark — PR Check'
            echo ''
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Scope | 500, 2000 providers × 5 radii |"
            echo "| Threshold | ${{ steps.scope.outputs.threshold_steps }} steps / ${{ steps.scope.outputs.threshold_ratio }}pp |"
            if [ "${{ steps.run.outputs.exit_code }}" != "0" ]; then
              echo "| Benchmark Status | ❌ Failed |"
            else
              echo "| Benchmark Status | ✅ Completed |"
            fi
            echo "| Baseline | ${{ steps.baseline.outputs.baseline_exists == 'true' && 'loaded from main' || 'none' }} |"
            echo ''
            echo '### Resultado da Validação de Crossover'
            echo ''
            echo '```'
            cat /tmp/gist-crossover-diff.txt 2>/dev/null || echo 'No validation data available.'
            echo '```'
            echo ''
            echo '### Benchmark Output'
            echo ''
            echo '```'
            cat /tmp/gist-benchmark-output.txt 2>/dev/null || echo 'No benchmark output.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Upload artifact ───────────────────────────────────────────────
      - name: Upload GiST benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-gist-benchmark-pr
          path: |
            docs/benchmarks/geo-gist-latest.json
            /tmp/gist-crossover-diff.txt
            /tmp/gist-benchmark-output.txt
          retention-days: 30

      # ── Fail on regression ────────────────────────────────────────────
      - name: Fail on crossover regression
        if: steps.validate.outputs.exit_code == '1'
        run: |
          echo "❌ GiST crossover regression detected — see job summary for details."
          echo "   Affected densities and radius steps:"
          cat /tmp/gist-crossover-diff.txt 2>/dev/null | grep -E '^(.*provider|⚠|crossover|step)' || true
          exit 1

  # ── Seed Guards E2E (prod + dev em UM service container) ───────────
  # Valida os DOIS seeds contra UM ÚNICO PostGIS efêmero (sugestão #1 —
  # economia ~1 min/PR vs. jobs separados: 1 pull de imagem + 1 bun install
  # + 1 prisma generate/push em vez de 2 de cada).
  #
  # ORDEM: prod E2E PRIMEIRO (128 checks — banco limpo, asserta ZERO
  # usuários), dev E2E DEPOIS (162 checks — o wipe+recreate do dev seed não
  # conflita com os dados do prod).
  #
  # Independência PRESERVADA: o step do dev roda com if: always() — um PR
  # que quebre o seed de dev é detectado MESMO se o prod E2E falhar antes
  # (mesmo comportamento do antigo job seed-dev-e2e dedicado, sem o custo
  # de container/imagem extras). SKIP_DB_PUSH no dev é condicional ao
  # sucesso do prod (schema já pushado → pula; prod falhou → dev faz push).
  #
  # A definição do job vive no reusable workflow seed-guards.yml — chamado
  # também pelo cron semanal (benchmark-weekly.yml) para revalidar contra
  # um banco efêmero sem duplicar a lógica.
  #
  # O reusable workflow define TRÊS jobs: (1) seed-guards — MATRIX 2×2
  # seed×imagem: prod e dev E2E rodam contra as DUAS variantes do PostGIS
  # (alpine + full — 4 combinações: prod×alpine, prod×full, dev×alpine,
  # dev×full), validando a compatibilidade de ambas as imagens em PRs, não só
  # em cron/deploy; (2) seed-prod-e2e-dev-env — o prod E2E com
  # PROD_SEED_ALLOW_DEV=1 NO AMBIENTE do job (container próprio), cobrindo o
  # fluxo de override de banco efêmero em dev que o CI de produção não
  # exercita (a produção roda NODE_ENV=production sem override);
  # (3) mutation-seed-dev-e2e — MUTATION TEST: introduz um bug conhecido no
  # prisma/seed.ts, roda o dev E2E e exige que ele FALHE (guard cego → falha).
  seed-guards:
    name: Seed Guards (prod + dev E2E)
    uses: ./.github/workflows/seed-guards.yml

  # ── Security Headers ──────────────────────────────────────────────────
  # Verifica CSP, HSTS, X-Frame-Options e demais headers de segurança
  # via curl. Roda no checkout sem dependências além de curl (pré-instalado).
  # Falha se algum header obrigatório estiver ausente ou mal configurado.
  security-headers:
    name: Security Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check security headers (CSP, HSTS, XFO, etc.)
        run: bash scripts/test-security-headers.sh --ci --url "${{ secrets.BASE_URL || 'https://severinno.com.br' }}"

      - name: Summary
        run: |
          echo "✅ Security headers verification complete."
          echo "Headers checked: CSP, HSTS, X-Content-Type-Options, X-Frame-Options,"
          echo "X-XSS-Protection, Referrer-Policy, Permissions-Policy, Server removal"

  # ── Main PR Check ──────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ vars.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ vars.BUN_VERSION }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: "Guard: no @ts-nocheck in non-generated files"
        run: bun run check:ts-nocheck

      # O heap default do Node (~1.4GB) é insuficiente para o tsc neste
      # codebase — o processo crasha com 'JavaScript heap out of memory'
      # (SIGABRT exit 134, não erro de tipo). Reproduzido e validado em
      # 08/2026: com 4096MB o typecheck passa limpo em ~2min.
      - name: Type check
        run: bunx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Unit tests
        run: bun run test:unit
