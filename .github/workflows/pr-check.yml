name: PR Check

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Regression threshold percentage (default: auto-detect 10% for benchmark code, 5% otherwise)"
        required: false
        default: 0
        type: number

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://localhost:5432/test
  REDIS_URL: redis://localhost:6379
  RABBITMQ_URL: amqp://localhost:5672

jobs:
  # ── UTF-8 Encoding Check ────────────────────────────────────────────────
  # Fast gate: <3s, no dependencies beyond python3 + node (both pre-installed on runners).
  # Runs in parallel with the main check job.
  #
  # SINGLE SOURCE OF TRUTH: the encoding gate (verify-encoding.sh --ci src/ -
  # UTF-8 + VPS ASCII + strict ASCII proof + frozen baseline) lives ONLY in
  # .github/workflows/utf8-check.yml (reusable). ci.yml, deploy.yml,
  # e2e-cache.yml, release-deploy.yml and this workflow call the same reusable
  # file — a future change to the gate is one edit.
  # utf8-check.yml does NOT self-trigger on pull_request anymore (that was
  # the triplication: its own PR trigger + ci.yml's workflow_call + this
  # inline job); PR coverage comes from here + ci.yml, while utf8-check.yml's
  # push trigger remains the always-on net for main/develop merges.
  #
  # PROOF that this gate really bites (run locally, no CI needed): see the
  # header of .github/workflows/utf8-check.yml (5-step 0x97 injection repro).
  utf8-check:
    uses: ./.github/workflows/utf8-check.yml

  # ── Docs Encoding (informational) ──────────────────────────────────────
  # docs/ e .md/.css/.html ficam FORA de todos os gates por design (ver
  # docs/ascii-safe.md, seção 'Who protects the docs?'). Este job é o ÚNICO
  # contato informativo de CI com a superfície de docs: NÃO-BLOQUEANTE
  # (continue-on-error: true + exit 0) e só alerta CORRUPÇÃO REAL - UTF-8
  # inválido (byte 0x97 Windows-1252, sequências truncadas etc.) - NÃO
  # acentos legítimos: 69/73 .md têm não-ASCII válido hoje, então o --report
  # cru daria falso alerta permanente em todo PR (por isso o --utf8, que
  # valida well-formedness e deixa acentos passar). Roda o MESMO scanner
  # canônico (scan-non-ascii.mjs), nunca um grep de range. A violação vira
  # ::warning:: no PR sem quebrar o design de exclusão.
  #
  # DESDE 2026-08 o MESMO scan --utf8 também lista os YAML GATE FILES
  # (.github/workflows/*.yml + .github/actions/*/action.yml): o fragile-range
  # os varre (classe de range) e a CAMADA 4 do verify-encoding.sh (o gate
  # unico, rodado via utf8-check.yml) os varre para UTF-8 well-formedness de
  # forma BLOQUEANTE desde 2026-08 - um byte 0x97 num workflow QUEBRA o parse
  # YAML inteiro (js-yaml/PyYAML: "invalid start byte"), o workflow nao carrega
  # e o CI para silenciosamente. Por isso os YAML gate files SAIRAM deste job
  # informativo e viraram gate blocking na camada 4; aqui so sobra a superficie
  # docs (.md/.css/.html), onde corrupcao e mojibake cosmetico e o alerta
  # informativo basta. Ver docs/ascii-safe.md 'Who protects .zscripts and the
  # YAML gate files?'.
  docs-encoding:
    name: Docs Encoding (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Scan docs for invalid UTF-8 (corruption alert, non-blocking)
        run: |
          # GH Actions bash steps run with `set -e -o pipefail`: a detected
          # violation makes node exit non-zero and the pipeline fail, which
          # would ABORT the step before the ::warning:: emission and the
          # `exit 0`. `set +e` is what keeps this job truly informational -
          # it must never turn a doc corruption into a red step.
          set +e
          # Docs globs DERIVED from the encoding-surface manifest (single
          # source of truth - scripts/encoding-surface.mjs --print-docs),
          # keeping this job, check-docs-encoding.sh and ascii-safe.md in sync.
          DOCS_PATTERNS="$(node scripts/encoding-surface.mjs --print-docs)"
          # shellcheck disable=SC2086 (intentional word-splitting into globs)
          git ls-files $DOCS_PATTERNS | xargs -r node scripts/scan-non-ascii.mjs --utf8 --report > /tmp/docs-utf8.txt 2>&1
          CODE=$?
          cat /tmp/docs-utf8.txt
          if [ $CODE -ne 0 ]; then
            echo "::warning::docs-encoding: invalid UTF-8 detected in docs surface (informational - PR NOT blocked)"
            while IFS=$'\t' read -r verdict file pos; do
              [ "$verdict" = "INVALID-UTF8" ] || continue
              echo "::warning file=$file::$pos invalid UTF-8 byte sequence"
            done < /tmp/docs-utf8.txt
          fi
          exit 0

  # ── Fuzz Tests ─────────────────────────────────────────────────────────
  # Runs in parallel with other checks. No external dependencies needed.
  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run fuzz tests
        run: bun run fuzz:ci > fuzz-results.json

      - name: Archive fuzz results
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: fuzz-results.json
          retention-days: 30

  # ── Geo Benchmark ──────────────────────────────────────────────────────
  # Runs the geo-distance benchmark and compares against the baseline from
  # main.  Fails the PR if any benchmark regresses >threshold % in mean
  # latency.  The threshold is 5 % by default; when the PR touches
  # benchmark or geolocation code paths, it widens to 10 % to reduce
  # flakiness from algorithmic changes.
  benchmark:
    name: Geo Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to fetch main branch for baseline

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run geo benchmark
        run: |
          node scripts/run-benchmark.mjs --type geo --json

      - name: Fetch baseline from main
        id: baseline
        run: |
          if git show main:docs/benchmarks/geo-baseline.json > /tmp/geo-baseline.json 2>/dev/null; then
            echo "baseline_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "baseline_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Detect threshold ────────────────────────────────────────────
      # Priority: workflow_dispatch input > auto-detect > default 5.
      # Auto-detect: when the PR touches benchmark/geo code, widen to 10%
      # to reduce flakiness from intentional algorithmic changes.
      - name: Detect threshold
        id: changes
        run: |
          MANUAL_INPUT=${{ github.event.inputs.threshold || 0 }}
          if [ "$MANUAL_INPUT" -gt 0 ] 2>/dev/null; then
            echo "threshold=$MANUAL_INPUT" >> "$GITHUB_OUTPUT"
          elif git diff --name-only origin/main...HEAD | grep -qE '^(src/lib/(geo-shared|distance-fallback|radius-expansion|fetch-providers-data|fetch-unrestricted-results|sql-builder)\.ts|src/app/api/providers/route\.ts|scripts/(geo-benchmark|compare-benchmarks|run-benchmark)\.mjs)$'; then
            echo "threshold=10" >> "$GITHUB_OUTPUT"
          else
            echo "threshold=5" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare with baseline
        id: compare
        if: steps.baseline.outputs.baseline_exists == 'true'
        env:
          BENCHMARK_THRESHOLD: ${{ steps.changes.outputs.threshold }}
        run: |
          node scripts/compare-benchmarks.mjs \
            /tmp/geo-baseline.json \
            docs/benchmarks/geo-latest.json \
            2>&1 | tee /tmp/benchmark-diff.txt

      - name: No baseline available
        if: steps.baseline.outputs.baseline_exists != 'true'
        run: |
          echo "No geo-baseline.json on main — skipping comparison." | tee /tmp/benchmark-diff.txt

      # ── Publish job summary ──────────────────────────────────────────
      # Writes a condensed version of the comparison to the GitHub Actions
      # Job Summary so failures are self-explanatory at a glance.
      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo '## 📊 Geo-Benchmark Comparison'
            echo ''
            echo '| Setting | Value |'
            echo '|---|---|'
            echo "| Threshold | ${{ steps.changes.outputs.threshold }}% |"
            echo "| Baseline | $(if [ -f /tmp/geo-baseline.json ]; then echo 'loaded'; else echo 'none'; fi) |"
            echo ''
            echo '```'
            cat /tmp/benchmark-diff.txt 2>/dev/null || echo 'No benchmark data available.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload artifact even on failure so results can be inspected
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-benchmark
          path: docs/benchmarks/geo-latest.json
          retention-days: 30

  # ── Security Headers ──────────────────────────────────────────────────
  # Verifica CSP, HSTS, X-Frame-Options e demais headers de segurança
  # via curl. Roda no checkout sem dependências além de curl (pré-instalado).
  # Falha se algum header obrigatório estiver ausente ou mal configurado.
  security-headers:
    name: Security Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check security headers (CSP, HSTS, XFO, etc.)
        run: bash scripts/test-security-headers.sh --ci --url "${{ secrets.BASE_URL || 'https://severinno.com.br' }}"

      - name: Summary
        run: |
          echo "✅ Security headers verification complete."
          echo "Headers checked: CSP, HSTS, X-Content-Type-Options, X-Frame-Options,"
          echo "X-XSS-Protection, Referrer-Policy, Permissions-Policy, Server removal"

  # ── Main PR Check ──────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      # Unit tests run FIRST so a lint regression never skips the suite
      # (a failed step skips subsequent steps by default in GH Actions).
      # Lint + Type check keep `if: always()` so they still run (and each
      # failure still blocks the job) even when tests fail — no masking in
      # either direction.
      - name: Unit tests
        run: bun run test:unit

      - name: Lint
        if: always()
        run: bun run lint

      - name: Type check
        if: always()
        run: bunx tsc --noEmit

  # ── Guard Gates (vitest) ──────────────────────────────────────────────────
  # Roda o MESMO par de suítes do guard que o push net guard-gates.yml
  # (bun run test:guard — o script único em package.json, single source of
  # truth: uma futura suíte de guard entra em UM lugar, não em 2 workflows)
  # como job independente — imune a qualquer skip do job check (o reorder
  # atual já protege, mas este job garante o contrato vitest do guard mesmo
  # se o check for reordenado no futuro). A camada 3 (CLI em arquivos reais)
  # roda no utf8-check; aqui ficam os contratos por mutação/fixture + o
  # scaffold compartilhado (golden-copy-utils: canonicalizer + divergence
  # guards + writeModuleCopy). Não precisa de Prisma client nem de build.
  fragile-guard:
    name: Fragile Range Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run guard vitest suites (fragile-range-guard + golden-copy-utils)
        run: bun run test:guard

      # scan-timeouts — the versioned explicit-timeout gate, MIRROR of the
      # push-net step in guard-gates.yml (same command, single source of
      # truth): every subprocess-heavy it()/test() must carry an explicit
      # timeout of its own (the global testTimeout: 30000 safety net in
      # vitest.config.unit.ts covers only tests the guard does NOT flag).
      # Pure node, no bun deps. The vitest twin
      # (scripts/__tests__/scan-timeouts.test.ts) also runs inside test:unit
      # in the check job.
      - name: Scan subprocess-heavy tests for explicit timeouts
        run: node scripts/scan-timeouts.mjs --ci

      # scan-curl-timeouts — the versioned curl-timeout gate for CI gate
      # scripts, MIRROR of the push-net step in guard-gates.yml (same
      # command, single source of truth): every curl invocation in a gate
      # script (the .sh files DERIVED from .github/workflows/*.yml) must
      # carry an explicit --max-time — a stalled curl (HTTP 000000, no
      # bound) hung the security-headers job for 9:08 in run 31430040398
      # (sec 11.20 + docs/security-headers-gate-2026-08.md). Pure node, no
      # bun deps. The vitest twin
      # (scripts/__tests__/scan-curl-timeouts.test.ts, BASELINE over the
      # derived surface) also runs inside test:unit in the check job.
      - name: Scan gate-script curls for explicit timeouts
        run: node scripts/scan-curl-timeouts.mjs --ci

      # scan-eol-anchor — the versioned EOL-anchor gate, MIRROR of the
      # push-net step in guard-gates.yml (same command, single source of
      # truth): a raw `.replace("...\n...")` string anchor in the test/
      # mutation surface silently no-ops on CRLF gate files (Windows
      # autocrlf working tree) — the Prova 17 ACHADO, sec 8.14 of
      # gates-proofs.md. The fix is the shared replaceEolAgnostic helper
      # (CRLF->LF normalize + throw on anchor-miss); this guard fails if
      # the raw idiom returns to the surface. Pure node, no bun deps. The
      # vitest twin (scripts/__tests__/scan-eol-anchor.test.ts, BASELINE
      # over the surface) also runs inside test:unit in the check job.
      - name: Scan string \n anchors in the test/mutation surface
        run: node scripts/scan-eol-anchor.mjs --ci
