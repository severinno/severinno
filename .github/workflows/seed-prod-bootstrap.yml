# =============================================================================
# Seed Guards — reusable workflow (prod + dev E2E)
#
# Valida AMBOS os seeds de uma vez contra UM ÚNICO PostGIS efêmero:
#   1. prod E2E (test-seed-prod-e2e.ts — 85 checks): guard recusa fora de
#      produção, dry-run nada escrito, bootstrap categorias+settings,
#      ZERO usuários, guard contra banco populado, idempotência
#   2. dev E2E (test-seed-dev-e2e.ts — 111 checks): guard recusa em produção,
#      9 usuários demo (1 admin + 2 clients + 6 providers), árvore completa
#      (27 = 3+7+17), 13 services, 4 bookings, wipe+recreate idempotente
#
# ORDEM: prod PRIMEIRO (banco limpo → asserta zero usuários), dev DEPOIS
# (o dev seed faz wipe+recreate, então não conflita com os dados do prod).
# Substitui os antigos jobs seed-prod-guard (grep manual) + seed-prod-bootstrap
# — um único service container, um único bun install, um único generate/push.
#
# Otimizações de CI aplicadas:
#   - 1 service container para os 2 E2Es (--skip-docker) → 1 pull de imagem
#   - Imagem via vars.POSTGIS_IMAGE (default alpine; mire no GHCR com
#     sync-postgis-mirror.yml para pull mais rápido + sem rate limit Docker Hub)
#   - Cache do Prisma client keyed no schema.prisma → SKIP_PRISMA_GENERATE=1
#     em cache hit (pula o generate, ~6s por job)
#   - Para eliminar o pull de imagem de vez: self-hosted runner com Docker
#     persistente (imagem já quente localmente) — avaliar se a frequência de
#     PRs justifica a manutenção do runner.
#
# Centralizado aqui (em vez de duplicado) para que PR check e cron semanal
# validem SEMPRE a mesma definição — sem drift entre os dois contextos.
#
# Chamado por:
#   - pr-check.yml          (a cada pull request)
#   - benchmark-weekly.yml  (cron semanal — revalida contra banco efêmero)
# =============================================================================

name: Seed Guards (reusable)

on:
  workflow_call:

jobs:
  seed-guards:
    name: Seed Guards (prod + dev E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # ── Ephemeral PostGIS service container ───────────────────────────
    # Imagem via vars.POSTGIS_IMAGE com fallback alpine. Para usar o mirror
    # GHCR (pull mais rápido, sem rate limit): rode sync-postgis-mirror.yml
    # uma vez e defina vars.POSTGIS_IMAGE=ghcr.io/severinno/postgis:16-3.4-alpine
    services:
      postgres:
        image: ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine' }}
        env:
          POSTGRES_DB: severinno
          POSTGRES_USER: severinno
          POSTGRES_PASSWORD: severinno_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severinno -d severinno"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      # ── Cache do Prisma client (keyed no schema + versão do client) ──
      # Em cache hit, os E2Es rodam com SKIP_PRISMA_GENERATE=1 (o .sh pula
      # o generate, que é determinístico dado o schema) — economia ~6s/job.
      # A key inclui bun.lock porque o output gerado depende TAMBÉM da
      # versão do @prisma/client/engine (um bump sem mudança de schema
      # invalidaria o cache). restore-keys nunca dispara o skip: o cache-hit
      # só é 'true' com key exata, então um restore parcial roda o generate.
      - name: Cache Prisma client
        id: prisma-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}-${{ hashFiles('bun.lock') }}
          restore-keys: prisma-

      # ── PostGIS extension no service container ──────────────────────
      # A imagem postgis só habilita a extensão em postgres/template_postgis,
      # NÃO no POSTGRES_DB (criado de template1) — sem ela o prisma db push
      # falha nas colunas Unsupported("geography(Point, 4326)"). Não dá para
      # usar init-script montado aqui: o service container inicia ANTES do
      # checkout (workspace vazio) — por isso o docker exec explícito.
      - name: Enable PostGIS extension
        run: |
          docker exec ${{ job.services.postgres.id }} \
            psql -U severinno -d severinno -c "CREATE EXTENSION IF NOT EXISTS postgis"

      # ── PROD E2E primeiro ────────────────────────────────────────────
      # Banco limpo no início do job → o prod E2E asserta ZERO usuários.
      # O .sh com --skip-docker faz: prisma generate (se cache miss) +
      # db push (schema) + validator (85 checks).
      - name: Run seed-prod E2E
        id: prod
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
          SKIP_PRISMA_GENERATE: ${{ steps.prisma-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          bun run test:seed-prod-e2e --skip-docker
          echo "  ✅ Seed prod E2E passou (85 checks)"

      # ── DEV E2E depois ───────────────────────────────────────────────
      # O dev seed faz wipe+recreate — não conflita com os dados do prod
      # (que não criou usuários). Guard recusa em produção + 9 usuários demo.
      # SKIP_DB_PUSH=1: o prod E2E acima já sincronizou o schema no MESMO
      # container — o dev reutiliza (economia ~9s), sem risco de drift pois
      # ambos rodam do mesmo commit/schema.
      # if: gated no sucesso do prod — se o prod falhar ANTES de sincronizar
      # o schema, rodar o dev com SKIP_DB_PUSH=1 contra banco sem schema
      # falharia de forma confusa (mascarando o erro real). O summary segue
      # if: always(), então o report não é afetado.
      - name: Run seed-dev E2E
        id: dev
        if: steps.prod.conclusion == 'success'
        env:
          DATABASE_URL: postgresql://severinno:severinno_dev@localhost:5432/severinno
          SKIP_PRISMA_GENERATE: ${{ steps.prisma-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          SKIP_DB_PUSH: "1"
        run: |
          bun run test:seed-dev-e2e --skip-docker
          echo "  ✅ Seed dev E2E passou (111 checks)"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## 🛡️ Seed Guards — prod + dev E2E'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Prod E2E (85 checks) | ${{ steps.prod.conclusion == 'success' && '✅' || '❌' }} |"
            echo "| Dev E2E (111 checks) | ${{ steps.dev.conclusion == 'success' && '✅' || '❌' }} |"
            echo "| Imagem PostGIS | ${{ vars.POSTGIS_IMAGE || 'postgis/postgis:16-3.4-alpine (default)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
