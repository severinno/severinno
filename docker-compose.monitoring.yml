# =============================================================================
# docker-compose.monitoring.yml — Severinno Marketplace (Monitoring Stack)
# =============================================================================
# Serviços: Prometheus, Tempo, Grafana, Loki, Promtail
#
# Acesso:
#   Grafana:    http://localhost:3001 (admin/admin)
#   Prometheus: http://localhost:9090
#   Tempo:      http://localhost:3200
#   Loki:       http://localhost:3100
# =============================================================================

networks:
  monitoring:
    name: severinno_monitoring
    driver: bridge

volumes:
  prometheus_data:
    name: severinno_prometheus_data
  grafana_data:
    name: severinno_grafana_data
  tempo_data:
    name: severinno_tempo_data
  loki_data:
    name: severinno_loki_data

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  tempo:
    image: grafana/tempo:2.5.0
    restart: unless-stopped
    ports:
      - "3200:3200"
      - "4318:4318"
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/config.yml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/config.yml"]
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    ports:
      - "3101:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  promtail:
    image: grafana/promtail:3.2.0
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /home/severinno/.pm2/logs:/home/severinno/.pm2/logs:ro
      - /var/log/caddy:/var/log/caddy:ro
      - /tmp:/tmp
    command: ["-config.file=/etc/promtail/config.yml"]
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    # Preenchidas pelo scripts/setup-telegram-alerts.sh (via sed). A config
    # do Alertmanager usa esses valores no receiver "telegram".
    environment:
      ALERTMANAGER_TELEGRAM_BOT_TOKEN: ${ALERTMANAGER_TELEGRAM_BOT_TOKEN:-0000000000:XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX}
      ALERTMANAGER_TELEGRAM_CHAT_ID: ${ALERTMANAGER_TELEGRAM_CHAT_ID:-123456789}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
