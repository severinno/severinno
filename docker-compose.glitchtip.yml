# =============================================================================
# docker-compose.glitchtip.yml — GlitchTip (Sentry-compatible, self-hosted)
#
# Uses host networking to connect to existing PostGIS + Redis.
# Start:  docker compose -f docker-compose.glitchtip.yml up -d
# UI:     http://localhost:8001
# =============================================================================

services:
  error-tracking:
    image: glitchtip/glitchtip:v5.2
    container_name: severinno-glitchtip
    restart: unless-stopped
    command: gunicorn glitchtip.wsgi:application --bind 0.0.0.0:8001 --workers 2 --timeout 60
    network_mode: host
    environment:
      DATABASE_URL: postgres://severinno:severinno@localhost:5433/severinno?options=-c%20search_path%3Dglitchtip%2Cpublic
      REDIS_URL: redis://localhost:6379/2
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?Set GLITCHTIP_SECRET_KEY in .env}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8001}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@severinno.com.br}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      S3_ENABLED: "false"
      DATABASE_POOL_MAX_SIZE: ${GLITCHTIP_DB_POOL:-5}
      VTASKS_CONCURRENCY: ${GLITCHTIP_CONCURRENCY:-2}
