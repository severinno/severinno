# =============================================================================
# docker-compose.glitchtip.yml — GlitchTip (Sentry-compatible Error Tracking)
# =============================================================================
# Stack leve de alta eficiência:
#   - 1 único container rodando app.py (uvicorn + celery worker + beat + partitions)
#   - Conecta ao PostgreSQL e Redis existentes na rede severinno_backend
#   - Banco dedicado 'glitchtip' no PostgreSQL existente
#   - Redis DB 3 no Redis existente
#   - Projeto isolado (-p glitchtip) imune a --remove-orphans do app
# =============================================================================

services:
  glitchtip:
    image: glitchtip/glitchtip:v5.2
    container_name: severinno-glitchtip
    restart: unless-stopped
    command: ["python", "app.py"]
    networks:
      - backend
    ports:
      - "127.0.0.1:8001:8000"
    secrets:
      - glitchtip_db_password
      - glitchtip_secret_key
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD}@postgres:5432/glitchtip
      REDIS_URL: redis://redis:6379/3
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: "8000"
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-https://glitchtip.severinno.com}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@severinno.com}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-}
      S3_ENABLED: "false"
      ENABLE_USER_REGISTRATION: "false"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/_health/').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  backend:
    name: severinno_backend
    external: true

secrets:
  glitchtip_db_password:
    file: ./secrets/glitchtip_db_password.secret
  glitchtip_secret_key:
    file: ./secrets/glitchtip_secret_key.secret
