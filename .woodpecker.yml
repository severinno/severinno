# =============================================================================
# .woodpecker.yml — Pipeline CI/CD para Severinno Marketplace
# =============================================================================
# Woodpecker CI - alternativa open source ao GitHub Actions
#
# Este arquivo define os pipelines de CI/CD que rodam no Woodpecker CI.
#
# ⚠️ STATUS: AVALIADO E ARQUIVADO (não é o caminho escolhido).
# A forja/CI adotada é o Gitea/Forgejo Actions (.gitea/workflows/), porque
# reaproveita a sintaxe dos workflows existentes; o Woodpecker exigiria
# reescrever todos eles. Este arquivo fica como registro da alternativa
# avaliada — dois pontos do rascunho original NÃO rodam como escritos:
#   1. `plugins/docker` está DESCONTINUADO (use
#      woodpeckerci/plugin-docker-buildx);
#   2. `appleboy/ssh-action` é um GitHub Action, não um plugin Woodpecker
#      (plugins do Woodpecker são imagens Docker lidas via `settings:`) — o
#      equivalente é `appleboy/drone-ssh`.
# O registry abaixo vem de secret (`image_registry`), não hardcoded.
#
# Os usos da versão do Bun neste arquivo são ESPELHOS, como os dos composes: a
# tag `oven/bun:<v>` de cada passo e os `BUN_VERSION=<v>` de `build_args` têm de
# dizer o valor DECLARADO em `.actrc`/`deploy/env.gitea.example`. Quem cobra isso
# é a invariante 19 do `check-bun-mirror` (comparação por valor) e quem os
# reescreve é a seção 2e do `bump-bun.sh` — o par escritor+comparação é o que faz
# de um literal uma derivação, e não um segundo ponto de verdade.
#
# Foram treze usos que envelheceram SETE versões atrás do repositório enquanto
# este arquivo esteve fora da varredura (a isenção que ficava escrita aqui). Um
# pipeline de terceiro é CONSUMIDOR da versão, não uma reserva dela: se o
# Woodpecker voltar a ser o caminho, o pipeline entra como está (a versão já
# acompanha o repositório) e os dois pontos do rascunho acima seguem pendentes.
# =============================================================================
#
# ── AS CONDIÇÕES DE CADA PASSO (quem roda QUANDO) ──────────────────────────
#
# Todo passo abaixo DECLARA a sua condição em `when:` — uma LISTA de cláusulas,
# a semântica do Woodpecker (qualquer entrada que case dispara o passo). A
# condição tem de ser a que a FORJA (Gitea/Forgejo, dona do merge) aplica ao
# trabalho daquele passo: um retrato que diz "roda no PR" onde a forja roda só
# no push mente sobre a pipeline, e é pior que não existir.
#
# Quem PROVA isso é o `check:archived-pipeline`
# (`scripts/check-archived-pipeline.mjs`), rodando nas duas pipelines: ele
# deriva os gatilhos (`on:`) e os `if:` dos jobs de `.gitea/workflows/`, casa
# cada passo com o job que faz o mesmo trabalho e exige IGUALDADE de condição.
#
# A tradução, uma vez (retrato → forja):
#   push → push · pull_request → pull_request · cron → schedule · manual → workflow_dispatch
# `branch:` aqui é o `branches:` de lá (e o branch ALVO num `pull_request`); os
# dois eventos que a forja não filtra por branch (cron/manual) são declarados
# sem `branch:`.
#
# A CONTRAPARTE de cada passo é DESCOBERTA pelo comando que ele roda (o guard
# canonicaliza `bun run check:x` para o script que a entrada executa). Quando o
# comando não basta — dois jobs da forja rodam o mesmo script, ou o passo é
# plugin (`settings:`) e não roda comando de repositório —, o passo DECLARA:
#   # espelha: .gitea/workflows/<arquivo>.yml#<job>
# e, quando não há contraparte nenhuma (o passo de notificação fala de STATUS,
# não de evento), declara a ausência COM O MOTIVO:
#   # fora da forja: <motivo>
# =============================================================================

# ── Pipeline de CI (a condição do `on:` do ci.yml, declarada passo a passo) ──
pipeline:
  lint:
    image: oven/bun:1.3.14
    commands:
      - bun install --frozen-lockfile
      - bun run lint
    # O `on:` do ci.yml, cláusula por cláusula.
    when:
      - event: push
        branch: [main, develop]
      - event: pull_request
        branch: main

  # Barreira explícita contra vazamento de campo sensível em payload de
  # usuário (allowlist de PII) + fonte única do client Prisma. Step próprio:
  # a falha precisa apontar para o vazamento, não se diluir no `test:run`.
  pii-allowlist:
    image: oven/bun:1.3.14
    commands:
      - bun install --frozen-lockfile
      - bun run db:generate
      - bun run check:pii-allowlist
      # Prova que o guard detecta regressão (sandbox isolado em .tmp/).
      - bun run check:pii-gate
    when:
      - event: push
        branch: [main, develop]
      - event: pull_request
        branch: main

  # O manifesto dos required checks precisa apontar para jobs reais e
  # incondicionais — um required check inexistente faz o PR esperar para sempre.
  required-checks:
    image: oven/bun:1.3.14
    commands:
      - bun run check:required-checks
    when:
      - event: push
        branch: [main, develop]
      - event: pull_request
        branch: main

  # Fonte unica do registry OCI (imagens da app + mirrors). Step proprio: a
  # falha precisa apontar o arquivo/linha que reacoplou o projeto ao GHCR.
  registry-source:
    image: oven/bun:1.3.14
    commands:
      - bun run check:registry-source
    # A contraparte é DECLARADA porque o comando casa com dois jobs da forja
    # (`ci.yml#guards` no PR/push e `smoke.yml#smoke`, que é só disparo manual):
    # a métrica de sobreposição empata e o guard exige o desempate por escrito.
    # espelha: .gitea/workflows/ci.yml#guards
    when:
      - event: push
        branch: [main, develop]
      - event: pull_request
        branch: main

  # Nenhuma referencia pendurada entre workflow -> script/package.json.
  workflow-refs:
    image: oven/bun:1.3.14
    commands:
      - bun run check:workflow-refs:internal
    when:
      - event: push
        branch: [main, develop]
      - event: pull_request
        branch: main

  # Escopo dos guards: nenhum script pode cravar um diretorio de forja.
  forge-workflow-scope:
    image: oven/bun:1.3.14
    commands:
      - bun run check:forge-workflow-scope
    when:
      - event: push
        branch: [main, develop]
      - event: pull_request
        branch: main

  # Paridade de gates entre a forja (dona do merge) e o espelho do GitHub.
  forge-parity:
    image: oven/bun:1.3.14
    commands:
      - bun run check:forge-parity
    when:
      - event: push
        branch: [main, develop]
      - event: pull_request
        branch: main

  typecheck:
    image: oven/bun:1.3.14
    commands:
      - bun install --frozen-lockfile
      - bun run db:generate
      - bunx tsc --noEmit
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
    when:
      - event: push
        branch: [main, develop]
      - event: pull_request
        branch: main

  test:
    image: oven/bun:1.3.14
    commands:
      - bun install --frozen-lockfile
      - bun run db:generate
      - bun run test:run
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/severinno_test
      REDIS_URL: redis://redis-test:6379
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
    services:
      - name: postgres-test
        image: postgis/postgis:16-3.4-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: severinno_test
      - name: redis-test
        image: redis:7-alpine
    when:
      - event: push
        branch: [main, develop]
      - event: pull_request
        branch: main

  build:
    image: oven/bun:1.3.14
    commands:
      - bun install --frozen-lockfile
      - bun run db:generate
      - bun run build
    environment:
      SKIP_TYPESCRIPT_CHECK: "true"
      BUILD_STANDALONE: "true"
    when:
      - event: push
        branch: [main, develop]
      - event: pull_request
        branch: main

# ── Pipeline de drift dos required checks (cron) ──────────────────────────
# NÃO roda em PR/push: é vigilância periódica do branch protection da forja.
# Os gates rodam em cada PR, mas quem BLOQUEIA o merge é a lista de required
# status checks — estado da forja, fora do review. Um rename de `name:` de job
# muda o contexto de status e o PR passa a esperar para sempre por um check que
# nunca roda; nenhum teste de PR enxerga isso.
#
# Agende no Woodpecker um cron (Repo Settings → Cron) — sem cron criado, este
# pipeline nunca dispara. Secrets: gitea_token + gitea_url.
drift:
  required-checks-drift:
    image: oven/bun:1.3.14
    commands:
      - bun scripts/apply-required-checks.mjs --check --forge gitea
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
      GITEA_URL:
        from_secret: gitea_url
    # O `on:` do required-checks-drift.yml: `schedule` E `workflow_dispatch` —
    # a vigilância periódica da forja também pode ser disparada à mão, e era
    # essa a metade que o retrato não dizia.
    when:
      - event: cron
      - event: manual

# ── Pipeline de Deploy (apenas main) ──────────────────────────────────────
deploy:
  # espelha: .gitea/workflows/deploy.yml#build
  docker-build:
    image: plugins/docker
    settings:
      # `repo` é o NOME da imagem SEM o host — o host vai em `registry:`.
      # O rascunho original repetia o host aqui (produziria
      # ghcr.io/ghcr.io/severinno/severinno).
      repo: severinno/severinno
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:7}
      # FONTE ÚNICA do registry: secret `image_registry`
      # (ex.: ghcr.io ou git.severinno.cloud).
      registry:
        from_secret: image_registry
      username:
        from_secret: image_registry_user
      password:
        from_secret: image_registry_token
      dockerfile: Dockerfile
      build_args:
        - BUN_VERSION=1.3.14
    # O `on:` do deploy.yml (`push` a main) mais o disparo manual que ele
    # também aceita — o `if:` dos jobs `migrate`/`deploy` não acrescenta
    # restrição nenhuma a isso.
    when:
      - event: push
        branch: main
      - event: manual

  # espelha: .gitea/workflows/deploy.yml#build
  docker-build-worker:
    image: plugins/docker
    settings:
      repo: severinno/severinno
      tags:
        - worker-latest
        - worker-${CI_COMMIT_SHA:0:7}
      registry:
        from_secret: image_registry
      username:
        from_secret: image_registry_user
      password:
        from_secret: image_registry_token
      dockerfile: Dockerfile.worker
      build_args:
        - BUN_VERSION=1.3.14
    # O `on:` do deploy.yml (`push` a main) mais o disparo manual que ele
    # também aceita — o `if:` dos jobs `migrate`/`deploy` não acrescenta
    # restrição nenhuma a isso.
    when:
      - event: push
        branch: main
      - event: manual

  # espelha: .gitea/workflows/deploy.yml#deploy
  deploy-vps:
    image: appleboy/ssh-action
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_key
      script:
        - cd /home/deploy/severinno
        - docker compose pull app realtime email-worker notification-worker
        - docker compose up -d --no-deps --remove-orphans app realtime
        - docker compose --profile workers up -d --no-deps email-worker notification-worker
        - docker image prune -f
    # O `on:` do deploy.yml (`push` a main) mais o disparo manual que ele
    # também aceita — o `if:` dos jobs `migrate`/`deploy` não acrescenta
    # restrição nenhuma a isso.
    when:
      - event: push
        branch: main
      - event: manual

# ── Notificações ──────────────────────────────────────────────────────────
notify:
  # fora da forja: nenhum workflow de .gitea/workflows/ publica notificação de status em passo de pipeline — a forja avisa por ISSUE (os publicadores de dívida).
  # O `when: status:` deste passo é do Woodpecker, e a ausência de contraparte
  # fica DITA aqui para ele não sumir do veredito por não ter com quem casar.
  telegram:
    image: plugins/telegram
    settings:
      token:
        from_secret: telegram_token
      chat:
        from_secret: telegram_chat_id
    when:
      status: [failure, success]
