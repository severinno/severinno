# =============================================================================
# .woodpecker.yml — Pipeline CI/CD para Severinno Marketplace
# =============================================================================
# Woodpecker CI - alternativa open source ao GitHub Actions
#
# Este arquivo define os pipelines de CI/CD que rodam no Woodpecker CI.
#
# ⚠️ STATUS: AVALIADO E ARQUIVADO (não é o caminho escolhido).
# A forja/CI adotada é o Gitea/Forgejo Actions (.gitea/workflows/), porque
# reaproveita a sintaxe dos workflows existentes; o Woodpecker exigiria
# reescrever todos eles. Este arquivo fica como registro da alternativa
# avaliada — dois pontos do rascunho original NÃO rodam como escritos:
#   1. `plugins/docker` está DESCONTINUADO (use
#      woodpeckerci/plugin-docker-buildx);
#   2. `appleboy/ssh-action` é um GitHub Action, não um plugin Woodpecker
#      (plugins do Woodpecker são imagens Docker lidas via `settings:`) — o
#      equivalente é `appleboy/drone-ssh`.
# O registry abaixo vem de secret (`image_registry`), não hardcoded.
#
# As imagens `oven/bun:<versão>` deste rascunho NÃO são um pin: são o valor do
# dia em que ele foi escrito (09/2026), copiado do default do `ARG BUN_VERSION`
# do Dockerfile — o mesmo valor que se espalhou por staging/hostinger/package.json
# e que a auditoria de 09/2026 removeu (invariante 18 do check-bun-mirror). Se o
# Woodpecker voltar a ser o caminho, a versão tem de ser DERIVADA da fonte única,
# como no `.gitea/workflows/` (o arquivo segue fora da varredura do guard porque
# está arquivado — não copie os literais daqui).
# =============================================================================

# ── Pipeline de CI (pull requests e push) ──────────────────────────────────
pipeline:
  lint:
    image: oven/bun:1.4.0
    commands:
      - bun install --frozen-lockfile
      - bun run lint

  # Barreira explícita contra vazamento de campo sensível em payload de
  # usuário (allowlist de PII) + fonte única do client Prisma. Step próprio:
  # a falha precisa apontar para o vazamento, não se diluir no `test:run`.
  pii-allowlist:
    image: oven/bun:1.4.0
    commands:
      - bun install --frozen-lockfile
      - bun run db:generate
      - bun run check:pii-allowlist
      # Prova que o guard detecta regressão (sandbox isolado em .tmp/).
      - bun run check:pii-gate

  # O manifesto dos required checks precisa apontar para jobs reais e
  # incondicionais — um required check inexistente faz o PR esperar para sempre.
  required-checks:
    image: oven/bun:1.4.0
    commands:
      - bun run check:required-checks

  # Fonte unica do registry OCI (imagens da app + mirrors). Step proprio: a
  # falha precisa apontar o arquivo/linha que reacoplou o projeto ao GHCR.
  registry-source:
    image: oven/bun:1.4.0
    commands:
      - bun run check:registry-source

  # Nenhuma referencia pendurada entre workflow -> script/package.json.
  workflow-refs:
    image: oven/bun:1.4.0
    commands:
      - bun run check:workflow-refs:internal

  # Escopo dos guards: nenhum script pode cravar um diretorio de forja.
  forge-workflow-scope:
    image: oven/bun:1.4.0
    commands:
      - bun run check:forge-workflow-scope

  # Paridade de gates entre a forja (dona do merge) e o espelho do GitHub.
  forge-parity:
    image: oven/bun:1.4.0
    commands:
      - bun run check:forge-parity

  typecheck:
    image: oven/bun:1.4.0
    commands:
      - bun install --frozen-lockfile
      - bun run db:generate
      - bunx tsc --noEmit
    environment:
      NODE_OPTIONS: --max-old-space-size=4096

  test:
    image: oven/bun:1.4.0
    commands:
      - bun install --frozen-lockfile
      - bun run db:generate
      - bun run test:run
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/severinno_test
      REDIS_URL: redis://redis-test:6379
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
    services:
      - name: postgres-test
        image: postgis/postgis:16-3.4-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: severinno_test
      - name: redis-test
        image: redis:7-alpine

  build:
    image: oven/bun:1.4.0
    commands:
      - bun install --frozen-lockfile
      - bun run db:generate
      - bun run build
    environment:
      SKIP_TYPESCRIPT_CHECK: "true"
      BUILD_STANDALONE: "true"

# ── Pipeline de drift dos required checks (cron) ──────────────────────────
# NÃO roda em PR/push: é vigilância periódica do branch protection da forja.
# Os gates rodam em cada PR, mas quem BLOQUEIA o merge é a lista de required
# status checks — estado da forja, fora do review. Um rename de `name:` de job
# muda o contexto de status e o PR passa a esperar para sempre por um check que
# nunca roda; nenhum teste de PR enxerga isso.
#
# Agende no Woodpecker um cron (Repo Settings → Cron) — sem cron criado, este
# pipeline nunca dispara. Secrets: gitea_token + gitea_url.
drift:
  required-checks-drift:
    image: oven/bun:1.4.0
    commands:
      - bun scripts/apply-required-checks.mjs --check --forge gitea
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
      GITEA_URL:
        from_secret: gitea_url
    when:
      - event: cron

# ── Pipeline de Deploy (apenas main) ──────────────────────────────────────
deploy:
  docker-build:
    image: plugins/docker
    settings:
      # `repo` é o NOME da imagem SEM o host — o host vai em `registry:`.
      # O rascunho original repetia o host aqui (produziria
      # ghcr.io/ghcr.io/severinno/severinno).
      repo: severinno/severinno
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:7}
      # FONTE ÚNICA do registry: secret `image_registry`
      # (ex.: ghcr.io ou git.severinno.cloud).
      registry:
        from_secret: image_registry
      username:
        from_secret: image_registry_user
      password:
        from_secret: image_registry_token
      dockerfile: Dockerfile
      build_args:
        - BUN_VERSION=1.4.0
    when:
      branch: main
      event: push

  docker-build-worker:
    image: plugins/docker
    settings:
      repo: severinno/severinno
      tags:
        - worker-latest
        - worker-${CI_COMMIT_SHA:0:7}
      registry:
        from_secret: image_registry
      username:
        from_secret: image_registry_user
      password:
        from_secret: image_registry_token
      dockerfile: Dockerfile.worker
      build_args:
        - BUN_VERSION=1.4.0
    when:
      branch: main
      event: push

  deploy-vps:
    image: appleboy/ssh-action
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_key
      script:
        - cd /home/deploy/severinno
        - docker compose pull app realtime email-worker notification-worker
        - docker compose up -d --no-deps --remove-orphans app realtime
        - docker compose --profile workers up -d --no-deps email-worker notification-worker
        - docker image prune -f
    when:
      branch: main
      event: push

# ── Notificações ──────────────────────────────────────────────────────────
notify:
  telegram:
    image: plugins/telegram
    settings:
      token:
        from_secret: telegram_token
      chat:
        from_secret: telegram_chat_id
    when:
      status: [failure, success]
