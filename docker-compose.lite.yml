# ============================================================================
# Severinno Marketplace SaaS — Development Lite Docker Compose
# ============================================================================
# Modo leve: sobe apenas o núcleo essencial (PostGIS + Redis + RabbitMQ)
# Economiza memória RAM mantendo compatibilidade total com o desenvolvimento local.
# ============================================================================

services:
  # ── PostgreSQL + PostGIS ───────────────────────────────────────────────
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: severinno
      POSTGRES_USER: severinno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-severinno}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./scripts/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U severinno -d severinno"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Valkey (100% FOSS, in-memory cache & rate-limit) ───────────────────
  redis:
    image: valkey/valkey:7.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data_dev:/data
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── RabbitMQ ───────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: severinno
      RABBITMQ_DEFAULT_PASS: severinno
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  pgdata_dev:
  redis_data_dev:
  rabbitmq_data_dev:
