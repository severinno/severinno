# =============================================================================
# docker-compose.prod.yml — Severinno Marketplace (Producao)
# =============================================================================
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   docker compose -f docker-compose.prod.yml --env-file .env.production logs -f
#   docker compose -f docker-compose.prod.yml --env-file .env.production down
#
# Variaveis de ambiente obrigatorias (.env.production):
#   SESSION_SECRET       — minimo 32 caracteres
#   POSTGRES_PASSWORD    — senha do banco de dados
#   S3_ACCESS_KEY        — acesso ao MinIO/S3
#   S3_SECRET_KEY        — segredo do MinIO/S3
#   REALTIME_EMIT_API_KEY — chave do bridge /emit do realtime (fail-closed).
#     Nos canais de produção NÃO vem por env: entra como DOCKER SECRET
#     secrets/realtime_emit_api_key (declarado na base), lido via
#     REALTIME_EMIT_API_KEY_FILE=/run/secrets/realtime_emit_api_key.
#
# ── Origem das imagens (FONTE UNICA) ─────────────────────────────────────
#   IMAGE_REGISTRY   — host do registry OCI (default: git.severinno.com)
#   IMAGE_NAMESPACE  — namespace/owner das imagens (default: severinno)
#
# As imagens da aplicacao NUNCA sao referenciadas com um host literal: trocar
# registry = mudar UMA variavel aqui (e a repo variable IMAGE_REGISTRY nos
# workflows, que e o mesmo valor para o lado de CI). Sem as variaveis o
# default aponta para o registry proprio (git.severinno.com/severinno).
#
# Para o registry OCI embutido do Gitea/Forgejo (sem custo de GHCR):
#   IMAGE_REGISTRY=git.severinno.com
#   IMAGE_NAMESPACE=severinno
#   docker compose ... login git.severinno.com   (uma vez, na VPS)
#
# Guard: `bun run check:registry-source` falha se um host de registry voltar
# a ser hardcoded em compose/workflow/script.
#
# Deploy (sem rebuild, pull das imagens mais recentes):
#   docker compose -f docker-compose.prod.yml --env-file .env.production pull
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# ── Modelo base + override ───────────────────────────────────────────────
# Os 10 serviços comuns ao deploy via GitHub Action (hostinger) vivem em
# deploy/docker-compose.base.yml — este arquivo é o PROD: base + Caddy
# completo, geo-cache-warm, search-index-worker e o stack GlitchTip em
# profile, além de ipam/subnets, limites de recursos e rotação de logs.
# Divergências de default de domínio (`.com.br`, vigente aqui) ficam
# explícitas no bloco environment deste arquivo.
# =============================================================================

include:
  # env_file aponta para um arquivo VAZIO de propósito: sem ele, o include
  # carregaria o .env do diretório da base por conta própria (var de dev
  # vazaria para o render de produção quando o --env-file não a define).
  # Com ele, a interpolação da base usa as MESMAS fontes do comando
  # (--env-file .env.production), preservando o contrato do monolítico.
  - path: docker-compose.base.yml
    env_file: [compose-include.env]

# ── Âncoras internas (só o que é EXCLUSIVO da produção) ──────────────────
# Rotação de logs json-file — padrão de todos os serviços de produção.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# ── Redes compartilhadas ──────────────────────────────────────────────────
# Separada em duas redes:
#   frontend — Caddy exposto para o mundo (portas 80/443)
#   backend  — herda da base (name/driver) e ganha ipam/subnet por chave
networks:
  frontend:
    name: severinno_frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend:
    name: severinno_backend
    external: true

# ── Volumes persistentes (exclusivos: Caddy + GlitchTip) ─────────────────
volumes:
  caddy_data:
    name: severinno_caddy_data
  caddy_config:
    name: severinno_caddy_config
  caddy_logs:
    name: severinno_caddy_logs
  glitchtip_db_data:
    name: severinno_glitchtip_db_data
  glitchtip_redis_data:
    name: severinno_glitchtip_redis_data
  glitchtip_minio_data:
    name: severinno_glitchtip_minio_data

# ── Docker Secrets (exclusivos: GlitchTip; os demais vêm da base) ────────
secrets:
  glitchtip_s3_secret_key:
    file: ./secrets/glitchtip_s3_secret_key.secret
  glitchtip_secret_key:
    file: ./secrets/glitchtip_secret_key.secret

# ============================================================================
# SERVIÇOS EXCLUSIVOS DA PRODUÇÃO
# (postgres, redis, rabbitmq, minio, minio-init, pgbouncer, realtime, app,
#  email-worker e notification-worker vêm de deploy/docker-compose.base.yml;
#  abaixo só o que a produção acrescenta ou refina por chave)
# ============================================================================

services:
  # ── Caddy (Reverse Proxy + SSL Automático) ────────────────────────────
  # HTTPS automático via Let's Encrypt / ZeroSSL.
  # Único serviço exposto para o mundo (portas 80 e 443 + admin 2019).
  #
  # ── Hardening de segurança ───────────────────────────────────────────
  #   security_opt: no-new-privileges  → Impede escalonamento de privilégios
  #   cap_drop: ALL                    → Remove todas as capacidades Linux
  #   cap_add: NET_BIND_SERVICE        → Permite apenas bind em portas <1024
  #   read_only: true                  → Filesystem somente leitura
  #   tmpfs: /tmp                      → /tmp em RAM para arquivos temporários
  #
  # ── Logs ─────────────────────────────────────────────────────────────
  #   bind mount: /var/log/caddy → fail2ban no host lê os logs
  #   named volume: caddy_logs   → fallback Docker-managed persistente
  caddy:
    # BUILD CUSTOM OBRIGATÓRIO (Dockerfile.caddy): o Caddyfile.prod usa
    # rate_limit (mholt/caddy-ratelimit) e format transform
    # (caddyserver/transform-encoder — CLF do fail2ban); nenhum existe na
    # imagem stock e o parse crasha no boot com ela. Versões pinadas no
    # Dockerfile.caddy (Caddy v2.11.4, ratelimit v0.1.0, transform 2026-04-23).
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: ${IMAGE_REGISTRY:-git.severinno.com}/${IMAGE_NAMESPACE:-severinno}/severinno:caddy-2.11.4-plugins
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy # Volume Docker (fallback persistente)
      - /var/log/caddy:/var/log/caddy # Bind mount (fail2ban no host)
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_healthy
      realtime:
        condition: service_healthy
    # start_period aumentado para 120s porque o Caddy depende de app + realtime
    # saudáveis, que por sua vez dependem de PostgreSQL, Redis, MinIO e RabbitMQ.
    # Com start_period baixo, o Caddy entra em ciclo de restart se o app demorar.
    healthcheck:
      start_period: 120s
      # Verifica se o Caddy está respondendo na porta 80 (HTTP).
      # Usa wget em vez de curl porque a imagem caddy:2-alpine NÃO
      # inclui curl (apenas BusyBox wget disponível).
      # O endpoint /health é servido pelo próprio Caddy (handle no
      # Caddyfile.prod), sem depender do Next.js ou outros serviços.
      test: ["CMD", "wget", "-s", "-q", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "64M"

  # ── Refinamentos de produção sobre a base ─────────────────────────────
  # deploy.resources (limites de CPU/RAM) e rotação de logs são EXCLUSIVOS
  # da produção — o deploy via action (hostinger) roda sem limites.
  postgres:
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "256M"

  redis:
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.1"
          memory: "64M"

  rabbitmq:
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.1"
          memory: "128M"

  minio:
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.1"
          memory: "128M"

  pgbouncer:
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
        reservations:
          cpus: "0.1"
          memory: "64M"

  realtime:
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "64M"

  app:
    # Divergências legítimas de default: produção usa o domínio vigente (.com.br).
    environment:
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://severinno.com.br}
      SMTP_FROM: ${SMTP_FROM:-noreply@severinno.com.br}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@severinno.com.br}
      # CSP: rollout começa em Report-Only (não bloqueia, só reporta para
      # /api/csp-report). Avanço de estágio e kill-switch: docs/RUNBOOK.md § CSP.
      # Defina CSP_REPORT_ONLY=0 no .env/shell do host quando pronto para enforce.
      CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-1}
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "256M"

  email-worker:
    environment:
      SMTP_FROM: ${SMTP_FROM:-noreply@severinno.com.br}
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "64M"

  notification-worker:
    environment:
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@severinno.com.br}
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "64M"

  # ── Geo Cache Warm (one-shot init) ───────────────────────────────────────
  # After the app is healthy, pre-fills the Redis cache with the most
  # frequent geo queries (top Brazilian cities, common CEPs, major city
  # coordinates) so the first users after deploy get cached responses
  # instead of the 5s Nominatim / ViaCEP latency.
  #
  # Uses the 23h cooldown in the cron endpoint itself — if this service
  # runs twice within 23h (e.g. after a restart), the second call is
  # skipped automatically via skip response from the cron endpoint.
  geo-cache-warm:
    image: curlimages/curl:8.12.1
    restart: "no"
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    # CRON_SECRET is shared from the app service's secret
    secrets:
      - cron_secret
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "[geo-cache-warm] App is healthy — triggering cache warming..."
        CRON_SECRET_VAL="$$(cat /run/secrets/cron_secret 2>/dev/null || echo \"\")"
        if [ -z "$$CRON_SECRET_VAL" ]; then
          echo "[geo-cache-warm] ⚠️  CRON_SECRET not found — skipping"
          exit 0
        fi
        RESPONSE=$$(curl -s -w "\n%{http_code}" \
          -H "Authorization: Bearer $$CRON_SECRET_VAL" \
          "http://app:3000/api/cron/geo-cache-warm")
        HTTP_CODE=$$(echo "$$RESPONSE" | tail -1)
        BODY=$$(echo "$$RESPONSE" | head -n -1)
        echo "[geo-cache-warm] HTTP $$HTTP_CODE"
        echo "[geo-cache-warm] Response: $$BODY"
        if [ "$$HTTP_CODE" = "200" ]; then
          echo "[geo-cache-warm] ✅ Geo cache warm completed or skipped (cooldown)"
          exit 0
        else
          echo "[geo-cache-warm] ❌ Failed (HTTP $$HTTP_CODE)"
          exit 1
        fi
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "32M"

  # ── Search Index Worker ───────────────────────────────────────────────
  # Hardening: tmpfs + capacidades mínimas.
  #
  # Healthcheck: este worker NÃO usa RabbitMQ (ele polla o banco de dados
  # diretamente e indexa no OpenSearch). O healthcheck verifica se o
  # worker consegue conectar no PostgreSQL via PgBouncer.
  search-index-worker:
    image: ${IMAGE_REGISTRY:-git.severinno.com}/${IMAGE_NAMESPACE:-severinno}/severinno:worker-latest
    entrypoint: ["./scripts/docker-entrypoint.sh"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    tmpfs:
      - /tmp:size=64M
    networks:
      - backend
    depends_on:
      pgbouncer:
        condition: service_healthy
    secrets:
      - postgres_password
    volumes:
      - ./scripts/docker-entrypoint.sh:/app/scripts/docker-entrypoint.sh:ro
    environment:
      NODE_ENV: production
      WORKER_TYPE: search-index
      DATABASE_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-severinno}
      DIRECT_URL: postgresql://${POSTGRES_USER:-severinno}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-severinno}
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      BATCH_SIZE: ${BATCH_SIZE:-50}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      # Verifica conectividade TCP com PgBouncer (porta 6432).
      # Usa node:net (disponivel no Bun) para tentar conexao TCP real.
      # Se PgBouncer estiver aceitando conexoes, o worker consegue
      # acessar o banco de dados para consultar a fila de reindex.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "require('net').connect(6432,'pgbouncer').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1)).setTimeout(5000,()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.1"
          memory: "128M"

  # ═══════════════════════════════════════════════════════════════════════
  # GLITCHTIP — Error Monitoring (profile: glitchtip)
  # ═══════════════════════════════════════════════════════════════════════
  # Self-hosted Sentry-compatible error tracking.
  # Iniciar com:
  #   docker compose --profile glitchtip --env-file .env.glitchtip up -d
  #
  # Depois de iniciar, configurar:
  #   ./scripts/glitchtip-setup.sh create-admin
  #   ./scripts/glitchtip-setup.sh create-project
  #
  # Variaveis (.env.glitchtip):
  #   cp .env.glitchtip.example .env.glitchtip
  # ═══════════════════════════════════════════════════════════════════════

  # ── GlitchTip: PostgreSQL ─────────────────────────────────────────────
  glitchtip-db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - glitchtip
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=128M
    expose:
      - "5432"
    secrets:
      - glitchtip_db_password
    environment:
      POSTGRES_USER: ${GLITCHTIP_DB_USER:-glitchtip}
      POSTGRES_PASSWORD_FILE: /run/secrets/glitchtip_db_password
      POSTGRES_DB: ${GLITCHTIP_DB_NAME:-glitchtip}
    volumes:
      - glitchtip_db_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${GLITCHTIP_DB_USER:-glitchtip} -d ${GLITCHTIP_DB_NAME:-glitchtip}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # ── GlitchTip: PgBouncer (Connection Pooler) ────────────────────────────
  # Pooling de conexões SESSION mode para Django + Celery do GlitchTip.
  # Reduz conexões ativas no PostgreSQL de ~20 para ~15.
  #
  # DIFERENÇA do pgbouncer principal:
  #   - pool_mode = session (Django precisa de sessão persistente)
  #   - default_pool_size = 15 (GlitchTip é menos intensivo que o app)
  #   - profiles: glitchtip (só ativo quando GlitchTip está em uso)
  pgbouncer-glitchtip:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    profiles:
      - glitchtip
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # read_only removido (mesmo motivo do pgbouncer da base)
    tmpfs:
      - /tmp:size=16M
    expose:
      - "6432"
    networks:
      - backend
    depends_on:
      glitchtip-db:
        condition: service_healthy
    volumes:
      - ./config/pgbouncer/pgbouncer-glitchtip.ini:/etc/pgbouncer/pgbouncer.ini:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
        reservations:
          cpus: "0.1"
          memory: "64M"

  # ── GlitchTip: Redis ──────────────────────────────────────────────────
  glitchtip-redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles:
      - glitchtip
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=32M
    expose:
      - "6379"
    volumes:
      - glitchtip_redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"

  # ── GlitchTip: MinIO (source maps & cold storage) ─────────────────────
  glitchtip-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    profiles:
      - glitchtip
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_CHROOT
    tmpfs:
      - /tmp:size=64M
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    secrets:
      - glitchtip_s3_secret_key
    environment:
      MINIO_ROOT_USER: ${GLITCHTIP_S3_ACCESS_KEY:-glitchtip_storage}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/glitchtip_s3_secret_key
    volumes:
      - glitchtip_minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"

  # ── GlitchTip: MinIO Bucket Init ──────────────────────────────────────
  glitchtip-minio-init:
    image: minio/mc:RELEASE.2024-12-18T13-15-44Z
    restart: "no"
    profiles:
      - glitchtip
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for GlitchTip MinIO..."
        GLITCHTIP_S3_SECRET_VAL="$(cat /run/secrets/glitchtip_s3_secret_key 2>/dev/null || echo \"${GLITCHTIP_S3_SECRET_KEY}\")"
        until /usr/bin/mc alias set glitchtip http://glitchtip-minio:9000 \
          "${GLITCHTIP_S3_ACCESS_KEY:-glitchtip_storage}" "${GLITCHTIP_S3_SECRET_VAL}"; do sleep 2; done
        echo "Creating bucket '${GLITCHTIP_S3_BUCKET:-glitchtip-storage}'..."
        /usr/bin/mc mb "glitchtip/${GLITCHTIP_S3_BUCKET:-glitchtip-storage}" --ignore-existing
        /usr/bin/mc anonymous set download "glitchtip/${GLITCHTIP_S3_BUCKET:-glitchtip-storage}"
        echo "Bucket ready."
    environment:
      GLITCHTIP_S3_ACCESS_KEY: ${GLITCHTIP_S3_ACCESS_KEY:-glitchtip_storage}
      GLITCHTIP_S3_BUCKET: ${GLITCHTIP_S3_BUCKET:-glitchtip-storage}
    networks:
      - backend
    depends_on:
      glitchtip-minio:
        condition: service_healthy
    secrets:
      - glitchtip_s3_secret_key

  # ── GlitchTip: Database Migration (one-shot) ──────────────────────────
  # ⚠️  LIMITAÇÃO: Esta imagem third-party (glitchtip/glitchtip:v5.2) NÃO usa
  #     o entrypoint customizado (scripts/docker-entrypoint.sh). Portanto,
  #     as senhas são passadas via interpolação do Docker Compose, não via
  #     Docker Secrets. Você PRECISA definir GLITCHTIP_DB_PASSWORD e
  #     GLITCHTIP_SECRET_KEY no .env.glitchtip.
  #
  #     Melhoria futura: fazer fork da imagem para adicionar suporte a _FILE
  #     ou usar Docker configs + env_file gerado dinamicamente.
  glitchtip-migrate:
    image: glitchtip/glitchtip:v5.2
    restart: "no"
    profiles:
      - glitchtip
    entrypoint: ["/entrypoint.sh"]
    command: ["./bin/run-migrate.sh"]
    depends_on:
      glitchtip-db:
        condition: service_healthy
    secrets:
      - glitchtip_db_password
      - glitchtip_secret_key
    volumes:
      - ./scripts/glitchtip-entrypoint.sh:/entrypoint.sh:ro
    environment:
      DATABASE_URL: postgres://${GLITCHTIP_DB_USER:-glitchtip}:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/${GLITCHTIP_DB_NAME:-glitchtip}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
    networks:
      - backend

  # ── GlitchTip: Web Server (Django) ────────────────────────────────────
  # Hardening mínimo — imagem third-party (Django), pode precisar de
  # acesso de escrita para staticfiles, cache, etc.
  #
  # ⚠️  LIMITAÇÃO DE SECRETS: Esta imagem third-party NÃO usa o entrypoint
  #     customizado. As senhas (GLITCHTIP_DB_PASSWORD, GLITCHTIP_SECRET_KEY,
  #     GLITCHTIP_S3_SECRET_KEY) são interpolação do Docker Compose.
  #     Configure-as no .env.glitchtip.
  #
  # Conexão ao banco VIA PgBouncer (pooler) para reduzir conexões ao PG.
  # Se o pooler estiver inacessível, o GlitchTip falha graciosamente.
  glitchtip-web:
    image: glitchtip/glitchtip:v5.2
    restart: unless-stopped
    profiles:
      - glitchtip
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/entrypoint.sh"]
    command: ["./bin/run-web.sh"]
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
      glitchtip-minio-init:
        condition: service_completed_successfully
      glitchtip-migrate:
        condition: service_completed_successfully
      pgbouncer-glitchtip:
        condition: service_healthy
    secrets:
      - glitchtip_db_password
      - glitchtip_secret_key
      - glitchtip_s3_secret_key
    volumes:
      - ./scripts/glitchtip-entrypoint.sh:/entrypoint.sh:ro
    environment:
      # Database URL without password — entrypoint reads from Docker secret
      DATABASE_URL: postgres://${GLITCHTIP_DB_USER:-glitchtip}@pgbouncer-glitchtip:6432/${GLITCHTIP_DB_NAME:-glitchtip}
      REDIS_URL: redis://glitchtip-redis:6379
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: "8000"
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-https://glitchtip.severinno.com}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@severinno.com}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-}
      CELERY_DEFAULT_QUEUE: glitchtip
      S3_ENABLED: "true"
      S3_ENDPOINT_URL: http://glitchtip-minio:9000
      S3_ACCESS_KEY_ID: ${GLITCHTIP_S3_ACCESS_KEY:-glitchtip_storage}
      S3_BUCKET_NAME: ${GLITCHTIP_S3_BUCKET:-glitchtip-storage}
      S3_REGION: auto
      DATABASE_POOL_MAX_SIZE: ${GLITCHTIP_DB_POOL:-10}
      VTASKS_CONCURRENCY: ${GLITCHTIP_CONCURRENCY:-4}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/_health/').read()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"

  # ── GlitchTip: Background Worker (Celery) ─────────────────────────────
  # Hardening mínimo — imagem third-party (Celery), pode precisar de
  # acesso a disco para resultados de tarefas.
  #
  # Conexão ao banco VIA PgBouncer (pooler).
  glitchtip-worker:
    image: glitchtip/glitchtip:v5.2
    restart: unless-stopped
    profiles:
      - glitchtip
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/entrypoint.sh"]
    command: ["./bin/run-celery-with-beat.sh"]
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
      glitchtip-minio-init:
        condition: service_completed_successfully
      glitchtip-migrate:
        condition: service_completed_successfully
      pgbouncer-glitchtip:
        condition: service_healthy
    secrets:
      - glitchtip_db_password
      - glitchtip_secret_key
      - glitchtip_s3_secret_key
    volumes:
      - ./scripts/glitchtip-entrypoint.sh:/entrypoint.sh:ro
    environment:
      # Database URL without password — entrypoint reads from Docker secret
      DATABASE_URL: postgres://${GLITCHTIP_DB_USER:-glitchtip}@pgbouncer-glitchtip:6432/${GLITCHTIP_DB_NAME:-glitchtip}
      REDIS_URL: redis://glitchtip-redis:6379
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-https://glitchtip.severinno.com}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@severinno.com}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-}
      CELERY_DEFAULT_QUEUE: glitchtip
      S3_ENABLED: "true"
      S3_ENDPOINT_URL: http://glitchtip-minio:9000
      S3_ACCESS_KEY_ID: ${GLITCHTIP_S3_ACCESS_KEY:-glitchtip_storage}
      S3_BUCKET_NAME: ${GLITCHTIP_S3_BUCKET:-glitchtip-storage}
      S3_REGION: auto
      DATABASE_POOL_MAX_SIZE: ${GLITCHTIP_DB_POOL:-10}
      VTASKS_CONCURRENCY: ${GLITCHTIP_CONCURRENCY:-4}
    networks:
      - backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"
