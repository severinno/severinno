# =============================================================================
# docker-compose.gitea.yml — Gitea + Caddy (HTTPS) + Act Runner
# =============================================================================
# CI/CD 100% open source com HTTPS automatico.
#
# Uso:
#   docker compose -f deploy/docker-compose.gitea.yml --env-file deploy/.env.gitea up -d
#
# Pre-requisitos:
#   1. DNS git.severinno.cloud apontando para o IP do VPS
#   2. Arquivo deploy/.env.gitea configurado
#   3. Portas 80 e 443 abertas no firewall
#
# Acesso:
#   Web UI: https://git.severinno.cloud
#   SSH:    ssh -p 2222 git@git.severinno.cloud
# =============================================================================

services:
  # ── Caddy (Reverse Proxy + SSL Automatico) ──────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    networks:
      - gitea-net
    depends_on:
      gitea:
        condition: service_healthy
    healthcheck:
      start_period: 60s
      test: ["CMD", "wget", "-s", "-q", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Gitea (Self-Hosted Git) ────────────────────────────────────────────
  gitea:
    image: gitea/gitea:1.22
    container_name: gitea
    restart: unless-stopped
    environment:
      # ── Database ──────────────────────────────────────────────────────
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db

      # ── Server ────────────────────────────────────────────────────────
      - GITEA__server__DOMAIN=git.severinno.cloud
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=https://git.severinno.cloud/
      - GITEA__server__DISABLE_SSH=true
      - GITEA__server__START_SSH_SERVER=false

      # ── Actions (CI/CD) ──────────────────────────────────────────────
      - GITEA__actions__ENABLED=true
      - GITEA__actions__DEFAULT_ACTIONS_URL=https://github.com

      # ── Registry OCI embutido (etapa 1 do corte do GitHub) ─────────────
      # O registry do PRÓPRIO Gitea é o substituto do GHCR declarado em
      # `docs/GITHUB_CUT.md` (etapa 1): é dele que o runner puxa a imagem que
      # roda os jobs depois do flip de `IMAGE_REGISTRY`/`IMAGE_NAMESPACE`, e o
      # ensaio `gitea-registry:prove` publica e puxa de volta por DIGEST aqui.
      #
      # DECLARADO, e não default da série: o default da 1.22 muda entre versões
      # menores, e a etapa 1 depende dele — uma stack que subisse sem esta linha
      # serviria a forja sem registry, com o sintoma só no PULL do runner. O
      # valor é o do template (`deploy/env.gitea.example`), e o default daqui é
      # IGUAL a ele: é a mesma régua dos defaults de `IMAGE_REGISTRY`
      # (`checkComposeImageDefaults`, no `check:registry-source`) — onde a
      # variável não existe, o default vale e ele tem de ser o valor declarado.
      - GITEA__registry__ENABLED=${GITEA__registry__ENABLED:-true}

      # ── Security ──────────────────────────────────────────────────────
      - GITEA__security__INSTALL_LOCK=true

      # ── Mailer (desabilitado) ─────────────────────────────────────────
      - GITEA__mailer__ENABLED=false

      # ── Logs ──────────────────────────────────────────────────────────
      - GITEA__log__MODE=console
      - GITEA__log__LEVEL=info
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "3000"
    networks:
      - gitea-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Gitea Act Runner (CI/CD) ────────────────────────────────────────────
  runner:
    image: gitea/act_runner:latest
    container_name: gitea-runner
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${RUNNER_TOKEN}
      - GITEA_RUNNER_NAME=vps-runner
      # ── Labels = IMAGEM que roda os jobs ───────────────────────────────
      # Apontam para a imagem que EMBARCA o Bun na versão da variable. E isso
      # que faz o fast path (tier-1, 0s) do setup-bun disparar nesta forja —
      # com a `node:20-bullseye` anterior o tier-1 NUNCA engajava e todo job
      # pagava o download do tier 3 (~1-3s pelo mirror, ~5-10s pelo release).
      #
      # FONTE UNICA da imagem: IMAGE_REGISTRY/IMAGE_NAMESPACE (as mesmas do
      # resto do repo) + BUN_VERSION. O BUN_VERSION daqui precisa ser IGUAL a
      # repository variable BUN_VERSION do repositorio — o guard semanal
      # (check-actrc-sync.mjs) compara os dois espelhos e o smoke da forja
      # (Proof 3) prova a igualdade em runtime.
      #
      # A TAG NAO PODE SER LITERAL: `check:registry-source` (invariante 6)
      # falha se este diretorio voltar a fixar uma versao
      # (`ubuntu-bun:1.3.14`) — a troca da variavel nao invalidaria a imagem e
      # o runner rodaria outra versao, com o tier-1 desligado em silencio.
      #
      # ⚠️ PREREQUISITO: a imagem precisa EXISTIR no registry ANTES de subir o
      # runner. NAO confie em subir a mao: quem garante isso e o comando
      # `bash deploy/gitea-up.sh` (ou `bun run runner-image:ensure`), que le
      # ESTE env, confere a tag no registry (publica se faltar — via
      # sync-ubuntu-bun-mirror.yml ou build+push local) e so entao sobe o
      # runner. Nao ha fallback: sem a imagem, os jobs nem iniciam — a
      # `node:20-bullseye` do Docker Hub e que era "sempre existe, sempre
      # lenta"; a troca e velocidade por dependencia.
      #
      # ⚠️ LABELS SAO DE REGISTRO: o act_runner os envia ao registrar e depois
      # usa os que ficaram gravados em /data/.runner — um `restart` NAO aplica a
      # troca de imagem. Mudar aqui exige RE-REGISTRAR, e o re-registro tambem
      # passa pela garantia da imagem (trocar a versao e justamente quando a tag
      # pode faltar):
      #   bash deploy/gitea-up.sh --re-register   (ver deploy/GITEA.md § Runner)
      # Ele garante a imagem, apaga o container E o registro gravado, e so
      # entao sobe — sem apagar o volume o runner voltaria com os labels ANTIGOS
      # e o tier-1 seguiria desligado, sem nenhum sintoma.
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://${IMAGE_REGISTRY:-git.severinno.cloud}/${IMAGE_NAMESPACE:-severinno}/ubuntu-bun:${BUN_VERSION},ubuntu-22.04:docker://${IMAGE_REGISTRY:-git.severinno.cloud}/${IMAGE_NAMESPACE:-severinno}/ubuntu-bun:${BUN_VERSION}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-data:/data
    networks:
      - gitea-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gitea-data:
    name: gitea-data
  runner-data:
    name: gitea-runner-data
  caddy-data:
    name: gitea-caddy-data
  caddy-config:
    name: gitea-caddy-config
  caddy-logs:
    name: gitea-caddy-logs

networks:
  gitea-net:
    driver: bridge
